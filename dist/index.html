<td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>当你在狂战士效果下结束战斗时可用。恢复SLx10 HP。[AR2E扩展]</td></tr>\\n<tr><td><strong>野蛮突击</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你的HP低于最大HP时生效。你的攻击获得+1d6伤害。[AR2E扩展]</td></tr>\\n</table>\\n<h5>忍者扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>水手里剑（水属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>对目标进行魔法攻击。该攻击的魔法判定获得+1d6。该攻击造成2d6+5水属性魔法伤害。\\n暴击：追加骰子 [Watson]</td></tr>\\n<tr><td><strong>大爆炸</strong></td><td>Burst Break Skill</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[爆发破坏技能]SL3才能学习此技能。可与[爆发破坏技能]同时使用。本次[爆发破坏技能]获得+CLx5伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>爆破（选择法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>区域（选择）</td><td>近战</td><td>-</td><td>3</td><td>每剧本SL次</td><td>学习此技能时，选择一个[属性]。对目标进行魔法攻击。该攻击造成2d6+[你当前HP]所选择[属性]的魔法伤害。（使用伤害掷骰时的当前HP）。在此主要阶段结束时，你的HP变为0并陷入K.O。暴击：追加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>爆发破坏技能</strong></td><td>主要动作</td><td>精神</td><td>区域（选择）</td><td>20m</td><td>-</td><td>3</td><td>每剧本1次</td><td>对目标进行特殊攻击。此攻击使用精神判定作为命中判定，造成2d6+SLx10贯穿伤害。对此攻击的任何反应自动失败，且此时不能使用[时机：反应]的技能。暴击：追加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>隐秘魔法技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>潜行</td><td>魔法攻击判定获得+1d6，魔法伤害获得+(SL)d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>道之握</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[地钓]SL3才能学习此技能。当你进行造成地属性魔法伤害的攻击时，如果该攻击造成至少1点HP伤害，直到本轮结束前，该攻击目标的移动-5（最小0）。[AR2E扩展]</td></tr>\\n<tr><td><strong>致命一击</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>每场景1次</td><td>在你掷出暴击后、进行攻击伤害掷骰前可用。该攻击获得+SLx10伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>引爆（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>区域（选择）</td><td>20m</td><td>12</td><td>5</td><td>-</td><td>对目标进行魔法攻击。该攻击造成(SL+1)d6+10虚属性魔法伤害。如果目标是物体，追加+2d6伤害。暴击：追加骰子 [Watson]</td></tr>\\n<tr><td><strong>风灵微风</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[烈风]SL3才能学习此技能。当你进行造成风属性魔法伤害的攻击时，如果该攻击造成至少1点HP伤害，直到本轮结束前，该攻击目标的物理防御-10（最小0）。[AR2E扩展]</td></tr>\\n<tr><td><strong>火灵微光</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[火击]SL3才能学习此技能。当你进行造成火属性魔法伤害的攻击时，如果该攻击造成至少1点HP伤害，直到本轮结束前，该攻击目标的命中判定-1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>带电（雷属性法术）</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>你造成雷属性魔法伤害的攻击获得+(SLx2)伤害。如果该攻击造成至少1点HP伤害，对目标施加恍惚。[Watson]</td></tr>\\n<tr><td><strong>火击（火属性法术）</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>你造成火属性魔法伤害的攻击获得+(SLx2)伤害。如果该攻击造成至少1点HP伤害，对目标施加威压。[AR2E扩展]</td></tr>\\n<tr><td><strong>屠杀者技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[杀戮技能]SL5才能学习此技能。当你在攻击的命中判定中掷出暴击时可用。如果此攻击对目标施加了减益，该减益直到场景结束前不能通过技能移除。[AR2E扩展]</td></tr>\\n<tr><td><strong>追踪命中技能</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>攻击的命中判定前可用。对此攻击的任何反应自动失败。此时不能使用[时机：反应]的技能和物品。[AR2E扩展]</td></tr>\\n<tr><td><strong>冰河期（冰属性法术）</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>你造成冰属性魔法伤害的攻击获得+(SLx2)伤害。如果该攻击造成至少1点HP伤害，对目标施加失衡。[Watson]</td></tr>\\n<tr><td><strong>内爆（暗属性法术）</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>8</td><td>1</td><td>-</td><td>当你在魔法攻击的命中判定中掷出暴击时可用。对于此攻击，将目标的魔法防御视为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>完美闪避技能</strong></td><td>判定后</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每场景SL次</td><td>在你进行回避判定后可用。该判定结果获得+2。[AR2E扩展]</td></tr>\\n<tr><td><strong>地钓（地属性法术）</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>你造成地属性魔法伤害的攻击获得+(SLx2)伤害。如果该攻击造成至少1点HP伤害，对目标施加眩晕。[AR2E扩展]</td></tr>\\n<tr><td><strong>水神激流</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[毒雾]SL3才能学习此技能。当你进行造成水属性魔法伤害的攻击时，如果该攻击造成至少1点HP伤害，直到本轮结束前，该攻击目标的回避判定-1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>杀戮技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>每当因暴击而向伤害掷骰添加骰子时，再为该攻击额外添加+(SL+1)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>毒雾（水属性法术）</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>你造成水属性魔法伤害的攻击获得+(SLx2)伤害。如果该攻击造成至少1点HP伤害，对目标施加中毒(1)。[AR2E扩展]</td></tr>\\n<tr><td><strong>快速骑乘</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>装备一件[类型：坐骑]的物品，然后进行战斗移动。[AR2E扩展]</td></tr>\\n<tr><td><strong>雷神鼓</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[带电]SL3才能学习此技能。当你进行造成雷属性魔法伤害的攻击时，如果该攻击造成至少1点HP伤害，直到本轮结束前，该攻击目标的魔法防御-10（最小0）。[Watson]</td></tr>\\n<tr><td><strong>无情将军</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[冰河期]SL3才能学习此技能。当你进行造成冰属性魔法伤害的攻击时，如果该攻击造成至少1点HP伤害，直到本轮结束前，该攻击目标的伤害掷骰-1d6。[Watson]</td></tr>\\n<tr><td><strong>暗影锁定（暗属性法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>20m</td><td>5</td><td>3</td><td>-</td><td>目标的移动-SLx3m。此效果持续到目标使用次要动作结束此效果或场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>潜近技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>-</td><td>移动前可用。对于此次移动，你可以忽略被阻挡交战的效果，且进入敌人的交战时不需要停止移动。[AR2E扩展]</td></tr>\\n<tr><td><strong>特技飞行</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>-</td><td>你获得飞行状态，你的移动变为SLx5m。此效果持续到你使用次要动作结束或场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>烈风（风属性法术）</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>你造成风属性魔法伤害的攻击获得+(SLx2)伤害。如果该攻击造成至少1点HP伤害，对目标施加击退(1)。[AR2E扩展]</td></tr>\\n</table>\\n<h5>幻术师扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>扰乱深渊（幻术法术）</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>10m</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有[扰乱影像]SL5才能学习此技能。当目标不是[类型：植物、不死、人造]时生效。在目标进行判定后可用（在来自祝福或技能的重掷之后）。从最终结果中选择一个骰子并将其设为1。如果这导致所有骰子都显示1，则视为失误。[AR2E扩展]</td></tr>\\n<tr><td><strong>幻影披风（幻术法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>10m</td><td>5</td><td>3</td><td>-</td><td>目标的回避判定获得+(SL+1)。此效果持续到场景结束。暴击：消耗0。[AR2E扩展]</td></tr>\\n<tr><td><strong>创造领域</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你的[时机：主要动作]且[对象：单体]的幻术师技能变为[对象：场景（选择）]。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>幻影痛</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每场景SL次</td><td>使用此技能时，选择一个减益。可与施加减益的攻击、技能、作弊或物品同时使用。当该行动的目标不是[类型：植物、不死、人造]时生效。将施加的减益变更为本技能选择的减益。如果需要效果等级，该效果等级为1。[AR2E扩展]</td></tr>\\n<tr><td><strong>精神破坏（幻术法术）</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>10m</td><td>8</td><td>3</td><td>每剧本SL次</td><td>当目标不是[类型：植物、不死、人造]时生效。每当目标判定失败或对抗判定落败时，你可以使用此技能对目标施加眩晕。[AR2E扩展]</td></tr>\\n<tr><td><strong>修炼之心</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>你的精神判定获得+(SL+1)。[AR2E扩展]</td></tr>\\n<tr><td><strong>幻影引导（幻术法术）</strong></td><td>判定后</td><td>自动成功</td><td>单体</td><td>10m</td><td>8</td><td>1</td><td>每剧本1次</td><td>判定后可用。目标重掷用于该判定的所有骰子。你不能选择自己作为此技能的目标。目标可以拒绝此技能的效果，在这种情况下，不计入使用次数。[AR2E扩展]</td></tr>\\n<tr><td><strong>群体幻象</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>5</td><td>每剧本SL次</td><td>你的[时机：主要动作]且[对象：单体]的幻术师技能变为[对象：区域（选择）]。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>终极幻象（幻术法术）</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>每剧本SL次</td><td>当该行动的目标不是[类型：植物、不死、人造]时，可与施加减益的攻击、技能、作弊或物品同时使用。直到场景结束前，该减益不能被技能治愈。[AR2E扩展]</td></tr>\\n<tr><td><strong>清晰影像（幻术法术）</strong></td><td>清理阶段</td><td>魔法判定</td><td>单体</td><td>10m</td><td>6</td><td>3</td><td>每场景SL次</td><td>目标从1个你选择的减益中恢复。暴击：消耗0。[AR2E扩展]</td></tr>\\n<tr><td><strong>影像武器（幻术法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>10m</td><td>4</td><td>1</td><td>-</td><td>当目标不是[类型：植物、不死、人造]时生效。对目标进行魔法攻击。该攻击造成2d6+5虚属性魔法伤害。如果目标因此伤害失去至少1点HP，对其施加恍惚。暴击：追加骰子 [AR2E扩展]</td></tr>\\n<tr><td><strong>兽影（幻术法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>10m</td><td>5</td><td>1</td><td>-</td><td>当目标不是[类型：植物、不死、人造]时生效。对目标进行魔法攻击。该攻击造成2d6+5虚属性魔法伤害。如果目标因此伤害失去至少1点HP，对其施加恐惧。暴击：追加骰子 [AR2E扩展]</td></tr>\\n<tr><td><strong>影像锁链（幻术法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>10m</td><td>5</td><td>1</td><td>-</td><td>当目标不是[类型：植物、不死、人造]时生效。对目标进行魔法攻击。该攻击造成2d6+5虚属性魔法伤害。如果目标因此伤害失去至少1点HP，对其施加束缚。暴击：追加骰子 [AR2E扩展]</td></tr>\\n<tr><td><strong>混乱影像（幻术法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>区域（选择）</td><td>10m</td><td>5</td><td>1</td><td>每场景1次</td><td>当目标不是[类型：植物、不死、人造]时生效。目标的移动-5（最小0）。此效果持续到本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>终结影像（幻术法术）</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>在对处于减益状态的目标进行幻术师技能攻击的伤害掷骰前可用。该攻击获得+(SL)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>迷宫影像（幻术法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>10m</td><td>4</td><td>3</td><td>每场景SL次</td><td>当目标不是[类型：植物、不死、人造]时生效。目标所在的交战变为被阻挡交战。此效果持续到目标成功脱离或本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>诱饵影像（幻术法术）</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>每轮1次</td><td>可与回避判定同时使用。你可以使用你的精神作为该回避判定的能力值。[AR2E扩展]</td></tr>\\n<tr><td><strong>死亡影像（幻术法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>区域（选择）</td><td>近战</td><td>8</td><td>3</td><td>每场景SL次</td><td>当目标不是[类型：植物、不死、人造]时生效。目标陷入威压。[AR2E扩展]</td></tr>\\n<tr><td><strong>恐惧影像（幻术法术）</strong></td><td>清理阶段</td><td>魔法判定</td><td>单体</td><td>近战</td><td>5</td><td>3</td><td>每场景SL次</td><td>当目标不是[类型：植物、不死、人造]时生效。当目标处于减益效果下时生效。如果目标对抗判定失败，你可以强制其脱离。忽略被阻挡交战进行此移动。你选择移动的方向。[AR2E扩展]</td></tr>\\n<tr><td><strong>毒影像（幻术法术）</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>-</td><td>可与带有效果等级的减益的攻击、技能、作弊或物品同时使用。当目标不是[类型：植物、不死、人造]时生效。该减益的效果等级+1。[AR2E扩展]</td></tr>\\n<tr><td><strong>必然影像</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>每场景SL次</td><td>当你对不是[类型：植物、不死、人造]的敌人进行施加减益的攻击时可用。即使该攻击的伤害被无效化，该攻击的减益仍然生效。[AR2E扩展]</td></tr>\\n<tr><td><strong>影像魔法</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>可与法术但非“幻术法术”的魔法攻击同时使用，获得+2d6伤害，但对[类型：植物、不死、人造]的敌人不可使用。[AR2E扩展]</td></tr>\\n<tr><td><strong>扰乱影像（幻术法术）</strong></td><td>判定前</td><td>自动成功</td><td>单体</td><td>10m</td><td>-</td><td>5</td><td>每剧本SL次</td><td>对不是[类型：植物、不死、人造]的目标可用。目标进行判定前可用。该判定-1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>写实影像</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[终极幻象]SL5才能学习此技能。你可以忽略你已学习的幻术师技能上的“不是[类型：植物、不死、人造]”限制；它们现在可以对任何[类型]的敌人使用。[AR2E扩展]</td></tr>\\n<tr><td><strong>诡计影像（幻术法术）</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>你必须拥有[必然影像]SL5才能学习此技能。当目标不是[类型：植物、不死、人造]时生效。进行施加减益的攻击时可用。如果减益成功施加，目标受到SLx5点HP损失。即使施加了多个减益，此技能每次攻击只能使用一次。[AR2E扩展]</td></tr>\\n<tr><td><strong>幻影之刃（幻术法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>10m</td><td>4</td><td>3</td><td>-</td><td>目标使用武器进行的命中判定获得+SL+1。此效果持续到场景结束。暴击：消耗0。[AR2E扩展]</td></tr>\\n<tr><td><strong>幻影束缚（幻术法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>10m</td><td>4</td><td>1</td><td>-</td><td>当目标不是[类型：植物、不死、人造]时生效。目标的行动点数-2d6。此效果持续到本轮结束。暴击：追加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>幻术大师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>使用幻术法术技能时，你可以使用你的精神进行魔法判定。[AR2E扩展]</td></tr>\\n<tr><td><strong>恶影（幻术法术）</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>-</td><td>可与施加减益的攻击、技能、作弊或物品同时使用。当目标不是[类型：植物、不死、人造]时生效。受到所施加减益影响的目标物理防御-SLx5。此效果持续到触发它的减益被治愈或场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>伪装帷幕（幻术法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体*</td><td>10m</td><td>10</td><td>1</td><td>每场景1次</td><td>目标进入隐匿状态。即使目标当前正与另一角色交战，也可以进入隐匿状态。目标可以通过精神对抗判定来尝试抵抗此技能。暴击：消耗0。[AR2E扩展]</td></tr>\\n</table>\\n<h5>剑斗士扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>技术防御技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>装备盾牌</td><td>当你没有装备[槽位：头部]或[槽位：身体]的防具时生效。你装备的盾牌物理防御+CL。[AR2E扩展]</td></tr>\\n<tr><td><strong>生存技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>当你没有装备[槽位：头部]或[槽位：身体]的防具时生效。你的物理防御+(SLx2)+5，魔法防御+SL。[AR2E扩展]</td></tr>\\n<tr><td><strong>肮脏战斗技能</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>每场景SL次</td><td>使用此技能时，选择“眩晕”或“失衡”。直到主要阶段结束前，每当你的近战攻击造成至少1点HP伤害时，施加所选择的减益。[AR2E扩展]</td></tr>\\n<tr><td><strong>战斗感知技能</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>使用此技能时，选择一个当前正在影响你的减益。从所选择的减益中恢复。直到场景结束前，你不会受到所选择减益的影响。[AR2E扩展]</td></tr>\\n<tr><td><strong>冠军</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你获得一件[冠军腰带]物品。将此物品放入你的物品栏。[AR2E扩展]</td></tr>\\n<tr><td><strong>目标变更</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>你必须拥有[锁定目标]至少SL5才能学习此技能。当[锁定目标]的效果因目标陷入K.O而结束时可用。立即对另一个目标使用[锁定目标]。[AR2E扩展]</td></tr>\\n<tr><td><strong>取悦观众</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>5</td><td>-</td><td>你的近战攻击获得+SLx3伤害。此效果持续到场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>锁定目标</strong></td><td>准备阶段</td><td>自动成功</td><td>单体</td><td>视野</td><td>5</td><td>5</td><td>-</td><td>你对目标进行的武器攻击获得+SLx3伤害。此效果持续到目标陷入K.O或场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>决斗</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>5</td><td>决斗中</td><td>你的近战攻击命中判定获得+1d6，伤害获得+SLx2。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>不屈之躯</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[生存技能]SL5才能学习此技能。当你没有装备[槽位：头部]或[槽位：身体]的防具时生效。你的物理防御和魔法防御+CL。[AR2E扩展]</td></tr>\\n<tr><td><strong>最后一击</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>决斗中，每场景1次</td><td>近战攻击的伤害掷骰前可用。此近战攻击获得+(SLx3)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>最后防线</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有[决斗]SL5才能学习此技能。在会导致你受到伤害的伤害掷骰后可用。如果此次伤害使你的HP变为0，你不会陷入K.O，而是HP变为1。此外，此次伤害本应施加的任何减益不会被施加。[AR2E扩展]</td></tr>\\n<tr><td><strong>振奋</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>-</td><td>你的物理防御和魔法防御+SLx2。但是，你的所有反应判定-1d6。此效果持续到场景结束，或直到你使用次要动作取消它。[AR2E扩展]</td></tr>\\n<tr><td><strong>地狱牢笼</strong></td><td>准备阶段</td><td>精神</td><td>区域（选择SLx2）</td><td>近战</td><td>5</td><td>3</td><td>-</td><td>目标进行精神对抗判定。如果你赢得判定，目标陷入威压。[AR2E扩展]</td></tr>\\n<tr><td><strong>无限精神</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[振奋]SL5才能学习此技能。你不会受到[振奋]效果对反应判定的惩罚。[AR2E扩展]</td></tr>\\n<tr><td><strong>翻滚闪避</strong></td><td>判定后</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>每轮1次</td><td>当你没有装备[槽位：头部]或[槽位：身体]的防具时生效。进行回避判定后可用。你可以重掷该判定。如果你这样做，你受到失衡。这不能被物品或技能阻止。[AR2E扩展]</td></tr>\\n<tr><td><strong>战斗兴奋</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>决斗中</td><td>你的近战攻击获得+(SL)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>搭台</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>决斗中，每场景1次</td><td>除你的[决斗]对象外，其他角色不能进入你的交战。此效果持续到本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>险避</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>当你对2个或更多目标进行武器攻击时生效。该攻击获得+(SL)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>兽吼</strong></td><td>准备阶段</td><td>精神</td><td>区域（选择SLx2）</td><td>近战</td><td>5</td><td>3</td><td>-</td><td>目标进行精神对抗判定。如果你赢得判定，目标陷入恍惚。[AR2E扩展]</td></tr>\\n<tr><td><strong>狮啸</strong></td><td>Beast Roar</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>每剧本1次</td><td>你必须拥有[兽吼]SL3才能学习此技能。可与[兽吼]同时使用。[兽吼]变为[对象：场景（选择）]。[AR2E扩展]</td></tr>\\n<tr><td><strong>步法</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>当你没有装备[槽位：头部]或[槽位：身体]的防具时生效。你的回避判定+SL+1，近战攻击获得+SLx3伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>坚持</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>3</td><td>每剧本3次</td><td>当你的HP等于最大HP时可用。你的HP和最大HP各+SLx10。此效果持续到场景结束。如果此效果结束时你的HP超过最大HP，你的HP变为等于最大HP。[AR2E扩展]</td></tr>\\n<tr><td><strong>怒血</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>每次主要阶段1次</td><td>在你受到攻击的HP伤害后可用。你的武器攻击获得+SL+2伤害。此效果最多叠加3次。此效果持续到场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>幸存者风格</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>战斗结束时可用。如果你的HP低于最大HP的一半，你的HP变为（最大HP/2）。如果此时从K.O中恢复，你的HP也变为（最大HP/2）。[AR2E扩展]</td></tr>\\n<tr><td><strong>对峙</strong></td><td>Hell in a Cell</td><td>自动成功</td><td>自身</td><td>-</td><td>2</td><td>1</td><td>-</td><td>你必须拥有[地狱牢笼]至少SL1才能学习此技能。可与[地狱牢笼]同时使用。当你通过[地狱牢笼]成功施加威压时，同时施加击退(2)。[AR2E扩展]</td></tr>\\n<tr><td><strong>目标追踪</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>每场景SL次</td><td>你必须拥有[锁定目标]至少SL1才能学习此技能。当你的[锁定目标]的目标移动到距离你位置（你的移动）米以内时可用。立即转移至目标的交战中。[AR2E扩展]</td></tr>\\n<tr><td><strong>一对一</strong></td><td>准备阶段</td><td>自动成功</td><td>单体*</td><td>近战</td><td>10</td><td>1</td><td>-</td><td>对你交战中的一名单体角色宣告[决斗]。即使你的交战中有多名角色也可以这样做。进入你交战的角色不会导致你失去此次[决斗]。在此[决斗]持续期间，你的所有攻击变为[对象：单体*]。[AR2E扩展]</td></tr>\\n</table>\\n<h5>萨满扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>麻醉（法术）</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>每轮1次</td><td>在目标进行攻击的伤害掷骰前可用。如果目标的攻击造成至少1点HP伤害，对目标（攻击者）施加束缚。[AR2E扩展]</td></tr>\\n<tr><td><strong>灵魂破坏者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>你必须拥有[白日噩梦]至少SL1才能学习此技能。你的[白日噩梦]获得+SLx3伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>雾幻（法术）</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>1</td><td>每剧本1次</td><td>在目标进行魔法判定后可用（在通过祝福或技能重掷之后）。从该判定掷出的骰子中选择一个并从结果中移除。（如果没有剩余骰子，掷骰值为0）。如果原始结果为暴击且剩余骰池中显示6的骰子少于两个，该暴击被无效化。反之，如果骰池中只剩下1，该判定视为失误。[AR2E扩展]</td></tr>\\n<tr><td><strong>快速引导</strong></td><td>清理阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有以下技能中的至少一个：[沙云]、[纠缠]或[海市蜃楼]至少SL1才能学习此技能。这3个技能中已在本剧本中使用过的其中一个可以额外使用一次。[AR2E扩展]</td></tr>\\n<tr><td><strong>白日噩梦（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>-</td><td>对目标进行魔法攻击。该攻击造成2d6+5贯穿伤害。暴击：追加骰子 [AR2E扩展]</td></tr>\\n<tr><td><strong>衰弱（法术）</strong></td><td>判定前</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>每场景1次</td><td>目标进行判定前可用。该判定-1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>刺痛（法术）</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>20m</td><td>15</td><td>1</td><td>每轮1次</td><td>在目标进行武器攻击的伤害掷骰前可用。将该攻击的伤害类型改为贯穿伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>心烦（法术）</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>每轮1次</td><td>在目标进行攻击的伤害掷骰前可用。如果目标的攻击造成至少1点HP伤害，对目标（攻击者）施加恐惧。[AR2E扩展]</td></tr>\\n<tr><td><strong>纠缠（法术）</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>1</td><td>每剧本1次</td><td>在目标进行反应判定后可用（在通过祝福或技能重掷之后）。从该判定掷出的骰子中选择一个并从结果中移除。（如果没有剩余骰子，掷骰值为0）。如果原始结果为暴击且剩余骰池中显示6的骰子少于两个，该暴击被无效化。反之，如果骰池中只剩下1，该判定视为失误。[AR2E扩展]</td></tr>\\n<tr><td><strong>隐者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>你进行的萨满技能判定获得+SL+1。[AR2E扩展]</td></tr>\\n<tr><td><strong>幸运（法术）</strong></td><td>判定前</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>5</td><td>每剧本3次</td><td>目标进行判定前可用。该判定获得+SL或-SL。在宣告使用此技能时宣告你正在应用的修正值。你不能选择自己作为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>脆弱（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>5</td><td>-</td><td>目标的物理防御和魔法防御-SLx5（最小0）。此效果持续到目标使用次要动作结束此效果或场景结束。暴击：消耗0。[AR2E扩展]</td></tr>\\n<tr><td><strong>迟钝（法术）</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>20m</td><td>7</td><td>5</td><td>每轮1次</td><td>在目标进行魔法攻击的伤害掷骰前可用。该攻击的伤害掷骰-(SL)d6（最少掷1d6）。[AR2E扩展]</td></tr>\\n<tr><td><strong>疾病（法术）</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>3</td><td>每轮1次</td><td>在目标进行攻击的伤害掷骰前可用。如果目标的攻击造成至少1点HP伤害，对目标（攻击者）施加中毒(SL)。[AR2E扩展]</td></tr>\\n<tr><td><strong>重病</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[脆弱]SL5才能学习此技能。[脆弱]的效果变为：“目标的物理防御和魔法防御-(SLx5)+5（最小0）。此效果持续到目标使用主要动作结束此效果或场景结束。”[AR2E扩展]</td></tr>\\n<tr><td><strong>禁忌诅咒</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>-</td><td>你必须拥有[隐者]SL5才能学习此技能。你的魔法攻击获得+SLx10伤害。但是，在此主要阶段结束时，如果你在此主要阶段中没有造成任何HP伤害，受到SLx5 HP损失。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>致命诅咒</strong></td><td>主要动作</td><td>精神</td><td>单体*</td><td>20m</td><td>6</td><td>3</td><td>每场景1次</td><td>当目标的CL（或EL）等于或低于（你的CL+SL）时生效。进行精神对抗判定。如果你成功，目标陷入K.O。如果你失败，你受到中毒(2)。[AR2E扩展]</td></tr>\\n<tr><td><strong>仪式诅咒</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>每剧本1次</td><td>你必须拥有[幸运]SL5才能学习此技能。对你[类型：法术]技能进行的反应判定自动失败，且不能使用[时机：反应]的技能或物品。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>沙云（法术）</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>1</td><td>每剧本1次</td><td>在目标进行武器攻击的命中判定后可用（在通过祝福或技能重掷之后）。从该判定掷出的骰子中选择一个并从结果中移除。（如果没有剩余骰子，掷骰值为0）。如果原始结果为暴击且剩余骰池中显示6的骰子少于两个，该暴击被无效化。反之，如果骰池中只剩下1，该判定视为失误。[AR2E扩展]</td></tr>\\n<tr><td><strong>妨碍</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>每当你的魔法攻击对目标造成至少1点HP伤害时，对该目标施加失衡。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>戒律：徒手</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>只要你没有装备武器就生效。你的物理防御+SLx3。一旦你装备了武器，你失去此技能的效果直到剧本结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>戒律：虔诚</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>你的魔法防御+SLx2。一旦你使用任何非萨满技能的法术效果，你失去此技能的效果直到剧本结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>戒律：裸身</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>学习此技能时，选择头部或身体。你的魔法攻击获得+SLx3伤害。一旦你在所选槽位装备了任何防具，你失去此技能的效果直到剧本结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>戒律：节制</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>你的萨满技能消耗-(SL+1)（最小1）。一旦你使用任何[类型：药水]物品，你失去此技能的效果直到剧本结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>严格戒律</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有任意[戒律：~~]技能至少SL1才能学习此技能。选择你的一个[戒律：~~]技能。该技能的最大SL变为5。[AR2E扩展]</td></tr>\\n<tr><td><strong>邪眼</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>对你的萨满技能进行的反应判定-1d6。此效果持续到你的主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>忏悔</strong></td><td>见效果</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有任意[戒律：~~]技能至少SL1才能学习此技能。只要你失去了[戒律：~~]技能的效果就可以使用。消耗1点祝福。如果你这样做，恢复因违反限制而失去的任何[戒律：~~]技能的效果。但是，如果你在使用此技能时仍在违反限制，你再次失去[戒律：~~]的效果。[AR2E扩展]</td></tr>\\n<tr><td><strong>锈蚀（法术）</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>20m</td><td>7</td><td>5</td><td>每轮1次</td><td>在目标进行武器攻击的伤害掷骰前可用。该攻击的伤害掷骰-(SL)d6（最少掷1d6）。[AR2E扩展]</td></tr>\\n<tr><td><strong>绊倒（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>3</td><td>-</td><td>目标的移动-SLx5（最小0）。此效果持续到目标使用次要动作结束此效果或场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>吸收（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>8</td><td>5</td><td>-</td><td>对目标进行魔法攻击。该攻击造成2d6+5虚属性魔法伤害。如果此攻击对目标造成至少1点HP伤害，恢复SLx5 HP。暴击：追加骰子 [AR2E扩展]</td></tr>\\n</table>\\n<h5>维京人扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>水手之魂</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>据点</td><td>你必须拥有[挂钩]SL5才能学习此技能。当同队成员在你的交战中时生效。将[挂钩]的效果改为“判定前可用。该判定结果获得+SL+（你的交战中同队成员数x2）”。[AR2E扩展]</td></tr>\\n<tr><td><strong>提督</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[船长]SL5才能学习此技能。你的[船长]和[同步]技能变为[对象：区域（选择）]。[AR2E扩展]</td></tr>\\n<tr><td><strong>友谊</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>据点</td><td>当你与同队成员交战时生效。你的近战攻击获得你交战中每名同队成员+2伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>鲨饵</strong></td><td>Skipjack</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你必须拥有[Skipjack]SL5才能学习此技能。可与[Skipjack]同时使用。你的武器攻击造成水属性魔法伤害而非其常规伤害类型，且每当造成至少1点HP伤害时，对攻击目标施加眩晕。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>发现技能</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>视野</td><td>6</td><td>1</td><td>每场景1次</td><td>在目标进行战利品掷骰前可用。目标进行两次掷骰，并可以选择保留哪个结果。[AR2E扩展]</td></tr>\\n<tr><td><strong>冲击攻击</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>你的武器攻击命中判定+SLx2。此外，如果该攻击造成至少1点HP伤害，对攻击目标施加失衡。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>船长</strong></td><td>准备阶段</td><td>自动成功</td><td>单体</td><td>近战</td><td>7</td><td>5</td><td>据点</td><td>当目标是同队成员时可用。直到本轮结束前，目标的命中判定+SL+1。你不能选择自己作为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>岛屿之歌</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>20m</td><td>2</td><td>5</td><td>每次防御1次</td><td>在会导致目标受到伤害的伤害掷骰后可用。该次伤害减少-SLx3。你不能选择自己作为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>航海歌谣</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>5</td><td>6</td><td>据点</td><td>当目标是同队成员时可用。当目标使用恢复HP的技能时可用。该技能的效果获得SLx2。你不能选择自己作为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>挂钩</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>5</td><td>据点</td><td>当你与同队成员交战时可用。判定前可用。该判定结果+SL+1。[AR2E扩展]</td></tr>\\n<tr><td><strong>深潜</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>游泳中，每剧本1次</td><td>进入潜行状态。即使你与敌对角色交战也可以这样做。[AR2E扩展]</td></tr>\\n<tr><td><strong>接舷</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>你必须拥有[Go Sign]SL1才能学习此技能。你的[Go Sign]的目标在进行[Go Sign]的移动期间移动+SLx5。[AR2E扩展]</td></tr>\\n<tr><td><strong>自尊</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>游泳中</td><td>你的武器攻击获得+(SL)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>飞斧回旋</strong></td><td>Axe Boomerang</td><td>自动成功</td><td>自身</td><td>-</td><td>2</td><td>3</td><td>装备斧</td><td>可与[飞斧]同时使用。为[飞斧]进行的攻击获得+(SL)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>飞斧</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>投掷</td><td>5</td><td>1</td><td>使用斧</td><td>对目标进行远程攻击。此攻击使用的武器必须具有投掷属性。该攻击的命中判定+1d6。直到主要阶段结束前，在你通过投掷此武器进行远程攻击后，该武器返回你手中并重新装备。暴击：追加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>大漩涡</strong></td><td>Before Damage Check</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>游泳中，每场景1次</td><td>在你进行近战攻击的伤害掷骰前可用。此攻击获得+(SLx2)d6伤害，并造成水属性魔法伤害而非其常规伤害类型。[AR2E扩展]</td></tr>\\n<tr><td><strong>吃肉</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>使用你物品中的一件肉类。你的武器攻击获得+(x)伤害，其中(x)为使用肉类恢复的HP量。但是，超过你最大HP的治疗不计入(x)。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>游泳</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>游泳中</td><td>你的移动+SLx5。[AR2E扩展]</td></tr>\\n<tr><td><strong>溺水</strong></td><td>准备阶段</td><td>灵巧</td><td>单体</td><td>20m</td><td>8</td><td>3</td><td>每场景SL次</td><td>你必须拥有[Aqua Stance]SL1才能学习此技能。目标进行精神对抗判定。如果你成功，目标直到本轮结束前所有判定-1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>肉菜</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>你使用的肉类物品效果获得+(SL)d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>潜水</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>游泳中</td><td>你获得物理防御和魔法防御+SLx2。[AR2E扩展]</td></tr>\\n<tr><td><strong>水之姿态</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你不会受到游泳的惩罚。此外，你的[条件：游泳中]技能即使不在游泳中也可以使用。[AR2E扩展]</td></tr>\\n<tr><td><strong>海上救援</strong></td><td>先攻阶段</td><td>自动成功</td><td>单体</td><td>近战</td><td>4</td><td>1</td><td>据点，每轮1次</td><td>你必须拥有[水之姿态]SL1才能学习此技能。目标为同队成员时可使用。目标不会受到游泳的惩罚。该效果持续到本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>出发信号</strong></td><td>主要动作</td><td>自动成功</td><td>区域（选择）</td><td>20m</td><td>6</td><td>1</td><td>据点</td><td>目标为同队成员时可使用。目标进行战斗移动或撤退。如果目标与敌人处于被阻挡交战状态，则不能以此方式撤退。你不能选择自己为此技能的目标。目标可以拒绝此技能的效果。[AR2E扩展]</td></tr>\\n<tr><td><strong>飞鱼</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>5</td><td>游泳中</td><td>你的武器攻击获得命中判定+1d6和伤害+SLx4。该效果持续到本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>缓解</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>据点，每轮1次</td><td>目标为同队成员且受到减益效果时可使用。目标从刚受到的减益效果中恢复。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>乘风</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>3</td><td>游泳中</td><td>进行战斗移动。此次移动的移动力获得+SLx5。如果进行了此战斗移动，你的武器攻击获得命中判定+1d6，直到本主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>同步</strong></td><td>准备阶段</td><td>自动成功</td><td>单体</td><td>20m</td><td>4</td><td>1</td><td>据点</td><td>目标为同队成员时可使用。比较目标的行动点数与你自己的行动点数。双方的行动点数变为两者中较高的值。该效果持续到本轮结束。目标可以拒绝此效果。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>飞溅</strong></td><td>移动动作</td><td>自动成功</td><td>见效果</td><td>See effect</td><td>5</td><td>1</td><td>游泳中，每场景1次</td><td>进行战斗移动。如果此次移动使你进入交战，你可以对该交战中的任意数量的角色造成失衡。[AR2E扩展]</td></tr>\\n</table>\\n<h5>武僧扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>追加打击</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>使用徒手</td><td>每当你对受到任意减益效果的对手进行近战攻击时，该攻击获得+(SLx2)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>自动闪避</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>如果对你进行的攻击判定结果低于（你的幸运+SLx3）（暴击除外），该攻击在你进行反应之前失败。[Watson]</td></tr>\\n<tr><td><strong>空手技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>空手</td><td>你的徒手攻击力变为等于CL，命中修正变为+1。[Haru]</td></tr>\\n<tr><td><strong>祝福移动</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>全力移动时的移动力加值从+5增加到+10。你的撤退移动距离从5m变为10m。[Watson]</td></tr>\\n<tr><td><strong>战斗投掷</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>近战</td><td>4</td><td>5</td><td>使用徒手</td><td>对目标进行近战攻击。该攻击获得+SLx2伤害。如果攻击命中，无论是否造成HP伤害，对目标造成失衡。暴击：增加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>反击投掷</strong></td><td>反应</td><td>命中判定</td><td>单体</td><td>近战</td><td>5</td><td>3</td><td>装备徒手，每剧本SL次</td><td>你必须拥有[战斗投掷]SL1才能学习此技能。当目标对你进行近战攻击时，你可以作为反应用装备的武器进行命中判定。如果成功，该攻击失败，并对目标造成失衡。[AR2E扩展]</td></tr>\\n<tr><td><strong>神圣飞踢</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>15m</td><td>20</td><td>1</td><td>每剧本1次</td><td>你必须拥有[飞踢]SL3才能学习此技能。使用者跳入空中踢击目标，造成等于(CL)d6+(灵巧xCL)的贯穿伤害。如果使用者未命中，受到等于(灵巧xCL)的坠落伤害。使用者移动到目标的近距离内。暴击：增加骰子。[Haru]</td></tr>\\n<tr><td><strong>醉退技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>使用者试图从被阻挡交战中撤退时，行动点数加上(幸运xSL)。[Haru]</td></tr>\\n<tr><td><strong>忍耐</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>每次防御1次</td><td>在你受到减益效果后可使用。立即从所有减益效果中恢复。[AR2E扩展]</td></tr>\\n<tr><td><strong>气功格挡</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>-</td><td>如果你对非魔法攻击的目标造成至少1点HP伤害，你阻止目标恢复HP或MP，直到目标使用主要动作结束此效果或直到本场景结束。此效果持续到本主要阶段结束。[Haru]</td></tr>\\n<tr><td><strong>气功打击</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>在你进行武器攻击的伤害掷骰前可使用。消耗最多SLx5 MP。该攻击的伤害增加等同于为此技能消耗的MP量。[AR2E扩展]</td></tr>\\n<tr><td><strong>气功爆发</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>-</td><td>你的攻击获得+(SL)d6伤害。但是，当你使用此技能时，装备在头部或身体装备栏上的物品立即被破坏。此效果持续到本轮结束。（即使那些装备栏没有装备任何物品也可以使用此技能）。[AR2E扩展]</td></tr>\\n<tr><td><strong>连打</strong></td><td>伤害掷骰后</td><td>命中判定</td><td>自身</td><td>-</td><td>8</td><td>1</td><td>每轮1次</td><td>用武器攻击对目标造成伤害后，立即对目标进行另一次武器攻击。[Haru]</td></tr>\\n<tr><td><strong>疾风打击</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>3</td><td>3</td><td>-</td><td>对目标进行武器攻击。如果此攻击造成至少1点HP伤害，将目标向任意方向移动最多(SLx5)米。对于此移动，你可以忽略任何会阻碍目标路径的交战或被阻挡交战。暴击：增加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>内在平衡</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>10m</td><td>8</td><td>1</td><td>-</td><td>将HP为0以上的目标的当前MP和HP平衡到尽可能接近。此效果可能暂时允许目标超过其最大HP或MP。如果目标超过了最大HP或MP，此效果持续到场景结束，任何剩余的多余HP或MP在达到最大HP或MP时消失。暴击：消耗0。[Haru]</td></tr>\\n<tr><td><strong>铁拳</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用徒手</td><td>将你的精神加到你的武器攻击伤害上。[AR2E扩展]</td></tr>\\n<tr><td><strong>飞踢</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>10m</td><td>12</td><td>3</td><td>-</td><td>使用者跳入空中踢击目标，造成等于2d6+(灵巧xSL)的物理伤害。如果使用者未命中，其移动力减少10，直到使用移动动作解除或直到场景结束。使用者移动到目标的近距离内。暴击：增加骰子。[Haru]</td></tr>\\n<tr><td><strong>锤战技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以使用[类型：钝器]武器来使用非被动的[条件：使用徒手、装备徒手]武僧技能。但是，如果你在没有[类型：徒手]武器的情况下使用这些技能，这些技能的消耗+1。（无消耗的技能不受此限制）[AR2E扩展]</td></tr>\\n<tr><td><strong>威吓咆哮</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>装备徒手，每场景1次</td><td>对你的近战攻击进行的反应获得-1d6。此效果持续到本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>金属肌肉</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用徒手</td><td>你必须拥有[强风格]SL5才能学习此技能。你的武器攻击获得+2d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>精神粉碎</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>-</td><td>你的武器攻击获得+SLx3伤害。如果该攻击造成至少1点HP伤害，对目标造成击退(1)。该效果持续到本主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>多臂技术</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>14</td><td>3</td><td>-</td><td>使用者快速挥动手臂，看起来像有多条手臂。使用者在所有非魔法攻击上增加(灵巧xSL)伤害，并在所有命中判定上增加(SL)d6。此效果持续到本轮结束。[Haru]</td></tr>\\n<tr><td><strong>一二连击</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>使用徒手，每场景SL次</td><td>在你进行近战攻击的命中判定前可使用。此判定获得+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>贯穿打击</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>6</td><td>1</td><td>使用徒手</td><td>对目标进行近战攻击。对于此次伤害掷骰，将目标的物理防御和魔法防御视为0。暴击：增加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>冲拳</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>装备徒手</td><td>进行战斗移动或全力移动。如果这样做，你的攻击获得命中判定+1d6，直到本主要阶段结束。此外，如果你使用此技能进行全力移动，你不需要放弃你的次要动作。[AR2E扩展]</td></tr>\\n<tr><td><strong>神圣之壳</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>16</td><td>1</td><td>Once per scene.</td><td>将[类型：不死、恶魔]的目标封印在预先准备的魔法强化物品中。此封印的有效性取决于目标被封印的物品。暴击：消耗0。[Haru]</td></tr>\\n<tr><td><strong>封印</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>8</td><td>3</td><td>SL times per scene.</td><td>进行武器攻击。如果该攻击造成至少1点HP伤害，阻止目标使用任何非被动技能，直到目标使用主要动作移除此效果或本场景结束。[Haru]</td></tr>\\n<tr><td><strong>灵魂之拳</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>20m</td><td>4</td><td>5</td><td>使用徒手</td><td>对目标进行近战攻击。此攻击造成虚空魔法伤害并获得+SLx2伤害。此近战不需要以同一交战中的敌人为目标，只要在射程内即可。暴击：增加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>强风格</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>使用徒手</td><td>你的近战攻击获得+(SL)d6伤害。此效果持续到本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>眩晕攻击</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>-</td><td>你的武器攻击获得+SLx3伤害。如果该攻击造成至少1点HP伤害，对目标造成眩晕。该效果持续到本主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>摇摆重定向</strong></td><td>反应</td><td>灵巧</td><td>单体</td><td>近战</td><td>10</td><td>3</td><td>SL times per scenario.</td><td>当被攻击指定为目标时，如果使用者的灵巧判定超过攻击目标的命中判定，使用者将攻击重定向到其交战中的另一个目标。[Haru]</td></tr>\\n<tr><td><strong>三连击</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>装备徒手，每剧本1次</td><td>你必须拥有[一二连击]SL5才能学习此技能。进行3次近战攻击。这些攻击不能与[时机：主要动作]的技能一起使用，且为[目标：单体*]。你可以自由选择目标。暴击：增加骰子。[AR2E扩展]</td></tr>\\n<tr><td><strong>美德忍耐</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>本轮战斗中你的行动点数设为0。在下一轮的准备阶段开始时，立即获得等于你CL的行动点数，并将（你的行动点数总和）加到你本轮进行的任何攻击伤害上。[Haru]</td></tr>\\n<tr><td><strong>生命力</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>使用徒手</td><td>你的武器攻击获得+(SL)d6伤害。此效果持续到本主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>武器技能：徒手</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用徒手</td><td>使用武器时的命中判定获得+1d6。你同时只能应用一个武器技能。[AR2E扩展]</td></tr>\\n</table>\\n<h5>农夫扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>农业之怒</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>5</td><td>-</td><td>在对“类型：动物、植物、魔兽”目标进行攻击的伤害掷骰前可使用。该攻击获得+(SL)d6伤害。[Haru]</td></tr>\\n<tr><td><strong>农业杀手</strong></td><td>准备阶段</td><td>自动成功</td><td>单体</td><td>20m</td><td>10</td><td>3</td><td>每剧本1次</td><td>你必须拥有[农业之怒]SL5才能学习此技能。此技能的目标为“类型：动物、植物、魔兽”时有效。直到本轮结束，目标的攻击获得-SLx10伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>安抚动物（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>-</td><td>对“类型：动物”目标可使用。目标对你的魔法判定进行精神对抗判定。如果你成功，目标将变为消耗、被安抚，并听从你的命令。如果目标不是杂兵或额外角色，他们可以忽略此效果。[Haru]</td></tr>\\n<tr><td><strong>鉴赏（法术）</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>8</td><td>3</td><td>-</td><td>当目标发起“保护”行动（如使用“掩护”技能）时可使用。直到本主要阶段结束，目标获得物理防御和魔法防御+SLx3。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>丰厚盟友</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>农夫</td><td>允许使用者与一个被安抚的“类型：动物、植物、魔兽”目标永久结盟。你可以以自由动作向盟友发出基本口头命令。盟友响应命令进行的所有判定获得+1d6。被归类为杂兵的盟友由GM决定算作一个单位。你同时只能拥有一个永久盟友单位。[Haru]</td></tr>\\n<tr><td><strong>赏金：农业</strong></td><td>见效果</td><td>-</td><td>自身</td><td>-</td><td>8</td><td>3</td><td>每场景SL次</td><td>掠夺“类型：植物”的怪物时，额外掷SL次战利品表以获取战利品。[Haru]</td></tr>\\n<tr><td><strong>赏金：牧场</strong></td><td>见效果</td><td>-</td><td>自身</td><td>-</td><td>8</td><td>3</td><td>每场景SL次</td><td>掠夺“类型：动物”的怪物时，额外掷SL次战利品表以获取战利品。[Haru]</td></tr>\\n<tr><td><strong>作物征服（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>-</td><td>对“类型：植物”目标可使用。目标对你的魔法判定进行精神对抗判定。如果你成功，目标将变为消耗、被安抚，并听从你的命令。如果目标不是杂兵或额外角色，他们可以忽略此效果。[Haru]</td></tr>\\n<tr><td><strong>德鲁伊</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你为基于感知的判定增加奖励骰的通用技能增加+2d6而非+1d6。[Watson]</td></tr>\\n<tr><td><strong>农夫专长</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>学习此技能时，选择一个“类型：动物、植物、魔兽”的怪物，然后将此技能命名为“农夫专长：<怪物名>”等。此技能影响该怪物的所有变种。你对所选怪物进行的所有判定获得+1d6。[Haru]</td></tr>\\n<tr><td><strong>农夫之胃</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>消耗3个不同名称的“食物”物品来换取SL个“农夫之乐”。“农夫之乐”是一种恢复2d6+3 HP和MP的食物，在技能和物品效果中算作“肉类”、“水果”和“蔬菜”。在本剧本结束时，未使用的“农夫之乐”将消失。[Watson]</td></tr>\\n<tr><td><strong>农夫幻步</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>-</td><td>3</td><td>1</td><td>-</td><td>可与移动同时使用。此次移动获得+5移动力。在此移动期间，你可以忽略有“类型：动物、植物、魔兽”角色存在的被阻挡交战的效果，且穿过有“类型：动物、植物、魔兽”角色的交战不会导致你的移动结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>农夫风暴</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有[猎人技艺]SL5才能学习此技能。在[猎人技艺]效果下可使用。你的攻击变为“目标：场景（选择）”和“射程：视野”。但是，你只能以此方式指定“类型：动物、植物、魔兽”为目标。此效果持续到本主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>偏爱农具</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Weapon equipped</td><td>在准备阶段，选择一把“类型：鞭、矛或斧”的特定武器指定为你的偏爱武器。同时只能有一把偏爱武器。当该偏爱武器被装备时，所有命中判定的最终结果+1。[Haru]</td></tr>\\n<tr><td><strong>园丁直觉</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>对“类型：动物、植物、魔兽”目标进行命中判定时，最终结果+SLx2。[Haru]</td></tr>\\n<tr><td><strong>收获（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>3</td><td>每场景SL次</td><td>对“类型：植物”目标有效。对目标进行魔法攻击。该攻击对目标造成2d6+CLx10贯穿伤害。如果该攻击将目标的HP降至0或以下，立即在该目标的战利品表上掷两次并获得两件物品。[Haru]</td></tr>\\n<tr><td><strong>猎人技艺</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>当你装备了“装备栏：单手”武器，且同时没有装备其他武器或盾牌时有效。你的攻击获得+SLx2伤害。此外，你获得物理防御+SLx2和魔法防御+SL。[AR2E扩展]</td></tr>\\n<tr><td><strong>大师技艺</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[猎人技艺]SL5才能学习此技能。在[猎人技艺]或[偏爱农具]效果下有效。你与“类型：动物”相关的农夫技能现在对“类型：魔兽、龙”生效，与“类型：植物”相关的农夫技能现在对“类型：人造”生效，使这些技能可以影响这些类型的生物。[AR2E扩展]</td></tr>\\n<tr><td><strong>槲寄生之力（法术）</strong></td><td>准备阶段</td><td>自动成功</td><td>单体</td><td>20m</td><td>5</td><td>5</td><td>每场景1次</td><td>目标进行的武器攻击获得+SLx5伤害。此效果持续到本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>槲寄生活力（法术）</strong></td><td>Cleanup Phase</td><td>自动成功</td><td>单体</td><td>近战</td><td>5</td><td>1</td><td>每场景1次</td><td>目标恢复3d6+CLx2 HP。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>滋养（法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>只能对“类型：动物、植物、魔兽”目标使用。目标的行动点数+5，直到场景结束。[Haru]</td></tr>\\n<tr><td><strong>掠食感知</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>每场景1次</td><td>当你对“类型：动物、植物、魔兽”目标进行攻击时，该攻击将感知加到伤害上。此效果持续到本轮结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>试探攻击</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>-</td><td>你必须拥有[感知敌人]SL1才能学习此技能。可与攻击同时使用。无论是否命中，在本主要阶段结束时，对攻击目标进行敌情识别判定。如果有多个目标，分别对每个目标进行判定，使用各自不同的识别难度。[AR2E扩展]</td></tr>\\n<tr><td><strong>反射射击</strong></td><td>反应</td><td>Dodge Check</td><td>自身</td><td>-</td><td>11</td><td>3</td><td>每剧本SL次</td><td>你必须拥有[园丁直觉]SL5以及[偏爱农具]SL1或[猎人技艺]至少SL1才能学习此技能。在[猎人技艺]或[偏爱农具]效果下可使用。作为对允许回避判定的攻击的反应可使用。使用你的感知进行回避判定。如果你在回避判定中成功，将该攻击视为命中攻击者。攻击者对自己进行伤害掷骰。[AR2E扩展]</td></tr>\\n<tr><td><strong>扎根姿态</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>-</td><td>如果你将受到失衡或击退减益效果，其效果等级减少SLx2（最小0）。如果效果等级为0或没有效果等级，不受到相应的减益效果。[Haru]</td></tr>\\n<tr><td><strong>围剿</strong></td><td>主要动作</td><td>Action Point</td><td>Area (SLx2)</td><td>10m</td><td>6</td><td>3</td><td>Whip，Spear or Axe equipped</td><td>目标与你进行行动点数对抗判定。如果你成功，目标进入你的交战（如果尚未在交战中），获得-SLx5行动点数，且交战变为被阻挡。此效果持续到本轮结束。目标的判定视为进行撤退，你的判定视为阻止撤退，并应用相应效果。[Watson]</td></tr>\\n<tr><td><strong>采种</strong></td><td>次要动作</td><td>自动成功</td><td>单体</td><td>10m</td><td>10</td><td>1</td><td>每场景1次</td><td>使用农夫的专业知识，从“类型：植物”目标处获得可种植生长的种子或根。目标兼容性和最终结果由GM决定。[Haru]</td></tr>\\n<tr><td><strong>感知敌人</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以使用感知进行敌情识别判定。[AR2E扩展]</td></tr>\\n<tr><td><strong>屠杀（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>3</td><td>每场景SL次</td><td>对“类型：动物”目标有效。对目标进行魔法攻击。该攻击对目标造成2d6+CLx10贯穿伤害。如果该攻击将目标的HP降至0或以下，立即在该目标的战利品表上掷两次并获得两件物品。[Haru]</td></tr>\\n<tr><td><strong>耕地</strong></td><td>主要动作</td><td>力量</td><td>见效果</td><td>近战</td><td>6</td><td>3</td><td>-</td><td>选择一个(SLx5)米半径的区域并翻起那里的地面。对区域内任何非飞行目标有效。目标进行灵巧对抗判定。如果你成功，它们受到失衡和击退(SL)减益效果。[Haru]</td></tr>\\n<tr><td><strong>老练农夫</strong></td><td>判定后</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每场景SL次</td><td>你必须拥有三个不同的“农夫专长”技能才能学习此技能。在对“类型：动物、植物、魔兽”目标进行判定后可使用。以相同骰数重掷该判定。[Haru]</td></tr>\\n<tr><td><strong>警告</strong></td><td>判定前</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>在目标进行感知判定前可使用。该判定获得+1d6。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>热情种植</strong></td><td>主要动作</td><td>命中判定</td><td>Area (SLx2)</td><td>近战</td><td>12</td><td>3</td><td>-</td><td>用你的武器进行近战攻击。如果你对目标造成至少1点HP伤害，目标被种在地上无法移动，直到场景结束或使用主要动作成功通过DL16的力量判定。[Haru]</td></tr>\\n</table>\\n<h5>死灵法师扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>亡灵盟友</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>死灵法师</td><td>允许使用者与一个被安抚的“类型：不死”目标永久结盟。你可以以自由动作向盟友发出基本口头命令。盟友响应命令进行的所有判定获得+1d6。被归类为杂兵的盟友由GM决定算作一个单位。你同时只能拥有一个永久盟友单位。[Watson]</td></tr>\\n<tr><td><strong>魔石保存技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>每剧本SL次</td><td>与你使用“魔石”物品时同时使用。该物品照常生效，但不消耗。对“魔石(XL)”无效。[Watson]</td></tr>\\n<tr><td><strong>尸体保存技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>视野</td><td>15</td><td>1</td><td>Create Undead</td><td>在场景结束时使用此技能。一个由[创造亡灵]创造的盟友怪物不会消失。[Watson]</td></tr>\\n<tr><td><strong>暗炼金技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>5</td><td>SLx2 times per Scenario</td><td>与你使用“治疗药水”物品时同时使用。治疗量-1d6，但现在对“类型：不死”有效。该效果可以以次要动作在不使用治疗药水的情况下应用，并交给他人稍后使用，但在这种情况下，该物品在本剧本结束时消失。[Watson]</td></tr>\\n<tr><td><strong>暗面技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的暗属性法术或死灵法师法术的魔法判定+2。暗属性法术或死灵法师法术的消耗-1（最小1）。[Watson]</td></tr>\\n<tr><td><strong>掘墓技能</strong></td><td>见效果</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每场景SL次</td><td>在你使用使你失去死亡生物战利品的技能时可使用。你不会失去对基础生物进行战利品掷骰的机会。[Watson]</td></tr>\\n<tr><td><strong>力能技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>在你进行造成虚空魔法伤害的魔法攻击时生效。该攻击的伤害+SLx4。[AR2E扩展]</td></tr>\\n<tr><td><strong>潜力技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>你的最大MP增加SL×5。[Watson]</td></tr>\\n<tr><td><strong>自我控制</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>你用魔法操控你的身体。当你需要进行武器攻击的命中判定，或力量判定或灵巧判定时，你改为进行魔法判定。该效果持续到本轮结束。[Watson]</td></tr>\\n<tr><td><strong>缠绕</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在你使用“外部召唤”时可使用。该技能变为“目标：单体*”且消耗-2（最小1）。[AR2E扩展]</td></tr>\\n<tr><td><strong>创造亡灵（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>15</td><td>3</td><td>-</td><td>只能对不是“类型：不死”且未被掠夺的死亡生物使用（使用此技能时你失去战利品）。创造一个服从并听命于你的“类型：不死”盟友怪物。创造的怪物根据此技能的SL选择，在“幽灵(SL1)”、“骷髅(SL2)”或“僵尸(SL3)”之间选择。此技能创造的怪物持续到本场景结束。[Watson]</td></tr>\\n<tr><td><strong>上级创造</strong></td><td>Create Undead</td><td>自动成功</td><td>自身</td><td>-</td><td>15</td><td>3</td><td>每剧本SL次</td><td>你必须拥有[创造亡灵]SL3才能学习此技能。与[创造亡灵]同时使用。怪物的EL（或CL）变为等于角色的CL。怪物获得原始等级与最终等级之间每级差值的能力。每2级所有判定+1。每级伤害+2。每级HP+5。每级物理防御和魔法防御+1。[Watson]</td></tr>\\n<tr><td><strong>衰老（法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>自身</td><td>20m</td><td>8</td><td>1</td><td>-</td><td>目标现在被视为“类型：不死”，没有“对类型：不死有效”的HP恢复效果对其无效。此效果持续到本轮结束。仅影响不死生物且持续时间应长于此效果的效果，与此效果同时结束。[Watson]</td></tr>\\n<tr><td><strong>暗影之枪（暗属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>对目标进行魔法攻击。该攻击造成2d6+10暗属性魔法伤害。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>尸体爆发（暗属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>只能对未被掠夺的死亡生物（使用此技能时你失去战利品）或由你的[创造亡灵(SL3)]创造的僵尸使用。该魔法攻击使尸体爆炸，对与尸体在同一交战中的所有角色造成2d6+10+(尸体的CL)x2暗属性魔法伤害。如果目标因该攻击受到至少1点HP伤害，附加中毒(1)、威压和眩晕。[Watson]</td></tr>\\n<tr><td><strong>虚假生命（法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>自身</td><td>20m</td><td>8</td><td>1</td><td>-</td><td>“类型：不死”的目标不再被视为“类型：不死”，具有“对类型：不死有效”的HP恢复效果对其无效，但其他效果有效。此效果持续到本轮结束。不能影响不死生物且持续时间应长于此效果的效果，与此效果同时结束。[Watson]</td></tr>\\n<tr><td><strong>丧钟（法术）</strong></td><td>Cleanup Phase</td><td>自动成功</td><td>场景（选择）</td><td>视野</td><td>20</td><td>1</td><td>每剧本1次</td><td>仅对“类型：不死”目标有效。对目标造成2d6+10+CLx4贯穿伤害。如果目标因该攻击受到至少1点HP伤害，直到场景结束前无法以任何方式恢复HP。[Watson]</td></tr>\\n<tr><td><strong>高级召唤师</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>对[外部召唤]进行的反应获得-1d6。该效果持续到本主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>上级召唤师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[高级召唤师]SL1才能学习此技能。当你需要为伤害、恢复HP/MP或增减伤害进行掷骰时，[外部召唤]的效果获得+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>双重召唤</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在你与[外部召唤]同时使用“契约”物品时有效。你可以从持有物中使用另一个“契约”物品并应用其效果。警告：并非所有“契约”物品的效果都兼容。[AR2E扩展]</td></tr>\\n<tr><td><strong>外部召唤（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>区域（选择）</td><td>20m</td><td>8</td><td>1</td><td>-</td><td>对目标进行魔法攻击。该攻击造成2d6虚空魔法伤害。如果你的持有物中有“契约”物品，你可以使用它来修改此法术效果。[Watson]</td></tr>\\n<tr><td><strong>暗之链接</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>12</td><td>5</td><td>-</td><td>你必须拥有[暗影之枪]SL1才能学习此技能。对目标进行武器攻击。如果目标因该攻击受到至少1点HP伤害，接下来SL次目标因非你造成的伤害来源受到至少1点HP伤害时，你立即无消耗地对目标施放“暗影之枪”。该效果持续到本轮结束。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>镜之诅咒（法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>-</td><td>你受到的下一个不造成伤害的法术也同时作用于该法术的来源。该效果持续到本轮结束。[Watson]</td></tr>\\n<tr><td><strong>魔法标记（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近战</td><td>10</td><td>1</td><td>每剧本1次</td><td>只要你的目标在同一场景中，你将其视为在你的法术“射程内”。目标可以拒绝此效果。如果目标拒绝，此次技能使用不计入使用次数限制。此效果持续到剧本结束。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>死灵傀儡（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>-</td><td>对“类型：不死”目标可使用。目标对你的魔法判定进行精神对抗判定。如果你成功，目标将变为消耗、被安抚，并听从你的命令。如果目标不是杂兵或额外角色，他们可以忽略此效果。[Watson]</td></tr>\\n<tr><td><strong>混乱射线（暗属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>-</td><td>对目标附加恍惚和激怒。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>契约（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>10</td><td>5</td><td>-</td><td>目标必须是非敌对生物。如果对方接受，你与其形成魔法“契约”。你最多可以拥有SL个不同的“契约”。如果你在达到上限后想形成“契约”，需要在形成新契约时放弃一个“契约”。“契约”以“重量：0”的物品形式存在，其效果取决于目标的“类型”和/或种族。你同时只能使用一个契约，且只有你能使用它们。[Watson]</td></tr>\\n<tr><td><strong>赏金：亡灵</strong></td><td>见效果</td><td>-</td><td>自身</td><td>-</td><td>8</td><td>3</td><td>每场景SL次</td><td>掠夺“类型：不死”的怪物时，额外掷SL次战利品表以获取战利品。[Watson]</td></tr>\\n<tr><td><strong>亡灵复苏（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>8</td><td>1</td><td>-</td><td>对[类型：不死]有效。目标恢复3d6+CLx3 HP。如果目标处于K.O状态，以2d6 HP复活，且变为消耗状态。对非[类型：不死]的目标无效。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>查询</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每剧本SL次</td><td>你可以向GM提出一个问题。GM可以选择不回答。如果GM不回答，此次技能使用不计入使用次数限制。[AR2E扩展]</td></tr>\\n<tr><td><strong>禁忌知识</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>将你的智力加到你的魔法攻击伤害上。此效果持续到你的主要阶段结束。[Watson]</td></tr>\\n<tr><td><strong>鲜血法术</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>在你进行魔法攻击的伤害掷骰前可使用。失去最多SLx5（最小1）HP。然后将等同于失去HP量的伤害加到此攻击上。伤害增加持续到本主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>领域</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>此技能影响你所有非“射程：近战”的死灵法师技能。你的技能射程增加SLx5米。[AR2E扩展]</td></tr>\\n</table>\\n<h5>弄臣扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>获得通用技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>学习此技能时，选择三个未被列为法术的通用技能，且不是专注或信仰。你学习那些技能。[Watson]</td></tr>\\n<tr><td><strong>空中支援</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>每轮1次</td><td>在坠落伤害掷骰前使用。将你将受到的坠落伤害变为0，然后进入飞行状态并进行战斗移动。你不必移动。此飞行状态持续到主要阶段结束。你也可以在落入陷阱或洞穴受到坠落伤害时，或骑乘时受到失衡影响时使用此技能。[Watson]</td></tr>\\n<tr><td><strong>弄臣技艺技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的舞蹈技能、音乐技能、演说技能或弄臣的表演技能的判定获得+1d6。[Watson]</td></tr>\\n<tr><td><strong>杂耍改良技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>你的“表演”技能的攻击伤害获得+(SL)d6。[Watson]</td></tr>\\n<tr><td><strong>杂耍武器技能</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>选择一把已装备或在持有物中的武器。当你使用造成伤害的“表演”技能时，加上所选武器的攻击力。如果武器在持有物中，你装备它并将之前手持的装备物品掉落在地上。该效果持续到主要阶段结束。[Watson]</td></tr>\\n<tr><td><strong>远投技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>投掷或“表演”技能的射程增加+SLx5米。[Watson]</td></tr>\\n<tr><td><strong>卓越演艺技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你将通用技能应用于“音乐”、“演说”、“表演”和“舞蹈”技能的判定（适用时）。此效果同时只能应用一个通用技能，且也应用于命中判定。反之，如果你拥有[弄臣技艺技能]，你的[吟唱技能]、[欺骗技能]、[宴会技能]和[舞蹈技能]在其他用途上获得+1d6。即使原本不受[弄臣技艺技能]影响，也可以应用于相应的判定。（吟游诗人的各种吟唱直接是吟唱判定，不需要此技能，但如果你拥有[弄臣技艺技能]，可以从中受益。）[Watson]</td></tr>\\n<tr><td><strong>舞蹈：旋转卡波耶拉</strong></td><td>主要动作</td><td>命中判定(Dance)</td><td>场景（选择SLx2）</td><td>Move</td><td>12</td><td>5</td><td>-</td><td>以节奏击打的攻击性舞蹈。对所有选择的目标进行近战武器攻击。如果你因该攻击造成1点HP伤害，对目标附加恍惚。该攻击的射程等于你的移动力，即使对交战外的目标也可以使用。你不移动。坐骑对移动力的影响不计入射程。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>舞蹈：禁忌之舞</strong></td><td>主要动作</td><td>Agility (Dance)</td><td>场景（选择）</td><td>Move</td><td>10</td><td>2</td><td>-</td><td>无名之舞。目标进行精神对抗判定。掷(SL)d6，对抗判定失败的目标根据每个骰子的结果分别获得减益效果。1：威压，2：激怒，3：恐惧，4：失衡，5：束缚，6：你从其他5种可能中选择减益效果。如果多个掷出的骰子有相同的点数（6除外），你将其中一个视为6，直到只有不同的结果或6为止。坐骑对移动力的影响不计入射程。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>舞蹈：最后华尔兹</strong></td><td>主要动作</td><td>见效果</td><td>见效果</td><td>See effect</td><td>See effect</td><td>1</td><td>每剧本1次</td><td>为舞会画上句号的舞蹈。你再次执行在过去五轮中执行过的所有“舞蹈”技能，一个接一个（你可以选择新目标）。此技能的消耗等于所有执行的“舞蹈”总消耗的一半。之后，直到本场景结束，你不能使用任何“舞蹈”技能。[Watson]</td></tr>\\n<tr><td><strong>舞蹈：军刀小步舞</strong></td><td>主要动作</td><td>命中判定(Dance)</td><td>单体</td><td>近战</td><td>8</td><td>1</td><td>-</td><td>以攻击压倒对方的攻击性舞蹈。对目标进行近战武器攻击。如果他们的行动点数少于你，你对目标进行第二次近战武器攻击。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>舞蹈：特技摇滚</strong></td><td>主要动作</td><td>Agility (Dance)</td><td>区域（选择）</td><td>Move</td><td>8</td><td>1</td><td>-</td><td>舞者向各方向跳跃的空中舞蹈，包括越过头顶。目标的所有反应判定获得-1d6，直到本轮结束。如果目标处于飞行状态，效果变为：失去飞行状态，行动点数减少-1d6，且所有反应判定获得-1d6，该效果持续到场景结束（可以通过恢复减益效果的效果取消）。如果至少一个目标受到此技能的任一效果影响，你可以选择进入飞行状态直到你的下一次移动，你不会因此效果移动。坐骑对移动力的影响不计入射程。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>幻影集</strong></td><td>Phase d&#x27;Initialisation</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>5</td><td>-</td><td>只有在音乐技能生效时才可使用。你的“舞蹈”技能、“演说”技能和“表演”技能获得伤害+SLx2和减益效果等级+SL，且这些技能的目标对其的反应判定获得-1d6。该效果持续到本轮结束或音乐效果结束。[Watson]</td></tr>\\n<tr><td><strong>邀请（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>-</td><td>对“类型：人类、亚人”目标可使用。目标对你的魔法判定进行精神对抗判定。如果你成功，目标将变为消耗、被安抚，并听从你的命令。如果目标不是杂兵或额外角色，他们可以忽略此效果。[Watson]</td></tr>\\n<tr><td><strong>巧舌</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>-</td><td>你选择一个“时机：主要动作”的“演说”技能、“音乐”技能或“吟唱”，立即使用它。直到本主要阶段结束，你不能再次使用所选技能。你不能选择使用条件未满足的技能。[Watson]</td></tr>\\n<tr><td><strong>赞助</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[卓越演艺技能]SL1才能学习此技能。学习此技能时，选择一个你不拥有的、在准备阶段产生KE效果的通用技能。你必须具备学习所选技能的条件，如果至少不具备其中一个条件则不能学习此技能。你在准备阶段从通用技能获得的KE数量乘以5。[Watson]</td></tr>\\n<tr><td><strong>音乐：魔法叙事诗</strong></td><td>主要动作</td><td>精神(Chant)</td><td>场景（选择）</td><td>Scene</td><td>14</td><td>1</td><td>-</td><td>注入魔法能量的叙事诗。目标获得魔法判定+1d6，直到你使用另一个“音乐”技能、你受到至少1点HP伤害，或直到本场景结束。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>音乐：终曲</strong></td><td>Phase d&#x27;Initialisation</td><td>自动成功</td><td>Scène (Choix)</td><td>Scène</td><td>25</td><td>1</td><td>Une fois par Scénario</td><td>只有在你执行的“音乐”技能效果激活时才可使用，并立即结束该效果。所有目标获得所有掷骰和判定+2d6。此效果激活期间你不能使用其他“音乐”技能，持续到你受到至少1点HP伤害或本轮结束。之后，直到本场景结束你不能使用任何“音乐”技能，但对于其他技能，你始终被视为处于“音乐”技能效果下。[Watson]</td></tr>\\n<tr><td><strong>音乐：战斗圣歌</strong></td><td>主要动作</td><td>精神(Chant)</td><td>场景（选择）</td><td>Scene</td><td>14</td><td>1</td><td>-</td><td>发自内心提升勇气的圣歌。目标获得武器攻击的命中判定+1d6，直到你使用另一个“音乐”技能、你受到至少1点HP伤害，或直到本场景结束。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>音乐：震动旋律</strong></td><td>主要动作</td><td>精神(Chant)</td><td>场景（选择）</td><td>Scene</td><td>14</td><td>1</td><td>-</td><td>震动肌肉与灵魂的旋律。目标获得回避判定+1d6，直到你使用另一个“音乐”技能、你受到至少1点HP伤害，或直到本场景结束。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>音乐：神秘颂</strong></td><td>主要动作</td><td>精神(Chant)</td><td>场景（选择）</td><td>Scene</td><td>14</td><td>1</td><td>-</td><td>被遗忘时代的神秘颂歌。目标获得所有精神判定+1d6，直到你使用另一个“音乐”技能、你受到至少1点HP伤害，或直到本场景结束。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>演说：谴责</strong></td><td>主要动作</td><td>精神(Deception)</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>说服目标他们的终结是近在咫尺且不可避免的。目标进行精神对抗判定。如果你获胜，目标在清理阶段受到2d6+CLx3贯穿伤害。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>演说：甜言蜜语</strong></td><td>主要动作</td><td>精神(Deception)</td><td>单体</td><td>20m</td><td>10</td><td>3</td><td>-</td><td>赞美目标并激起他们的自负。他们获得再生(SL+1)。该效果在每个清理阶段恢复5 HP，然后效果等级减少1。当效果等级降至0或HP等于最大HP时此效果结束。效果等级可以通过提升减益效果等级的技能来提升。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>演说：疑病症</strong></td><td>主要动作</td><td>精神(Deception)</td><td>单体</td><td>20m</td><td>10</td><td>3</td><td>-</td><td>说服目标他们接触了毒物。目标进行精神对抗判定。如果你获胜，对目标附加中毒(SL+1)。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>演说：侮辱</strong></td><td>主要动作</td><td>精神(Deception)</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>-</td><td>向目标投掷粗俗侮辱的言辞。目标进行精神对抗判定。如果你获胜，对目标附加激怒和威压。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>演说：疑云</strong></td><td>主要动作</td><td>精神(Deception)</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>-</td><td>在目标耳边低语关于他们的谣言。目标进行精神对抗判定。如果你获胜，附加恍惚和击退(2)。暴击：消耗0。[Watson]</td></tr>\\n<tr><td><strong>舞步：禁忌</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你必须拥有[舞蹈：禁忌之舞]SL2才能学习此技能。你可以在准备阶段使用你的[舞蹈：禁忌之舞]。此技能被视为舞者技能“舞步：~~”，且在使用时直到本轮结束被视为处于类似技能效果下。[Watson]</td></tr>\\n<tr><td><strong>迫害</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>仅在攻击受到任意减益效果的对手时有效。将你的精神加到你的命中判定和造成的伤害上。该效果持续到本主要阶段结束。[Watson]</td></tr>\\n<tr><td><strong>奇迹之袋</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>选择一个“时机：主要动作”的“表演”技能，立即使用它。直到本主要阶段结束，你不能再次使用所选技能。你不能选择使用条件未满足的技能。你取回一件在本场景中掉落或丢失的物品。[Watson]</td></tr>\\n<tr><td><strong>表演：气球</strong></td><td>主要动作</td><td>灵巧(Party)</td><td>单体</td><td>投掷</td><td>4</td><td>1</td><td>-</td><td>制造一个气球投向目标。对目标进行远程攻击。该攻击造成2d6+5物理伤害。如果目标因此伤害失去至少1点HP，对其附加失衡。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>表演：圈环</strong></td><td>主要动作</td><td>灵巧(Party)</td><td>单体</td><td>投掷</td><td>4</td><td>1</td><td>-</td><td>制造一个圈环投向目标。对目标进行远程攻击。该攻击造成2d6+5物理伤害。如果目标因此伤害失去至少1点HP，对其附加威压。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>表演：飞刀</strong></td><td>主要动作</td><td>灵巧(Party)</td><td>单体</td><td>投掷</td><td>4</td><td>1</td><td>-</td><td>制造一把魔法飞刀投向目标。对目标进行远程攻击。该攻击的灵巧判定获得+1d6。该攻击造成2d6+5物理伤害。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>表演：抛射返还</strong></td><td>反应</td><td>灵巧(Party)</td><td>单体</td><td>See effect</td><td>5</td><td>1</td><td>每轮1次</td><td>当你是远程武器攻击的目标时可使用。对该攻击进行灵巧对抗判定。如果你获胜，选择一个目标，该目标成为攻击的新目标（他们可以像正常一样对该攻击进行反应，且可以是攻击者本身）。攻击者和新目标都需要在视野内。[Watson]</td></tr>\\n<tr><td><strong>表演：丝带</strong></td><td>主要动作</td><td>灵巧(Party)</td><td>单体</td><td>投掷</td><td>4</td><td>1</td><td>-</td><td>制造一条丝带在目标上方展开。对目标进行远程攻击。该攻击造成2d6+5物理伤害。如果目标因此伤害失去至少1点HP，他们的所有伤害掷骰获得-1d6，直到本轮结束。暴击：增加骰子。[Watson]</td></tr>\\n<tr><td><strong>表演：微笑</strong></td><td>移动动作</td><td>自动成功</td><td>单体</td><td>投掷</td><td>6</td><td>3</td><td>每场景SL次</td><td>向目标送上微笑。目标立即使用一个主要动作，而不进入其主要阶段。该主要动作不会使目标变为消耗状态，即使目标已消耗也可以使用。目标可以拒绝此效果，在这种情况下，此次技能使用不计入使用次数限制。[Watson]</td></tr>\\n</table>\\n<h5>专注扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>专注：弄臣</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>弄臣</td><td>你的职业必须是弄臣才能学习此技能。幸运+1。你最多只能学习一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：狂战士</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Berserker / Use two handed weapon</td><td>你的职业必须是狂战士才能学习此技能。双手武器的武器攻击伤害+2。你最多只能学习一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：舞者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>舞者</td><td>你的职业必须是舞者才能学习此技能。灵巧+1。你最多只能学习一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：农夫</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>农夫</td><td>你的职业必须是农夫才能学习此技能。你对[类型：动物、植物和魔兽]目标的战利品掷骰+2。你最多只能学习一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：剑斗士</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Gladiator / Duelling</td><td>你的职业必须是剑斗士才能学习此技能。当你处于决斗状态时激活。魔法防御+2。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：幻术师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Illusionist</td><td>你的职业必须是幻术师才能学习此技能。你使用幻术法术的魔法攻击伤害+2。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：吟游诗人</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>吟游诗人</td><td>你的职业必须是吟游诗人才能学习此技能。准备阶段，你获得精神x100 KE。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：武僧</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Monk / Use Hand-to-hand</td><td>你的职业必须是武僧才能学习此技能。你使用徒手武器的武器攻击伤害+2。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：死灵法师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>死灵法师</td><td>你的职业必须是死灵法师才能学习此技能。你的死灵法师法术对[类型：不死生物]生效时威力+2（伤害或治疗）。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：忍者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>忍者</td><td>你的职业必须是忍者才能学习此技能。精神+1。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：贤者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>贤者</td><td>你的职业必须是贤者才能学习此技能。智力+1。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：萨满</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>萨满</td><td>你的职业必须是萨满才能学习此技能。你对带有负面状态的目标的攻击伤害+2。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>专注：维京人</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Viking / Swimming</td><td>你的职业必须是维京人才能学习此技能。当你处于游泳状态时，行动点数+2。你不能学习超过一个专注技能。[Watson]</td></tr>\\n<tr><td><strong>上级精通：大法师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>CL 10，Arch-Wizard / Choosen class</td><td>你的基础智力需要达到15，基础感知需要达到12。你需要拥有装备限制为「魔法师」的某个职业的[专注：~~]和[精通技能：~~]才能学习此技能。\\n当你处于大法师职业时，你被视为同时拥有你的[专注：~~]技能所属职业，就像你被视为魔法师职业一样（你可以学习该职业的技能，并使用需要该职业才能使用的技能）。\\n你的[专注：~~]技能所属职业每等级的HP和MP获得量+4。该职业修正值在智力上+1，在感知上+1。\\n当你处于你的[专注：~~]所属职业时，你可以学习大法师技能。但通过此效果每等级只能学习1 SL的大法师技能。[Watson]</td></tr>\\n<tr><td><strong>上级精通：大祭司</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>CL 10，Arch-Priest / Choosen class</td><td>你的基础精神需要达到15，基础幸运需要达到12。你需要拥有装备限制为「祭司」的某个职业的[专注：~~]和[精通技能：~~]才能学习此技能。\\n当你处于大祭司职业时，你被视为同时拥有你的[专注：~~]技能所属职业，就像你被视为祭司职业一样（你可以学习该职业的技能，并使用需要该职业才能使用的技能）。\\n你的[专注：~~]技能所属职业每等级的HP和MP获得量+4。该职业修正值在精神上+1，在幸运上+1。\\n当你处于你的[专注：~~]所属职业时，你可以学习大祭司技能。但通过此效果每等级只能学习1 SL的大祭司技能。[Watson]</td></tr>\\n<tr><td><strong>上级精通：刺客</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>CL 10，Assassin / Choosen class</td><td>你的基础敏捷需要达到15，基础灵巧需要达到12。你需要拥有装备限制为「盗贼」的某个职业的[专注：~~]和[精通技能：~~]才能学习此技能。\\n当你处于刺客职业时，你被视为同时拥有你的[专注：~~]技能所属职业，就像你被视为盗贼职业一样（你可以学习该职业的技能，并使用需要该职业才能使用的技能）。\\n你的[专注：~~]技能所属职业每等级的HP和MP获得量+4。该职业修正值在敏捷上+1，在灵巧上+1。\\n当你处于你的[专注：~~]所属职业时，你可以学习刺客技能。但通过此效果每等级只能学习1 SL的刺客技能。[Watson]</td></tr>\\n<tr><td><strong>上级精通：冒险者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>冒险者，CL 10</td><td>你需要拥有[上级职业模仿技能]和[专注：冒险者]才能学习此技能。冒险者职业每等级的HP和MP获得量+4。[专注：冒险者]选择的能力值现在变为+2而非+1。如果你是冒险者职业，在准备阶段获得1次额外的祝福。[Watson]</td></tr>\\n<tr><td><strong>上级精通：十字军</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>CL 10，Crusader / Choosen class</td><td>你的基础力量需要达到15，基础精神需要达到12。你需要拥有装备限制为「战士」的某个职业的[专注：~~]和[精通技能：~~]才能学习此技能。\\n当你处于十字军职业时，你被视为同时拥有你的[专注：~~]技能所属职业，就像你被视为战士职业一样（你可以学习该职业的技能，并使用需要该职业才能使用的技能）。\\n你的[专注：~~]技能所属职业每等级的HP和MP获得量+4。该职业修正值在力量上+1，在精神上+1。\\n当你处于你的[专注：~~]所属职业时，你可以学习十字军技能。但通过此效果每等级只能学习1 SL的十字军技能。[Watson]</td></tr>\\n<tr><td><strong>魔法蜡烛（火属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>见效果</td><td>See effect</td><td>6</td><td>1</td><td>-</td><td>将你所在区域的亮度改为2或3（如果你不使用亮度规则，则取消黑暗效果）。你可以以自由动作调整此亮度。但是，你不能通过此技能使区域的亮度降至其初始值以下。此效果无视魔法黑暗的限制。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>不吉</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每场景1次</td><td>使用任意数量的祝福，最多不超过你的最大使用次数（即你的幸运值）。你每消耗1点祝福恢复CLx3 HP。[AR2E扩展]</td></tr>\\n<tr><td><strong>烙印</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>在一次判定完成后使用（在技能/祝福的重掷之后）。消耗1点祝福。在上述判定的结果上+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>人造人</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每场景1次</td><td>使用任意数量的祝福，最多不超过你的最大使用次数（即你的幸运值）。你每消耗1点祝福恢复CLx2 MP。[AR2E扩展]</td></tr>\\n<tr><td><strong>机械装甲</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你获得+2物理防御和+1魔法防御。[AR2E扩展]</td></tr>\\n<tr><td><strong>机械肢体</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的基础力量、基础灵巧和基础敏捷各+1。[AR2E扩展]</td></tr>\\n<tr><td><strong>继承</strong></td><td>物品</td><td>-</td><td>Special</td><td>-</td><td>-</td><td>1</td><td>-</td><td>准备阶段，选择1件你已装备或在物品栏中的武器或防具。如果该物品是武器，其攻击力+1。如果该物品是防具，其物理防御或魔法防御+1。[AR2E扩展]</td></tr>\\n</table>\\n<h5>信仰扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>信仰：阿肯雷夫</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>所有命中判定+1。你不能再获得任何其他信仰技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>信仰：格罗维斯</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的灵巧判定+1。你不能再获得任何其他信仰技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>信仰：达格德莫尔</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的行动点数+2。你不能再获得任何其他信仰技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>信仰：达南</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>减少受到伤害的技能或作弊的效果+1。你不能再获得任何其他信仰技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>信仰：纳雷什</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的精神判定+1。你不能再获得任何其他信仰技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>信仰：布里甘蒂亚</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>反应判定+1。你不能再获得任何其他信仰技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>信仰：里亚尔</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>游泳中</td><td>你的攻击伤害+3。你不能再获得任何其他信仰技能。[AR2E扩展]</td></tr>\\n</table>\\n<h5>通用技能遗产职业技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>遗产印记</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>此技能无法正常学习，只能作为任务的奖励获得。在聚会前或使用经验值时，你可以将此技能交换为以下之一：[遗产印记：武斗家]、[遗产印记：契约者]、[遗产印记：术士]或[遗产印记：幸运儿]。交换此技能后，无法再次学习。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>遗产印记：武斗家</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你获得遗产动作，你可以在主要阶段中的移动、次要或主要动作之前使用它来使用遗产技能。你获得战术点数（TP），武斗家独有的技能货币，并免费获得[武器战术]SL1。当你升级时，如果你处于以下职业之一：战士、十字军、冒险者或[上级精通：十字军]选择的职业，你可以像当前职业一样学习武斗家职业的任何技能。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>遗产印记：契约者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你获得遗产动作，你可以在主要阶段中的移动、次要或主要动作之前使用它来使用遗产技能。你获得物品类型：契约妖精（C. Fae），契约者独有的物品类型，并免费获得[契约]SL1。当你升级时，如果你处于以下职业之一：祭司、大祭司、冒险者或[上级精通：大祭司]选择的职业，你可以像当前职业一样学习契约者职业的任何技能。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>遗产印记：术士</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你获得遗产动作，你可以在主要阶段中的移动、次要或主要动作之前使用它来使用遗产技能。你获得灵性武器（SprWpn），术士独有的武器类型，并免费获得[元素武器]SL1。当你升级时，如果你处于以下职业之一：魔法师、大法师、冒险者或[上级精通：大法师]选择的职业，你可以像当前职业一样学习术士职业的任何技能。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>遗产印记：幸运儿</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你获得遗产动作，你可以在主要阶段中的移动、次要或主要动作之前使用它来使用遗产技能。你获得奥秘牌组，幸运儿独有的物品类型，并免费获得[奥秘]SL1。当你升级时，如果你处于以下职业之一：盗贼、刺客、冒险者或[上级精通：刺客]选择的职业，你可以像当前职业一样学习幸运儿职业的任何技能。[AR2E遗产职业]</td></tr>\\n</table>\\n<h5>武斗家遗产职业技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>武器战术</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>5</td><td>-</td><td>战斗开始时，你获得(SLx3)+2战术点数（TP）。战斗结束时，你失去所有当前拥有的TP。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>精通技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择一种武器类型。将此技能与所选类型一起记录，例如精通技能：单手剑。使用所选类型武器的所有命中判定+1d6。将其他武器的精通技能实例视为独立技能。你同一时间只能应用一个精通技能。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>逆转生命</strong></td><td>昏迷时</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>仅在你拥有至少1点TP时可使用。消耗你所有的TP。从昏迷状态中恢复，并恢复等于所消耗TP数量的HP。你变为力竭状态。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>冲击打击</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用徒手</td><td>消耗最多5点TP（最少1点）。你的武器攻击获得+(消耗TPx3)伤害。此外，每当你的攻击对目标造成至少1点HP伤害时，对其施加失衡。这些效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>灵气护盾</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>每次防御1次，装备徒手</td><td>在一次会造成你受到伤害的伤害掷骰后使用。将该次伤害减少1d6+精神值。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>连续冲锋</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>1</td><td>使用徒手</td><td>你的武器攻击变为「目标：区域(3)」。此效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>闪避之刃</strong></td><td>判定后</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>装备匕首</td><td>在回避判定后使用。消耗最多5点TP（最少1点）。该判定+(消耗TPx2)。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>精准</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>使用匕首</td><td>你可以使用你一个时机为次要动作的技能。之后，直到你的主要阶段结束，你将灵巧加到所有武器攻击伤害上。所选的次要动作不能让你使用另一个次要动作。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>痛苦之刃</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>8</td><td>1</td><td>使用匕首</td><td>每当你的武器攻击施加一个有效力等级的负面状态时，所施加的负面状态效力等级+1。此效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>迅剑</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>Using 1HSword</td><td>你的武器攻击伤害+5。此效果持续到本场景结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>剑加速</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>每轮1次，Using 1HSword</td><td>你可以使用你一个时机为次要动作的技能。之后，直到你的主要阶段结束，你将敏捷加到所有武器攻击伤害上。所选的次要动作不能让你使用另一个次要动作。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>破坏者之剑</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Using 1HSword</td><td>消耗最多5点TP（最少1点）。你的武器攻击获得+(消耗TP)d6伤害。此效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>能量斩</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Using 2HSword</td><td>消耗最多5点TP（最少1点）。在武器攻击的伤害掷骰前使用。该武器攻击的伤害类型变为虚空魔法伤害，并获得+(消耗TPx3)伤害。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>要塞之刃</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>8</td><td>1</td><td>2HSword equipped</td><td>你获得+5物理防御和魔法防御。此效果持续到本场景结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>刃爆</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>Using 2HSword</td><td>你的武器攻击命中判定+1d6。此效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>飞斧轰炸</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>使用斧</td><td>消耗最多5点TP（最少1点）。你的武器攻击获得+(消耗TPx3)伤害。此外，每当你的攻击对目标造成至少1点HP伤害时，对其施加击退(1)。这些效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>动态冲刺</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>使用斧</td><td>进行战斗移动或全力移动。如果你这样做，直到本主要阶段结束，你的近战攻击命中判定+1d6。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>快斧</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>装备斧</td><td>消耗1点TP。你的行动点数增加2d6。此效果持续到本轮结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>灵魂冲击</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Using Blunt</td><td>消耗最多5点TP（最少1点）。你的武器攻击获得+(消耗TPx3)伤害。此外，每当你的攻击对目标造成至少1点HP伤害时，对其施加恍惚。这些效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>破坏者挥击</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>Using Blunt</td><td>每当你的武器攻击对目标造成至少1点HP伤害时，你可以将该目标向任意方向移动最多5米。此移动可以允许目标脱离交战，忽略被阻挡交战的效果。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>治愈打击</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>1</td><td>Using Blunt</td><td>在你进行武器攻击的伤害掷骰时使用。如果此攻击造成至少1点HP伤害，在本主要阶段结束时恢复(你的精神值)HP。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>跳跃变换</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>Spear equipped</td><td>你获得飞行状态，并可以立即进行战斗移动。如果你不想移动也可以不移动。飞行状态在你的移动结束时结束。如果你拥有[跳跃移动]至少SL1，你通过[跳跃变换]进行的战斗移动增加(跳跃移动的SLx5)米。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>枪压</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Using Spear</td><td>消耗最多5点TP（最少1点）。你的武器攻击获得+(消耗TPx3)伤害。此外，每当你的攻击对目标造成至少1点HP伤害时，对其施加威压。这些效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>精准刺击</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>Using Spear</td><td>你可以使用你一个时机为次要动作的技能。之后，直到你的主要阶段结束，你将感知加到所有武器攻击伤害上。所选的次要动作不能让你使用另一个次要动作。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>鞭笼</strong></td><td>先攻阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>Whip equipped，每轮1次</td><td>消耗1点TP。你的交战变为被阻挡交战。此效果持续到你移动，或直到本轮结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>鞭狂</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Using Whip</td><td>消耗最多5点TP（最少1点）。你的武器攻击变为「目标：区域(2)」并获得+(消耗TPx3)伤害。这些效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>痛苦束缚</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Using Whip</td><td>每当你的武器攻击施加一个有效力等级的负面状态时，所施加的负面状态效力等级+1。此效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>防御之箭</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>武器</td><td>5</td><td>1</td><td>装备弓，每次防御1次</td><td>在对目标进行伤害掷骰后使用。该次伤害-3d6。如果你也可以使用[反击射击技能]，你可以同时使用这两个技能。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>先制</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>使用弓</td><td>你的武器攻击伤害+5。此效果持续到场景结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>百万射击</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用弓</td><td>消耗最多5点TP（最少1点）。你的武器攻击变为「目标：(消耗TP+1)个单体」。此效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>多重武器战术</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你使用一个「条件」为「使用武器」或「装备武器」且与你使用或装备的武器不同的非被动技能时使用。消耗1点TP。该条件现在允许你的武器被使用或装备用于此次使用。此技能不允许超出你的武器射程，你需要来自物品、技能或武器本身的其他效果（例如近战武器可投掷，或远程武器可在近战使用）才能使用。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>灵气之刃</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>1</td><td>装备刀，每场景1次</td><td>你的武器攻击伤害+10。此效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>踢击突击</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>2</td><td>1</td><td>装备刀</td><td>如果你在本主要阶段中进行了移动则可使用。你的近战攻击命中判定+1d6。此效果持续到本主要阶段结束。[AR2E遗产职业]</td></tr>\\n<tr><td><stron R2E遗产职业]</td></tr>\\n</table>\\n<h5>术士遗产职业技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>元素武器</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>当你使用此技能时，选择一个「类型：灵性武器」（SprWeap）物品。你失去当前装备的任何「类型：灵性武器」物品，你获得并装备所选物品。之前在同一装备栏位中装备的物品可以放入物品栏。此效果持续到场景结束，届时该物品消失。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>大元素</strong></td><td>Elemental Weapon</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>与[元素武器]同时使用。你通过[元素武器]创造的物品变为「装备栏位：双手」并获得+3「攻击力」。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>双重元素</strong></td><td>Elemental Weapon</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>与[元素武器]同时使用。选择并创造2个「类型：灵性武器」物品而非1个，并双手各装备一个。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>元素守卫</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>SprWeap equipped，Once per Defence</td><td>在一次会造成你受到伤害的伤害掷骰后使用。将你从该伤害掷骰中受到的伤害减少(你武器的攻击力/2)。（如果有任何效果修改你的武器攻击力，在除法之前应用这些修改。）[AR2E遗产职业]</td></tr>\\n<tr><td><strong>剑魔法</strong></td><td>遗产动作</td><td>魔法判定</td><td>单体*</td><td>近战</td><td>5</td><td>1</td><td>Using SprWeap</td><td>对目标进行近战攻击。此攻击的命中判定为魔法判定。攻击后，进行一次撤退。你不能以此方式从被阻挡交战中撤退。暴击：追加骰子。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>连锁魔法</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>SprWeap equipped</td><td>与[剑魔法]同时使用。如果[剑魔法]的攻击造成至少1点HP伤害，直到本主要阶段结束，你的魔法攻击伤害+5。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>快速标记</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>SprWeap equipped</td><td>你获得+4行动点数。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>前进移动</strong></td><td>先攻阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>SprWeap equipped，每轮1次</td><td>进行战斗移动。此移动必须用于进入与另一个角色的交战。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>魔法追击</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>SprWeap equipped</td><td>你的「类型：法术」技能消耗-1。[AR2E遗产职业]</td></tr>\ ks made using this Weapon deal Lightning magic damage. You get +1 to Magic Checks you make for &quot;Lightning Spell&quot; effects. Consider Skills with &quot;Condition: Spiritual Weapon equipped&quot; to treat all mention of &quot;Dark&quot; to be &quot;Lightning&quot; instead. / A spiritual weapon formed by coalescing lightning spirits.</td><td>[AR2E遗产职业]</td></tr>\\n</table>\\n<h5>幸运儿遗产职业技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>奥秘</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>获得CL+2张「类型：奥秘」物品（奥秘卡）并将它们加入你的牌组。准备阶段，你可以从零开始重组你的牌组。（牌组被视为仅用于奥秘卡的独立物品栏。你的牌组中每种奥秘卡最多可有2张重复，你可以在指定时机使用任何卡牌的效果。每张奥秘卡每剧本可使用1次，但不会丢失。）[AR2E遗产职业]</td></tr>\\n<tr><td><strong>卡牌强化</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>准备阶段，额外获得SL张奥秘卡并将它们加入你的牌组。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>卡牌大师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的牌组中每种奥秘卡的最大重复数量变为3。（通常为2）[AR2E遗产职业]</td></tr>\\n<tr><td><strong>荣耀抽牌</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Arcanum</td><td>在你受到奥秘卡效果期间有效。你的攻击命中判定+2。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>洗牌</strong></td><td>遗产动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>Arcanum，每剧本1次</td><td>你的牌组中所有在本剧本中至少使用过1次的奥秘卡获得1次额外使用次数。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>双重拔刀</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>3</td><td>Arcanum，每场景SL次</td><td>作为次要动作，你可以使用通常需要遗产动作的奥秘卡。但是，在本主要阶段中你不能使用同一张卡两次。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>张力提升</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Arcanum</td><td>在你受到奥秘卡效果期间有效。你的攻击伤害+1d6。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>储备</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>Arcanum，每剧本1次</td><td>仅可在战斗外使用。选择你牌组中的1张奥秘卡和1张未在牌组中使用的奥秘卡。交换这两张物品。此效果持续到剧本结束。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>逆转卡牌</strong></td><td>见效果</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>Arcanum</td><td>每当你使用奥秘卡时可使用。使用该物品的「逆转」而非其「效果」。时机变为逆转的时机。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>命名</strong></td><td>Type</td><td>Effects</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>Reverse [AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：阿肯雷夫</strong></td><td>奥秘</td><td>Effect: Legacy Action: Until the end of this Scene, Weapon Attacks made by the user get +2d6 Damage.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：判定后：使用者可以重掷使用武器进行的命中判定。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：布里甘蒂亚</strong></td><td>奥秘</td><td>Effect: Legacy Action: Until the end of this Scene, Magic Attacks and Special Attacks made by the user get +2d6 Damage.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：判定后：使用者可以重掷一次魔法判定。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：达格德莫尔</strong></td><td>奥秘</td><td>Effect: Setup Process: Until the end of this Round, the user get +5 Actions Points.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：准备阶段：直到本轮结束，20m内的一个单体目标行动点数-5。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：达南</strong></td><td>奥秘</td><td>Effect: Legacy Action: Until the end of this Main Process, HP Recovery effects you initiate get +10 to their effects.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：主要动作：你交战中的一个单体目标从昏迷状态中恢复并恢复1 HP。以此方式从昏迷中恢复的目标变为力竭状态。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：艾玛</strong></td><td>奥秘</td><td>Effect: Legacy Action: A Single target within 20m recovers 3d6+(User&#x27;s CL)x3 HP.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：伤害掷骰后：20m内的一个单体目标从该伤害掷骰中少受10点伤害。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：戈万农</strong></td><td>奥秘</td><td>Effect: Legacy Action: Until the end of this Scene, a Single target within 20m gets +7 Physical Defense.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：直到本场景结束，20m内的一个单体目标魔法防御+7。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：格兰恩</strong></td><td

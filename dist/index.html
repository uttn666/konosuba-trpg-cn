ng>奥秘：迪亚波罗斯</strong></td><td>奥秘</td><td>Effect: Legacy Action: Choose a Single target within 20m. Until the end of this Round, the target&#x27;s Weapon Attacks do Dark Magic Damage instead of their regular Damage type.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：移动动作：使用者获得潜行状态。即使有敌人在场，使用者也可以获得潜行状态。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：阿丽安萝德</strong></td><td>奥秘</td><td>Effect: Usable before a Single target within 20m makes a Loot Roll. The target gets +1d6 for that Loot Roll.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：直到本主要阶段结束，对使用者攻击的反应判定-1d6。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：阿拉克涅</strong></td><td>奥秘</td><td>Effect: Before Check: A Single target within 20m gets -1d6 on the Hit check for one Attack.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：直到本主要阶段结束，每当使用者的攻击造成至少1点HP伤害，对攻击的目标施加束缚。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：西穆尔格</strong></td><td>奥秘</td><td>Effect: Legacy Action: Until the end of this Main Process, the user gets +2d6 for Hit Checks made for Weapon Attacks.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：判定前：使用者一次回避判定+1d6。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：利维坦</strong></td><td>奥秘</td><td>Effect: Legacy Action: The user&#x27;s Engagement becomes a Blocked Engagement until the end of this Round.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：当使用者处于「游泳」状态时可使用。遗产动作：直到本主要阶段结束，使用者的攻击伤害+10。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：芬里尔</strong></td><td>奥秘</td><td>Effect: Usable when the user rolls a Critical on Hit Check for an Attack. That Attack gets +10 Damage.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：使用者获得「狂战士(2)」。如果使用者已经处于「狂战士」状态，将「狂战士」的效力等级+2。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：卡托布莱帕斯</strong></td><td>奥秘</td><td>Effect: Usable when the user makes a movement. The user gets +10m for this movement.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：直到本主要阶段结束，每当使用者的攻击造成至少1点HP伤害，对攻击的目标施加中毒(1)。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：约尔蒙甘德</strong></td><td>奥秘</td><td>Effect: Usable when the user makes an Attack that inflicts a Debuff with an Effectiveness Level. Increase the Effectiveness Level of the Inflicted Debuff by 1.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：使用者恢复所有负面状态。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：法夫纳</strong></td><td>奥秘</td><td>Effect: Setup Process: When you use this Item, choose an Element. Until the end of this Round, the user&#x27;s Afinity becomes the chosen Element. (Double Magic Defense against the chosen element magic damage).</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：伤害掷骰前：对魔法伤害有效。使用者的一次攻击伤害+3d6。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：太阳</strong></td><td>奥秘</td><td>Effect: Legacy Action: Until the end of this Main Process, the user gets +1d6 to Hit Checks for Weapon Attacks.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：20m内的一个单体目标直到本轮结束物理防御-5（最小0）。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：月亮</strong></td><td>奥秘</td><td>Effect: Legacy Action: Until the end of this Main Process, the user gets +1d6 to Magic Checks.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：20m内的一个单体目标直到本轮结束魔法防御-5（最小0）。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：星辰</strong></td><td>奥秘</td><td>Effect: Setup Process: A Single target within 20m gains the Flying State until the end of this Round.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：遗产动作：20m内的一个单体目标失去飞行状态。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：大地</strong></td><td>奥秘</td><td>Effect: Usable at the same time as an Arcanum Card. Change all instances of &quot;Single&quot; on that Card&#x27;s Effect to &quot;Area(Choose)&quot;</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：与技能同时使用。该技能消耗-3（最小1）。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>奥秘：海洋</strong></td><td>奥秘</td><td>Effect: Setup Process: A Single target within 20m gains the Swimming State until the end of this Round.</td><td></td><td></td><td>-</td><td>-</td><td>-</td><td>逆转：准备阶段：直到本轮结束，游泳状态在进行移动时不再施加惩罚。（影响所有角色，不分敌我）。[AR2E遗产职业]</td></tr>\\n</table>\\n        "},{"i":63,"ch":"第五章","chTitle":"技能系统","title":"技能概述","id":"skill-overview","html":"\\n            <p>技能是角色在冒险中可以使用的特殊能力。每个技能都有其独特的用途——有些用于战斗，有些用于探索，还有些在日常生活中也能发挥作用。</p>\\n            <p>技能按类型分为以下几类：</p>\\n            <ul>\\n                <li><strong>战斗技能：</strong>在战斗中使用，包括攻击招式、防御技巧和战术动作。</li>\\n                <li><strong>魔法技能：</strong>消耗MP发动的超自然力量，包括攻击魔法、治疗魔法和辅助魔法。</li>\\n                <li><strong>通用技能：</strong>不限于特定职业的实用技能，如急救、追踪、交涉等。</li>\\n                <li><strong>职业专属技能：</strong>只有特定职业才能学习的独特技能。</li>\\n            </ul>\\n            <p><strong>学习技能：</strong>角色在升级时，从三种模式中选择一种来学习种族技能和/或职业技能（详见\\"技能等级与成长\\"章节）。冒险者可以从其他职业的技能列表中选择技能，但通常不能获取进阶职业技能或敌人技能。</p>\\n            <p><strong>技能等级：</strong>大多数技能有最大SL（技能等级）上限。提升技能等级会增强技能效果。技能等级只能在角色创建时或升级时提升。</p>\\n        "},{"i":64,"ch":"第五章","chTitle":"技能系统","title":"战斗技能示例（战士）","id":"skill-combat","html":"\\n            <p>每个职业拥有专属的职业技能列表。以下以<strong>战士（Warrior）</strong>为例，展示部分职业技能（完整列表见原书第134-139页）：</p>\\n            <table>\\n                <tr><th>技能名</th><th>时机</th><th>消耗</th><th>最大SL</th><th>效果摘要</th></tr>\\n                <tr><td>命中技能</td><td>被动</td><td>—</td><td>5</td><td>武器命中判定+SL+1</td></tr>\\n                <tr><td>万能防御技能</td><td>被动</td><td>—</td><td>3</td><td>物理防御+SL×2，魔法防御+SL</td></tr>\\n                <tr><td>Cover（掩护）</td><td>伤害掷骰前</td><td>—</td><td>1</td><td>代替目标承受伤害（每防御一次）</td></tr>\\n                <tr><td>Heavy Attack（重击）</td><td>主要动作</td><td>4</td><td>5</td><td>武器攻击伤害+(SL)D6</td></tr>\\n                <tr><td>Mow Down（横扫）</td><td>主要动作</td><td>3</td><td>3</td><td>近战攻击同交战范围内的多个目标</td></tr>\\n                <tr><td>Rampart（壁垒）</td><td>次要动作</td><td>3</td><td>5</td><td>物理防御+SL×3（持续到场景结束）</td></tr>\\n                <tr><td>盾击技能</td><td>被动</td><td>—</td><td>3</td><td>持盾时命中判定+SL</td></tr>\\n                <tr><td>耐久技能</td><td>被动</td><td>—</td><td>3</td><td>最大HP+SL×5</td></tr>\\n                <tr><td>Indomitable（不屈）</td><td>清理流程</td><td>3</td><td>1</td><td>移除自身一个减益状态</td></tr>\\n            </table>\\n            <p>以上仅为一个职业的示例。每个职业拥有15-25个专属技能，完整数据请参考技能列表Excel或原书第132-165页。</p>\\n        "},{"i":65,"ch":"第五章","chTitle":"技能系统","title":"魔法技能示例（祭司）","id":"skill-magic","html":"\\n            <p>魔法技能标有(Spell)类型和元素属性。以下以<strong>祭司（Priest）</strong>为例展示部分法术：</p>\\n            <table>\\n                <tr><th>法术名</th><th>时机</th><th>MP</th><th>最大SL</th><th>效果摘要</th></tr>\\n                <tr><td>Bless（祝福·光）</td><td>主要动作</td><td>6</td><td>1</td><td>目标判定+1D6（持续到回合结束）</td></tr>\\n                <tr><td>Heal（治愈·光）</td><td>主要动作</td><td>6</td><td>1</td><td>目标HP恢复2D6+CL</td></tr>\\n                <tr><td>Cure（解毒·光）</td><td>主要动作</td><td>5</td><td>1</td><td>移除目标所有减益状态（每剧本一次）</td></tr>\\n                <tr><td>Saint Shield（圣盾·光）</td><td>伤害掷骰前</td><td>5</td><td>5</td><td>目标受到伤害-SL×5（持续到主要流程结束）</td></tr>\\n                <tr><td>Turn Undead（驱散亡灵·光）</td><td>主要动作</td><td>5</td><td>5</td><td>对不死族单体魔法攻击3D6+CL</td></tr>\\n                <tr><td>Resurrection（复活·光）</td><td>主要动作</td><td>15</td><td>1</td><td>复活一名阵亡队友，HP恢复到1（每剧本一次）</td></tr>\\n                <tr><td>Sacred Weapon（圣武·光）</td><td>设置流程</td><td>5</td><td>3</td><td>目标武器攻击伤害+SL×2（持续到场景结束）</td></tr>\\n            </table>\\n            <p>以上仅为祭司职业的部分法术示例。大祭司（Arch-priest）进阶后还能获得更强大的神圣魔法。基础魔法（Basic Magic）列表包含Create Water、Tinder、Freeze等生活系小法术，任何职业均可学习。</p>\\n        "},{"i":66,"ch":"第五章","chTitle":"技能系统","title":"通用技能列表（精选）","id":"skill-general","html":"\\n            <p>通用技能可被任何职业/种族学习。角色可学习的通用技能总等级上限为<strong>CL+1</strong>。创建角色时选择2个通用技能，均获得1级。</p>\\n            <table>\\n                <tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>效果</th></tr>\\n                <tr><td><strong>鉴定</strong><br>Appraisal Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>分析物品功能或使用方法的智力判定+1D6</td></tr>\\n                <tr><td><strong>运动</strong><br>Athletic Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>攀爬或跳跃的力量判定+1D6</td></tr>\\n                <tr><td><strong>负重</strong><br>Carrying Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>负重限制变为(基础力量)×2</td></tr>\\n                <tr><td><strong>敌人识别</strong><br>Enemy Identification Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>敌人识别判定+1D6</td></tr>\\n                <tr><td><strong>破坏</strong><br>Destruction Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>破坏物体时伤害+2D6。仍无法破坏不可破坏的物体</td></tr>\\n                <tr><td><strong>识破</strong><br>Detect Deception Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>看穿谎言和欺骗的精神判定+1D6。成功不会告知欺骗原因</td></tr>\\n                <tr><td><strong>欺瞒</strong><br>Deception Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>欺骗他人的精神判定+1D6</td></tr>\\n                <tr><td><strong>疾步</strong><br>Fleet-Footed Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>从被封锁的交战中撤退时行动点+1D6</td></tr>\\n                <tr><td><strong>信仰：厄里斯</strong><br>Faith: Eris</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>恢复HP或MP的技能/物品效果+2。不能再获得其他信仰技能</td></tr>\\n                <tr><td><strong>钓鱼</strong><br>Fishing Skill</td><td>见效果</td><td>自动成功</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>场景结束时使用，恢复2D6+CL×2的MP。每剧本1次。GM可因无水域而拒绝使用（不消耗次数）</td></tr>\\n                <tr><td><strong>信仰：阿库娅</strong><br>Faith: Aqua</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>物理防御+1，魔法防御+1。不能再获得其他信仰技能。阿库娅信徒可能被他人不信任</td></tr>\\n                <tr><td><strong>调查</strong><br>Investigation Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>基于感知的信息收集判定+1D6</td></tr>\\n                <tr><td><strong>历史</strong><br>History Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>了解定居点基本信息的智力判定+1D6</td></tr>\\n                <tr><td><strong>狩猎</strong><br>Hunting Skill</td><td>见效果</td><td>自动成功</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>场景结束时使用，恢复2D6+CL×2的HP。每剧本1次。GM可因无时间或无动物而拒绝使用（不消耗次数）</td></tr>\\n                <tr><td><strong>赠肉</strong><br>Gifted Meat Skill</td><td>物品</td><td>自动成功</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>预备游戏期间获得3块肉</td></tr>\\n                <tr><td><strong>追踪</strong><br>Tracking Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>追踪痕迹的感知判定+1D6</td></tr>\\n                <tr><td><strong>交涉</strong><br>Negotiation Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>交涉说服的精神判定+1D6</td></tr>\\n                <tr><td><strong>宴会才艺</strong><br>Party Skill</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>表演宴会才艺的灵巧判定+1D6</td></tr>\\n                <tr><td><strong>急救</strong><br>Lifesaving Skill</td><td>主要动作</td><td>灵巧</td><td>单体</td><td>近</td><td>—</td><td>1</td><td>仅对倒地目标有效。灵巧判定DL10成功则目标不再倒地，HP变为1，目标变为消耗状态</td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>💡 译者注：</strong>以上技能数据来自官方技能表（Skill List Excel）。完整通用技能列表包含60+种技能，涵盖冒险生活的方方面面。基础魔法（Basic Magic）是一个独立的子类，包含Create Earth/Water/Fire/Wind/Ice/Lightning/Light/Darkness等元素小法术，任何职业都可以学习。</div>\\n        "},{"i":67,"ch":"第五章","chTitle":"技能系统","title":"基础魔法列表","id":"skill-basic-magic","html":"\\n            <p>基础魔法是入门级法术，容易习得但多数不适合战斗。任何职业均可学习。法师职业可通过\\"获得基础魔法\\"技能选择3个基础魔法法术。</p>\\n            <table>\\n                <tr><th>法术名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>MP</th><th>最大SL</th><th>效果</th></tr>\\n                <tr><td><strong>羽落</strong><br>Feather [风]</td><td>见效果</td><td>魔法判定</td><td>自身</td><td>—</td><td>6</td><td>1</td><td>坠落伤害掷骰前使用，将坠落伤害变为0。也可用于落穴/坑洞伤害或骑乘时失衡。每场景1次。暴击：消耗0</td></tr>\\n                <tr><td><strong>造土</strong><br>Create Earth [地]</td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近</td><td>2</td><td>1</td><td>成功则产生一把量的泥土。暴击：消耗0</td></tr>\\n                <tr><td><strong>造水</strong><br>Create Water [水]</td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近</td><td>2</td><td>1</td><td>成功则产生一杯量的清水。暴击：消耗0</td></tr>\\n                <tr><td><strong>微风</strong><br>Wind Breath [风]</td><td>主要动作</td><td>魔法判定</td><td>见效果</td><td>5m</td><td>2</td><td>1</td><td>成功则在指定位置产生足以吹走纸张的风。暴击：消耗0</td></tr>\\n                <tr><td><strong>净化</strong><br>Purification [水]</td><td>设置流程</td><td>魔法判定</td><td>见效果</td><td>近</td><td>6</td><td>1</td><td>成功则净化接触的水。可净化脏水、有毒水等。GM可根据状态或水量设定判定DL。暴击：消耗0</td></tr>\\n                <tr><td><strong>点火</strong><br>Tinder [火]</td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近</td><td>2</td><td>1</td><td>成功则产生火柴大小的火焰。维持需要可燃物。暴击：消耗0</td></tr>\\n                <tr><td><strong>冰冻</strong><br>Freeze [冰]</td><td>设置流程</td><td>魔法判定</td><td>单体</td><td>5m</td><td>4</td><td>1</td><td>成功则冻结射程内的水或角色体表。冻结不影响判定。暴击：消耗0</td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>关于基础魔法：</strong>虽然这些法术看似弱小，但在冒险中往往有意想不到的用途。造水可以在沙漠中救命，点火可以照亮黑暗或引开怪物，净化可以去除水中的毒素。创造性地使用基础魔法是优秀冒险者的标志。</div>\\n        "},{"i":68,"ch":"第五章","chTitle":"技能系统","title":"技能等级与成长","id":"skill-progression","html":"\\n            <h4>升级规则</h4>\\n            <p>角色可以通过消耗经验值（EXP）来升级。升级所需EXP = <strong>当前角色等级 × 10</strong>。</p>\\n            <table>\\n<tr><th>当前等级</th><th>升级所需EXP</th></tr>\\n<tr><td>1</td><td>10</td></tr>\\n<tr><td>2</td><td>20</td></tr>\\n<tr><td>3</td><td>30</td></tr>\\n<tr><td>5</td><td>50</td></tr>\\n<tr><td>10</td><td>100</td></tr>\\n</table>\\n            <h4>升级时的选择</h4>\\n            <p>升级时必须从以下三种模式中选择一种：</p>\\n            <table>\\n<tr><th>模式</th><th>内容</th></tr>\\n<tr><td>模式1</td><td>学习<strong>3个等级</strong>的种族技能和/或职业技能</td></tr>\\n<tr><td>模式2</td><td>学习<strong>3个等级</strong>的种族技能和/或职业技能，<strong>同时转职</strong></td></tr>\\n<tr><td>模式3</td><td>学习<strong>2个等级</strong>的种族技能和/或职业技能，<strong>同时最大祝福数永久+1</strong></td></tr>\\n</table>\\n            <p><strong>学习技能规则：</strong></p>\\n            <ul>\\n                <li>可以从角色所属职业的可用技能中选择学习</li>\\n                <li>可以学习新技能（从SL 1开始），也可以提升已有技能的等级</li>\\n                <li>每次升级时，单个职业技能最多只能提升2级</li>\\n            </ul>\\n            <p><strong>属性提升：</strong>每次升级，选择3个基础属性值各+1。基础属性值没有上限。</p>\\n            <h4>通用技能的学习</h4>\\n            <p>消耗<strong>5 EXP</strong>可以学习<strong>1个等级</strong>的通用技能。角色所能掌握的通用技能总等级上限 = CL + 1。</p>\\n            <h4>转职规则</h4>\\n            <ul>\\n                <li>转职时重写角色表上的职业和职业修正，重新计算所有属性值</li>\\n                <li>转职后可以学习旧职业和新职业双方的技能</li>\\n                <li>冒险者转职为其他职业时，失去\\"额外祝福\\"效果；转回冒险者时恢复</li>\\n                <li>角色等级达到<strong>10级</strong>以上时可转职为进阶职业（必须选择模式2）</li>\\n            </ul>\\n            <table>\\n<tr><th>基础职业</th><th>进阶职业</th></tr>\\n<tr><td>战士（战士）</td><td>十字军（十字军）</td></tr>\\n<tr><td>祭司（祭司）</td><td>大祭司（大祭司）</td></tr>\\n<tr><td>法师（法师）</td><td>大法师（大法师）</td></tr>\\n<tr><td>盗贼（盗贼）</td><td>刺客（刺客）</td></tr>\\n</table>\\n        "},{"i":69,"ch":"第五章","chTitle":"技能系统","title":"武器列表","id":"equip-weapons","html":"\\n            <p>武器分为九类：徒手、匕首、单手剑、双手剑、斧、钝器、枪、鞭、弓。每种武器有等级要求、重量、命中修正、攻击力、行动修正、射程和价格。</p>\\n            <h4>徒手武器</h4>\\n            <table>\\n<tr><th>武器名</th><th>等级</th><th>重量</th><th>命中</th><th>攻击力</th><th>行动</th><th>射程</th><th>装备</th><th>价格</th></tr>\\n<tr><td>徒手</td><td>1</td><td>-</td><td>±0</td><td>±0</td><td>±0</td><td>近战</td><td>双持</td><td>-</td></tr>\\n<tr><td>铁指虎</td><td>1</td><td>5</td><td>+1</td><td>+4</td><td>±0</td><td>近战</td><td>双持</td><td>10</td></tr>\\n<tr><td>虎爪</td><td>1</td><td>5</td><td>±0</td><td>+6</td><td>±0</td><td>近战</td><td>双持</td><td>50</td></tr>\\n<tr><td>铁爪</td><td>2</td><td>5</td><td>±0</td><td>+7</td><td>±0</td><td>近战</td><td>双持</td><td>100</td></tr>\\n</table>\\n            <h4>匕首</h4>\\n            <table>\\n<tr><th>武器名</th><th>等级</th><th>重量</th><th>命中</th><th>攻击力</th><th>行动</th><th>射程</th><th>装备</th><th>价格</th><th>备注</th></tr>\\n<tr><td>匕首（刀类）</td><td>1</td><td>1</td><td>±0</td><td>+3</td><td>±0</td><td>近战</td><td>单手</td><td>10</td><td>可投掷</td></tr>\\n<tr><td>匕首</td><td>1</td><td>1</td><td>±0</td><td>+4</td><td>±0</td><td>近战</td><td>单 d><td>单手</td><td>650</td><td>战士、祭司</td></tr>\\n<tr><td>圣盾</td><td>6</td><td>3</td><td>+6</td><td>+1</td><td>-1</td><td>单手</td><td>1,300</td><td>祭司</td></tr>\\n<tr><td>秘银盾</td><td>8</td><td>4</td><td>+9</td><td>±0</td><td>-1</td><td>单手</td><td>2,900</td><td>战士、祭司</td></tr>\\n<tr><td>反射盾</td><td>10</td><td>4</td><td>+8</td><td>+2</td><td>-4</td><td>单手</td><td>6,800</td><td>战士、祭司</td></tr>\\n</table>\\n        "},{"i":73,"ch":"第五章","chTitle":"技能系统","title":"饰品列表","id":"equip-accessories","html":"\\n            <table>\\n<tr><th>饰品名</th><th>等级</th><th>重量</th><th>价格</th><th>效果</th></tr>\\n<tr><td>盗贼工具</td><td>1</td><td>1</td><td>50</td><td>被动：解除陷阱时最终判定值+1（后计算）。</td></tr>\\n<tr><td>圣徽</td><td>1</td><td>1</td><td>150</td><td>被动：使用Heal技能时恢复HP额外+1d6。仅限祭司。</td></tr>\\n<tr><td>魔导书</td><td>1</td><td>1</td><td>200</td><td>被动：魔法攻击伤害+1。仅限法师。</td></tr>\\n<tr><td>维护工具</td><td>1</td><td>1</td><td>200</td><td>被动：武器攻击伤害+1（徒手除外）。</td></tr>\\n</table>\\n        "},{"i":74,"ch":"第五章","chTitle":"技能系统","title":"工具列表","id":"equip-tools","html":"\\n            <table>\\n<tr><th>工具名</th><th>等级</th><th>重量</th><th>价格</th><th>效果</th></tr>\\n<tr><td>冒险者卡</td><td>1</td><td>0</td><td>不可出售</td><td>冒险者公会发行的卡片，记录等级、职业和技能。</td></tr>\\n<tr><td>粉笔</td><td>1</td><td>1</td><td>1</td><td>可在墙壁等表面书写的白色棒状物。</td></tr>\\n<tr><td>打火石</td><td>1</td><td>1</td><td>1</td><td>用于生火的石头和金属片。</td></tr>\\n<tr><td>书写工具</td><td>1</td><td>1</td><td>1</td><td>书写所需的纸、笔、墨水等工具。</td></tr>\\n<tr><td>绳索</td><td>1</td><td>1</td><td>3</td><td>判定前：攀爬和跳跃判定总值+2。约20米长。</td></tr>\\n<tr><td>提灯</td><td>1</td><td>1</td><td>5</td><td>自由动作：消除使用者所在区域的黑暗效果，持续到自由动作熄灭或场景结束。</td></tr>\\n<tr><td>乐器</td><td>1</td><td>1</td><td>5</td><td>弦乐器、管乐器或鼓等音乐器具。</td></tr>\\n<tr><td>露营工具</td><td>1</td><td>2</td><td>3</td><td>包含简易帐篷和毯子的露营装备，可供一人在户外露营。</td></tr>\\n<tr><td>冒险者套装</td><td>1</td><td>5</td><td>10</td><td>包含露营工具、绳索、提灯和打火石的套装。</td></tr>\\n</table>\\n            <h4>宝石</h4>\\n            <table>\\n<tr><th>宝石名</th><th>等级</th><th>重量</th><th>价格</th><th>效果</th></tr>\\n<tr><td>红宝石</td><td>1</td><td>1</td><td>200</td><td>与Elemental Rune配合使用时，武器攻击属性变为火。</td></tr>\\n<tr><td>绿宝石</td><td>1</td><td>1</td><td>200</td><td>与Elemental Rune配合使用时，武器攻击属性变为风。</td></tr>\\n<tr><td>蓝宝石</td><td>1</td><td>1</td><td>200</td><td>与Elemental Rune配合使用时，武器攻击属性变为水。</td></tr>\\n<tr><td>黄宝石</td><td>1</td><td>1</td><td>200</td><td>与Elemental Rune配合使用时，武器攻击属性变为地。</td></tr>\\n<tr><td>钻石</td><td>1</td><td>1</td><td>500</td><td>与Elemental Rune配合使用时，武器攻击属性变为光。</td></tr>\\n</table>\\n            <h4>储物</h4>\\n            <table>\\n<tr><th>物品名</th><th>等级</th><th>重量</th><th>价格</th><th>效果</th></tr>\\n<tr><td>腰包</td><td>1</td><td>0</td><td>15</td><td>被动：携带量+2。只能持有一个。</td></tr>\\n<tr><td>背包</td><td>1</td><td>0</td><td>30</td><td>被动：携带量+5。只能持有一个。</td></tr>\\n</table>\\n        "},{"i":75,"ch":"第五章","chTitle":"技能系统","title":"生活方式列表","id":"equip-lifestyles","html":"\\n            <p>每位角色在创建时必须选择一种生活方式（Lifestyle）。生活方式决定了角色在城镇中的生活水平，影响每次会话后的费用支出和最大HP/MP。</p>\\n            <table>\\n                <tr><th>生活方式</th><th>每次会话费用</th><th>最大HP/MP修正</th><th>说明</th></tr>\\n                <tr><td>马厩生活（Stable）</td><td>0 KE</td><td>－CL×5</td><td>睡在马厩里，生活质量极差。和真和阿库娅初到阿克塞尔时的状态。</td></tr>\\n                <tr><td>简朴生活（Simple）</td><td>CL×10 KE</td><td>±0</td><td>最基本的生活水平，勉强糊口。</td></tr>\\n                <tr><td>经济生活（Economy）</td><td>CL×100 KE</td><td>+5</td><td>便宜旅馆或合租房，简朴但体面的饮食。</td></tr>\\n                <tr><td>套房生活（Suite）</td><td>CL×1,000 KE</td><td>+10</td><td>高级旅馆的套房，每日三餐品质优良。</td></tr>\\n                <tr><td>王室生活（Royal）</td><td>CL×10,000 KE</td><td>+30</td><td>住在宫殿般豪华的环境中，享受最好的服务。</td></tr>\\n            </table>\\n            <p><strong>重要规则：</strong>如果在会话结束后无法支付生活方式费用，角色只能获得正常经验值的一半。费用随角色等级（CL）增长——高等级冒险者需要更高的生活品质来维持状态。</p>\\n            <div class=\\"example\\"><strong>💡 译者注——原作参考：</strong>和真和阿库娅刚来到阿克塞尔时身无分文，只能住在马厩里，不得不靠打零工维持生计。1级角色选择马厩生活，HP/MP各-5。随着等级提升和收入增加，角色通常会升级生活方式——毕竟没人想永远睡在马厩里。</div>\\n        "},{"i":76,"ch":"第五章","chTitle":"技能系统","title":"属性判定","id":"rules-attribute","html":"\\n            <p>当角色需要运用某项身体或精神能力时，进行属性判定。使用的属性由具体行动决定：</p>\\n            <ul>\\n                <li><strong>力量判定（STR）：</strong>举重物、破坏物体、游泳、攀爬等</li>\\n                <li><strong>灵巧判定（DEX）：</strong>精细操作、手部技巧、使用精致工具</li>\\n                <li><strong>敏捷判定（AGI）：</strong>保持平衡、快速移动、躲避陷阱等</li>\\n                <li><strong>智力判定（INT）：</strong>解谜、回忆知识、鉴定物品、分析功能</li>\\n                <li><strong>感知判定（PER）：</strong>发现隐藏物品、察觉埋伏、追踪痕迹、察言观色</li>\\n                <li><strong>精神判定（MND）：</strong>抵抗恐惧/魅惑/精神控制、识破谎言、保持专注</li>\\n                <li><strong>幸运判定（LUK）：</strong>赌博、偶然发现、命运转折等不确定性事件</li>\\n            </ul>\\n            <p>HP（生命值）并非独立的判定属性，而是通过基础力量值、职业起始HP和技能修正共同计算得出的次要能力值：<strong>最大HP = 基础力量值 + 职业起始HP + 技能修正</strong>。</p>\\n            <div class=\\"example\\"><strong>示例：</strong>惠惠试图搬运一箱沉重的魔法书。她力量较低，力量修正为-1。她掷2D6=8，加上力量修正-1，最终结果为7。TN为9（普通难度），7 < 9，判定失败——她搬不动。和真过来帮忙（力量中等），掷2D6=10，最终结果为10，判定成功。</div>\\n        "},{"i":77,"ch":"第五章","chTitle":"技能系统","title":"对抗判定","id":"rules-opposed","html":"\\n            <p>当两个角色进行直接对抗时（如角力、潜行vs察觉、欺骗vs察言观色），双方各进行一次判定，结果高者获胜。平局时，主动方获胜。</p>\\n            <div class=\\"example\\"><strong>示例：</strong>和真试图偷走一个NPC的钱包。和真进行敏捷+潜行判定（敏捷4修正+1，潜行技能+1），掷2D6=7，结果=9。NPC进行感知判定来察觉（感知3修正0），掷2D6=6，结果=6。9 > 6，和真成功偷走了钱包——希望他这次偷的是钱包而不是其他什么。</div>\\n        "},{"i":78,"ch":"第五章","chTitle":"技能系统","title":"属性修正值对照表","id":"rules-ability-table","html":"\\n            <p>属性值每3点产生1点属性加值（向下取整）。以下是属性值与加值的对照：</p>\\n            <table>\\n                <tr><th>属性值</th><th>0-2</th><th>3-5</th><th>6-8</th><th>9-11</th><th>12-14</th><th>15-17</th><th>18-20</th></tr>\\n                <tr><td>加值</td><td>0</td><td>+1</td><td>+2</td><td>+3</td><td>+4</td><td>+5</td><td>+6</td></tr>\\n            </table>\\n            <p>例如：属性值9、10或11的加值均为3。属性值0时加值为0。大多数判定的公式为：<strong>2D6 + 属性加值 + 技能修正</strong>。</p>\\n        "},{"i":79,"ch":"第五章","chTitle":"技能系统","title":"祝福规则（Blessing Rules）","id":"rules-blessings","html":"\\n            <p>祝福（Blessings）是素晴TRPG的核心特色系统之一，模拟了原作中女神阿库娅赐予转生者特殊能力的设定。它代表了<strong>玩家角色作为故事主角对抗命运——或让命运成为盟友——的力量</strong>。</p>\\n\\n            <h4>祝福点数</h4>\\n            <ul>\\n                <li><strong>祝福数量：</strong>角色拥有的祝福点数等于其<strong>幸运值（LUK）</strong>。</li>\\n                <li><strong>初始祝福：</strong>角色创建时的基础祝福为<strong>5点</strong>。冒险者职业因\\"额外祝福\\"技能在预备阶段额外获得1点（即6点）。</li>\\n                <li><strong>祝福上限：</strong>祝福点数不会超过当前的最大值。最大值可通过升级时选择模式3（获得1点祝福）来永久增加。</li>\\n            </ul>\\n\\n            <h4>祝福的用途</h4>\\n            <p>消耗1点祝福可以获得以下效果之一：</p>\\n            <ul>\\n                <li><strong>追加骰子：</strong>在一次判定中额外掷1D6加入结果（可多次消耗叠加骰子）。</li>\\n                <li><strong>重掷：</strong>一次判定后可以重掷所有骰子（必须接受新结果）。</li>\\n                <li><strong>伤害增幅：</strong>在一次伤害掷骰中额外掷1D6（可多次消耗叠加）。</li>\\n                <li><strong>起死回生：</strong>当HP降至0时可以消耗1点祝福自动稳定伤势（不累计死亡标记）。</li>\\n            </ul>\\n\\n            <h4>祝福的恢复</h4>\\n            <ul>\\n                <li><strong>会话结束：</strong>每次游戏会话（Session）结束后，所有祝福点数恢复至最大值。</li>\\n                <li><strong>剧情奖励：</strong>GM可以在角色完成重要剧情目标或展现出色角色扮演时，奖励恢复1点祝福。</li>\\n            </ul>\\n\\n            <div class=\\"example\\"><strong>使用示例：</strong>乙姬（《Re:ZERO》作者长月达平的角色）在Boss战中发动了作弊能力\\"死亡回归\\"——这是消耗祝福的极端例子。当他的角色HP归零时，他消耗祝福触发\\"死亡回归\\"效果：HP全恢复并重新站起，代价是永久失去1点祝福上限。吉尔伯特在躲避弗洛格的黏液攻击时消耗了2点祝福，将回避骰从2D6+3提升至4D6+3，掷出两个6（暴击），成功闪避。</div>\\n            <div class=\\"note\\"><strong>💡 译者注：</strong>祝福系统是素晴TRPG区别于其他TRPG的重要特色。它给了玩家角色\\"主角光环\\"——在关键时刻扭转命运的能力。GM应当鼓励玩家在戏剧性时刻使用祝福，这不仅能增加生存率，更能创造令人难忘的故事瞬间。建议GM在玩家做出精彩的扮演或推动剧情发展时慷慨地奖励祝福恢复。</div>\\n        "},{"i":80,"ch":"第五章","chTitle":"技能系统","title":"角色成长规则（Character Growth）","id":"rules-growth","html":"\\n            <p>经验值（EXP）代表着冒险者通过战斗和冒险积累的成长。每次游戏会话结束后，GM根据以下条目计算每位玩家获得的EXP：</p>\\n\\n            <h4>经验值获取清单</h4>\\n            <table>\\n                <tr><th>获取条件</th><th>EXP</th><th>说明</th></tr>\\n                <tr><td>参加会话至结束</td><td>+1点</td><td>无论角色是否死亡，只要玩家参与至会话结束即可获得</td></tr>\\n                <tr><td>完成任务</td><td>GM裁定</td><td>建议以终幕阶段遭遇的最高敌人等级作为点数</td></tr>\\n                <tr><td>遭遇敌人</td><td>总敌人等级÷玩家人数</td><td>战斗结果不影响此奖励</td></tr>\\n                <tr><td>遭遇陷阱</td><td>总陷阱等级÷玩家人数</td><td>解除结果不影响此奖励</td></tr>\\n                <tr><td>优秀角色扮演</td><td>+1点</td><td>GM判断玩家是否进行了良好的角色扮演</td></tr>\\n                <tr><td>帮助其他玩家</td><td>+1点</td><td>说了或做了帮助其他玩家的事</td></tr>\\n                <tr><td>协助会话推进</td><td>+1点</td><td>帮助游戏顺利进行（如记录笔记、协助规则查阅等）</td></tr>\\n                <tr><td>协助组织/场地</td><td>+1点</td><td>提供场地、联系参与者或协调日程</td></tr>\\n            </table>\\n\\n            <h4>升级所需EXP</h4>\\n            <p>升级所需EXP = <strong>当前角色等级 × 10</strong></p>\\n            <table>\\n                <tr><th>当前等级</th><th>升级所需EXP</th><th>累计EXP</th></tr>\\n                <tr><td>1</td><td>10</td><td>10</td></tr>\\n                <tr><td>2</td><td>20</td><td>30</td></tr>\\n                <tr><td>3</td><td>30</td><td>60</td></tr>\\n                <tr><td>4</td><td>40</td><td>100</td></tr>\\n                <tr><td>5</td><td>50</td><td>150</td></tr>\\n                <tr><td>6</td><td>60</td><td>210</td></tr>\\n                <tr><td>7</td><td>70</td><td>280</td></tr>\\n                <tr><td>8</td><td>80</td><td>360</td></tr>\\n                <tr><td>9</td><td>90</td><td>450</td></tr>\\n            </table>\\n\\n            <h4>升级奖励</h4>\\n            <p>每次升级时，角色获得以下<strong>固定</strong>奖励：</p>\\n            <ul>\\n                <li><strong>属性提升：</strong>选择3个基础属性，各+1点（无上限）</li>\\n                <li><strong>HP增加：</strong>增加当前职业的HP Gain值</li>\\n                <li><strong>MP增加：</strong>增加当前职业的MP Gain值</li>\\n                <li><strong>技能学习：</strong>从以下三种模式中选择一种：\\n                    <ul>\\n                        <li>模式1：学习3个等级的种族技能和/或职业技能</li>\\n                        <li>模式2：学习3个等级的种族技能和/或职业技能 + 转职</li>\\n                        <li>模式3：学习2个等级的种族技能和/或职业技能 + 最大祝福数永久+1</li>\\n                    </ul>\\n                </li>\\n            </ul>\\n\\n            <h4>职业转换（转职）</h4>\\n            <p>当角色达到<strong>10级或以上</strong>时，在升级时必须选择模式2：学习相当于3级的种族技能和/或职业技能，然后进行职业转换。进阶职业（如十字军、大祭司、大法师、刺客）是职业转换的目标。转换后：</p>\\n            <ul>\\n                <li>不会失去已学会的任何职业技能（冒险者转出时失去\\"额外祝福\\"效果除外）</li>\\n                <li>进阶职业仍可以学习其基础职业的技能（如十字军可以学习战士技能）</li>\\n                <li>如果从冒险者变更为其他职业，最大祝福数-1；变回冒险者则重新获得</li>\\n            </ul>\\n\\n            <h4>生活方式费用</h4>\\n            <p>每次会话结束后，角色必须支付其生活方式等级对应的费用。如果无法支付，获得的经验值减半。</p>\\n\\n            <div class=\\"example\\"><strong>💡 译者注——原作参考：</strong>在原作中，升级和能力成长的设定较为灵活。例如惠惠在早期就将全部技能点投入\\"爆裂\\"魔法，使其威力远超同级法师。在与无头骑士贝尔迪亚的战斗中，她的一发爆裂直接摧毁了贝尔迪亚的城堡。GM可以允许玩家采取类似的\\"极端专精\\"路线——但也要让玩家承担相应的代价（如MP耗尽后完全无力化）。</div>\\n        "},{"i":81,"ch":"第五章","chTitle":"技能系统","title":"会话结束与恢复","id":"rules-rest","html":"\\n            <h4>After Play（游戏后处理）</h4>\\n            <p>当结束阶段（Ending Phase）结束，GM宣布剧本结束时，游戏进入After Play阶段。此阶段处理以下事项：</p>\\n            <ul>\\n                <li><strong>生活方式费用：</strong>角色必须支付其生活方式等级对应的费用。如果无法支付，获得的经验值减半。</li>\\n                <li><strong>经验值分配：</strong>GM向每位玩家分配经验值。</li>\\n                <li><strong>角色恢复：</strong>如果没有角色死亡，所有伤害被消除，HP和MP全部恢复，所有减益效果被清除。这些不会延续到下一次会话。每个角色的祝福数恢复到会话开始时的数值。</li>\\n            </ul>\\n            <h4>经验值获取</h4>\\n            <table>\\n<tr><th>获取途径</th><th>EXP</th></tr>\\n<tr><td>参与跑团直到结束</td><td>+1</td></tr>\\n<tr><td>完成任务</td><td>GM决定（建议使用高潮阶段遭遇的最高敌人等级）</td></tr>\\n<tr><td>遭遇敌人</td><td>[敌人等级总和 / 玩家人数]</td></tr>\\n<tr><td>遭遇陷阱</td><td>[陷阱等级总和 / 玩家人数]</td></tr>\\n<tr><td>优秀角色扮演</td><td>+1</td></tr>\\n<tr><td>说了或做了帮助其他玩家的事</td><td>+1</td></tr>\\n<tr><td>帮助推进跑团进程</td><td>+1</td></tr>\\n<tr><td>帮助提供场地/物品/联络/调整日程</td><td>+1</td></tr>\\n</table>\\n            <div class=\\"note\\"><strong>注意：</strong>经验值是给玩家/GM本人的，不是给角色的。一个玩家/GM可以将经验值用于自己创建的任何角色。</div>\\n        "},{"i":82,"ch":"第五章","chTitle":"技能系统","title":"先攻流程（行动顺序）","id":"combat-initiative","html":"\\n            <p>素晴TRPG中<strong>没有\\"先攻判定掷骰\\"</strong>——行动顺序由<strong>行动点数（Action Points）</strong>决定。</p>\\n\\n            <h4>行动点数</h4>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">行动点数 = 敏捷 + 感知 + 装备修正 + 技能修正</p>\\n            <p>行动点数代表角色行动的敏捷程度，决定了战斗中的行动顺序。行动点数可以为负数。</p>\\n\\n            <h4>先攻流程</h4>\\n            <p>每个回合的先攻流程中，GM确定下一个行动的角色：</p>\\n            <ul>\\n                <li><strong>行动点数最高的待命角色</strong>成为先攻角色，执行其主要流程</li>\\n                <li>执行完毕后该角色变为<strong>消耗状态</strong></li>\\n                <li>重复以上步骤，直到所有角色都变为消耗状态</li>\\n            </ul>\\n\\n            <h4>同分处理</h4>\\n            <ul>\\n                <li>行动点数相同时，<strong>玩家角色优先</strong>于非玩家角色</li>\\n                <li>多个玩家角色同分时，由相关玩家<strong>讨论决定</strong>谁先行动</li>\\n                <li>无法达成一致时，由<strong>GM决定</strong></li>\\n                <li>多个NPC同分时，由<strong>GM决定</strong></li>\\n            </ul>\\n\\n            <h4>等待与放弃</h4>\\n            <ul>\\n                <li><strong>等待：</strong>角色可以选择等待，在所有其他角色都消耗后再行动。多个等待角色按行动点数<strong>从低到高</strong>行动。</li>\\n                <li><strong>放弃行动：</strong>角色可以选择放弃部分或全部行动。如果放弃标准行动，角色立即变为消耗状态。</li>\\n            </ul>\\n\\n            <h4>偷袭</h4>\\n            <p>当角色遭到意外攻击（如伏击、夜袭）时，GM可以判定发生<strong>偷袭</strong>。偷袭方可以在正常战斗回合开始前各执行一次主要流程，且无需按行动点数顺序。偷袭方的主要流程中，被偷袭方进行反应判定时<strong>-1D6</strong>。</p>\\n        "},{"i":83,"ch":"第五章","chTitle":"技能系统","title":"行动类型","id":"combat-actions","html":"\\n            <p>在主要流程中，角色可以按以下顺序执行行动：</p>\\n            <ol>\\n                <li><strong>移动行动：</strong>战斗移动（移动值米）或全力移动（移动值×2米，但不能再执行次要行动）</li>\\n                <li><strong>次要行动：</strong>使用时机为\\"次要行动\\"的技能、切换防御专注状态等</li>\\n                <li><strong>标准行动：</strong>攻击、使用时机为\\"标准行动\\"的技能等主要行动（每回合1次）</li>\\n            </ol>\\n            <p>此外还有以下特殊行动：</p>\\n            <ul>\\n                <li><strong>反应：</strong>在其他角色的标准行动中触发的响应行动（如闪避、格挡）。消耗状态的角色也可以执行反应。每次标准行动只能执行1次反应。</li>\\n                <li><strong>自由行动：</strong>不需要消耗行动次数的简单动作（如简短对话），每回合限1次，需向GM声明。</li>\\n            </ul>\\n        "},{"i":84,"ch":"第五章","chTitle":"技能系统","title":"攻击","id":"combat-attack","html":"\\n            <p>攻击是影响敌人的行动，首要的是对敌人造成伤害。攻击通过<strong>对抗判定</strong>来处理，分为以下五个步骤：</p>\\n            <h4>① 声明攻击</h4>\\n            <p>攻击方（以下称攻击者）选择一个合适的目标（以下称防御者），声明攻击方式、使用的技能和武器。攻击者只能使用当前装备的武器进行攻击。GM需确认声明的攻击是否可行。</p>\\n            <h4>② 命中判定</h4>\\n            <p>攻击者进行判定，确认攻击是否命中。这称为<strong>命中判定</strong>。使用的属性值如下：</p>\\n            <ul>\\n                <li><strong>武器攻击：</strong>使用<strong>灵巧</strong>进行判定</li>\\n                <li><strong>魔法攻击：</strong>进行<strong>魔法判定</strong>（使用智力）</li>\\n                <li><strong>特殊攻击：</strong>因技能而异，参见各技能条目</li>\\n            </ul>\\n            <p>如果命中判定<strong>暴击</strong>（至少2个骰子为6），攻击自动成功，且可能影响伤害计算。但如果防御方也暴击，则防御方优先，攻击未命中。</p>\\n            <p>如果命中判定<strong>失误</strong>（所有骰子为1），攻击自动失败，跳过回避判定步骤。</p>\\n            <h4>③ 回避判定</h4>\\n            <p>攻击者完成命中判定后，防御方进行自己的判定以尝试回避。这称为<strong>回避判定</strong>。回避判定使用<strong>敏捷</strong>。</p>\\n            <p>如果回避判定<strong>暴击</strong>，防御方获胜，攻击未命中，不造成伤害。如果防御方<strong>失误</strong>，攻击自动成功。</p>\\n            <h4>④ 命中决定</h4>\\n            <p>比较双方的总判定值，按照对抗判定的规则决定攻击是否命中：</p>\\n            <ul>\\n                <li>攻击者的总判定值更高 → 攻击命中，进入伤害掷骰步骤</li>\\n                <li>防御者的总判定值更高或相等 → 攻击未命中（平局时防御方优先）</li>\\n            </ul>\\n            <h4>⑤ 伤害掷骰</h4>\\n            <p>攻击命中后，确定攻击者对敌人造成的伤害。详见\\"伤害计算\\"章节。</p>\\n            <p>如果攻击者在命中判定中暴击，伤害掷骰时额外增加的骰数等于命中判定中掷出6的骰子数量。例如，命中判定中掷出了3个6，则伤害掷骰额外增加3个骰子。</p>\\n            <h4>攻击方式分类</h4>\\n            <p><strong>武器攻击：</strong>使用武器（剑、枪、弓等）攻击其他角色。</p>\\n            <ul>\\n                <li><strong>近战攻击：</strong>使用射程为\\"近战\\"的武器（如剑、徒手）。必须在同一交战中才能进行。</li>\\n                <li><strong>远程攻击：</strong>使用射程非\\"近战\\"的武器。不能攻击与自己处于同一交战中的角色。</li>\\n                <li><strong>投掷：</strong>部分近战武器标注为可投掷，此时可进行远程攻击，射程=力量+5米。投掷的武器视为消耗品，通常丢失，但战斗结束后可通过幸运判定（DL 12）找回。</li>\\n            </ul>\\n            <p><strong>魔法攻击：</strong>使用分类为\\"法术\\"的技能进行攻击。</p>\\n            <p><strong>特殊攻击：</strong>不属于武器或魔法类别的攻击（如龙息等）。</p>\\n            <h4>掩护</h4>\\n            <p>在伤害掷骰步骤之前，与被命中角色处于同一交战中的角色可以选择代替该角色承受攻击，这称为<strong>掩护</strong>。所有减益状态、技能和物品效果连同伤害一起转移给掩护者。掩护者必须处于待命状态，执行掩护后立即变为消耗状态。杂兵敌人不能执行掩护。如果攻击（如范围攻击）同时命中掩护者和被掩护者，掩护者受到双倍伤害。</p>\\n            <div class=\\"example\\"><strong>战斗示例：</strong>达克妮丝用长剑攻击一只巨型蟾蜍。达克妮丝进行命中判定（灵巧判定），掷2D6=5 + 灵巧值 = 总判定值。蟾蜍进行回避判定（敏捷判定），掷2D6=8 + 敏捷值 = 总判定值。如果达克妮丝的总判定值更高，攻击命中——但众所周知，达克妮丝的灵巧值低得可怕，所以她几乎总是打不中。</div>\\n        "},{"i":85,"ch":"第五章","chTitle":"技能系统","title":"伤害计算","id":"combat-damage","html":"\\n            <p>攻击命中后，按以下方式计算伤害。伤害分为三种类型：<strong>物理伤害</strong>、<strong>魔法伤害</strong>和<strong>贯穿伤害</strong>。</p>\\n            <h4>物理伤害</h4>\\n            <p>通常由武器造成的伤害为物理伤害。</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">伤害 = 2D6 + 武器攻击力 + 修正</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">总伤害 = 伤害 -（防御方物理防御 + 修正）</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">HP = 受伤前HP - 总伤害</p>\\n            <p>如果总伤害为0或更少，防御方不受伤害。</p>\\n            <h4>魔法伤害</h4>\\n            <p>由魔法效果造成的伤害为魔法伤害。伤害计算方式取决于所使用的技能。</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">伤害 = 取决于使用的技能</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">总伤害 = 伤害 -（防御方魔法防御 + 修正）</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">HP = 受伤前HP - 总伤害</p>\\n            <p>如果总伤害为0或更少，防御方不受伤害。</p>\\n            <p>魔法伤害可能带有元素属性。元素包括：火、水、风、土、雷、冰、光、暗，以及无属性（虚空），共9种。</p>\\n            <ul>\\n                <li><strong>相同元素：</strong>如果防御方拥有与攻击相同的元素属性，计算总伤害时魔法防御翻倍。</li>\\n                <li><strong>弱点元素：</strong>如果防御方对攻击元素有弱点，计算总伤害时魔法防御视为0。</li>\\n                <li><strong>虚空（无属性）：</strong>纯粹为方便而设的称呼，不存在\\"虚空元素\\"。选择元素时不能选择虚空。</li>\\n            </ul>\\n            <h4>贯穿伤害</h4>\\n            <p>贯穿伤害无视防御，不能被物理防御或魔法防御减少。因为它既不是物理伤害也不是魔法伤害，任何仅减少物理或魔法伤害的技能/物品对贯穿伤害无效。但如果技能或物品只说\\"减少伤害\\"而未指定物理或魔法，则可以减少贯穿伤害。</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">伤害 = 取决于使用的技能</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">总伤害 = 伤害 - 防御方修正</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">HP = 受伤前HP - 总伤害</p>\\n            <h4>防御值说明</h4>\\n            <p><strong>物理防御：</strong>由装备（防具、盾牌）的物理防御值 + 技能修正构成。物理防御不能低于0。</p>\\n            <p><strong>魔法防御：</strong>由精神值 + 装备（防具、盾牌）的魔法防御值 + 技能修正构成。魔法防御不能低于0。</p>\\n            <div class=\\"example\\"><strong>伤害计算示例：</strong>和真用长剑（攻击力5）命中了一只哥布林。伤害掷骰：2D6=7 + 武器攻击力5 = 12。哥布林的物理防御为2。总伤害 = 12 - 2 = 10点。哥布林HP减少10点。</div>\\n        "},{"i":86,"ch":"第五章","chTitle":"技能系统","title":"状态异常","id":"combat-status","html":"\\n            <p>战斗中可能出现各种减益状态（Debuff），影响角色的行动能力。以下是官方规则中的标准减益状态：</p>\\n            <table>\\n                <tr><th>状态</th><th>效果</th><th>恢复方式</th></tr>\\n                <tr><td>威压（Intimidation）</td><td>无法执行主要动作</td><td>使用次要动作解除</td></tr>\\n                <tr><td>激怒（Rage）</td><td>对施加减益者以外的目标进行主要动作判定时-2D</td><td>清理流程自动恢复</td></tr>\\n                <tr><td>眩晕（Stun）</td><td>反应动作判定-1D</td><td>先攻流程自动恢复</td></tr>\\n                <tr><td>滑倒（Slip）</td><td>无法进行战斗移动、全力移动和脱离</td><td>使用移动动作解除</td></tr>\\n                <tr><td>中毒（Poison）</td><td>每等级强度在清理流程损失5点HP</td><td>使用技能或物品解除</td></tr>\\n                <tr><td>击退（Knockback）</td><td>每等级强度行动点数-5</td><td>清理流程自动恢复</td></tr>\\n                <tr><td>失神（Dazed）</td><td>主要动作判定-1D</td><td>清理流程自动恢复</td></tr>\\n            </table>\\n            <p>减益状态可以有<strong>效果强度等级</strong>（如中毒3级每回合损失15HP）。部分技能和物品可以增加施加减益的效果等级。</p>\\n        "},{"i":87,"ch":"第五章","chTitle":"技能系统","title":"HP归零与死亡","id":"combat-death","html":"\\n            <p>当角色的HP降至0时，角色陷入<strong>濒死</strong>状态。</p>\\n            <h4>濒死状态</h4>\\n            <p>濒死角色无法使用任何技能或执行任何行动，直到从濒死中恢复。也不能通过技能或物品恢复HP。不能执行移动动作、主要动作、次要动作，也不能反应或执行自由行动。（如果在对抗判定中作为防御方，总判定值视为0。）但即使濒死，持续技能效果仍然保留，减益状态也不会消失。如果角色在HP未降至0的情况下陷入濒死，HP自动变为0。</p>\\n            <h4>死亡判定</h4>\\n            <p>在每个战斗回合结束时，所有濒死角色必须进行一次<strong>死亡判定</strong>。死亡判定是使用<strong>幸运</strong>属性的行动判定，难度等级（DL）由当前HP决定：</p>\\n            <table>\\n                <tr><th>当前HP</th><th>难度等级（DL）</th></tr>\\n                <tr><td>0 ～ -10</td><td>8</td></tr>\\n                <tr><td>-11 ～ -20</td><td>10</td></tr>\\n                <tr><td>-21 ～ -50</td><td>15</td></tr>\\n                <tr><td>每超过-50再加-50</td><td>+8</td></tr>\\n            </table>\\n            <ul>\\n                <li><strong>判定成功：</strong>角色脱离濒死状态，HP变为1</li>\\n                <li><strong>判定失败：</strong>角色死亡</li>\\n            </ul>\\n            <p>GM也可以决定角色只能通过技能或物品从濒死中恢复。</p>\\n            <h4>死亡</h4>\\n            <p>角色死亡后，在游戏后处理阶段被移出游戏。</p>\\n            <h4>HP恢复与濒死恢复</h4>\\n            <p>HP可以通过技能或物品等多种方式恢复。但濒死角色无法恢复任何HP。此外，一般情况下，角色无法从死亡中恢复。</p>\\n            <h4>HP损失与MP损失</h4>\\n            <p>攻击通过伤害减少目标的HP，但还有其他方式损失HP，称为<strong>HP损失</strong>。HP损失不被视为伤害，因此任何减少伤害的技能或物品都不能用于减少HP损失。同样方式减少MP的称为<strong>MP损失</strong>。</p>\\n            <div class=\\"example\\"><strong>素晴式死亡：</strong>在素晴的世界中，死亡并不一定是终点。和真就死过好几次（最初甚至是被拖拉机吓得心脏麻痹而死）。不过每次复活都伴随着各种麻烦——阿库娅虽然是复活专家，但她的态度让复活过程变得相当不愉快。</div>\\n        "},{"i":88,"ch":"第九章","chTitle":"魔法与技能系统","title":"魔法概述","id":"magic-overview","html":"\\n            <p>在素晴TRPG中，<strong>没有独立的\\"魔法系统\\"</strong>。魔法完全通过<strong>技能系统</strong>来处理——法术（Spell）只是技能的一种分类类型。使用法术的规则与使用其他技能完全相同：声明使用→支付MP消耗→进行判定（如需要）→结算效果。</p>\\n            <h4>法术的特征</h4>\\n            <p>分类为\\"法术\\"（Spell）的技能具有以下共同特征：</p>\\n            <ul>\\n                <li><strong>消耗MP：</strong>所有法术都需要消耗MP（魔力值）来使用。MP不足则无法使用该法术。</li>\\n                <li><strong>魔法判定：</strong>需要判定的法术使用<strong>魔法判定</strong>（Magic Check），即使用<strong>智力</strong>属性进行判定。</li>\\n                <li><strong>暴击效果：</strong>许多法术在暴击时有特殊效果，最常见的是\\"暴击：消耗变为0\\"（Critical: Costs 0），即暴击时不消耗MP。</li>\\n                <li><strong>元素属性：</strong>部分法术带有元素属性，标注在技能名旁，如\\"火球术 Spell（火）\\"。</li>\\n            </ul>\\n            <h4>MP（魔力值）</h4>\\n            <p><strong>最大MP = 精神基础值 + 职业初始MP + 技能修正</strong></p>\\n            <p>MP是使用法术和其他技能时消耗的资源。MP不会在战斗中自然恢复，只能通过以下方式恢复：</p>\\n            <ul>\\n                <li>技能效果（如祭司的\\"治愈\\"法术、钓鱼技能等）</li>\\n                <li>物品效果（如MP恢复药水）</li>\\n                <li>每个场景开始时，角色HP和MP恢复到最大值（由GM根据情况判断）</li>\\n            </ul>\\n            <h4>元素属性</h4>\\n            <p>魔法伤害可能带有元素属性。元素共有9种：<strong>火、水、风、土、雷、冰、光、暗</strong>，以及<strong>虚空</strong>（无属性）。</p>\\n            <ul>\\n                <li><strong>相同元素：</strong>如果防御方拥有与攻击相同的元素属性，计算总伤害时魔法防御翻倍。</li>\\n                <li><strong>弱点元素：</strong>如果防御方对攻击元素有弱点，计算总伤害时魔法防御视为0。</li>\\n                <li><strong>虚空（无属性）：</strong>纯粹为方便而设的称呼，不存在\\"虚空元素\\"。选择元素时不能选择虚空。</li>\\n            </ul>\\n            <h4>法术的获取</h4>\\n            <p>法术通过以下方式获取：</p>\\n            <ul>\\n                <li><strong>职业技能：</strong>祭司、法师等职业的技能列表中包含大量法术</li>\\n                <li><strong>基础魔法：</strong>通用技能中的\\"基础魔法\\"分类包含初学者法术（如生火、造水、羽落等）</li>\\n                <li><strong>习得基础魔法：</strong>法师职业的\\"习得基础魔法\\"技能允许选择3个通用法术技能学习</li>\\n            </ul>\\n            <div class=\\"note\\"><strong>重要提示：</strong>所有法术的详细数据（时机、判定、对象、射程、消耗、最大SL、使用条件、效果）请参阅各职业的技能列表。法术没有独立的\\"法术列表\\"——它们就是职业技能的一部分。</div>\\n        "},{"i":89,"ch":"第九章","chTitle":"魔法与技能系统","title":"使用法术的规则","id":"magic-casting","html":"\\n            <p>使用法术的流程与使用其他技能完全相同，遵循技能使用的一般规则：</p>\\n            <h4>① 确认使用条件</h4>\\n            <p>检查是否满足法术的使用条件（如\\"需习得治愈1级\\"、\\"仅对恶魔目标有效\\"等）。</p>\\n            <h4>② 支付消耗</h4>\\n            <p>支付法术的MP消耗。如果MP不足，则无法使用该法术。</p>\\n            <h4>③ 进行判定</h4>\\n            <p>如果法术的判定栏标注为\\"魔法判定\\"，则进行魔法判定（使用智力属性）。如果标注为\\"自动成功\\"，则无需判定。</p>\\n            <p>对于<strong>魔法攻击</strong>类法术，判定方式为<strong>对抗判定</strong>：攻击方进行命中判定（魔法判定/智力），防御方进行回避判定（敏捷），比较双方总判定值。</p>\\n            <h4>④ 结算效果</h4>\\n            <p>根据法术的效果描述结算。法术的效果多种多样：</p>\\n            <ul>\\n                <li><strong>攻击型：</strong>对目标造成魔法伤害（如火球术、风刃等）</li>\\n                <li><strong>治疗型：</strong>恢复目标的HP（如治愈术）</li>\\n                <li><strong>辅助型：</strong>为目标提供增益（如祝福术、神圣护甲等）</li>\\n                <li><strong>控制型：</strong>对目标施加减益状态（如脚踝陷阱、睡眠术等）</li>\\n                <li><strong>功能型：</strong>非战斗用途（如生火、造水、净化等基础魔法）</li>\\n            </ul>\\n            <h4>暴击效果</h4>\\n            <p>法术在暴击时可能有特殊效果，常见的有：</p>\\n            <ul>\\n                <li><strong>暴击：消耗变为0</strong>——不消耗MP（最常见）</li>\\n                <li><strong>暴击：增加骰数</strong>——伤害或恢复量额外加骰</li>\\n            </ul>\\n            <h4>用通用魔法进行攻击</h4>\\n            <p>玩家可能想出用没有攻击信息的技能进行攻击的创意，例如用\\"生火\\"增强火焰或用\\"造水\\"推水冲击敌人。在这种情况下，伤害变为1d6魔法或物理伤害（不应设置得比有正规攻击信息的技能更高）。如果是魔法伤害，GM可以根据技能类型决定元素。例如，\\"生火\\"的类型是法术（火），因此会造成火焰魔法伤害。</p>\\n            <div class=\\"example\\"><strong>法术使用示例：</strong>阿库娅使用\\"治愈\\"法术治疗达克妮丝。治愈的判定为\\"魔法判定\\"，阿库娅进行智力判定。判定成功后，达克妮丝恢复3d6+CL×3点HP。如果阿库娅暴击了——暴击效果是\\"增加骰数\\"，恢复量额外加骰！</div>\\n        "},{"i":90,"ch":"第九章","chTitle":"魔法与技能系统","title":"主要法术一览","id":"magic-spell-list","html":"\\n            <p>以下是各职业可学习的法术技能完整列表，包含判定栏信息。<strong>完整数据请参阅各职业的技能列表。</strong></p>\\n            <h4>祭司法术</h4>\\n            <table>\\n                <tr><th>法术名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>效果概要</th></tr>\\n                <tr><td>治愈术（Heal）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>1</td><td>恢复目标3d6+CL×3 HP。暴击：追加骰子</td></tr>\\n                <tr><td>净化术（Cure）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>5</td><td>1</td><td>移除目标所有减益状态。暴击：消耗变0</td></tr>\\n                <tr><td>祝福术（Bless）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>近</td><td>6</td><td>1</td><td>目标判定获得1d6加成（持续到回合结束）。暴击：消耗变0</td></tr>\\n                <tr><td>驱魔术（Exorcism）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>仅对恶魔：魔法攻击，2d6+10火焰魔法伤害。暴击：追加骰子</td></tr>\\n                <tr><td>加速术（Haste）</td><td>准备流程</td><td>魔法判定</td><td>单体</td><td>20m</td><td>3</td><td>5</td><td>目标获得(SL)d6行动点数（持续到回合结束）。暴击：追加骰子</td></tr>\\n                <tr><td>力量术（Power）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>5</td><td>目标武器攻击伤害+SL×3（持续到场景结束）。暴击：消耗变0</td></tr>\\n                <tr><td>圣言术（Holy Word）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>5</td><td>目标魔法攻击伤害+SL×3（持续到场景结束）。暴击：消耗变0</td></tr>\\n                <tr><td>祈祷术（Invoke）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>目标回避判定+1d6（持续到场景结束）。暴击：消耗变0</td></tr>\\n                <tr><td>神圣护甲（Holy Armor）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>5</td><td>目标物理防御+SL×3（持续到场景结束）。暴击：消耗变0</td></tr>\\n                <tr><td>反治愈（Reverse Heal）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>需1级治愈术。仅对不死族：魔法攻击，3d6+CL×3贯穿伤害。暴击：追加骰子</td></tr>\\n                <tr><td>抗魔术（Resist）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>5</td><td>5</td><td>目标魔法防御+SL×3（持续到场景结束）。暴击：消耗变0</td></tr>\\n                <tr><td>复活术（Resurrection）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>10</td><td>1</td><td>仅对濒死目标：复活，恢复2d6 HP，目标变为消耗状态。暴击：追加骰子</td></tr>\\n                <tr><td>圣盾术（Saint Shield）</td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>20m</td><td>3</td><td>5</td><td>减少目标受到的伤害(SL)d6。每次防御1次</td></tr>\\n                <tr><td>超度亡灵（Turn Undead）</td><td>主要行动</td><td>魔法判定</td><td>区域（选择）</td><td>20m</td><td>10</td><td>3</td><td>仅对不死族：等级≤CL+SL则击倒/击杀。每场景1次</td></tr>\\n                <tr><td>驱散术（Dispel）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>1</td><td>移除目标身上一个法术效果。暴击：消耗变0</td></tr>\\n                <tr><td>神圣守卫（Divine Guard）</td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>20m</td><td>—</td><td>1</td><td>仅祭司。目标受到的伤害变为0。每场景1次</td></tr>\\n                <tr><td>快速治愈（Quick Heal）</td><td>先攻流程</td><td>自动成功</td><td>自身</td><td>—</td><td>5</td><td>1</td><td>在先攻流程中使用治愈术。每场景1次</td></tr>\\n                <tr><td>神圣之光（Sacred Light）</td><td>移动行动</td><td>自动成功</td><td>自身</td><td>—</td><td>5</td><td>3</td><td>仅祭司/大祭司法术：攻击伤害或HP恢复+3d6（持续到主要流程结束）。每场景SL次</td></tr>\\n            </table>\\n            <h4>祭司被动技能</h4>\\n            <table>\\n                <tr><th>技能名</th><th>判定</th><th>最大SL</th><th>效果概要</th></tr>\\n                <tr><td>信仰技能（Faith Skill）</td><td>被动</td><td>5</td><td>仅对造成贯穿伤害的魔法攻击有效：伤害+SL×4</td></tr>\\n                <tr><td>钝器武器技能（Weapon Skill: Blunt）</td><td>被动</td><td>1</td><td>使用钝器时命中判定+1d6</td></tr>\\n            </table>\\n            <h4>大祭司法术（进阶职业）</h4>\\n            <table>\\n                <tr><th>法术名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>效果概要</th></tr>\\n                <tr><td>圣典术（Scripture Skill）</td><td>次要行动</td><td>自动成功</td><td>自身</td><td>—</td><td>7</td><td>1</td><td>仅祭司/大祭司法术：主要行动的HP恢复或攻击伤害+精神值（持续到主要流程结束）</td></tr>\\n                <tr><td>神圣驱魔（Sacred Exorcism）</td><td>主要行动</td><td>—</td><td>单体</td><td>20m</td><td>12</td><td>3</td><td>需1级驱魔术。仅对恶魔：等级≤CL+SL+3则即死，否则(SL+1)d6+20贯穿伤害。暴击：追加骰子</td></tr>\\n                <tr><td>神圣超度（Sacred Turn Undead）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>3</td><td>需3级超度亡灵。仅对不死族：等级≤CL+SL+3则击倒/击杀，否则(SL+1)d6+20贯穿伤害。暴击：追加骰子</td></tr>\\n            </table>\\n            <h4>大祭司被动技能</h4>\\n            <table>\\n                <tr><th>技能名</th><th>判定</th><th>最大SL</th><th>效果概要</th></tr>\\n                <tr><td>祈祷技能（Prayer Skill）</td><td>被动</td><td>1</td><td>祭司/大祭司法术的所有判定+1d6</td></tr>\\n                <tr><td>圣战技能（Holy Battle Skill）</td><td>被动</td><td>5</td><td>攻击伤害+SL×3</td></tr>\\n                <tr><td>防御强化技能（Defensive Enhancement Skill）</td><td>被动</td><td>5</td><td>圣盾术的效果+SL×3</td></tr>\\n                <tr><td>高阶圣盾（High Saint Shield）</td><td>圣盾术同时</td><td>1</td><td>圣盾术的对象变为区域（选择）。每回合1次</td></tr>\\n            </table>\\n            <h4>法师法术</h4>\\n            <table>\\n                <tr><th>法术名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>效果概要</th></tr>\\n                <tr><td>风刃术（Blade of Wind）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>魔法攻击，魔法判定+1d6，2d6+5风属性魔法伤害。暴击：追加骰子</td></tr>\\n                <tr><td>闪光术（Flash）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>魔法攻击，2d6+5光属性魔法伤害，命中则威压。可选择不造成伤害</td></tr>\\n                <tr><td>火球术（Fireball）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>魔法攻击，2d6+10火属性魔法伤害。暴击：追加骰子</td></tr>\\n                <tr><td>雷击术（Lightning）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>魔法攻击，2d6+5雷属性魔法伤害，命中则眩晕。可选择不造成伤害</td></tr>\\n                <tr><td>冰霜风（Freeze Gust）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>魔法攻击，2d6+5冰属性魔法伤害，命中则恍惚。暴击：追加骰子</td></tr>\\n                <tr><td>脚踝陷阱（Ankle Snare）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>目标失衡并击退(1)</td></tr>\\n                <tr><td>睡眠术（Sleep）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>目标恍惚+眩晕。杂兵可选择直接睡眠</td></tr>\\n                <tr><td>风之帘（Wind Curtain）</td><td>判定前</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>对远程/法术攻击的回避判定总判定值+5。每回合1次</td></tr>\\n                <tr><td>石盾术（Stone Shield）</td><td>准备流程</td><td>魔法判定</td><td>单体</td><td>20m</td><td>5</td><td>1</td><td>目标物理防御+5（持续到回合结束）。暴击：消耗变0</td></tr>\\n                <tr><td>水之盾（Water Shield）</td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>减少特殊攻击伤害10点。每回合1次</td></tr>\\n                <tr><td>石化束缚（Stone Bind）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>魔法攻击，2d6+5土属性魔法伤害，命中则失衡。暴击：追加骰子</td></tr>\\n                <tr><td>锁术（Lock）</td><td>主要行动</td><td>魔法判定</td><td>见效果</td><td>近</td><td>5</td><td>1</td><td>用魔法判定代替正常判定解除陷阱，或对宝箱/门设置Lock A陷阱</td></tr>\\n                <tr><td>延长咏唱（Extended Chant Skill）</td><td>准备流程</td><td>自动成功</td><td>自身</td><td>—</td><td>8</td><td>5</td><td>魔法攻击伤害+SL×5，行动点数-10（持续到回合结束或移动）</td></tr>\\n                <tr><td>魔力集中（Mana Convergence）</td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>—</td><td>3</td><td>3</td><td>魔法攻击伤害+(SL×2)d6。每场景1次</td></tr>\\n                <tr><td>魔力升华（Mana Ascendance）</td><td>见效果</td><td>自动成功</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>仅法师。魔法攻击目标变单体*，伤害+CL×10。每场景1次</td></tr>\\n                <tr><td>魔力爆发（Magic Blast）</td><td>移动行动</td><td>自动成功</td><td>自身</td><td>—</td><td>3</td><td>3</td><td>主要行动的单体法术变为区域（SL×2目标）（持续到主要流程结束）</td></tr>\\n                <tr><td>增强咏唱（Enhanced Chanting）</td><td>次要行动</td><td>自动成功</td><td>自身</td><td>—</td><td>5</td><td>1</td><td>魔法攻击伤害+感知值（持续到主要流程结束）</td></tr>\\n            </table>\\n            <h4>法师被动技能</h4>\\n            <table>\\n                <tr><th>技能名</th><th>判定</th><th>最大SL</th><th>效果概要</th></tr>\\n                <tr><td>咏唱技能（Chanting Skill）</td><td>被动</td><td>1</td><td>魔法判定+1d6</td></tr>\\n                <tr><td>获得基础魔法（Acquire Basic Magic）</td><td>被动</td><td>1</td><td>选择3个基础魔法通用技能并学习</td></tr>\\n                <tr><td>魔法强化技能（Magical Enhancement Skill）</td><td>被动</td><td>5</td><td>所有魔法攻击伤害+(SL)d6</td></tr>\\n                <tr><td>元素强化技能（Elemental Enhancement Skill）</td><td>被动</td><td>5</td><td>选择1元素：该元素魔法攻击伤害+SL×4</td></tr>\\n            </table>\\n            <h4>大法师法术（进阶职业）</h4>\\n            <table>\\n                <tr><th>法术名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>效果概要</th></tr>\\n                <tr><td>爆裂魔法（Explosion）</td><td>主要行动</td><td>魔法判定</td><td>场景（选择）</td><td>视野</td><td>60</td><td>5</td><td>需5级延长咏唱，仅在5级延长咏唱激活时可用。魔法攻击，(SL+1)d6+60虚空魔法伤害。暴击：追加骰子</td></tr>\\n                <tr><td>龙卷风（Tornado）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级风刃术。魔法判定+1d6，2d6+20风属性魔法伤害。暴击：追加骰子</td></tr>\\n                <tr><td>光之军刀（Light of Saber）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级闪光术。2d6+25光属性魔法伤害，同一交战中+10。暴击：追加骰子</td></tr>\\n                <tr><td>雷神击（Lightning Strike）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级雷击术。2d6+20雷属性魔法伤害，命中则威压。暴击：追加骰子</td></tr>\\n                <tr><td>炼狱火（Inferno）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级火球术。2d6+30火属性魔法伤害。暴击：追加骰子</td></tr>\\n                <tr><td>地动术（Earth Shaker）</td><td>主要行动</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级石化束缚。2d6+20土属性魔法伤害，命中则失衡。暴击：追加骰子</td></tr>\\n            </table>\\n            <h4>基础魔法（通用技能）</h4>\\n            <table>\\n                <tr><th>法术名</th><th>时机</th><th>判定</th><th>消耗</th><th>效果概要</th></tr>\\n                <tr><td>羽落术（Feather）</td><td>见效果</td><td>魔法判定</td><td>6</td><td>坠落伤害变为0。也可用于落穴/骑乘失衡。暴击：消耗变0。每场景1次</td></tr>\\n                <tr><td>造土术（Create Earth）</td><td>主要行动</td><td>魔法判定</td><td>2</td><td>产生一把土。暴击：消耗变0</td></tr>\\n                <tr><td>造水术（Create Water）</td><td>主要行动</td><td>魔法判定</td><td>2</td><td>产生一杯水。暴击：消耗变0</td></tr>\\n                <tr><td>微风术（Wind Breath）</td><td>主要行动</td><td>魔法判定</td><td>2</td><td>产生吹走纸张程度的风。暴击：消耗变0</td></tr>\\n                <tr><td>净化术（Purification）</td><td>准备流程</td><td>魔法判定</td><td>6</td><td>净化接触的水（脏水、毒水等）。暴击：消耗变0</td></tr>\\n                <tr><td>生火术（Tinder）</td><td>主要行动</td><td>魔法判定</td><td>2</td><td>产生火柴大小的火焰。暴击：消耗变0</td></tr>\\n                <tr><td>冰冻术（Freeze）</td><td>准备流程</td><td>魔法判定</td><td>4</td><td>轻微冻结目标表面（不影响判定）。暴击：消耗变0</td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>关于爆裂魔法：</strong>\\"爆裂\\"是大法师的终极法术，需要5级\\"延长咏唱\\"技能，且只能在5级延长咏唱激活时使用。消耗60MP，造成(SL+1)d6+60虚空魔法伤害。它并非\\"消耗全部MP\\"——惠惠之所以每次用完都倒下，是因为她的总MP只有60左右，用完就归零了。爆裂魔法是虚空属性（无属性），不是火属性。</div>\\n        "},{"i":91,"ch":"第十章","chTitle":"游戏主持人指南","title":"黄金法则","id":"gm-golden-rule","html":"\\n            <p>在素晴TRPG中，所有参与者<strong>共同合作创造同一个故事</strong>。游戏的乐趣在于共同构建叙事的过程，以及享受大家共同创造的成果。这是游戏中最重要的规则——<strong>黄金法则</strong>。</p>\\n            <p>每个人都应该努力创造一个让所有人都乐在其中的体验。这条黄金法则的优先级<strong>高于</strong>本书中的任何内容、任何其他素晴TRPG相关书籍、以及其中的任何裁定或信息。</p>\\n            <p><strong>会话的终极目标</strong>是让所有参与者结束时都想要再次游玩。这并不难——所有参与者都将尽最大努力获得经验值（EXP）。在素晴TRPG中，\\"胜利\\"就是这个意思。</p>\\n            <div class=\\"note\\"><strong>💡 译者注：</strong>这条黄金法则是素晴TRPG精神的完美体现。和真小队的冒险从来不是关于\\"完美通关\\"——而是关于伙伴之间的混乱互动、意外展开和共同面对困难。作为GM，不必追求规则的完美执行，而是要确保所有人都玩得开心。</div>\\n        "},{"i":92,"ch":"第十章","chTitle":"游戏主持人指南","title":"游戏主持人的角色","id":"gm-role","html":"\\n            <p>GM为PC——即玩家角色——的冒险准备舞台。GM向他们呈现危险情境，并引导他们走向合适的结局。换句话说，虽然其他玩家在游戏中是被动角色，但作为GM，你需要在会话的所有阶段采取主动并积极参与。</p>\\n            <p>在游戏之外，你还需要为下一次会话构建剧本。（当然，这意味着为所有将出现的NPC和敌人创建数据。）</p>\\n            <p>这看起来可能工作量很大，但当游戏顺利进行时，这些努力会得到十倍的回报。记住，GM不仅仅是为了服务其他玩家而存在的。GM和其他玩家是平等的，他们都想要享受游戏的乐趣。GM是<strong>主持人</strong>——换句话说，是一个帮助其他人度过美好时光的玩家。不要忘记，GM也是应该享受会话的参与者之一。</p>\\n            <h4>成为GM的诀窍</h4>\\n            <p>GM的角色是领导会话并做出决定。他们必须在会话开始之前就做好准备，决定剧本的故事、将出现的角色以及所有敌人的数据。他们在整个会话中决定使用哪些规则、应用这些规则，并判断玩家角色的行动。当会话结束时，GM决定要分配的经验值，并确保了解玩家角色的成长情况。</p>\\n            <p>指导游戏和做出判断的权利始终在于GM。顺利且不出错地完成这一切的唯一诀窍就是：<strong>要有自信</strong>。显然，即使是最有经验的GM有时也会感到困惑，他们甚至可能犯错。在你作为GM的任期内，你毫无疑问会在某个时刻对自己的某个决定感到不安。</p>\\n            <p>不过不要害怕！根据书面规则，GM的决定永远是正确的。</p>\\n        "},{"i":93,"ch":"第十章","chTitle":"游戏主持人指南","title":"GM的权限与裁定","id":"gm-authority","html":"\\n            <p>主持素晴TRPG会话的GM被授予以下权限和能力。但即使拥有这些权限，GM仍应尽力遵循规则，所有参与者（包括GM）都应努力使用公平正确的规则。</p>\\n\\n            <h4>规则裁定</h4>\\n            <p>游戏中描述的空间是由参与者的想象力赋予生命的\\"第二现实\\"。本书描述了尽可能模拟\\"游戏内部现实\\"的规则。然而，有时会出现规则未涵盖的情况。当这些情况发生时，或对适用哪些规则有疑问时，<strong>GM拥有最终决定权</strong>。GM可以创建新规则、修改规则，甚至决定不使用现有规则。</p>\\n\\n            <h4>拒绝和决定结果</h4>\\n            <p>GM可以选择<strong>拒绝</strong>任何GM未见证或未允许的玩家判定或掷骰。GM也可以随时要求玩家掷骰。此外，GM可以<strong>自由决定</strong>其自身的判定或掷骰结果（如NPC的行动），而无需掷任何骰子。</p>\\n\\n            <h4>当裁定出错时</h4>\\n            <p>如果GM或任何玩家弄错了规则，应<strong>立即纠正</strong>并在未来遵循正确的规则。但不应通过\\"回溯游戏时间\\"来纠正错误——就像体育比赛中一旦判决做出几乎从不推翻一样。试图回溯可能导致游戏时间拉长甚至循环。GM<strong>绝不能回溯时间</strong>。玩家指出规则应用错误是正确的做法，GM应立即查阅规则并使用正确版本。但玩家也不应以反对GM的决定来拖延游戏。</p>\\n            <div class=\\"note\\"><strong>一句话：</strong>GM的裁定永远是正确的——即使它不完全符合规则。这确保了游戏能流畅进行，而不是陷入规则争议的泥潭。</div>\\n        "},{"i":94,"ch":"第十章","chTitle":"游戏主持人指南","title":"可选规则：作弊能力（Cheats）","id":"gm-cheats","html":"\\n            <p>素晴TRPG包含一项可选规则——<strong>作弊能力</strong>（Cheats），用于还原原作中转生者携带\\"外挂\\"的设定。游戏参与者应自行决定是否使用此项可选规则。</p>\\n            <ul>\\n                <li>作弊能力在低等级角色手中可能导致游戏平衡更难以把控</li>\\n                <li>当然，它们也带来了更多乐趣——但这并不意味着所有人都能享受</li>\\n                <li>因此，系统设计为让参与者自行决定是否使用</li>\\n                <li>玩家想要使用作弊能力没有问题，但<strong>GM拥有最终决定权</strong></li>\\n            </ul>\\n            <p><strong>作弊能力限制：</strong>GM可以对玩家角色可获得的作弊能力施加限制。例如，在涉及对抗魔王军的剧本中，拥有\\"魔王军成员\\"作弊能力的角色可能处于严重劣势。在这些情况下，GM可以限制该会话中可获得的作弊能力。当然，GM也可以将该作弊能力引入剧情中。</p>\\n            <p><strong>作弊能力与NPC：</strong>GM可以让NPC作为剧本的一部分获得作弊能力。如果这样做，所有人在\\"完成任务\\"部分将获得额外经验值，等于NPC拥有的作弊能力数量乘以所有玩家角色的平均等级。</p>\\n            <p><strong>完整作弊能力列表：</strong></p>\\n            <table>\\n                <tr><th>名称</th><th>效果（Merit）</th><th>代价（Demerit）</th></tr>\\n                <tr><td><strong>死亡回归</strong><br>Return by Death</td><td>昏迷或死亡时使用。你不再昏迷或死亡，HP变为1。每剧本限用一次。</td><td>克服死亡并非易事。使用死亡回归时，必须消耗1点祝福。如果无法消耗，则不能使用死亡回归。</td></tr>\\n                <tr><td><strong>我其实是女神</strong><br>I'm Actually a Goddess</td><td>在同一场景中的角色进行判定后立即使用。该判定变为大成功。如果因大成功而追加骰子，无论掷出多少个6，始终追加2d6。每剧本限用一次。</td><td>这个世界上没有人相信你是女神。你不断告诉他们，但每个人都认为你疯了，或者因为害怕被诅咒而避开你。</td></tr>\\n                <tr><td><strong>贝尔泽格王族</strong><br>Belzerg Royalty</td><td>被动。对恶魔敌人的所有伤害增加CL×4。</td><td>你的力量依赖于你所习惯的王室生活方式。如果选择\\"稳定生活\\"或\\"简朴生活\\"作为生活方式，则无法获得此作弊能力的增益效果，且所有判定承受-1d6惩罚。</td></tr>\\n                <tr><td><strong>痛觉沉醉</strong><br>Intoxicated by Pain</td><td>对你造成的伤害掷骰后立即使用。将该攻击对你造成的伤害变为0。每剧本限用一次。</td><td>你如此沉迷于追求快感，以至于攻击力下降，还忽视了一些本可以闪避的攻击。每次进行命中判定或闪避判定时，承受-1d6惩罚。</td></tr>\\n                <tr><td><strong>力量追求</strong><br>Pursuit of Power</td><td>被动。对使用骰子决定效果的技能有效。获得此作弊能力时，选择一个你已拥有的、通过攻击造成伤害、恢复HP、恢复MP或增减伤害的法术。在该技能的效果中追加5d6。如果等级在10以上，改为追加(CL/2)d6。</td><td>作为力量的代价，你将每一滴魔力和生命力都倾注到法术中。在应用增益效果的流程结束后，你的HP变为0。</td></tr>\\n                <tr><td><strong>魔王军成员</strong><br>Member of the Demon King's Army</td><td>被动。物理防御和魔法防御增加CL×4。</td><td>你不能拒绝魔王的命令，也不能攻击属于魔王军的任何角色或敌人。GM可以设定一个条件，当条件满足时允许你攻击此类角色或敌人。</td></tr>\\n                <tr><td><strong>圣宝持有者：防具</strong><br>Sacred Treasure Holder: Armor</td><td>物品。在预备游戏期间，从你的物品栏中选择一件防具。该防具成为圣宝。其物理防御增加CL×3，魔法防御增加CL。</td><td>当你未装备为此作弊能力选择的防具（你的圣宝）时，所有判定承受-2d6惩罚。</td></tr>\\n                <tr><td><strong>圣宝持有者：武器</strong><br>Sacred Treasure Holder: Weapon</td><td>物品。在预备游戏期间，从你的物品栏中选择一件武器。该武器成为圣宝。其攻击力增加CL×3。</td><td>当你未装备为此作弊能力选择的武器（你的圣宝）时，所有判定承受-2d6惩罚。</td></tr>\\n                <tr><td><strong>邪恶气场</strong><br>Villainous Energy</td><td>目标进行任何判定后立即使用。将该判定变为大失败。每剧本限用一次。</td><td>人们像躲避瘟疫一样避开你。如果在角色创建以外的任何时间购买物品，每件物品（包括生活方式）的价格对你来说都是双倍。</td></tr>\\n                <tr><td><strong>破坏魔法力量</strong><br>Destructive Magic Power</td><td>伤害掷骰前使用。你进行的魔法攻击伤害追加10d6。如果CL在10以上，改为追加(CL+2)d6。每剧本限用一次。</td><td>你需要非常精确地控制MP才能使用破坏魔法力量。你用于进行魔法攻击的所有法术的MP消耗翻倍。</td></tr>\\n                <tr><td><strong>创造作弊</strong><br>Creation Cheat</td><td>随时使用。创造一件具有你选择功能的物品。无法通过此效果获得武器或防具等装备，也无法通过此增益恢复祝福。GM对物品的最终效果拥有最终决定权。获得的物品在剧本结束时消失。每剧本限用一次。</td><td>你因为创造东西的花费而吝啬金钱。你拒绝放弃任务，拼命想要获得报酬。如果因某种原因无法获得任务报酬或必须放弃任务，你的祝福数立即变为0。</td></tr>\\n                <tr><td><strong>最强之人的世界</strong><br>World of the Strongest</td><td>在先攻流程中使用。你立即执行你的主要流程。即使已消耗行动，你也可以执行此主要流程，且执行后不会变为消耗状态。每剧本限用一次。</td><td>拥有最强大的力量给你带来了沉重的负担。在增益的主要流程之后，直到场景结束，你进行的每次掷骰（如判定和伤害）承受-1d6惩罚。这不会将掷骰数量减少到1以下。</td></tr>\\n                <tr><td><strong>命运借贷</strong><br>Loan on Destiny</td><td>被动。可用祝福上限增加1。即使祝福数降至0以下，你也可以使用祝福。</td><td>当你的祝福数为0或以下时，你进行的所有判定（大成功掷骰除外）无论结果如何都会失败。此外，在结束游戏阶段，如果你的祝福数等于或低于你的幸运值的负值，你会死亡。</td></tr>\\n                <tr><td><strong>被误解的人</strong><br>Misunderstood</td><td>以当前场景中的所有群众角色（或战斗中的群体敌人）为目标。这些目标服从你的指示直到场景结束。然而，在此效果下，他们被视为群众。每剧本限用一次。</td><td>你非常引人注目，人们忍不住会大量关注你。任何以你为攻击目标之一的人进行命中判定时，该命中判定获得+1d6。</td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>💡 译者注：</strong>在游戏实录中，每位玩家都选择了一项作弊能力，而且它们完美还原了原作的氛围。GM在允许玩家选择作弊能力时，可以考虑要求玩家同时设定一个与能力匹配的角色背景故事——比如为什么阿库娅要赐予这个转生者这样的能力？</div>\\n        "},{"i":95,"ch":"第十章","chTitle":"游戏主持人指南","title":"GM管理的信息","id":"gm-info","html":"\\n            <p>GM在素晴TRPG的会话中管理两套信息：NPC和陷阱。</p>\\n            <h4>NPC</h4>\\n            <p>NPC（非玩家角色）是指由GM控制的角色。NPC可以设置为三种类型：</p>\\n            <ul>\\n                <li><strong>嘉宾（Guest）：</strong>在剧本中作为敌人或战斗中提供帮助的NPC。通常拥有与玩家角色大致相同类型的信息。</li>\\n                <li><strong>杂兵（Mob）：</strong>2到10个被视为单一实体的角色。当你需要一群怪物或一队士兵时使用。其信息比玩家角色更简化。</li>\\n                <li><strong>群众（Extra）：</strong>没有属性值或职业等数据的NPC。任何不参与战斗的NPC通常都是群众，从开店的老头到冒险者公会的接待员。群众由GM和玩家口头处理。如果玩家声明要杀死群众，该群众直接死亡，无需进入战斗。如果玩家声明只是击晕，那就是击晕。</li>\\n            </ul>\\n            <h4>敌人</h4>\\n            <p>敌人是与玩家对抗的特定NPC。嘉宾敌人称为<strong>单体敌人</strong>（Solo Enemy），群体敌人称为<strong>杂兵敌人</strong>（Mob Enemy）。</p>\\n            <h4>陷阱</h4>\\n            <p>宝箱和门等被视为物体，但地下城等处设置的陷阱是独立的类别。详见\\"陷阱与物体\\"章节。</p>\\n        "},{"i":96,"ch":"第十章","chTitle":"游戏主持人指南","title":"制作剧本","id":"gm-adventure","html":"\\n            <p>剧本是游玩素晴TRPG所必需的。本节将说明如何制作剧本。</p>\\n            <h4>基本冒险剧本</h4>\\n            <p>素晴TRPG的基本剧本结构如下：</p>\\n            <ul>\\n                <li><strong>开场阶段：</strong>PC扮演冒险者，接受一个任务</li>\\n                <li><strong>中间阶段：</strong>前往任务地点</li>\\n                <li><strong>高潮阶段：</strong>击败作为任务目标的敌人，或解决阻碍获取任务所需物品的障碍</li>\\n                <li><strong>结尾阶段：</strong>描绘冒险的结束</li>\\n            </ul>\\n            <p>一般来说，GM需要构思两件事：让玩家角色承担的<strong>任务</strong>，以及让他们为该任务击败的<strong>敌人</strong>（包括Boss）。</p>\\n            <h4>任务</h4>\\n            <p>任务是向玩家角色冒险者发出的请求，要求他们消灭敌人、收集物品等。通过完成任务，PC将获得报酬（以厄里斯支付）。会话的基本目标是PC完成这项工作并获得报酬。</p>\\n            <p>任务源于人们被某事困扰，希望冒险者公会提供帮助。冒险者公会本身有时也会发布任务。</p>\\n            <h4>设计任务报酬</h4>\\n            <p>创建自己的任务时，报酬应特别考虑。我们建议报酬足以让每个PC支付简单生活方式的费用。</p>\\n            <p>计算报酬的推荐公式：</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">[所有参与PC的平均角色等级 × 10] KE</p>\\n            <p>此公式基于一个前提：在地下城中拾取的物品和敌人掉落的物品都是PC可以保留的额外收获，减去他们需要支付生活方式费用的部分。此公式仅供参考。GM可以自由设定适合会话氛围的报酬。如果任务期间没有任何敌人或可拾取的物品，我们建议提高任务的报酬。</p>\\n            <h4>中间阶段省略</h4>\\n            <p>如果在到达任务地点之前不会发生任何特别的事情，你也可以省略会话的中间阶段。换句话说，你可以游玩一个完全没有中间阶段的剧本。</p>\\n            <h4>剧本的变化</h4>\\n            <p>创建剧本时，一些GM可能觉得只涉及完成任务的会话不够丰富。如果你决定制作更有容量的剧本，例如让故事在任务中途发生变化，你可以在任务地点引发其他事件，在中间阶段创建另一个独立的任务。但是，在组织这样的展开时，你应该确保在预览中有所暗示——可以只是简单的暗示，给玩家一个提示，而不是完全透露将要发生什么。</p>\\n            <h4>创建高等级玩家角色</h4>\\n            <p>本节介绍如何创建CL 1以上的玩家角色。GM应在玩家创建进阶职业角色时参考本节。然而，此方法纯粹是建议。GM可以使用其他方法。最终，GM拥有最终决定权。</p>\\n            <ul>\\n                <li><strong>决定经验值：</strong>玩家需要经验值来组建更高等级的角色。GM需要指定他们可以使用的经验值上限。玩家确认自己拥有多少经验值，然后每人使用相同数量的点数来强化角色。对于只持续一次会话的角色，你也可以将经验值作为赠礼给予玩家，让他们自己培养角色。</li>\\n                <li><strong>物品和金钱：</strong>高等级PC可能是已经完成许多任务的冒险者。他们通常拥有比新创建PC更多种类的物品和更多金钱。使用以下公式确定角色总共拥有的金钱，然后让玩家用这些钱购买物品：</li>\\n            </ul>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;text-indent:0;\\">手头总金额 = CL（角色等级）× CL × 300</p>\\n        "},{"i":97,"ch":"第十章","chTitle":"游戏主持人指南","title":"敌人规则","id":"gm-monsters","html":"\\n            <p>敌人是对所有与玩家敌对的角色的统称。在素晴TRPG中，这包括栖息在地下城和城镇外区域的怪物，以及田地里种植的蔬菜。敌人也可能是属于魔王军的恶魔或亚人。</p>\\n            <h4>敌人类型</h4>\\n            <p>敌人是NPC，因此也分为三种类型：嘉宾、杂兵和群众。嘉宾敌人称为<strong>单体敌人</strong>。作为敌人的群众仅用于角色扮演，不需要数据支持。</p>\\n            <h4>杂兵敌人规则</h4>\\n            <p>杂兵敌人没有属性值。当它们需要进行判定时，直接使用Checks栏中列出的数值。斜杠（\\"/\\"）前的数字用于它们自身的基本判定或主动判定行动，斜杠后的数字用于在对抗判定中作为反应方时使用。将2d6加到这个数值上即可得到它们的总判定值。</p>\\n            <ul>\\n                <li>除技能、物品和作弊能力外，杂兵敌人不能执行掩护</li>\\n                <li>杂兵敌人没有最大MP值。如果杂兵敌人学会了需要消耗MP的技能，该消耗视为0</li>\\n            </ul>\\n            <div class=\\"content-img\\">\\n                <img src=\\"img/image_191_image242.png\\" alt=\\"敌人列表阅读指南\\">\\n                <p class=\\"caption\\">敌人列表字段说明</p>\\n            </div>\\n        "},{"i":98,"ch":"第十章","chTitle":"游戏主持人指南","title":"敌人数据列表（已验证）","id":"gm-enemies","html":"\\n            <p>以下数据来自英文原版规则书第276-285页。敌人的攻击格式为<strong>命中(骰数) / 伤害(骰数) / 类型 / 射程</strong>。防御以 物理防御/魔法防御 分别列出。Mob敌人无MP，使用技能无消耗。</p>\\n            <table>\\n                <tr><th>敌人名</th><th>类型</th><th>等级</th><th>HP</th><th>物防/魔防</th><th>回避</th><th>攻击</th><th>行动/移动</th><th>关键技能</th></tr>\\n                <tr><td><strong>哥布林</strong><br>Goblin</td><td>亚人</td><td>1(Mob)</td><td>28</td><td>5/3</td><td>2D+4</td><td>匕首: 2D+3/2D+8/物理/近</td><td>7/7</td><td>集团战术(与同类交战时命中+1,伤害+2)</td></tr>\\n                <tr><td><strong>鬼魂</strong><br>Ghost</td><td>不死</td><td>1(Mob)</td><td>24</td><td>10/3</td><td>2D+4</td><td>亡者之手: 2D+4/2D+6/魔法(暗)/近</td><td>4/12</td><td>暗视, 弱点:光, 飞行, 抗性:毒</td></tr>\\n                <tr><td><strong>小卷心菜</strong><br>Lesser Cabbage</td><td>植物</td><td>1(Mob)</td><td>28</td><td>2/2</td><td>2D+5</td><td>撞击: 2D+5/2D+6/物理/近</td><td>5/9</td><td>盗窃危害, 飞行能力</td></tr>\\n                <tr><td><strong>狗头人</strong><br>Kobold</td><td>亚人</td><td>2(Mob)</td><td>39</td><td>6/3</td><td>2D+4</td><td>短弓: 2D+4/2D+8/物理(远程)/20m</td><td>5/8</td><td>暗视</td></tr>\\n                <tr><td><strong>骷髅兵</strong><br>Skeleton</td><td>不死</td><td>2(Mob)</td><td>42</td><td>4/0</td><td>2D+5</td><td>长剑: 2D+5/2D+10/物理/近</td><td>7/8</td><td>暗视, 特殊物理抗性(匕首/枪/弓)</td></tr>\\n                <tr><td><strong>伪恶魔</strong><br>False Demon</td><td>亚人</td><td>2(Mob)</td><td>35</td><td>7/3</td><td>2D+3</td><td>长枪: 3D+7/3D+11/物理/近</td><td>8/7</td><td>暗视</td></tr>\\n                <tr><td><strong>山贼</strong><br>Bandit</td><td>人类</td><td>2(Mob)</td><td>38</td><td>5/4</td><td>2D+3</td><td>短剑: 2D+7/2D+11/物理/近</td><td>6/10</td><td>—</td></tr>\\n                <tr><td><strong>巨型蟾蜍</strong><br>Giant Toad</td><td>动物</td><td>2</td><td>37</td><td>5/2</td><td>2D+3</td><td>舌(鞭): 2D+7/2D+15/物理/近</td><td>5/11</td><td>吞噬(束缚+无法回避), 消化(每回合10HP损失), 特殊物理抗性(徒手/钝器)</td></tr>\\n                <tr><td><strong>僵尸</strong><br>Zombie</td><td>不死</td><td>3(Mob)</td><td>37</td><td>5/2</td><td>2D+3</td><td>撕咬: 2D+7/2D+15/物理/近</td><td>6/9</td><td>死亡恶臭(交战中敌人回避-2), 抗性:毒</td></tr>\\n                <tr><td><strong>巨型蝙蝠</strong><br>Giant Bat</td><td>动物</td><td>3(Mob)</td><td>35</td><td>6/2</td><td>2D+5</td><td>撕咬: 2D+5/2D+12/物理/近</td><td>7/18</td><td>暗视, 飞行</td></tr>\\n                <tr><td><strong>小恶魔</strong><br>Gremlin</td><td>恶魔</td><td>3(Mob)</td><td>35</td><td>3/5</td><td>3D+5</td><td>利爪: 3D+6/3D+15/物理/近</td><td>9/10</td><td>暗视, 飞行</td></tr>\\n                <tr><td><strong>石傀儡</strong><br>Earth Golem</td><td>人造</td><td>3</td><td>56</td><td>16/0</td><td>2D+4</td><td>拳击: 3D+7/2D+18/物理/近</td><td>8/11</td><td>猛击(次要动作,下次攻击伤害+5), 再生(清理流程移除1个减益,HP损失10), 盗窃危害:动力核心</td></tr>\\n                <tr><td><strong>巨型角甲虫</strong><br>Giant Horn Beetle</td><td>动物</td><td>5(Mob)</td><td>41</td><td>10/2</td><td>2D+4</td><td>角(枪): 3D+8/2D+16/物理/近</td><td>7/16</td><td>集中:近战Lv3, 飞行</td></tr>\\n                <tr><td><strong>凶暴鳄鱼</strong><br>Brutal Alligator</td><td>动物</td><td>5(Mob)</td><td>44</td><td>7/3</td><td>2D+4</td><td>撕咬: 3D+8/4D+14/物理/近</td><td>10/10</td><td>两栖</td></tr>\\n                <tr><td><strong>僵尸制造者</strong><br>Zombie Maker</td><td>不死</td><td>5</td><td>64</td><td>6/4</td><td>2D+5</td><td>攻击魔法:火Lv1: 3D+7/2D+18/魔法(火)/20m</td><td>9/9</td><td>暗视, 攻击魔法:火, 弱点:火, 召唤:僵尸, 抗性:毒</td></tr>\\n                <tr><td><strong>哥布林首领</strong><br>Goblin Leader</td><td>亚人</td><td>4</td><td>59</td><td>8/2</td><td>2D+4</td><td>短剑: 3D+6/2D+20/物理/近</td><td>7/10</td><td>哥布林指挥(同场景哥布林判定+4,伤害+1D), 哥布林战术(命中+场景中哥布林数,伤害+2×哥布林数)</td></tr>\\n                <tr><td><strong>不死骑士</strong><br>Undead Knight</td><td>不死</td><td>7(Mob)</td><td>64</td><td>10/5</td><td>2D+4</td><td>阔剑: 3D+8/4D+20/物理/近</td><td>9/12</td><td>弱点:水, 特殊物理抗性(匕首/枪/弓)Lv2</td></tr>\\n                <tr><td><strong>火龙蜥</strong><br>Fire Drake</td><td>魔兽</td><td>7</td><td>74</td><td>18/10</td><td>2D+5</td><td>撕咬: 3D+10/2D+16/物理/近<br>吐息:火Lv1: 3D+7/2D+42/特殊(火)/20m</td><td>8/17</td><td>龙蜥叹息(移动动作,吐息伤害+2D6,每场景1次), 弱点:冰, 吐息:火</td></tr>\\n , 消化Lv5(每回合25HP损失), 弱点:冰/雷</td></tr>\\n            </table>\\n            <p><strong>数据格式说明：</strong>\\"Mob\\"表示杂兵敌人，无属性值，判定使用Checks值(主动/反应)。攻击格式为\\"命中加值(骰数)/伤害加值(骰数)/伤害类型/射程\\"。回避格式为\\"加值(骰数)\\"。物防/魔防分别用于对抗物理/魔法伤害。</p>\\n            <div class=\\"note\\"><strong>完整敌人列表：</strong>原书包含50+种敌人（含特殊怪物和魔王军干部级别），以上为原书第276-285页的完整敌人列表，包含从1级杂鱼到20级BOSS的各级别敌人。</div>\\n\\n            <h4 style=\\"margin-top:20px; color:var(--text-heading);\\">敌人卡片列表（完整版）</h4>\\n            <p style=\\"font-size:13px; margin-bottom:10px;\\">以下为以卡片形式展示的完整敌人数据，数据与上方表格完全一致，来源于原版规则书第276-285页。</p>\\n            <div class=\\"enemy-card-grid\\">\\n\\n                <div class=\\"enemy-card\\">\\n                    <div class=\\"enemy-card-header\\">\\n                        <div class=\\"enemy-card-name\\">哥布林<span class=\\"enemy-en\\">Goblin</span></div>\\n                        <div><span class=\\"enemy-card-type\\">亚人</span> <span class=\\"enemy-card-level\\">Lv.1 (Mob)</span></div>\\n                    </div>\\n                    <div class=\\"enemy-card-body\\">\\n                        <div class=\\"enemy-stats\\">\\n                            <div class=\\"enemy-stat\\"><span class=\\"enemy-stat-label\\">HP</span><span class=\\"enemy-stat-value\\">28</span></div>\\n                            <div class=\\"enemy-stat\\"><span class=\\"enemy-stat-label\\">物防/魔防</span><span class=\\"enemy-stat-value\\">5/3</span></div>\\n                            <div class=\\"enemy-stat\\"><span class=\\"enemy-stat-label\\">回避</span><span class=\\"enemy-stat-value\\">2D+4</span></div>\\n                            <div class=\\"enemy-stat\\"><span class=\\"enemy-stat-label\\">行动</span><span class=\\"enemy-stat-value\\">7</span></div>\\n                            <div class=\\"enemy-stat\\"><span class=\\"enemy-stat-label\\">移动</span><span class=\\"enemy-stat-value\\">7</span></div>\\n                            <div class=\\"enemy-stat\\"><span class=\\"enemy-stat-label\\">MP</span><span class=\\"enemy

             <tr><td>元素师 元素师</td><td>呼唤精灵强化魔法的施法者</td><td>—</td></tr>\\n                <tr><td>创造者 创造者</td><td>使用魔法阵设置陷阱和削弱敌人</td><td>—</td></tr>\\n                <tr><td>剑斗士 剑斗士</td><td>精通所有剑类武器的战士</td><td>—</td></tr>\\n                <tr><td>骑士 骑士</td><td>以荣誉和誓言强化自身的职业</td><td>—</td></tr>\\n                <tr><td>枪兵 枪兵</td><td>使用长枪控制战场的长距离战士</td><td>—</td></tr>\\n                <tr><td>Rune 骑士 符文骑士</td><td>使用符文和宝石强化装备的魔法战士</td><td>—</td></tr>\\n            </table>\\n            <p>以下是对主要职业的详细介绍。</p>\\n        "},{"i":45,"ch":"第四章","chTitle":"职业详解","title":"冒险者（Adventurer）","id":"class-adventurer","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>全能型，灵活多变。素晴TRPG中最特殊的职业。在原作中，和真因为基础属性较低而没有太多职业可选，最终成为冒险者——但正是这个职业的灵活性让他多次逆转危机。</p>\\n            <p>冒险者只有一个本职业技能——<strong>\\"额外祝福\\"</strong>——但可以从<strong>任何其他职业</strong>学习技能。创建时必须获得额外祝福技能，该技能使冒险者在每次预备阶段获得1点额外祝福。如果冒险者转职为其他职业，此效果失效。在升级时，冒险者也能从其他职业学习5个等级的技能。</p>\\n            <p><strong>特殊规则——学习敌技能：</strong>在素晴原作中，冒险者和真曾从怪物那里学会了技能（如\\"偷窃\\"）。在TRPG中，<strong>仅有冒险者——且仅在GM允许的情况下——可以获取敌技能</strong>。获取的敌技能被视为冒险者的职业技能而非敌技能。这个规则完美还原了原作中冒险者\\"什么都能学一点\\"的特点。</p>\\n            <p><strong>注意：</strong>当冒险者变更职业为冒险者以外的职业时，会失去\\"额外祝福\\"效果（最大祝福数-1）。如果之后再变回冒险者，将重新获得该效果。</p>\\n            <div class=\\"example\\"><strong>💡 译者注：</strong>佐藤和真——从现代日本转生的冒险者。初始属性较低所以没有太多职业可选，但他灵活的头脑和多样的技能组合弥补了这一点。他学习了偷窃（盗贼技能）、弓箭、基础魔法、料理等能力，甚至从怪物那里学会了\\"偷窃\\"和\\"隐蔽\\"等技能，完美体现了冒险者\\"样样通\\"的特点。</div>\\n            <h4>冒险者技能列表（1技能）</h4>\\n            <p>冒险者只有1个职业专属技能，但可以学习其他职业的职业技能（视为本职业技能升级）。升级时可获得其他职业的职业技能或提升现有技能等级。通常无法获得进阶职业技能或敌人技能。</p>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>额外祝福</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在预备阶段获得1点额外祝福。如果当前职业不是冒险者，此效果无效。</td></tr>\\n</table>\\n        "},{"i":46,"ch":"第四章","chTitle":"职业详解","title":"战士（Warrior）","id":"class-warrior","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>前线物理攻击者。擅长各种近战武器，拥有较高的HP和物理防御，是队伍中可靠的伤害吸收者和输出者。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>战士对武器的精通使他们获得武器命中判定的加成。他们还拥有\\"掩护\\"技能，可以替队友承受伤害。</p>\\n            <p><strong>📝 译者补充（非原版内容）——进阶职业——十字军（Crusader）：</strong>当战士达到10级后，可以转职为十字军。十字军是重装防御专家，以极高的HP和防御力著称——尽管命中率可能需要额外训练来提高。</p>\\n            <div class=\\"example\\"><strong>📝 译者补充（非原版内容）——角色灵感：</strong>达克妮丝是十字军的代表。她拥有极高的防御力和HP，敌人几乎无法对她造成致命伤害——但她的剑术糟糕到几乎所有攻击都会打空。她其实享受被攻击的感觉。这种特殊的性格倾向不是十字军的标配。</div>\\n            <p class=\\"class-desc\\">战士是冒险者中常见的职业。他们经常被要求同时担任队伍的剑和盾，在狩猎怪物等任务中最为活跃。然而，他们的攻击力和防御力很大程度上取决于武器和防具。战士必须确保购买适合自己等级的优质装备，才能在战斗中发挥最佳水平——这意味着他们需要更多的报酬来维持生活。这也是高级战士雇佣费用昂贵的原因之一。</p>\\n            <h4>战士技能列表（26技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>命中技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>所有武器命中判定的总判定值+(SL+1)。</td></tr>\\n<tr><td><strong>万能防御</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>物理防御+SL×2，魔法防御+SL。</td></tr>\\n<tr><td><strong>掩护</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>近战</td><td>-</td><td>1</td><td>每次防御1次</td><td>与掩护同时使用。代替同一交战中的目标承受伤害。你只承受1个角色份的伤害。</td></tr>\\n<tr><td><strong>掩护移动</strong></td><td>掩护</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>3</td><td>每场景SL次</td><td>与掩护同时使用。掩护的射程从近战变为20m。你不会因为这个技能而实际移动。</td></tr>\\n<tr><td><strong>诱饵</strong></td><td>准备阶段</td><td>力量</td><td>单体</td><td>10m</td><td>4</td><td>3</td><td>-</td><td>目标进行精神对抗判定。你的最终判定值+SL×2。如果你获胜，目标对你施加威压，必须对你进行攻击。</td></tr>\\n<tr><td><strong>防御专注</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>物理防御和魔法防御+(SL)×2。此效果持续到场景结束或你进行移动为止。</td></tr>\\n<tr><td><strong>下劈</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>对目标进行近战攻击，伤害+(SL)d6。如果目标因此受到至少1点伤害，对目标施加失衡。暴击：追加骰子。</td></tr>\\n<tr><td><strong>耐久</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>最大HP+SL×5。</td></tr>\\n<tr><td><strong>追击</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>每场景1次</td><td>当目标受到HP伤害时可用。目标受到等同于你装备的一件近战武器威力的HP损失。[AR2E扩展]</td></tr>\\n<tr><td><strong>正面迎击</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>-</td><td>在你受到物理伤害的伤害掷骰后使用，伤害-SL×3。</td></tr>\\n<tr><td><strong>强击</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>4</td><td>5</td><td>-</td><td>对目标进行武器攻击，伤害+(SL)d6。暴击：追加骰子。</td></tr>\\n<tr><td><strong>不屈</strong></td><td>清理阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>移除自身1个减益效果。</td></tr>\\n<tr><td><strong>最后手段</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>-</td><td>武器攻击伤害+SL×3，但反应判定-1d6。此效果持续到场景结束。</td></tr>\\n<tr><td><strong>猛吼</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>5</td><td>-</td><td>近战攻击伤害+SL×2。此效果持续到场景结束。</td></tr>\\n<tr><td><strong>横扫</strong></td><td>主要动作</td><td>命中判定</td><td>范围（SL×2个目标）</td><td>近战</td><td>3</td><td>3</td><td>-</td><td>对同一交战中的目标进行近战攻击。</td></tr>\\n<tr><td><strong>壁垒</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>-</td><td>物理防御+SL×3。此效果持续到场景结束。</td></tr>\\n<tr><td><strong>盾击</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>装备盾牌</td><td>使用武器命中判定的总判定值+SL，近战攻击伤害+SL×2。</td></tr>\\n<tr><td><strong>无形打击</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>近战命中判定+1d6。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>真空波</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>战士, 每剧本1次</td><td>进行武器攻击时使用。该攻击的对象变为单体*，伤害+CL×10。</td></tr>\\n<tr><td><strong>武器技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用选择的武器</td><td>获得此技能时选择一种武器类型，记为\\"武器技能：单手剑\\"等。使用该类型武器时命中判定+1d6。不同武器的武器技能视为不同技能。</td></tr>\\n<tr><td><strong>万能防御II</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>需要万能防御SL3。当你激活降低伤害的技能时，减少的伤害值+SL×5。</td></tr>\\n<tr><td><strong>双武器技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用双武器</td><td>武器攻击命中判定+1。如果武器攻击暴击，伤害+1d6。</td></tr>\\n<tr><td><strong>单手武器技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用单手武器</td><td>武器攻击命中判定的最终结果+2，伤害+1。</td></tr>\\n<tr><td><strong>强击II</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>需要强击SL5。学习时选择一种减益效果。如果你的攻击对敌人造成至少1点伤害，对该敌人施加选择的减益效果。</td></tr>\\n<tr><td><strong>壁垒II</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>需要壁垒SL5。壁垒的效果从\\"物理防御+SL×3\\"变为\\"物理防御+SL×5，魔法防御+SL×2\\"。</td></tr>\\n<tr><td><strong>双手武器技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用双手武器</td><td>武器攻击命中判定的最终结果+1，伤害+3。</td></tr>\\n</table>\\n        "},{"i":47,"ch":"第四章","chTitle":"职业详解","title":"祭司（Priest）","id":"class-priest","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>治疗与支援。侍奉神明的圣职者，通过祈祷施展神圣魔法来治愈队友、驱散异常状态。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>祭司的治疗魔法效率更高。他们对不死族和恶魔类怪物有额外优势。</p>\\n            <p><strong>📝 译者补充（非原版内容）——进阶职业——大祭司（Arch-priest）：</strong>当祭司达到10级后，可以转职为大祭司。大祭司拥有最强的治疗和复活能力，在高级别时可以复活阵亡的队友。</p>\\n            <div class=\\"example\\"><strong>📝 译者补充（非原版内容）——角色灵感：</strong>阿库娅作为女神，拥有顶级的大祭司能力——轻松复活死者，治疗重伤，驱散诅咒。然而她糟糕的智力让这些神圣力量经常被用在奇怪的地方。普通的大祭司应该比她可靠得多。</div>\\n            <p class=\\"class-desc\\">祭司运用信仰之力创造各种奇迹。在冒险队伍中，他们通常专注于治疗和支援。由于他们的重要性，每个队伍都想确保有一名祭司。幸运的是，选择危险冒险生活的祭司并不少。他们在冒险者公会中需求很大。崇拜女神厄里斯的厄里斯教会是世界上最大的宗教组织，大多数冒险祭司都属于该教派。</p>\\n            <h4>祭司技能列表（20技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>祝福</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近战</td><td>6</td><td>1</td><td>-</td><td>目标的判定+1d6。此效果持续到回合结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>净化</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>5</td><td>1</td><td>-</td><td>移除目标的所有减益效果。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>驱散</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>1</td><td>-</td><td>移除目标身上一个正在生效的法术效果。你可以选择移除哪个法术的效果。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>神圣守卫</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>1</td><td>仅祭司, 每剧本1次</td><td>在目标受到伤害的伤害掷骰后立即使用。将该伤害变为0。</td></tr>\\n<tr><td><strong>驱魔</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>仅对恶魔目标有效。对目标进行魔法攻击，造成2d6+10火属性魔法伤害。暴击：追加骰子。</td></tr>\\n<tr><td><strong>信仰术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>仅对造成贯穿伤害的魔法攻击有效。魔法攻击伤害+SL×4。</td></tr>\\n<tr><td><strong>急速</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>20m</td><td>3</td><td>5</td><td>-</td><td>目标获得(SL)d6行动点数。此效果持续到回合结束。暴击：追加骰子。</td></tr>\\n<tr><td><strong>治疗</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>1</td><td>-</td><td>目标恢复3d6+CL×3 HP。暴击：追加骰子。</td></tr>\\n<tr><td><strong>圣甲</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>5</td><td>-</td><td>目标物理防御+SL×3。此效果持续到场景结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>圣言</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>5</td><td>-</td><td>目标进行的魔法攻击伤害+SL×3。此效果持续到场景结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>祈求</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>目标回避判定+1d6。此效果持续到场景结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>力量术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>4</td><td>5</td><td>-</td><td>目标所有武器攻击伤害+SL×3。此效果持续到场景结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>快速治疗</strong></td><td>先攻阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>每场景1次</td><td>此技能允许你在先攻阶段使用治疗术。</td></tr>\\n<tr><td><strong>抗魔</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>5</td><td>5</td><td>-</td><td>目标魔法防御+SL×3。此效果持续到场景结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>复活</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>10</td><td>1</td><td>-</td><td>仅对击倒状态的目标有效。目标复活，HP变为2d6。目标变为已行动状态。暴击：追加骰子。</td></tr>\\n<tr><td><strong>反治疗</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>需要1级治疗术。仅对亡灵目标有效。对目标进行魔法攻击，造成3d6+CL×3贯穿伤害。暴击：追加骰子。</td></tr>\\n<tr><td><strong>神圣之光</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>每场景SL次</td><td>仅对祭司和大祭司法术有效。主要行动的攻击伤害或HP恢复+3d6。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>圣盾</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>20m</td><td>3</td><td>5</td><td>每次防御1次</td><td>与掩护同时使用。减少目标受到的伤害。在目标受到伤害的伤害掷骰后使用，伤害-(SL)d6。</td></tr>\\n<tr><td><strong>驱散亡灵</strong></td><td>主要动作</td><td>魔法判定</td><td>范围（选择）</td><td>20m</td><td>10</td><td>3</td><td>每场景1次</td><td>仅对亡灵目标有效。如果目标的CL≤你的CL+SL，目标死亡或被击倒（你选择）。暴击：追加骰子。</td></tr>\\n<tr><td><strong>武器技能：钝器</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用钝器</td><td>使用钝器时命中判定+1d6。不能同时应用多个武器技能。</td></tr>\\n</table>\\n        "},{"i":48,"ch":"第四章","chTitle":"职业详解","title":"法师（Wizard）","id":"class-wizard","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>魔法攻击者。操纵元素之力，施展火焰、冰霜、雷电等破坏性魔法。物理防御较弱，需要队友保护，但魔法输出是队伍中不可或缺的火力来源。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>法师的MP池比其他职业更大。他们对魔法攻击有额外伤害加成。</p>\\n            <p><strong>📝 译者补充（非原版内容）——进阶职业——大法师（Arch-wizard）：</strong>当法师达到10级后，可以转职为大法师。大法师可以使用更强大的魔法——包括传说中的\\"爆裂\\"（Explosion）魔法，这种足以夷平城堡的终极爆炸魔法，使用后会耗尽全部MP并倒地。</p>\\n            <div class=\\"example\\"><strong>📝 译者补充（非原版内容）——角色灵感：</strong>惠惠——红魔族大法师，只学习\\"爆裂\\"一种魔法并将其威力发挥到极致。每天只能使用一次就会耗尽MP倒下，但其威力无与伦比。拒绝学习爆裂以外的任何攻击魔法。</div>\\n            <p class=\\"class-desc\\">法师是操控魔法的职业，经常成为队伍的智囊。这是因为魔法在世界许多地方被视为学术科目，大多数法师都接受过高等教育。他们也常被聘为政府官员、军事顾问和医生。尽管如此，天赋在使用魔法时至关重要。因此，红魔族出身的法师的优秀是广为人知的。在冒险者中，法师是比较稀少的职业。</p>\\n            <h4>法师技能列表（20技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>习得基础魔法</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>学习此技能时，选择3个标记为法术的通用技能。你习得这些技能。</td></tr>\\n<tr><td><strong>足缚术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>-</td><td>对目标施加失衡和击退(1)。</td></tr>\\n<tr><td><strong>风刃</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>对目标进行魔法攻击，魔法判定+1d6，造成2d6+5风属性魔法伤害。暴击：追加骰子。</td></tr>\\n<tr><td><strong>咏唱技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>魔法判定+1d6。</td></tr>\\n<tr><td><strong>元素强化</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>学习此技能时选择一种元素。此技能影响你造成的该元素所有魔法伤害，伤害+SL×4。</td></tr>\\n<tr><td><strong>强化咏唱</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>魔法攻击伤害加上你的感知值。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>火球术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>对目标进行魔法攻击，造成2d6+10火属性魔法伤害。暴击：追加骰子。</td></tr>\\n<tr><td><strong>闪光</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>对目标进行魔法攻击，造成2d6+5光属性魔法伤害。如果目标因此受到至少1点伤害，对目标施加威压。使用此法术时可选择不造成伤害。</td></tr>\\n<tr><td><strong>冰冻强风</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>对目标进行魔法攻击，造成2d6+5冰属性魔法伤害。如果目标因此受到至少1点伤害，对目标施加恍惚。暴击：追加骰子。</td></tr>\\n<tr><td><strong>闪电</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>对目标进行魔法攻击，造成2d6+5雷属性魔法伤害。如果目标因此受到至少1点伤害，对目标施加眩晕。使用此法术时可选择不造成伤害。</td></tr>\\n<tr><td><strong>锁定</strong></td><td>主要动作</td><td>魔法判定</td><td>见效果</td><td>近战</td><td>5</td><td>1</td><td>-</td><td>使用魔法判定代替正常的陷阱解除判定。或者对目标施加锁定陷阱。</td></tr>\\n<tr><td><strong>魔法强化</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>所有魔法攻击伤害+(SL)d6。</td></tr>\\n<tr><td><strong>魔法飞弹</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>-</td><td>时机为主要动作且对象为单体的法术，其对象变为范围（SL×2个目标）。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>魔力攀升</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>法师, 每剧本1次</td><td>进行魔法攻击时使用。将该魔法攻击的对象变为单体*，伤害+CL×10。</td></tr>\\n<tr><td><strong>魔力集中</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>每场景1次</td><td>在魔法攻击的伤害掷骰前使用，该攻击伤害+(SL×2)d6。</td></tr>\\n<tr><td><strong>催眠术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>7</td><td>1</td><td>-</td><td>目标变为眩晕和恍惚。如果目标是杂兵，可以使其睡眠。</td></tr>\\n<tr><td><strong>石缚术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>对目标进行魔法攻击，造成2d6+5地属性魔法伤害。如果目标因此受到至少1点伤害，对目标施加失衡。暴击：追加骰子。</td></tr>\\n<tr><td><strong>石盾术</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>20m</td><td>5</td><td>1</td><td>-</td><td>目标物理防御+5。此效果持续到回合结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>水盾术</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>每轮1次</td><td>在目标受到特殊攻击伤害的伤害掷骰后使用，该伤害-10。</td></tr>\\n<tr><td><strong>风幕术</strong></td><td>判定前</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>每轮1次</td><td>在对远程攻击或法术进行回避判定前使用，该回避判定的总判定值+5。</td></tr>\\n</table>\\n        "},{"i":49,"ch":"第四章","chTitle":"职业详解","title":"盗贼（Thief）","id":"class-thief","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>技巧型战士。擅长潜行、开锁、解除陷阱、偷窃和偷袭。在地下城探索中不可或缺——发现和解除陷阱、开锁、侦察前方情况。战斗中利用高敏捷先发制人，配合偷袭造成额外伤害。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>盗贼在攻击未察觉自己或正与队友交战的敌人时获得命中和伤害加成。他们还擅长使用双武器——匕首和鞭子同时装备可以有额外效果。</p>\\n            <p><strong>📝 译者补充（非原版内容）——进阶职业——刺客（Assassin）：</strong>当盗贼达到10级后，可以转职为刺客，获得更强的偷袭能力和致命一击的概率。</p>\\n            <div class=\\"example\\"><strong>📝 译者补充（非原版内容）——角色灵感：</strong>克里斯（厄里斯女神的凡间化身）是盗贼的典范，精通各种盗贼技能。和真从她那里学会了\\"偷窃\\"技能——尽管后来主要用它来偷女生的内裤。</div>\\n            <p class=\\"class-desc\\">盗贼是冒险者中仅次于战士的常见职业。和战士一样，他们在战斗中负责进攻。然而，盗贼在地下城探索中真正大放异彩。盗贼的技能对于应对地下城中各种危险陷阱是不可或缺的。他们还有许多与隐秘行动相关的技能，使他们成为能够胜任多种角色的职业。他们多样的职业技能意味着两个盗贼可能因为所学不同而完全不同。</p>\\n            <h4>盗贼技能列表（20技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>伏击</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>4</td><td>5</td><td>潜行状态</td><td>对目标进行武器攻击，命中判定+1d6，伤害+(SL)d6。暴击：追加骰子。</td></tr>\\n<tr><td><strong>束缚</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>5</td><td>5</td><td>使用鞭</td><td>对目标进行近战攻击，伤害+(SL)×2。如果目标因此受到至少1点伤害，你或目标都不能移动。此效果持续到你用次要动作宣布结束或场景结束。暴击：追加骰子。</td></tr>\\n<tr><td><strong>隐蔽</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>进入潜行状态。与敌方角色交战时不能使用此技能（除非其他技能或物品允许在交战中进入潜行状态）。</td></tr>\\n<tr><td><strong>疾走</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>进行战斗移动或撤退。如果与你同一交战中有敌方角色阻挡，则不能进行撤退。</td></tr>\\n<tr><td><strong>敌意感知</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>受到突袭时，进行反应判定不受-1d6惩罚。</td></tr>\\n<tr><td><strong>回避术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>所有回避判定+1d6。</td></tr>\\n<tr><td><strong>佯攻</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>你进行的武器攻击的目标在反应判定上-1d6。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>毒术</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>-</td><td>进行武器攻击时使用。如果目标因此受到至少1点伤害，对目标施加中毒(SL)。此技能效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>贯穿</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>-</td><td>在武器攻击的伤害掷骰前使用，该攻击伤害+(SL)d6。</td></tr>\\n<tr><td><strong>技能封印</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>视野</td><td>-</td><td>1</td><td>盗贼, 每剧本1次</td><td>当目标宣布使用任何非被动技能时使用。使该技能效果无效化并结束，即使该技能有持续时间。技能仍被视为已使用，目标仍需支付正常消耗。</td></tr>\\n<tr><td><strong>蛇击</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>使用匕首或鞭</td><td>所有武器攻击伤害加上你的灵巧值。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>潜行术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以在移动和进入交战时保持潜行状态。此效果也适用于因技能或物品进行的移动。</td></tr>\\n<tr><td><strong>速攻</strong></td><td>主要动作</td><td>命中判定</td><td>范围（选择）</td><td>武器</td><td>4</td><td>5</td><td>-</td><td>对目标进行武器攻击。如果攻击指定2个或以上目标，伤害+(SL)×2。暴击：追加骰子。</td></tr>\\n<tr><td><strong>偷窃</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>4</td><td>每剧本SL次</td><td>对敌人进行近战伤害掷骰后使用。从攻击目标获得1件战利品。正常掷骰战利品表。如果对没有指定战利品表的敌人使用，获得敌人等级×100 KE。</td></tr>\\n<tr><td><strong>专精武器</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>使用选择的武器</td><td>从持有的武器中选择一种类型，记为\\"专精武器：匕首\\"等。使用该类型武器时命中判定+(SL)，伤害+(SL)×2。不能同时应用多个专精武器技能。</td></tr>\\n<tr><td><strong>威胁感知</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>威胁感知判定+1d6。</td></tr>\\n<tr><td><strong>陷阱探测</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>所有陷阱探测判定+1d6。此外，即使探测失败，陷阱也不会触发。</td></tr>\\n<tr><td><strong>陷阱解除</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你的物品栏中有「契约妖精：敲击者」时可使用。进行一次「解除陷阱」判定。你可以使用精神代替灵巧进行此判定。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>双刃术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用匕首或鞭</td><td>当左右手各装备一把满足使用条件的武器时生效。将两把武器的命中修正、攻击力、行动修正相加，视为一把武器。可使用任一武器的效果，但同一时间只能激活一个需要声明的效果。</td></tr>\\n<tr><td><strong>武器技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用选择的武器</td><td>获得此技能时选择一种武器类型，记为\\"武器技能：匕首\\"等。使用该类型武器时命中判定+1d6。不同武器的武器技能视为不同技能。</td></tr>\\n</table>\\n        "},{"i":50,"ch":"第四章","chTitle":"职业详解","title":"弓箭手（Archer）","id":"class-archer","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>远程物理攻击者。弓箭手专精于弓术，可以在远处精准打击敌人而无需靠近。他们能够瞄准敌人的弱点，从安全的距离外造成可观的伤害。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>弓箭手可以在不进入敌人交战范围的情况下攻击。一些技能允许他们用箭矢限制敌人的移动（如\\"影缚之术\\"将敌人的影子钉在地上）。幸运值高的弓箭手尤其致命——他们的远程伤害与幸运属性挂钩。</p>\\n            <p class=\\"class-desc\\">弓箭手是专门使用弓的职业。他们可以从远处攻击敌人的弱点，不让敌人靠近。</p>\\n            <h4>弓箭手技能列表（3技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>幸运射击</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>4</td><td>5</td><td>使用弓</td><td>对目标进行远程攻击，伤害+(SL)×你的幸运值。暴击：追加骰子。</td></tr>\\n<tr><td><strong>影缚之术</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>5</td><td>1</td><td>使用弓</td><td>对目标进行远程攻击。如果目标因此受到至少1点伤害，对目标施加失衡。暴击：追加骰子。</td></tr>\\n<tr><td><strong>弓术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用弓</td><td>使用弓时命中判定+1d6。</td></tr>\\n</table>\\n        "},{"i":51,"ch":"第四章","chTitle":"职业详解","title":"元素师（Elemental Master）","id":"class-elemental","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>精灵魔法专精者。元素师通过呼唤精灵（Elementals）来增强特定元素的魔法威力，也可以召唤精灵削弱敌人对特定元素魔法的防御。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>大多数元素师技能需要搭配元素魔法使用。选择一种元素专精（如火焰、冰霜、雷电等），在该元素上的魔法伤害和判定获得显著加成。召唤精灵后脱离原位会中断效果。</p>\\n            <p class=\\"class-desc\\">元素师是召唤精灵来增强自身力量的职业。因此，他们的大部分技能如果没有使用精灵之力的手段就毫无意义。</p>\\n            <h4>元素师技能列表（3技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>精灵安置</strong></td><td>准备阶段</td><td>魔法判定</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>-</td><td>使用时选择一种元素，该元素的魔法伤害+(SL)×5。此效果持续到场景结束或你进行移动。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>精灵防御</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>20m</td><td>3</td><td>3</td><td>-</td><td>使用时选择一种元素。如果目标受到该元素的魔法伤害，在计算伤害前魔法防御+(SL)×5。此效果持续到回合结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>精灵强化</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>学习此技能时选择一种元素，记为\\"精灵强化：光\\"等。该元素的魔法判定总判定值+(SL)，该元素的魔法伤害+(SL)×2。可以再次学习此技能作为不同元素的独立技能。</td></tr>\\n</table>\\n        "},{"i":52,"ch":"第四章","chTitle":"职业详解","title":"创造者（Creator）","id":"class-creator","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>魔法阵陷阱师。创造者使用魔法阵（Magic Circles）进行战斗——预设陷阱削弱敌人防御或对其施加负面状态（Debuff），同时为队友创造攻击机会。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>创造者可以通过预测敌人行动并提前设置魔法阵来布设陷阱。他们对敌人施加的负面状态效果等级+1。</p>\\n            <p class=\\"class-desc\\">创造者是使用魔法阵——通过魔力创造的陷阱——进行战斗的职业。他们的阵法既可以突破敌人防御，也可以对敌人施加减益效果。</p>\\n            <h4>创造者技能列表（3技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>陷阱</strong></td><td>移动动作</td><td>自动成功</td><td>单体</td><td>-</td><td>特殊</td><td>3</td><td>每场景SL次</td><td>使用时选择一种减益效果。如果你对目标造成至少1点伤害，对目标施加选择的减益效果。减益效果的有效等级视为1。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>防御贯穿</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>20m</td><td>5</td><td>3</td><td>每场景1次</td><td>在伤害掷骰前使用。目标的物理防御和魔法防御-(SL)×5（最低为0）。此效果在计算伤害后结束。</td></tr>\\n<tr><td><strong>陷阱强化</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你对目标施加的减益效果的有效等级+1。对没有有效等级的减益效果无效。</td></tr>\\n</table>\\n        "},{"i":53,"ch":"第四章","chTitle":"职业详解","title":"剑斗士（Swordfighter）","id":"class-swordfighter","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>剑术专精战士。剑斗士精通所有剑类武器——匕首、单手剑、双手剑。无论手持何种剑，他们都能将敌人斩于剑下。双持剑术（Dual-Wielding）也是他们的特长。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>剑斗士可以在移动的同时拔剑攻击（拔刀术），在瞬间完成移动和伤害输出。双持两把单手剑或匕首时，获得额外命中加成。</p>\\n            <p class=\\"class-desc\\">剑斗士是精通各种剑类武器的职业，无论是匕首、单手剑还是双手剑。只要把剑放在他们手中，他们就能击倒所有敌人。</p>\\n            <h4>剑斗士技能列表（3技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>双持术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>使用匕首或单手剑</td><td>当左右手各装备一把匕首或单手剑时生效。命中判定+(SL)，伤害+(SL)×2。</td></tr>\\n<tr><td><strong>拔刀术</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>使用匕首、单手剑或双手剑，每场景SL次</td><td>近战攻击伤害+3d6。此效果持续到主要阶段结束。使用此技能时可以自动装备任意匕首、单手剑或双手剑，但不能以这种方式交换已装备的武器。</td></tr>\\n<tr><td><strong>剑舞</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>使用匕首、单手剑或双手剑</td><td>所有武器攻击伤害加上你的敏捷值。此效果持续到主要阶段结束。</td></tr>\\n</table>\\n        "},{"i":54,"ch":"第四章","chTitle":"职业详解","title":"骑士（Knight）","id":"class-knight","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>以荣誉和誓言为力量的职业。骑士通过宣誓（Oath）来增强自身或保护同伴。他们可以发誓守护某人（获得对该目标的伤害加成）、发誓荣耀战斗（增强攻击力）、或发誓防御（增强自身防御）。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>骑士的\\"誓言技\\"（Oath Skill）允许他们选择一个誓约目标，只要目标在同一场景中，骑士就获得额外的攻击伤害加成。</p>\\n            <p class=\\"class-desc\\">骑士是骄傲而高贵的职业。他们可以通过荣誉和誓约来增强自身力量。</p>\\n            <h4>骑士技能列表（3技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>歼灭</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>-</td><td>所有武器攻击伤害+(SL)×4。此效果持续到回合结束。</td></tr>\\n<tr><td><strong>守护</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>5</td><td>-</td><td>物理防御和魔法防御+(SL)×2。此效果持续到场景结束。</td></tr>\\n<tr><td><strong>誓约</strong></td><td>主要动作</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>1</td><td>每剧本1次</td><td>只要目标在同一场景中，所有攻击伤害+1d6。此效果持续到剧本结束。</td></tr>\\n</table>\\n        "},{"i":55,"ch":"第四章","chTitle":"职业详解","title":"枪兵（Lancer）","id":"class-lancer","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>长枪战士。枪兵使用长枪（Spear）进行战斗，利用武器的长度来扫击和突刺，阻止敌人的移动。他们可以通过蓄力冲锋来大幅增加攻击威力。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>枪兵可以消耗移动行动进行冲锋，冲锋后伤害获得大幅加成。他们还可以横扫敌人腿部使其失去平衡（Off-Balance），或利用枪的长度干扰敌人使其行动延迟。</p>\\n            <p class=\\"class-desc\\">枪兵是使用枪类武器战斗的职业。武器的长度使他们能够刺击和横扫，阻止敌人的移动，并且可以利用冲锋的力量增加攻击力。</p>\\n            <h4>枪兵技能列表（3技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>冲锋</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>使用枪</td><td>进行战斗移动或全力移动。如果这样做，近战攻击伤害+(SL)×4。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>牵制</strong></td><td>准备阶段</td><td>自动成功</td><td>单体</td><td>近战</td><td>4</td><td>3</td><td>使用枪</td><td>目标的行动点数-(SL)d6。此效果持续到回合结束。</td></tr>\\n<tr><td><strong>扫腿</strong></td><td>次要动作</td><td>命中判定</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>使用枪</td><td>所有武器攻击伤害+(SL)×3。如果攻击对目标造成至少1点伤害，对目标施加失衡。此效果持续到主要阶段结束。</td></tr>\\n</table>\\n        "},{"i":56,"ch":"第四章","chTitle":"职业详解","title":"符文骑士（Rune Knight）","id":"class-runeknight","html":"\\n            <p><strong>📝 译者补充（非原版内容）——定位：</strong>魔法战士。符文骑士使用魔法符文（Runes）来强化自己的武器和防具，也可以通过消耗宝石（Gem）从武器中释放元素属性攻击。</p>\\n            <p><strong>📝 译者补充（非原版内容）——职业特性：</strong>符文骑士可以为武器附加\\"锋利符文\\"增加伤害，为防具附加\\"守护符文\\"增加防御，或消耗宝石将物理攻击转化为特定元素的魔法伤害。</p>\\n            <p class=\\"class-desc\\">符文骑士使用魔法符文进行战斗。他们可以用这些符文来增强武器和防具，或从宝石中引出元素之力。</p>\\n            <h4>符文骑士技能列表（3技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>武器符文</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>近战</td><td>5</td><td>5</td><td>-</td><td>目标武器攻击伤害+(SL)×2。此效果持续到场景结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>防具符文</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>近战</td><td>5</td><td>3</td><td>-</td><td>目标物理防御+(SL)×2，魔法防御+(SL)。此效果持续到场景结束。暴击：消耗变为0。</td></tr>\\n<tr><td><strong>元素符文</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>消耗1个宝石物品。你的武器攻击伤害变为该宝石元素属性的魔法伤害。此效果持续到场景结束。</td></tr>\\n</table>\\n        "},{"i":57,"ch":"第四章","chTitle":"职业详解","title":"进阶职业概述","id":"class-advanced","html":"\\n<p>当角色达到<strong>10级</strong>后，可以在升级时转职为进阶职业。以下是4种进阶职业的详细数据：</p>\\n\\n            <table>\\n                <tr><th>基础职业</th><th>进阶职业</th><th>定位与特性</th></tr>\\n            </table>\\n        "},{"i":58,"ch":"第四章","chTitle":"职业详解","title":"十字军（Crusader）——战士进阶","id":"class-crusader","html":"\\n<p><strong>十字军（Crusader）——战士进阶</strong></p>\\n            <p>十字军是重装防御专家，以极高的HP和防御力著称。他们通过\\"掩护\\"和\\"挑衅\\"等技能将敌人的注意力集中在自己身上，保护后方的脆皮队友。十字军可以继续学习战士技能。</p>\\n            <ul>\\n                <li><strong>核心能力：</strong>装备盾牌时防御力显著提升；可以将敌人的攻击目标强制转移到自己身上</li>\\n                <li><strong>代表角色：</strong>达克妮丝——拥有极高的防御力但命中率极低，不过她享受被攻击的感觉</li>\\n            </ul>\\n\\n            <p class=\\"class-desc\\">十字军是战士的进阶职业。他们战斗方式的核心是使用武器攻击和技能来增强防御。他们还有许多保护盟友的技能，这些都是站在前线面对敌人主力的十字军所必需的能力。</p>\\n            <h4>十字军（进阶职业）技能列表（7技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>攻击强化</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>所有武器攻击伤害+(SL)×4。</td></tr>\\n<tr><td><strong>鲜血打击</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>在武器攻击伤害掷骰前使用。消耗最多SL×5 HP，每消耗1 HP，攻击伤害+1。</td></tr>\\n<tr><td><strong>连击</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>8</td><td>3</td><td>每场景SL次</td><td>进行2次近战强击。不需支付任何一次强击的消耗，目标变为单体*。可以攻击同一目标2次，或攻击2个不同目标各1次。</td></tr>\\n<tr><td><strong>要塞姿态</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>9</td><td>5</td><td>-</td><td>物理防御和魔法防御+(SL)×4。此效果持续到场景结束或你进行移动。</td></tr>\\n<tr><td><strong>群体掩护</strong></td><td>掩护</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>每剧本SL次</td><td>与掩护同时使用。保护同一交战中的多个角色。受保护角色不受伤害。你只承受1个角色份的伤害。如果你也是伤害掷骰的目标，你在1个角色份伤害之外还承受你自身份的伤害。</td></tr>\\n<tr><td><strong>精通</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择一种武器类型，记为\\"精通：单手剑\\"等。使用该类型武器时命中判定+1d6。不同武器的精通视为不同技能。不能同时应用多个精通技能。</td></tr>\\n<tr><td><strong>状态抗性</strong></td><td>清理阶段</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每场景SL次</td><td>恢复你当前所有减益效果。</td></tr>\\n</table>\\n        "},{"i":59,"ch":"第四章","chTitle":"职业详解","title":"大祭司（Arch-priest）——祭司进阶","id":"class-archpriest","html":"\\n<p><strong>大祭司（Arch-priest）——祭司进阶</strong></p>\\n            <p>大祭司是侍奉神明的最高级圣职者，拥有最强的治疗、净化和支援能力。高级大祭司可以复活阵亡的队友——这是其他任何职业无法做到的神圣奇迹。</p>\\n            <ul>\\n                <li><strong>核心能力：</strong>治疗效果大幅增强；获得\\"复活\\"等高级神圣魔法；对不死族和恶魔有额外伤害</li>\\n                <li><strong>代表角色：</strong>阿库娅——作为女神，她的治疗和复活能力超乎常人，但智力和判断力严重拖后腿</li>\\n            </ul>\\n\\n            <p class=\\"class-desc\\">大祭司是祭司的进阶职业。他们可以使用更加专精于恢复和支援的魔法，此外还有额外的战斗能力。</p>\\n            <h4>大祭司（进阶职业）技能列表（7技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>防御强化</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>圣盾的效果+(SL)×3。</td></tr>\\n<tr><td><strong>高等圣盾</strong></td><td>圣盾</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>每轮1次</td><td>与圣盾同时使用。圣盾的对象变为范围（选择）。</td></tr>\\n<tr><td><strong>圣战术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>攻击伤害+(SL)×3。</td></tr>\\n<tr><td><strong>祈祷</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>祭司和大祭司技能的所有判定+1d6。</td></tr>\\n<tr><td><strong>神圣驱魔</strong></td><td>主要动作</td><td>-</td><td>单体</td><td>20m</td><td>12</td><td>3</td><td>-</td><td>需要1级驱魔。仅对恶魔目标有效。对目标进行魔法攻击。如果目标的CL≤你的CL+SL+3，目标死亡。否则，攻击造成(SL+1)d6+20贯穿伤害。暴击：追加骰子。</td></tr>\\n<tr><td><strong>神圣驱亡</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>3</td><td>-</td><td>仅对亡灵目标有效。如果目标的CL≤你的CL+SL，目标死亡或被击倒（你选择）。暴击：追加骰子。</td></tr>\\n<tr><td><strong>圣典术</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>1</td><td>-</td><td>Only affects 祭司 and 大祭司 skills. Add your Mind to any HP-recovery effects or attack damage brought about b...</td></tr>\\n</table>\\n        "},{"i":60,"ch":"第四章","chTitle":"职业详解","title":"大法师（Arch-wizard）——法师进阶","id":"class-archwizard","html":"\\n<p><strong>大法师（Arch-wizard）——法师进阶</strong></p>\\n            <p>大法师是魔法攻击的终极形态。他们可以使用最高级别的攻击魔法，包括传说中的\\"爆裂\\"（Explosion）——一种足以夷平城堡的终极爆炸魔法。</p>\\n            <ul>\\n                <li><strong>核心能力：</strong>可以使用最强大的攻击魔法；MP池大幅增加；可以学习\\"爆裂\\"等终极魔法</li>\\n                <li><strong>代表角色：</strong>惠惠——红魔族大法师，\\"爆裂\\"魔法的狂热爱好者，拒绝学习其他任何攻击魔法</li>\\n            </ul>\\n\\n            <p class=\\"class-desc\\">大法师是法师的进阶职业。他们可以使用更强大、更具威力的魔法。</p>\\n            <h4>大法师（进阶职业）技能列表（7技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>地震术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级石缚术</td><td>对目标进行魔法攻击，造成2d6+20地属性魔法伤害。如果目标因此受到至少1点伤害，对目标施加失衡。暴击：追加骰子。</td></tr>\\n<tr><td><strong>爆裂术</strong></td><td>主要动作</td><td>魔法判定</td><td>场景（选择）</td><td>视野</td><td>60</td><td>5</td><td>-</td><td>需要5级延长咏唱，仅在5级延长咏唱激活时可用。对目标进行魔法攻击，造成(SL+1)d6+60虚空魔法伤害。暴击：追加骰子。</td></tr>\\n<tr><td><strong>延长咏唱</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>8</td><td>5</td><td>-</td><td>魔法攻击伤害+(SL)×5，但行动点数-10。此效果持续到回合结束或你进行移动。</td></tr>\\n<tr><td><strong>炼狱术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级火球术</td><td>对目标进行魔法攻击，造成2d6+30火属性魔法伤害。暴击：追加骰子。</td></tr>\\n<tr><td><strong>光刃术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级闪光</td><td>对目标进行魔法攻击，造成2d6+25光属性魔法伤害。如果目标与你同一交战，伤害+10。暴击：追加骰子。</td></tr>\\n<tr><td><strong>雷击术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级闪电</td><td>对目标进行魔法攻击，造成2d6+20雷属性魔法伤害。如果目标因此受到至少1点伤害，对目标施加威压。暴击：追加骰子。</td></tr>\\n<tr><td><strong>龙卷术</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>20m</td><td>12</td><td>1</td><td>需1级风刃</td><td>对目标进行魔法攻击，魔法判定+1d6，造成2d6+20风属性魔法伤害。暴击：追加骰子。</td></tr>\\n</table>\\n        "},{"i":61,"ch":"第四章","chTitle":"职业详解","title":"刺客（Assassin）——盗贼进阶","id":"class-assassin","html":"\\n<p><strong>刺客（Assassin）——盗贼进阶</strong></p>\\n            <p>刺客是潜行和暗杀的专家，在敌人察觉之前就能将其致命一击。作为盗贼的进阶形态，刺客在地下城探索和情报收集方面无人能及。</p>\\n            <ul>\\n                <li><strong>核心能力：</strong>偷袭伤害大幅提升；可以在不被发现的情况下发动致命攻击；解除最复杂的陷阱</li>\\n                <li><strong>代表角色：</strong>克里斯（厄里斯女神的凡间化身）展现了盗贼-刺客线的技能——潜行、偷窃、开锁无一不精</li>\\n            </ul>\\n\\n            <p class=\\"class-desc\\">刺客是盗贼的进阶职业。他们专精于潜行战斗，潜伏在暗影中，等待完美时机攻击敌人的弱点。</p>\\n            <h4>刺客（进阶职业）技能列表（7技能）</h4>\\n            <table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>杂技回避</strong></td><td>判定后</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>3</td><td>每场景SL次</td><td>在回避判定后使用。重新进行该判定。新判定的结果不能被更改。</td></tr>\\n<tr><td><strong>残像术</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>12</td><td>1</td><td>-</td><td>武器攻击命中判定+1d6，回避判定+1d6。此效果持续到场景结束。</td></tr>\\n<tr><td><strong>蝉蜕术</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>每剧本SL次</td><td>进行回避判定时使用。如果回避判定成功，在攻击者的主要阶段结束后，你可以进行1个主要动作（不能攻击）。不能以此方式进行移动动作或次要动作。</td></tr>\\n<tr><td><strong>雾隐术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以在与敌方角色交战时进入潜行状态。</td></tr>\\n<tr><td><strong>要害突刺</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>使用匕首, 每场景1次</td><td>进行武器攻击时使用。该攻击的对象变为单体*，然后计算伤害时视为目标的物理防御和魔法防御为0。此效果持续到主要阶段结束。</td></tr>\\n<tr><td><strong>暗影刃</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>潜行状态</td><td>武器攻击命中判定+1d6，伤害+(SL)×5。</td></tr>\\n<tr><td><strong>暴风突袭</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>8</td><td>3</td><td>每剧本SL次</td><td>进行2次近战速攻。不需支付任何一次速攻的消耗。可以攻击同一目标2次，或攻击2个不同目标各1次。</td></tr>\\n</table>\\n\\n            <div class=\\"note\\"><strong>转职规则：</strong>进阶职业仍可以学习其基础职业的技能（如十字军可学习战士技能，大法师可学习法师技能）。进阶职业不能直接转换为另一个进阶职业（十字军不能直接转为大祭司），但可以先转回基础职业再转换路线。</div>\\n        "},{"i":62,"ch":"第五章","chTitle":"技能系统","title":"扩展职业技能（Arianrhod 2E）","id":"class-homebrew","html":"\\n            <p>以下是来自<strong>Arianrhod 2E扩展规则</strong>的额外职业技能。这些技能不是原版素晴TRPG规则书的内容，而是来自与素晴TRPG兼容的Arianrhod 2E规则书的扩展内容。GM可以自行决定是否允许使用这些技能。</p>\\n            <div class=\\"note\\"><strong>来源标注：</strong>[AR2E勘误]=原版技能的AR2E修正版 | [AR2E扩展]=AR2E新增技能 | [AR2E遗产职业]=遗产职业系统技能 | [Watson]=社区自制 | [Haru]=社区自制</div>\\n            <h5>战士扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>抗性粉碎</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>20m</td><td>7</td><td>5</td><td>-</td><td>对目标进行武器攻击。你的攻击不造成伤害。取而代之，目标的魔法防御减少SLx4（最低为0）。此效果持续到场景结束。暴击：消耗0 [AR2E勘误]</td></tr>\\n</table>\\n<h5>盗贼扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>防御粉碎</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>20m</td><td>7</td><td>5</td><td>-</td><td>对目标进行武器攻击。在伤害掷骰步骤中该攻击不造成伤害。取而代之，目标的物理防御减少SLx5（最低为0）。此效果持续到场景结束。暴击：消耗0 [AR2E勘误]</td></tr>\\n</table>\\n<h5>弓箭手扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>腿击技能</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>5</td><td>5</td><td>-</td><td>对目标进行远程攻击。如果你造成了至少1点伤害，目标的移动力减少SLx5。此效果持续到目标使用一个次要动作结束此效果或场景结束。暴击：增加骰子 [AR2E勘误]</td></tr>\\n<tr><td><strong>箭雨</strong></td><td>Arrow Shower</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>可与箭雨同时使用。此次箭雨的\\"对象：区域（选择）\\"变为\\"对象：场景（选择）\\"。[AR2E扩展]</td></tr>\\n<tr><td><strong>反击射击技能</strong></td><td>反应</td><td>命中判定</td><td>单体</td><td>武器</td><td>3</td><td>3</td><td>每场景SL次</td><td>当目标对你进行远程或魔法攻击时，你可以作为反应使用此技能。使用你装备的武器进行命中判定。如果成功，目标受到CLx5点HP损失。但是，目标的攻击视为自动命中，你将正常受到其效果。[AR2E扩展]</td></tr>\\n<tr><td><strong>冲击射击</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>使用弓</td><td>如果武器攻击对目标造成了至少1点HP伤害，对该目标施加击退(2)。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>拦截</strong></td><td>反应</td><td>命中判定</td><td>单体</td><td>视野</td><td>3</td><td>3</td><td>装备弓，每剧本SL次</td><td>你必须拥有反击射击技能SL1才能学习此技能。当目标对你进行远程或魔法攻击时，你可以作为反应使用此技能。使用你装备的弓进行命中判定。如果成功，取消目标的攻击。[AR2E扩展]</td></tr>\\n<tr><td><strong>强弓技能</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有速射技能SL3才能学习此技能。在赛前准备时，选择一把你已装备或在持有物中的弓。所选武器获得+3重量和+5威力。[AR2E扩展]</td></tr>\\n<tr><td><strong>技巧射击</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>One per scenario</td><td>你必须拥有远距狙击技能SL3才能学习此技能。你的远程攻击造成贯穿伤害。此外，对其进行的反应自动失败，且时机为反应的物品或技能不能因此被激活。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>回收利用</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>8</td><td>1</td><td>-</td><td>在场景结束时可用。将本场景中使用的所有弹药物品归还到你的持有物中。同时，任何投掷过的武器也归还给你，并装备或放回你的持有物中。[AR2E扩展]</td></tr>\\n<tr><td><strong>双箭技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每场景SL次</td><td>在你声明使用弹药物品时可用。消耗你持有物中一个同名的额外弹药物品。所声明物品的效果翻倍。[AR2E扩展]</td></tr>\\n</table>\\n<h5>通用技能扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>集中训练技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择一项基础属性值。该属性值增加+3。你可以多次学习此技能，但每次必须影响不同的基础属性值。[AR2E勘误]</td></tr>\\n<tr><td><strong>信仰：蕾吉娜</strong></td><td>见效果</td><td>自动成功</td><td>见效果</td><td>-</td><td>-</td><td>1</td><td>-</td><td>仅在你成为攻击目标时激活，目标为攻击使用者的一方。如果你因该攻击失去了至少1点HP，目标受到1点HP损失。你不能再获得任何其他信仰技能。[Watson]</td></tr>\\n<tr><td><strong>信仰：沃尔巴奇</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的攻击伤害+2。你不能再获得任何其他信仰技能。[Watson]</td></tr>\\n<tr><td><strong>信仰：泽纳里斯</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你恢复HP或MP的技能现在对\\"类型：不死生物\\"生效。你不能再获得任何其他信仰技能。[Watson]</td></tr>\\n<tr><td><strong>信仰：泽纳里斯（变体）</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>无视黑暗的效果。你不能再获得任何其他信仰技能。在赛前准备时，你可以将[信仰：泽纳里斯（变体）]与[信仰：泽纳里斯]互换。[Watson]</td></tr>\\n<tr><td><strong>赐果技能</strong></td><td>物品</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在赛前准备时，选择：获得三个水果或获得1d6个蔬菜。[AR2E扩展]</td></tr>\\n<tr><td><strong>转卖技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>将所有非敌人掉落获得的装备和物品以75%而非50%的价格出售。但是，GM可以决定此技能不适用。[Haru]</td></tr>\\n<tr><td><strong>屠宰技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的队伍出售的敌人掉落物价值增加10%（最高+50%）。但是，GM可以决定此技能不适用，或将其也应用于其他战利品。[Watson]</td></tr>\\n<tr><td><strong>批量购买专长</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>如果一次购买3个或更多同一种物品，价格减少25%（最低50%）。但是，GM可以决定此技能不适用。[Haru]</td></tr>\\n<tr><td><strong>唇读技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在尝试不通过声音解读他人说话内容时的感知判定中+1d6。[Haru]</td></tr>\\n<tr><td><strong>魔术技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每轮1次</td><td>你必须至少知道5个类型为法术的通用技能。此技能每轮可在准备阶段使用一次，或在你主要阶段作为移动动作或次要动作使用。你选择一个你知道的类型为法术且\\"时机：主要动作\\"的通用技能并立即使用。[Watson]</td></tr>\\n<tr><td><strong>人气艺术家</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须知道[绘画技能]才能学习此技能。在赛前准备时，你获得灵巧×100 KE。[Watson]</td></tr>\\n<tr><td><strong>中间人</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须知道[交涉技能]才能学习此技能。在赛前准备时，你获得感知×100 KE。[Watson]</td></tr>\\n<tr><td><strong>舞蹈技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在有节奏地跳舞时的敏捷判定中+1d6。[Watson]</td></tr>\\n<tr><td><strong>邮递员</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须知道[运动技能]才能学习此技能。在赛前准备时，你获得力量×100 KE。[Watson]</td></tr>\\n<tr><td><strong>表演</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须知道[舞蹈技能]才能学习此技能。在赛前准备时，你获得敏捷×100 KE。[Watson]</td></tr>\\n<tr><td><strong>药剂师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须知道[烹饪技能]才能学习此技能。在赛前准备时，你获得智力×100 KE。[Watson]</td></tr>\\n<tr><td><strong>赞助人</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须知道[畅销书]才能学习此技能。在赛前准备时，你获得幸运×100 KE。[Watson]</td></tr>\\n<tr><td><strong>囤积技能</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>消耗1点祝福。你可以购买一件价格不超过CLx100 KE的物品。此购买可以无视场景、时间或情况进行。例如，使用此技能，你可以在战斗中购买物品。[AR2E扩展]</td></tr>\\n<tr><td><strong>骑术技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>骑乘</td><td>你的回避判定+1。[AR2E扩展]</td></tr>\\n<tr><td><strong>魔眼技能</strong></td><td>主要动作</td><td>感知</td><td>Voir effet</td><td>视野</td><td>-</td><td>1</td><td>每场景1次</td><td>进行DL13的感知判定。如果成功，你得知你视野范围内所有魔法物品的存在。[AR2E扩展]</td></tr>\\n<tr><td><strong>受身技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>如果你受到坠落造成的伤害，你受到的伤害减少1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>武器更换技能</strong></td><td>移动动作</td><td>-</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>你可以将右手槽和/或左手槽中装备的物品替换为持有物中相同槽位的物品。之前装备的物品放入你的持有物中。[AR2E扩展]</td></tr>\\n<tr><td><strong>王室知识技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在与国内外王室和贵族事务相关的智力判定中+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>一饮而尽技能</strong></td><td>清理阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>每场景1次</td><td>你可以使用药水类型的物品。[AR2E扩展]</td></tr>\\n<tr><td><strong>隐秘行动技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>潜行</td><td>你的攻击命中判定+1。[AR2E扩展]</td></tr>\\n<tr><td><strong>动物共感技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以理解并与类型为动物、魔兽的生物沟通。理解的程度由GM决定。[AR2E扩展]</td></tr>\\n<tr><td><strong>夜眼技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你不再受到在黑暗中（或使用亮度规则时，亮度等级1~2）判定的-1d6惩罚。如果存在其他惩罚，你仍然会受到。[AR2E扩展]</td></tr>\\n<tr><td><strong>物品精通技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你使用一个效果中需要失去HP或MP的物品时，减少2点失去量。如果该物品有根据失去量变化的效果，在计算该效果时视为失去量不变。[AR2E扩展]</td></tr>\\n<tr><td><strong>飞行机动技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>飞行</td><td>你的回避判定+1。[AR2E扩展]</td></tr>\\n<tr><td><strong>游泳技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在游泳以及所有与游泳相关的力量判定中+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>封锁技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在对被阻挡交战中的脱离进行反应时，你的行动点数+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>街头智慧技能</strong></td><td>主要动作</td><td>Luck</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>使用幸运进行信息收集。此判定+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>魔法知识技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在与魔法相关知识相关的智力判定中+1d6。（不适用于魔法判定）[AR2E扩展]</td></tr>\\n<tr><td><strong>休息技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>在场景结束时使用。恢复2d6+(CL)点HP和MP。GM可以因场景间没有足够时间休息或情况不允许休息等原因拒绝使用此技能。如果GM拒绝使用，不计入使用次数。[AR2E扩展]</td></tr>\\n<tr><td><strong>超级感知技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在聆听或侦察的感知判定中+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>常规技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以以减少10%的价格（向上取整）获得类型为药水的物品。但是，GM可以决定此技能不适用。[AR2E扩展]</td></tr>\\n<tr><td><strong>警觉技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在尝试发现潜行状态中的角色或尝试保持潜行状态的感知判定中+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>意图</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的最大MP增加CL。你不能同时学习此技能和[活力]。[AR2E扩展]</td></tr>\\n<tr><td><strong>活力</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的最大HP增加CL。你不能同时学习此技能和[意图]。[AR2E扩展]</td></tr>\\n</table>\\n<h5>转生者扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>优化</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在赛前准备时，从你拥有的技能中选择一个技能。该技能的消耗-2（最低1）。[AR2E扩展]</td></tr>\\n<tr><td><strong>异界起源</strong></td><td>被动/创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在角色创建时，你额外获得1点SL用于获取起始职业的技能。你不是转生者，但你仍然来自异世界。[Watson]</td></tr>\\n</table>\\n<h5>原住民扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>怪物本性</strong></td><td>被动/创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你获得此技能时，选择一个时机为创建时的魔王军技能。你获得该技能。[Watson]</td></tr>\\n<tr><td><strong>怪物本性II</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[怪物本性]才能学习此技能。当你获得此技能时，选择一个时机不是创建时的魔王军技能。你获得该技能。[Watson]</td></tr>\\n</table>\\n<h5>红魔族扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>宣告者</strong></td><td>准备阶段</td><td>自动成功</td><td>区域（选择）</td><td>视野</td><td>-</td><td>1</td><td>每场景1次</td><td>你只能在战斗的第一回合使用此技能。目标的行动点数+2，持续到场景结束。你不能选择自己作为此技能的目标。[AR2E扩展]</td></tr>\\n</table>\\n<h5>魔王军扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>魔王军：植物</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>在场景结束时使用。恢复2d6+(CLx3)点HP和MP。GM可以因地面太硬或太贫瘠无法吸收养分，或情况不允许扎根等原因拒绝使用此技能。如果GM拒绝使用，不计入使用次数。<br>弱点：你被视为\\"类型：植物\\"。你不能选择生活方式，被锁定在\\"简朴生活方式\\"（你仍需支付生活方式费用）。你不能受益于据点中影响生活方式的效果。如果据点的设施\\"良好采光\\"或\\"花园\\"处于激活状态，每个设施使你的最大HP+5和最大MP+5。[Watson]</td></tr>\\n<tr><td><strong>魔王军：转生</strong></td><td>被动/创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择此技能时，选择一个\\"魔王军\\"技能和一个\\"转生者\\"技能（须为[时机：创建时]）并获得其效果。对于要求转生者的物品或装备，你被视为[转生者]。你可以像学习自己种族的技能一样学习[转生者]种族中非[时机：创建时]的种族技能。<br>弱点：你的基础幸运减少3。如果因其他\\"魔王军\\"技能存在不同的\\"弱点\\"或\\"类型\\"，该\\"类型\\"也会被应用。[Watson]</td></tr>\\n<tr><td><strong>魔性魅力</strong></td><td>准备阶段</td><td>精神</td><td>单体</td><td>20m</td><td>-</td><td>1</td><td>每场景1次</td><td>你必须是[类型：恶魔]才能学习此技能。目标进行精神对抗判定。如果目标失败，受到击退(1)和眩晕。[Watson]</td></tr>\\n<tr><td><strong>元素之选</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>需要[元素调谐II]才能学习。获得此技能时，选择与[元素调谐II]相同的元素。该元素的魔法攻击伤害+SL×5。[AR2E扩展]</td></tr>\\n<tr><td><strong>元素亲和II</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[元素亲和]才能学习此技能。获得此技能时，选择一个与[元素亲和]所选不同的元素。你现在被视为所选元素的元素亲和者，你对该元素魔法伤害的魔法防御视为两倍。[Watson]</td></tr>\\n<tr><td><strong>独立怪物</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>如果你拥有[魔王之力]、[转生怪物]或作弊[魔王军成员]，则不能学习此技能，学习此技能后也不能获得它们。当你获得此技能时，选择一个[原住民]种族中非[时机：创建时]的技能。你以SL1学习该技能。对于要求原住民的物品或装备，你被视为[原住民]。[Watson]</td></tr>\\n<tr><td><strong>转生怪物</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>如果你拥有[魔王之力]、[独立怪物]或作弊[魔王军成员]，则不能学习此技能，学习此技能后也不能获得它们。当你获得此技能时，选择一个[转生者]种族中非[时机：创建时]的技能。你以SL1学习该技能。对于要求转生者的物品或装备，你被视为[转生者]。[Watson]</td></tr>\\n<tr><td><strong>魔力</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>需要[类型：恶魔]才能学习。你使用的类型为法术的技能消耗-1（最低1）。[AR2E扩展]</td></tr>\\n<tr><td><strong>变形II</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>变形</td><td>你可以从[变形]所选的敌人身上选择最多3项属性值、技能或除HP、MP和作弊以外的任何东西。当你变身为该生物时，你获得该属性值或技能，并在必要时替换你的。GM可以否决所选内容。[Watson]</td></tr>\\n</table>\\n<h5>元素大师扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>使魔</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>获得SL个使魔。只有你可以持有或使用这些物品。你可以获得多个提供同一属性值判定修正的使魔，但同一类型的判定修正同时只能应用一个。在赛前准备时，你可以更换你的使魔，你不可用的使魔重新变为可用。[AR2E扩展]</td></tr>\\n<tr><td><strong>使魔攻击</strong></td><td>主要动作</td><td>感知</td><td>单体</td><td>20m</td><td>5</td><td>5</td><td>拥有使魔</td><td>对目标进行特殊攻击。以感知判定作为命中判定，伤害为(SL+2)d6+CL点贯穿伤害。暴击：增加骰子 [AR2E扩展]</td></tr>\\n<tr><td><strong>使魔强化</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>拥有使魔</td><td>将你使魔的判定修正从+2变为+3。[AR2E扩展]</td></tr>\\n<tr><td><strong>使魔连携</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>9</td><td>1</td><td>每次主要阶段1次</td><td>你必须拥有使魔攻击SL5才能学习此技能。进行一次使魔攻击和另一个时机为主要动作的技能。顺序由你决定。如果愿意，你可以为每个技能选择不同的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>使魔精通</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>拥有使魔</td><td>你的使魔攻击判定+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>使魔撕裂</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>拥有使魔</td><td>你的使魔攻击伤害+SLx3。[AR2E扩展]</td></tr>\\n<tr><td><strong>使魔支援</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>拥有使魔</td><td>当你持有物中有2个或更多使魔时生效。使魔攻击、精神攻击或与使魔连携一起使用时所选技能的判定+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>守护者</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>1</td><td>拥有使魔，每场景1次</td><td>在对目标进行伤害掷骰后可用。目标受到的伤害减少CLx5。但是，你物品栏中的一个使魔变为不可用。如果你有多个使魔，你可以选择哪个变为不可用。[AR2E扩展]</td></tr>\\n<tr><td><strong>放松</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>拥有使魔，每剧本1次</td><td>恢复SLx20 MP。[AR2E扩展]</td></tr>\\n</table>\\n<h5>创造者扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>创造技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的创造技能判定+1d6，包括使用类型为魔像或炼金的武器攻击时的命中判定。你不能同时应用此技能和[武器技能]。[Watson]</td></tr>\\n<tr><td><strong>万灵药</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你使用需要掷骰来决定效果的药水物品时，该掷骰+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>手榴弹材料</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>2</td><td>1</td><td>-</td><td>与\\"手榴弹：~~\\"技能同时使用。你可以将\\"手榴弹：~~\\"技能作为移动动作使用。[AR2E扩展]</td></tr>\\n<tr><td><strong>手榴弹：爆裂</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>1</td><td>使用手榴弹</td><td>你的远程攻击无视目标的物理防御和魔法防御。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>手榴弹：直击</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>使用手榴弹</td><td>将你的远程攻击从\\"对象：区域\\"变为\\"对象：区域（选择）\\"。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>手榴弹：微型</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>使用手榴弹</td><td>你的远程攻击变为\\"对象：单体*\\"，并在伤害中加入你的灵巧值。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>手榴弹：毒气</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>使用手榴弹</td><td>如果攻击造成了至少1点HP伤害，对目标施加中毒(SL)。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>手榴弹：眩晕</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>使用手榴弹</td><td>你的远程攻击伤害+SLx3。如果攻击造成了至少1点HP伤害，对目标施加眩晕。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>掷弹兵</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你从\\"手榴弹\\"获得的手榴弹攻击力+CL。[AR2E扩展]</td></tr>\\n<tr><td><strong>手榴弹</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>获得SLx3个手榴弹。只有你可以使用或装备这些物品。[AR2E扩展]</td></tr>\\n<tr><td><strong>隐藏陷阱</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>5</td><td>-</td><td>你隐藏用\\"陷阱：~~\\"技能制作的陷阱。如果陷阱在激活时仍处于隐藏状态，该陷阱效果的命中判定或DL获得+SLx2。此效果持续到主要阶段结束。[Watson]</td></tr>\\n<tr><td><strong>放大</strong></td><td>主要动作</td><td>智力</td><td>区域（选择）</td><td>近战</td><td>6</td><td>1</td><td>-</td><td>对目标使用你持有物中的一个药水物品。如果目标不想受到该物品的效果，必须成功进行回避判定。如果判定成功，该物品无效。暴击：消耗0。[AR2E扩展]</td></tr>\\n<tr><td><strong>药水投掷</strong></td><td>主要动作</td><td>智力</td><td>单体</td><td>投掷</td><td>3</td><td>1</td><td>-</td><td>对目标使用你持有物中的一个药水物品。如果目标不想受到该物品的效果，必须成功进行回避判定。如果判定成功，该物品无效。暴击：消耗0。[AR2E扩展]</td></tr>\\n<tr><td><strong>合成</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你可以用一个动作使用2个药水物品，并且对于使用药水物品的技能，你可以使用2个药水物品。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>陷阱：手榴弹</strong></td><td>主要动作</td><td>感知</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>使用手榴弹</td><td>你使用一个\\"手榴弹\\"来在你所在的交战区设置陷阱。当非飞行角色进入你陷阱的交战区时，你可以选择激活陷阱（这将打断其移动，即使交战区中没有其他人）。交战区中的所有角色进行DL为(10+你的感知)的幸运判定。你对判定失败者造成使用\\"手榴弹\\"的武器攻击伤害。如果你在放置陷阱时受到\\"手榴弹：~~\\"技能的效果影响手榴弹的交互方式，将该效果应用于陷阱。同一交战区只能放置一个陷阱。此效果持续到激活或场景结束。[Watson]</td></tr>\\n<tr><td><strong>陷阱：药水</strong></td><td>主要动作</td><td>智力</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你使用一个药水物品来在你所在的交战区设置陷阱。当非飞行角色进入你陷阱的交战区时，你可以选择激活陷阱（这将打断其移动，即使交战区中没有其他人）。目标进行DL为(10+你的智力)的幸运判定。如果失败，你对目标应用所使用物品的效果。目标可以选择主动接受该效果。同一交战区只能放置一个陷阱。此效果持续到激活或场景结束。[Watson]</td></tr>\\n<tr><td><strong>陷阱：设置</strong></td><td>主要动作</td><td>感知</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你必须拥有[陷阱攻击]至少SL1才能学习此技能。使用此技能，你可以用[陷阱攻击]在你所在的交战区设置陷阱。当非飞行角色进入你陷阱的交战区时，你可以选择激活陷阱（这将打断其移动，即使交战区中没有其他人）。此时，你对目标使用[陷阱攻击]，即使你不在范围内。如果你在使用此技能时受到[陷阱雷]的效果，将其应用于攻击。同一交战区只能放置一个陷阱。此效果持续到激活或场景结束。对于要求[陷阱攻击]的技能，你可以使用此技能代替[陷阱攻击]。[Watson]</td></tr>\\n</table>\\n<h5>剑士扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>先制</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>你的行动点数+(SLx2)。[AR2E扩展]</td></tr>\\n<tr><td><strong>神经破坏</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>4</td><td>5</td><td>-</td><td>对目标进行武器攻击。如果此攻击造成了至少1点HP伤害，目标的回避判定-(SLx2)。此效果持续到目标使用一个次要动作结束此效果或场景结束。暴击：增加骰子 [AR2E扩展]</td></tr>\\n<tr><td><strong>音爆</strong></td><td>Kamaitachi</td><td>自动成功</td><td>自身</td><td>-</td><td>2</td><td>3</td><td>-</td><td>可与[镰鼬]同时使用。此攻击伤害+(SL)d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>秘方</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以在使用其他武器时使用非被动的剑士技能，这些技能须有[条件：使用匕首、单手剑、双手剑或刀]或[条件：装备匕首、单手剑、双手剑或刀]。但是，以此方式使用的技能消耗+2。无消耗的技能不增加消耗。[AR2E扩展]</td></tr>\\n<tr><td><strong>武士之魂</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>获得SL把[类型：刀]武器。这些物品只能由你使用和装备。在赛前准备时，你可以获得新武器，但不能超过SL把。[类型：刀]武器被视为[类型：单手剑和双手剑]武器，可与需要其中任一类型的技能配合使用。[AR2E扩展]</td></tr>\\n<tr><td><strong>双手攻击技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>装备刀</td><td>你的[装备：单手]的[类型：刀]武器变为[装备：双手]，其[攻击力]+[SLx2]。[AR2E扩展]</td></tr>\\n<tr><td><strong>狂怒</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>使用刀</td><td>直到主要阶段结束，你的武器攻击伤害+(SLx10)。在主要阶段结束时，你用于此攻击的武器被破坏。[AR2E扩展]</td></tr>\\n<tr><td><strong>光辉之刃</strong></td><td>物品</td><td>-</td><td>见效果</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你只有在[武士之魂]至少为SL5时才能学习此技能。你拥有的所有[类型：刀]武器攻击力+5。[AR2E扩展]</td></tr>\\n</table>\\n<h5>骑士扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>拯救攻击</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>4</td><td>1</td><td>-</td><td>对目标进行武器攻击。如果该攻击命中，与目标在同一交战区中你以外的一个选定角色可以选择立即进行脱离。此脱离可以无视被阻挡交战的效果。（失去战斗能力的角色不能使用此技能。）暴击：增加骰子 [AR2E扩展]</td></tr>\\n</table>\\n<h5>枪兵扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>蜂刺</strong></td><td>主要动作</td><td>命中判定</td><td>单体</td><td>武器</td><td>4</td><td>3</td><td>-</td><td>对目标进行武器攻击。此攻击的命中判定获得+(SL+1)d6。暴击：增加骰数。[AR2E扩展]</td></tr>\\n</table>\\n<h5>符文骑士扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>材料成分</strong></td><td>物品</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你对[类型：宝石]物品的使用有更多选择。当你进行魔法攻击时，可以消耗一颗与该攻击魔法伤害属性相同的宝石。你获得+2d6伤害以及通常适用于武器攻击的加值。[AR2E扩展]</td></tr>\\n</table>\\n<h5>大法师扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>传送术（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>区域（选择）</td><td>近战</td><td>20</td><td>5</td><td>One per Scene</td><td>你和所有目标传送至你事先指定的标记点。你最多可拥有SL个标记点。当你提升此技能的SL时，不需要立即创建新的标记点。你可以使用主要动作将你能看到的地点指定为标记点。目标可以拒绝传送。暴击：消耗为0。[AR2E扩展]</td></tr>\\n</table>\\n<h5>贤者扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>忠告</strong></td><td>判定前</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>5</td><td>每剧本SL+1次</td><td>在目标进行判定前可使用。该判定获得+1d6。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>属性</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>当你使用对目标弱点属性造成魔法伤害的攻击时可使用。该攻击获得+SLx4伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>生物学</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>学习此技能时，选择一个敌人[类型]并记录为[生物学：恶魔]等。你对所选[类型]敌人的魔法攻击获得+[SLx4]伤害。你可以为不同的[类型]多次学习此技能。每次学习视为独立技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>生物学专家</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>学习此技能时，选择你拥有的一个[生物学：~~]技能并记录为[生物学专家：恶魔]等。所选技能的效果现在适用于所有攻击而不仅是魔法攻击。你可以多次学习此技能。每次学习视为独立技能。[Watson]</td></tr>\\n<tr><td><strong>书签</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>每剧本SL次</td><td>使用此技能时，选择一个敌人[类型]。将你一个[生物学：~~]（以及关联的[生物学专家：~~]，如适用）技能所指定的种族替换为所选[类型]。但是，你不能有多个指定相同[类型]的[生物学：~~]技能。此效果持续到本场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>属性破坏</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>每剧本SL次</td><td>在魔法攻击的判定前可使用。计算此攻击的HP伤害时，视目标对该攻击的[属性]为弱点。即使目标无属性或与攻击属性相同也适用。[AR2E扩展]</td></tr>\\n<tr><td><strong>一致</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你进行敌情识别时，可以将该行动视为[目标：场景（选择）]和[射程：视野]并拥有更多目标。你只进行一次判定，并与每个目标的识别难度进行比较。[AR2E扩展]</td></tr>\\n<tr><td><strong>拆解</strong></td><td>准备阶段</td><td>智力</td><td>单体</td><td>20m</td><td>8</td><td>5</td><td>-</td><td>目标进行智力对抗判定。如果你成功，直到本回合结束，目标的[物理防御]和[魔法防御]减少SLx3（最小为0）。[AR2E扩展]</td></tr>\\n<tr><td><strong>高效技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>每当法术需要你掷骰进行攻击、恢复HP/MP或增减伤害时，该掷骰获得+SLx2。[AR2E扩展]</td></tr>\\n<tr><td><strong>百科全书</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>进行敌情识别判定。此技能允许你在准备阶段进行敌情识别。[AR2E扩展]</td></tr>\\n<tr><td><strong>博学</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你为基于智力的判定增加奖励骰的一般技能，由+1d6变为+2d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>发现</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当隐匿角色进入场景时，你立即察觉。你不会知道该角色的名字或位置，但你知道有人处于隐匿状态。此外，如果你成功通过判定定位隐匿角色，对该角色施加恍惚状态。[AR2E扩展]</td></tr>\\n<tr><td><strong>追击</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>5</td><td>5</td><td>每场景SL次</td><td>可在目标受到HP伤害时使用。目标受到你装备的斗篷中一件的威力值的HP损失。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>高级属性</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>只有当你的[属性]至少为SL5时才能学习此技能。每当你进行对目标弱点[属性]造成魔法伤害的攻击时，该攻击获得+SLx5伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>高级智慧</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>你的智力判定获得+SLx2。[AR2E扩展]</td></tr>\\n<tr><td><strong>学识优势</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>你对已成功识别的敌人（由你或你的队伍识别）的攻击获得+(SL)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>完美记忆</strong></td><td>判定后</td><td>自动成功</td><td>单体</td><td>近战</td><td>4</td><td>1</td><td>每场景1次</td><td>在目标进行情报收集判定后可使用。以相同骰数重掷该判定。目标可以拒绝此技能，此时此次使用不计入使用次数限制。[AR2E扩展]</td></tr>\\n<tr><td><strong>预知</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[忠告]SL5才能学习此技能。将[忠告]效果提供的修正值从+1d6改为+2d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>快速搜索</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>Once per Setup Process</td><td>使用[百科全书]和一个[时机：准备阶段]的技能。你可以选择使用的顺序，并可以为每个技能选择不同的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>逆转</strong></td><td>判定后</td><td>自动成功</td><td>单体</td><td>20m</td><td>10</td><td>3</td><td>每场景1次</td><td>在目标进行判定后可使用。该判定的结果减少SLx3（最小为1）。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>宝物狂</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>视野</td><td>-</td><td>1</td><td>每场景1次</td><td>你可以在目标进行战利品掷骰前使用此技能。该掷骰获得+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>杂学列表</strong></td><td>判定后</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>每场景1次</td><td>在你进行判定前可使用。你可以将该判定替换为智力判定。[AR2E扩展]</td></tr>\\n<tr><td><strong>真实视觉</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你成功进行敌情识别时，除了通常获得的信息外，你还能得知目标的[物理防御]和[魔法防御]的精确数值。[AR2E扩展]</td></tr>\\n<tr><td><strong>要害</strong></td><td>Weak Point</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>与[弱点]同时使用。[弱点]获得额外效果：[对该目标的攻击获得+1d6伤害]。[AR2E扩展]</td></tr>\\n<tr><td><strong>弱点</strong></td><td>准备阶段</td><td>智力</td><td>场景（选择SL）</td><td>20m</td><td>8</td><td>3</td><td>-</td><td>对你已成功识别的敌人可使用。目标进行智力对抗判定。如果你成功，目标的反应获得-1d6。此效果持续到本回合结束。[AR2E扩展]</td></tr>\\n</table>\\n<h5>吟游诗人扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>饰品更换</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>将你的饰品和其他防具栏位的装备与持有物中相同栏位的装备交换。如果相应装备栏位为空，你可以直接从持有物中装备合适的物品。将之前装备的物品放入持有物。[AR2E扩展]</td></tr>\\n<tr><td><strong>伴奏</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>8</td><td>3</td><td>每场景SL次</td><td>你必须拥有[葡萄藤]SL1才能学习此技能。当目标使用[时机：准备阶段]且[目标：自身]的舞者或弄臣技能时可使用。将所使用技能的SL视为比实际值高2。此增加可以超过技能的最大SL。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>快板</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>你的吟唱判定获得+SLx2。[AR2E扩展]</td></tr>\\n<tr><td><strong>颂歌（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>6</td><td>1</td><td>-</td><td>你必须拥有[挽歌]SL5才能学习此技能。使用此技能时，选择一个属性。直到本回合结束，每当目标将受到所选属性的魔法伤害时，该伤害减少SLx10。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>叙事诗（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>6</td><td>5</td><td>-</td><td>使用此技能时，选择物理防御或魔法防御。直到本场景结束，目标获得所选属性+SLx2。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>卡农（吟唱）</strong></td><td>见效果</td><td>自动成功</td><td>单体</td><td>20m</td><td>-</td><td>3</td><td>每场景SL次</td><td>当目标使用祝福来增强掷骰时可使用。消耗1点祝福。目标的掷骰获得+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>随想曲（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>4</td><td>5</td><td>-</td><td>目标的行动点数增加+SLx2。此效果持续到场景结束。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>颂歌（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>10</td><td>3</td><td>-</td><td>需要[挽歌]SL5才能学习。使用此技能时选择一种元素。直到本回合结束，该元素的所有魔法攻击伤害+CL×2。[AR2E扩展]</td></tr>\\n<tr><td><strong>不协和音（吟唱）</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>单体</td><td>20m</td><td>4</td><td>5</td><td>每轮1次</td><td>在目标进行攻击的伤害掷骰前可使用。该攻击获得+(SL)d6。你代替目标掷额外的骰子。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>练习曲（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>4</td><td>5</td><td>-</td><td>目标进行的攻击获得+SLx2伤害。此效果持续到场景结束。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>战歌（吟唱）</strong></td><td>准备阶段</td><td>自动成功</td><td>单体*</td><td>20m</td><td>-</td><td>1</td><td>每剧本1次</td><td>如果目标已用尽一个[条件：每剧本~~次]技能的所有使用次数，你可以赋予该技能一次额外使用。你只能以此方式刷新1个技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>强音</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>2</td><td>5</td><td>-</td><td>当你使用施加减益效果的[类型：吟唱]技能时可使用。该技能造成额外的SLx3点HP损失。[AR2E扩展]</td></tr>\\n<tr><td><strong>咒歌</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>与[类型：吟唱]且[目标：区域]的技能同时使用。将该技能改为[目标：区域（选择）]。[AR2E扩展]</td></tr>\\n<tr><td><strong>葡萄藤</strong></td><td>主要动作</td><td>精神</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>使用精神进行情报收集判定。该判定获得+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>即兴曲</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>7</td><td>1</td><td>每场景1次</td><td>在你进行判定前可使用。将该判定替换为吟唱判定。[AR2E扩展]</td></tr>\\n<tr><td><strong>翻译家</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你为基于精神的判定增加奖励骰的一般技能，由+1d6变为+2d6。[Watson]</td></tr>\\n<tr><td><strong>欢乐颂（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>单体*</td><td>20m</td><td>7</td><td>3</td><td>每场景SL次</td><td>如果目标处于疲劳状态，其变为就绪状态。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>终曲（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>单体</td><td>20m</td><td>8</td><td>1</td><td>每剧本1次</td><td>当目标陷入K.O时可使用。目标从K.O中恢复并恢复HP至最大HP。然后，目标变为疲劳状态，你变为K.O。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>大声歌唱（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>5</td><td>1</td><td>-</td><td>对目标施加失衡状态。[AR2E扩展]</td></tr>\\n<tr><td><strong>摇篮曲（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>5</td><td>1</td><td>-</td><td>对目标施加眩晕状态。[AR2E扩展]</td></tr>\\n<tr><td><strong>牧歌（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>6</td><td>3</td><td>-</td><td>目标进行主要动作时的判定获得+SLx2。此效果持续到场景结束。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>进行曲（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>4</td><td>5</td><td>-</td><td>目标的移动力获得+SLx2。此效果持续到场景结束。暴击：消耗为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>玛祖卡</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每场景1次</td><td>你必须拥有[叙事诗]SL5才能学习此技能。与[时机：主要动作]且[判定：吟唱]且[类型：吟唱]的技能同时使用。该技能变为[目标：场景（选择）]和[射程：视野]。[AR2E扩展]</td></tr>\\n<tr><td><strong>旋律圣歌（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>-</td><td>1</td><td>每剧本1次</td><td>目标恢复3d6+(CLx3)点MP。你不能选择自己为此技能的目标。暴击：增加骰数。[AR2E扩展]</td></tr>\\n<tr><td><strong>清唱剧（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>8</td><td>1</td><td>-</td><td>目标从所有困扰其的减益效果中恢复。[AR2E扩展]</td></tr>\\n<tr><td><strong>波尔卡（吟唱）</strong></td><td>准备阶段</td><td>自动成功</td><td>区域</td><td>20m</td><td>-</td><td>1</td><td>每剧本1次</td><td>目标进行战斗移动。但是，此时不能脱离交战。目标可以选择移动的方向。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>快速歌唱</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>3</td><td>每场景SL次</td><td>你必须拥有[快板]SL5才能学习此技能。与[时机：主要动作]且[判定：吟唱]且[类型：吟唱]的技能同时使用。你可以在本准备阶段使用该技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>安魂曲（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>5</td><td>1</td><td>-</td><td>对目标施加威压状态。[AR2E扩展]</td></tr>\\n<tr><td><strong>挽歌（吟唱）</strong></td><td>主要动作</td><td>吟唱</td><td>区域</td><td>20m</td><td>10</td><td>5</td><td>每剧本SL次</td><td>使用此技能时，选择一个属性。直到本场景结束，目标的属性变为所选属性。暴击：消耗为0。[AR2E扩展]</td></tr>\\n</table>\\n<h5>舞者扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>杂技演员</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你为基于敏捷的判定增加奖励骰的一般技能，由+1d6变为+2d6。[Watson]</td></tr>\\n<tr><td><strong>空中连击</strong></td><td>主要动作</td><td>命中判定(Dance)</td><td>单体</td><td>近战</td><td>7</td><td>5</td><td>飞行</td><td>对目标进行近战攻击。该攻击的命中判定获得+1d6，伤害获得+SLx3。暴击：增加骰数。[AR2E扩展]</td></tr>\\n<tr><td><strong>应用</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>恢复CLx5点MP。[AR2E扩展]</td></tr>\\n<tr><td><strong>盔甲更换</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>将你的头部和身体栏位的装备与持有物中相同栏位的装备交换。如果相应装备栏位为空，你可以直接从持有物中装备合适的物品。将之前装备的物品放入持有物。[AR2E扩展]</td></tr>\\n<tr><td><strong>闪舞</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>5</td><td>-</td><td>与回避判定同时使用。该判定的结果获得+SL。如果判定成功，你可以向任意方向移动5m，或进行撤退。但是，如果你与敌人处于被阻挡交战状态，你不能使用此技能撤退。[AR2E扩展]</td></tr>\\n<tr><td><strong>伴舞</strong></td><td>判定前</td><td>自动成功</td><td>单体</td><td>近战</td><td>4</td><td>3</td><td>每场景SL次</td><td>你必须拥有[舞者优雅]才能学习此技能。在目标进行吟唱或表演判定前可使用。该判定获得+2d6。你不能选择自己为此技能的目标。[AR2E扩展]</td></tr>\\n<tr><td><strong>驱散舞步</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每剧本SL次</td><td>你必须拥有[技巧舞步]SL5才能学习此技能。在对你的攻击进行伤害掷骰后可使用。该伤害减少CLx10。[AR2E扩展]</td></tr>\\n<tr><td><strong>战斗舞步</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>只要你处于[舞步：~~]技能的效果下，你的回避判定获得+SL，且你的攻击的命中判定和伤害均获得+SL。[AR2E扩展]</td></tr>\\n<tr><td><strong>舞者优雅</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以用敏捷判定代替力量判定进行跳跃。你也可以将跳跃作为撤退而非全力移动，此时DL增加5。在被阻挡交战状态下你不能这样做，除非先通过对抗判定。[Watson]</td></tr>\\n<tr><td><strong>舞之英雄</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每场景1次</td><td>在你进行判定前可使用。该判定获得+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>死亡之舞</strong></td><td>主要动作</td><td>自动成功</td><td>单体</td><td>20m</td><td>12</td><td>5</td><td>每剧本SL次</td><td>目标的武器攻击只要在命中判定中掷出至少一个6即视为暴击。增加的骰数按正常计算（例如一个6=一颗额外骰；两个6=两颗额外骰，以此类推）。此效果持续到目标获得暴击或场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>效果跳过</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>-</td><td>在你进行判定前可使用。如果你受到任何来自技能/物品等（基础效果或作弊除外）会减少此次判定掷骰数的效果影响，你可以在忽略这些效果的情况下进行判定。[AR2E扩展]</td></tr>\\n<tr><td><strong>鼓励</strong></td><td>先攻阶段</td><td>自动成功</td><td>单体</td><td>20m</td><td>6</td><td>1</td><td>每场景1次</td><td>对就绪状态的角色可使用。目标可以在先攻阶段进行其主要阶段。（之后变为疲劳状态）。目标可以拒绝此技能的效果，此时此次使用不计入使用次数限制。[AR2E扩展]</td></tr>\\n<tr><td><strong>死亡入场</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你必须拥有[死亡之舞]SL5才能学习此技能。与[死亡之舞]同时使用。你可以在准备阶段使用[死亡之舞]。[AR2E扩展]</td></tr>\\n<tr><td><strong>羽触</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>进入飞行状态并进行战斗移动。你不必移动。此飞行状态持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>强拍</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>-</td><td>只要你的HP与最大HP相等即生效。你的攻击获得+(SL)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>主角</strong></td><td>判定后</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>在你进行[舞之英雄]的判定后可使用。以相同骰数重掷该判定。[AR2E扩展]</td></tr>\\n<tr><td><strong>斗牛士</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>5</td><td>-</td><td>在你进行回避判定前可使用。该判定获得+SL+1。[AR2E扩展]</td></tr>\\n<tr><td><strong>快速舞步</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你可以使用2个[舞步：~~]技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>再生节奏</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>10</td><td>1</td><td>每场景1次</td><td>你必须拥有[强拍]SL1才能学习此技能。恢复CLx5点HP。[AR2E扩展]</td></tr>\\n<tr><td><strong>空翻</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>每场景SL次</td><td>与[羽触]、[风之跃]或[空中支援]同时使用。在这些效果的移动过程中，你的移动力获得+10。[AR2E扩展]</td></tr>\\n<tr><td><strong>舞步：暗</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>直到本场景结束，你的回避判定获得+SLx2。[AR2E扩展]</td></tr>\\n<tr><td><strong>舞步：地</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>-</td><td>直到本场景结束，你的物理防御和魔法防御获得+SLx3。[AR2E扩展]</td></tr>\\n<tr><td><strong>舞步：火</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>3</td><td>-</td><td>直到本场景结束，你的攻击获得+SLx3伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>舞步：光</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>-</td><td>直到本场景结束，你的行动点数获得+SLx3。[AR2E扩展]</td></tr>\\n<tr><td><strong>舞步：水</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>-</td><td>直到本场景结束，你的攻击的命中判定获得+SLx2。[AR2E扩展]</td></tr>\\n<tr><td><strong>舞步：风</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>-</td><td>直到本场景结束，你的移动力获得+SLx5。[AR2E扩展]</td></tr>\\n<tr><td><strong>触即离</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>每场景1次</td><td>你必须拥有[空中连击]SL5才能学习此技能。在使用了[空中连击]的主要阶段后可使用。向任意方向移动5m或撤退。如果你撤退，可以忽略被阻挡交战的效果。[AR2E扩展]</td></tr>\\n<tr><td><strong>技巧舞步</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>5</td><td>-</td><td>在对你进行的武器攻击的伤害掷骰后可使用。该伤害减少SLx3。[AR2E扩展]</td></tr>\\n<tr><td><strong>战舞</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>你可以用敏捷代替灵巧进行武器攻击的命中判定。你的武器攻击也视为舞蹈，用于增加舞蹈判定的技能。此效果持续到主要阶段结束。[Watson]</td></tr>\\n</table>\\n<h5>狂战士扩展技能（Arianrhod 2E）</h5>\\n<table>\\n<tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr>\\n<tr><td><strong>怒暴</strong></td><td>准备阶段</td><td>力量</td><td>区域（选择）</td><td>近战</td><td>-</td><td>3</td><td>每场景1次</td><td>目标进行精神对抗判定。此判定的最终得分获得+SLx2。如果你赢得判定，目标陷入激怒状态。[AR2E扩展]</td></tr>\\n<tr><td><strong>怒战</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用双手武器</td><td>对处于激怒状态的目标进行攻击时有效。你的近战攻击获得+10伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>孤注一掷</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>5</td><td>-</td><td>你的武器攻击伤害获得+SLx3。但是，进行反应判定时少掷一颗骰子。此效果持续到你宣布结束或场景结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>大挥击</strong></td><td>移动动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>使用双手武器</td><td>你的近战攻击获得+(SL)d6伤害。此效果持续到本主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>肉体大脑</strong></td><td>见效果</td><td>自动成功</td><td>见效果</td><td>See effect</td><td>-</td><td>3</td><td>每场景SL次</td><td>当你受到对手的HP伤害时可使用。当本主要阶段结束时，你可以对伤害你的敌人进行敌情识别判定。使用力量作为此判定的属性。[AR2E扩展]</td></tr>\\n<tr><td><strong>残暴爆发</strong></td><td>自由动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每剧本1次</td><td>你必须拥有[残暴生命]SL5才能学习此技能。在怒战效果下可使用。直到本场景结束，你的HP和最大HP增加SLx20。此效果结束时，将你的HP设为1。[AR2E扩展]</td></tr>\\n<tr><td><strong>残暴吸取</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>3</td><td>-</td><td>在[怒战]效果下可使用。每当你进行近战攻击且造成至少1点HP伤害时，恢复SLx5点HP。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>残暴生命</strong></td><td>清理阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>5</td><td>-</td><td>在怒战效果下可使用。恢复SLx3点HP。你只能在战斗中使用此技能。[AR2E扩展]</td></tr>\\n<tr><td><strong>残暴移动</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>每场景SL次</td><td>在怒战效果下可使用。当你的攻击使目标K.O或死亡时可使用。本主要阶段结束后，你可以进行战斗移动或撤退。[AR2E扩展]</td></tr>\\n<tr><td><strong>残暴打击</strong></td><td>见效果</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>使用双手武器，每场景1次</td><td>在怒战效果下可使用。与近战攻击同时使用。计算此攻击的伤害时，将敌人的物理防御和魔法防御视为0。[AR2E扩展]</td></tr>\\n<tr><td><strong>混战技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你的交战中有2名或更多敌人时可使用。你对交战中角色进行的近战攻击获得+[2×交战中敌人数]伤害。即使攻击只命中1个目标，此加值也适用。[AR2E扩展]</td></tr>\\n<tr><td><strong>冷却奔跑技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[孤注一掷]SL5才能学习此技能。无效化[孤注一掷]的-1d6反应惩罚。（对[怒战]无效）。[AR2E扩展]</td></tr>\\n<tr><td><strong>交叉反击</strong></td><td>反应</td><td>自动成功</td><td>单体</td><td>武器</td><td>-</td><td>3</td><td>装备双手武器，SL times per Scene.</td><td>作为反应，对你进行的近战攻击可使用。目标受到等于你一把装备武器威力的HP损失。此技能作为反应对抗的攻击视为自动命中，你正常承受其效果。[AR2E扩展]</td></tr>\\n<tr><td><strong>激魂</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每剧本SL次</td><td>你必须拥有[孤注一掷]至少SL1才能学习此技能。判定前可用。该判定获得+[你的孤注一掷SL]。[AR2E扩展]</td></tr>\\n<tr><td><strong>致命终结</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>每场景1次</td><td>当你的攻击使敌人陷入K.O或死亡时可用。直到场景结束前，你的攻击获得+(SL+1)d6伤害。[AR2E扩展]</td></tr>\\n<tr><td><strong>边缘精通</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>处于狂战士效果下时可用。你的[时机：移动动作、次要动作、主要动作]技能消耗-1（最小1）。[AR2E扩展]</td></tr>\\n<tr><td><strong>边缘冲击</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>处于狂战士效果下时可用。每当你的近战攻击造成至少1点HP伤害时，对目标施加眩晕。[AR2E扩展]</td></tr>\\n<tr><td><strong>边缘挥击</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>处于狂战士效果下时可用。你的近战攻击命中判定获得+1d6。[AR2E扩展]</td></tr>\\n<tr><td><strong>边缘领域</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>如果你在近战攻击中掷出暴击，在暴击添加的骰子之外，再为该攻击额外添加+2d6伤害骰。[AR2E扩展]</td></tr>\\n<tr><td><strong>压制</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[孤注一掷]至少SL1才能学习此技能。将[孤注一掷]的效果从“你的武器攻击获得+SLx3伤害”改为“你的攻击获得+SLx3伤害”。[AR2E扩展]</td></tr>\\n<tr><td><strong>追击</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>单体</td><td>近战</td><td>-</td><td>3</td><td>装备双手武器，SL times per Scenario.</td><td>可在目标受到HP伤害时使用。目标受到你装备的斗篷中一件的威力值的HP损失。[AR2E遗产职业]</td></tr>\\n<tr><td><strong>灵魂炽热</strong></td><td>Last Resort</td><td>自动成功</td><td>自身</td><td>-</td><td>3</td><td>3</td><td>孤注一掷</td><td>你获得狂战士(SL+1)。你可以忽略保护你免受减益的效果来应用此效果。\\n在狂战士(n)效果下，你的攻击获得+(n)d6伤害。但是，你进行的任何反应自动失败，且你不能使用任何通常作为反应使用的技能、作弊或物品。你可以使用次要动作移除此减益，或在场景结束时自动恢复。[AR2E扩展]</td></tr>\\n<tr><td><strong>速挥技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>3</td><td>装备双手武器</td><td>你装备的双手武器行动修正增加SLx3（最大0）。[AR2E扩展]</td></tr>\\n<tr><td><strong>张力打击</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有[胜利之血]SL5才能学习此技能。当你的攻击使角色陷入K.O或死亡时可用。恢复CLx10 HP。[AR2E扩展]</td></tr>\\n<tr><td><strong>双手打击</strong></td><td>次要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>6</td><td>3</td><td>使用双手武器，每场景SL次</td><td>每当你进行近战攻击且造成至少1点HP伤害时，你可以将目标向任意方向移动最多10m。你可以强制目标离开交战。你可以忽略被阻挡交战规则进行此移动。此效果持续到主要阶段结束。[AR2E扩展]</td></tr>\\n<tr><td><strong>双手握持技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>装备斧/钝器/枪</td><td>你装备的[槽位：单手]武器变为[槽位：双手]，并获得+2攻击力。[AR2E扩展]</td></tr>\\n<tr><td><strong>胜利之血</strong></td><td>见效果</td><td>自动成功</td>

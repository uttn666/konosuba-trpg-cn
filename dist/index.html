axSL":"1","usage":"-","effect":"对“类型：植物”目标可使用。目标对你的魔法判定进行精神对抗判定。如果你成功，目标将变为消耗、被安抚，并听从你的命令。如果目标不是杂兵或额外角色，他们可以忽略此效果。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"德鲁伊","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你为基于感知的判定增加奖励骰的通用技能增加+2d6而非+1d6。","srcTag":"Watson","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"农夫专长","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"学习此技能时，选择一个“类型：动物、植物、魔兽”的怪物，然后将此技能命名为“农夫专长：”等。此技能影响该怪物的所有变种。你对所选怪物进行的所有判定获得+1d6。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"农夫之胃","timing":"主要动作","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"3","usage":"-","effect":"消耗3个不同名称的“食物”物品来换取SL个“农夫之乐”。“农夫之乐”是一种恢复2d6+3 HP和MP的食物，在技能和物品效果中算作“肉类”、“水果”和“蔬菜”。在本剧本结束时，未使用的“农夫之乐”将消失。","srcTag":"Watson","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"农夫幻步","timing":"见效果","check":"自动成功","target":"单体","range":"-","cost":"3","maxSL":"1","usage":"-","effect":"可与移动同时使用。此次移动获得+5移动力。在此移动期间，你可以忽略有“类型：动物、植物、魔兽”角色存在的被阻挡交战的效果，且穿过有“类型：动物、植物、魔兽”角色的交战不会导致你的移动结束。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"农夫风暴","timing":"移动动作","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"每剧本1次","effect":"你必须拥有[猎人技艺]SL5才能学习此技能。在[猎人技艺]效果下可使用。你的攻击变为“目标：场景（选择）”和“射程：视野”。但是，你只能以此方式指定“类型：动物、植物、魔兽”为目标。此效果持续到本主要阶段结束。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"偏爱农具","timing":"物品","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"Weapon equipped","effect":"在准备阶段，选择一把“类型：鞭、矛或斧”的特定武器指定为你的偏爱武器。同时只能有一把偏爱武器。当该偏爱武器被装备时，所有命中判定的最终结果+1。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"园丁直觉","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"5","usage":"-","effect":"对“类型：动物、植物、魔兽”目标进行命中判定时，最终结果+SLx2。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"收获（法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"12","maxSL":"3","usage":"每场景SL次","effect":"对“类型：植物”目标有效。对目标进行魔法攻击。该攻击对目标造成2d6+CLx10贯穿伤害。如果该攻击将目标的HP降至0或以下，立即在该目标的战利品表上掷两次并获得两件物品。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"猎人技艺","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"5","usage":"-","effect":"当你装备了“装备栏：单手”武器，且同时没有装备其他武器或盾牌时有效。你的攻击获得+SLx2伤害。此外，你获得物理防御+SLx2和魔法防御+SL。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"大师技艺","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你必须拥有[猎人技艺]SL5才能学习此技能。在[猎人技艺]或[偏爱农具]效果下有效。你与“类型：动物”相关的农夫技能现在对“类型：魔兽、龙”生效，与“类型：植物”相关的农夫技能现在对“类型：人造”生效，使这些技能可以影响这些类型的生物。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"槲寄生之力（法术）","timing":"准备阶段","check":"自动成功","target":"单体","range":"20m","cost":"5","maxSL":"5","usage":"每场景1次","effect":"目标进行的武器攻击获得+SLx5伤害。此效果持续到本轮结束。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"槲寄生活力（法术）","timing":"Cleanup Phase","check":"自动成功","target":"单体","range":"近战","cost":"5","maxSL":"1","usage":"每场景1次","effect":"目标恢复3d6+CLx2 HP。你不能选择自己为此技能的目标。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"滋养（法术）","timing":"准备阶段","check":"魔法判定","target":"单体","range":"20m","cost":"6","maxSL":"1","usage":"-","effect":"只能对“类型：动物、植物、魔兽”目标使用。目标的行动点数+5，直到场景结束。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"掠食感知","timing":"准备阶段","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"1","usage":"每场景1次","effect":"当你对“类型：动物、植物、魔兽”目标进行攻击时，该攻击将感知加到伤害上。此效果持续到本轮结束。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"试探攻击","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"6","maxSL":"1","usage":"-","effect":"你必须拥有[感知敌人]SL1才能学习此技能。可与攻击同时使用。无论是否命中，在本主要阶段结束时，对攻击目标进行敌情识别判定。如果有多个目标，分别对每个目标进行判定，使用各自不同的识别难度。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"反射射击","timing":"反应","check":"Dodge Check","target":"自身","range":"-","cost":"11","maxSL":"3","usage":"每剧本SL次","effect":"你必须拥有[园丁直觉]SL5以及[偏爱农具]SL1或[猎人技艺]至少SL1才能学习此技能。在[猎人技艺]或[偏爱农具]效果下可使用。作为对允许回避判定的攻击的反应可使用。使用你的感知进行回避判定。如果你在回避判定中成功，将该攻击视为命中攻击者。攻击者对自己进行伤害掷骰。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"扎根姿态","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"6","maxSL":"3","usage":"-","effect":"如果你将受到失衡或击退减益效果，其效果等级减少SLx2（最小0）。如果效果等级为0或没有效果等级，不受到相应的减益效果。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"围剿","timing":"主要动作","check":"Action Point","target":"Area (SLx2)","range":"10m","cost":"6","maxSL":"3","usage":"Whip，Spear or Axe equipped","effect":"目标与你进行行动点数对抗判定。如果你成功，目标进入你的交战（如果尚未在交战中），获得-SLx5行动点数，且交战变为被阻挡。此效果持续到本轮结束。目标的判定视为进行撤退，你的判定视为阻止撤退，并应用相应效果。","srcTag":"Watson","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"采种","timing":"次要动作","check":"自动成功","target":"单体","range":"10m","cost":"10","maxSL":"1","usage":"每场景1次","effect":"使用农夫的专业知识，从“类型：植物”目标处获得可种植生长的种子或根。目标兼容性和最终结果由GM决定。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"感知敌人","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你可以使用感知进行敌情识别判定。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"屠杀（法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"12","maxSL":"3","usage":"每场景SL次","effect":"对“类型：动物”目标有效。对目标进行魔法攻击。该攻击对目标造成2d6+CLx10贯穿伤害。如果该攻击将目标的HP降至0或以下，立即在该目标的战利品表上掷两次并获得两件物品。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"耕地","timing":"主要动作","check":"力量","target":"见效果","range":"近战","cost":"6","maxSL":"3","usage":"-","effect":"选择一个(SLx5)米半径的区域并翻起那里的地面。对区域内任何非飞行目标有效。目标进行灵巧对抗判定。如果你成功，它们受到失衡和击退(SL)减益效果。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"老练农夫","timing":"判定后","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"3","usage":"每场景SL次","effect":"你必须拥有三个不同的“农夫专长”技能才能学习此技能。在对“类型：动物、植物、魔兽”目标进行判定后可使用。以相同骰数重掷该判定。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"警告","timing":"判定前","check":"自动成功","target":"单体","range":"20m","cost":"6","maxSL":"1","usage":"-","effect":"在目标进行感知判定前可使用。该判定获得+1d6。你不能选择自己为此技能的目标。","srcTag":"AR2E扩展","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"热情种植","timing":"主要动作","check":"命中判定","target":"Area (SLx2)","range":"近战","cost":"12","maxSL":"3","usage":"-","effect":"用你的武器进行近战攻击。如果你对目标造成至少1点HP伤害，目标被种在地上无法移动，直到场景结束或使用主要动作成功通过DL16的力量判定。","srcTag":"Haru","nameEn":"","cls":"农夫","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"亡灵盟友","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"死灵法师","effect":"允许使用者与一个被安抚的“类型：不死”目标永久结盟。你可以以自由动作向盟友发出基本口头命令。盟友响应命令进行的所有判定获得+1d6。被归类为杂兵的盟友由GM决定算作一个单位。你同时只能拥有一个永久盟友单位。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"魔石保存技能","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"5","usage":"每剧本SL次","effect":"与你使用“魔石”物品时同时使用。该物品照常生效，但不消耗。对“魔石(XL)”无效。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"尸体保存技能","timing":"见效果","check":"自动成功","target":"自身","range":"视野","cost":"15","maxSL":"1","usage":"Create Undead","effect":"在场景结束时使用此技能。一个由[创造亡灵]创造的盟友怪物不会消失。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"暗炼金技能","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"5","usage":"SLx2 times per Scenario","effect":"与你使用“治疗药水”物品时同时使用。治疗量-1d6，但现在对“类型：不死”有效。该效果可以以次要动作在不使用治疗药水的情况下应用，并交给他人稍后使用，但在这种情况下，该物品在本剧本结束时消失。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"暗面技能","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你的暗属性法术或死灵法师法术的魔法判定+2。暗属性法术或死灵法师法术的消耗-1（最小1）。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"掘墓技能","timing":"见效果","check":"-","target":"自身","range":"-","cost":"-","maxSL":"3","usage":"每场景SL次","effect":"在你使用使你失去死亡生物战利品的技能时可使用。你不会失去对基础生物进行战利品掷骰的机会。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"力能技能","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"5","usage":"-","effect":"在你进行造成虚空魔法伤害的魔法攻击时生效。该攻击的伤害+SLx4。","srcTag":"AR2E扩展","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"潜力技能","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"3","usage":"-","effect":"你的最大MP增加SL×5。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"自我控制","timing":"次要动作","check":"自动成功","target":"自身","range":"-","cost":"4","maxSL":"1","usage":"-","effect":"你用魔法操控你的身体。当你需要进行武器攻击的命中判定，或力量判定或灵巧判定时，你改为进行魔法判定。该效果持续到本轮结束。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"缠绕","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"在你使用“外部召唤”时可使用。该技能变为“目标：单体*”且消耗-2（最小1）。","srcTag":"AR2E扩展","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"创造亡灵（法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"15","maxSL":"3","usage":"-","effect":"只能对不是“类型：不死”且未被掠夺的死亡生物使用（使用此技能时你失去战利品）。创造一个服从并听命于你的“类型：不死”盟友怪物。创造的怪物根据此技能的SL选择，在“幽灵(SL1)”、“骷髅(SL2)”或“僵尸(SL3)”之间选择。此技能创造的怪物持续到本场景结束。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"上级创造","timing":"Create Undead","check":"自动成功","target":"自身","range":"-","cost":"15","maxSL":"3","usage":"每剧本SL次","effect":"你必须拥有[创造亡灵]SL3才能学习此技能。与[创造亡灵]同时使用。怪物的EL（或CL）变为等于角色的CL。怪物获得原始等级与最终等级之间每级差值的能力。每2级所有判定+1。每级伤害+2。每级HP+5。每级物理防御和魔法防御+1。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"衰老（法术）","timing":"准备阶段","check":"魔法判定","target":"自身","range":"20m","cost":"8","maxSL":"1","usage":"-","effect":"目标现在被视为“类型：不死”，没有“对类型：不死有效”的HP恢复效果对其无效。此效果持续到本轮结束。仅影响不死生物且持续时间应长于此效果的效果，与此效果同时结束。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"暗影之枪（暗属性法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"6","maxSL":"1","usage":"-","effect":"对目标进行魔法攻击。该攻击造成2d6+10暗属性魔法伤害。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"尸体爆发（暗属性法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"6","maxSL":"1","usage":"-","effect":"只能对未被掠夺的死亡生物（使用此技能时你失去战利品）或由你的[创造亡灵(SL3)]创造的僵尸使用。该魔法攻击使尸体爆炸，对与尸体在同一交战中的所有角色造成2d6+10+(尸体的CL)x2暗属性魔法伤害。如果目标因该攻击受到至少1点HP伤害，附加中毒(1)、威压和眩晕。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"虚假生命（法术）","timing":"准备阶段","check":"魔法判定","target":"自身","range":"20m","cost":"8","maxSL":"1","usage":"-","effect":"“类型：不死”的目标不再被视为“类型：不死”，具有“对类型：不死有效”的HP恢复效果对其无效，但其他效果有效。此效果持续到本轮结束。不能影响不死生物且持续时间应长于此效果的效果，与此效果同时结束。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"丧钟（法术）","timing":"Cleanup Phase","check":"自动成功","target":"场景（选择）","range":"视野","cost":"20","maxSL":"1","usage":"每剧本1次","effect":"仅对“类型：不死”目标有效。对目标造成2d6+10+CLx4贯穿伤害。如果目标因该攻击受到至少1点HP伤害，直到场景结束前无法以任何方式恢复HP。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"高级召唤师","timing":"移动动作","check":"自动成功","target":"自身","range":"-","cost":"3","maxSL":"1","usage":"-","effect":"对[外部召唤]进行的反应获得-1d6。该效果持续到本主要阶段结束。","srcTag":"AR2E扩展","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"上级召唤师","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你必须拥有[高级召唤师]SL1才能学习此技能。当你需要为伤害、恢复HP/MP或增减伤害进行掷骰时，[外部召唤]的效果获得+1d6。","srcTag":"AR2E扩展","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"双重召唤","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"在你与[外部召唤]同时使用“契约”物品时有效。你可以从持有物中使用另一个“契约”物品并应用其效果。警告：并非所有“契约”物品的效果都兼容。","srcTag":"AR2E扩展","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"外部召唤（法术）","timing":"主要动作","check":"魔法判定","target":"区域（选择）","range":"20m","cost":"8","maxSL":"1","usage":"-","effect":"对目标进行魔法攻击。该攻击造成2d6虚空魔法伤害。如果你的持有物中有“契约”物品，你可以使用它来修改此法术效果。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"暗之链接","timing":"主要动作","check":"命中判定","target":"单体","range":"武器","cost":"12","maxSL":"5","usage":"-","effect":"你必须拥有[暗影之枪]SL1才能学习此技能。对目标进行武器攻击。如果目标因该攻击受到至少1点HP伤害，接下来SL次目标因非你造成的伤害来源受到至少1点HP伤害时，你立即无消耗地对目标施放“暗影之枪”。该效果持续到本轮结束。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"镜之诅咒（法术）","timing":"准备阶段","check":"魔法判定","target":"自身","range":"-","cost":"10","maxSL":"1","usage":"-","effect":"你受到的下一个不造成伤害的法术也同时作用于该法术的来源。该效果持续到本轮结束。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"魔法标记（法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"近战","cost":"10","maxSL":"1","usage":"每剧本1次","effect":"只要你的目标在同一场景中，你将其视为在你的法术“射程内”。目标可以拒绝此效果。如果目标拒绝，此次技能使用不计入使用次数限制。此效果持续到剧本结束。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"死灵傀儡（法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"12","maxSL":"1","usage":"-","effect":"对“类型：不死”目标可使用。目标对你的魔法判定进行精神对抗判定。如果你成功，目标将变为消耗、被安抚，并听从你的命令。如果目标不是杂兵或额外角色，他们可以忽略此效果。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"混乱射线（暗属性法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"7","maxSL":"1","usage":"-","effect":"对目标附加恍惚和激怒。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"契约（法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"10","maxSL":"5","usage":"-","effect":"目标必须是非敌对生物。如果对方接受，你与其形成魔法“契约”。你最多可以拥有SL个不同的“契约”。如果你在达到上限后想形成“契约”，需要在形成新契约时放弃一个“契约”。“契约”以“重量：0”的物品形式存在，其效果取决于目标的“类型”和/或种族。你同时只能使用一个契约，且只有你能使用它们。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"赏金：亡灵","timing":"见效果","check":"-","target":"自身","range":"-","cost":"8","maxSL":"3","usage":"每场景SL次","effect":"掠夺“类型：不死”的怪物时，额外掷SL次战利品表以获取战利品。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"亡灵复苏（法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"8","maxSL":"1","usage":"-","effect":"对[类型：不死]有效。目标恢复3d6+CLx3 HP。如果目标处于K.O状态，以2d6 HP复活，且变为消耗状态。对非[类型：不死]的目标无效。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"查询","timing":"主要动作","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"3","usage":"每剧本SL次","effect":"你可以向GM提出一个问题。GM可以选择不回答。如果GM不回答，此次技能使用不计入使用次数限制。","srcTag":"AR2E扩展","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"禁忌知识","timing":"次要动作","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"1","usage":"-","effect":"将你的智力加到你的魔法攻击伤害上。此效果持续到你的主要阶段结束。","srcTag":"Watson","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"鲜血法术","timing":"伤害掷骰前","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"5","usage":"-","effect":"在你进行魔法攻击的伤害掷骰前可使用。失去最多SLx5（最小1）HP。然后将等同于失去HP量的伤害加到此攻击上。伤害增加持续到本主要阶段结束。","srcTag":"AR2E扩展","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"领域","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"3","usage":"-","effect":"此技能影响你所有非“射程：近战”的死灵法师技能。你的技能射程增加SLx5米。","srcTag":"AR2E扩展","nameEn":"","cls":"死灵法师","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"获得通用技能","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"学习此技能时，选择三个未被列为法术的通用技能，且不是专注或信仰。你学习那些技能。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"空中支援","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"6","maxSL":"1","usage":"每轮1次","effect":"在坠落伤害掷骰前使用。将你将受到的坠落伤害变为0，然后进入飞行状态并进行战斗移动。你不必移动。此飞行状态持续到主要阶段结束。你也可以在落入陷阱或洞穴受到坠落伤害时，或骑乘时受到失衡影响时使用此技能。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"弄臣技艺技能","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你的舞蹈技能、音乐技能、演说技能或弄臣的表演技能的判定获得+1d6。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"杂耍改良技能","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"5","usage":"-","effect":"你的“表演”技能的攻击伤害获得+(SL)d6。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"杂耍武器技能","timing":"移动动作","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"1","usage":"-","effect":"选择一把已装备或在持有物中的武器。当你使用造成伤害的“表演”技能时，加上所选武器的攻击力。如果武器在持有物中，你装备它并将之前手持的装备物品掉落在地上。该效果持续到主要阶段结束。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"远投技能","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"5","usage":"-","effect":"投掷或“表演”技能的射程增加+SLx5米。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"卓越演艺技能","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你将通用技能应用于“音乐”、“演说”、“表演”和“舞蹈”技能的判定（适用时）。此效果同时只能应用一个通用技能，且也应用于命中判定。反之，如果你拥有[弄臣技艺技能]，你的[吟唱技能]、[欺骗技能]、[宴会技能]和[舞蹈技能]在其他用途上获得+1d6。即使原本不受[弄臣技艺技能]影响，也可以应用于相应的判定。（吟游诗人的各种吟唱直接是吟唱判定，不需要此技能，但如果你拥有[弄臣技艺技能]，可以从中受益。）","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"舞蹈：旋转卡波耶拉","timing":"主要动作","check":"命中判定(Dance)","target":"场景（选择SLx2）","range":"Move","cost":"12","maxSL":"5","usage":"-","effect":"以节奏击打的攻击性舞蹈。对所有选择的目标进行近战武器攻击。如果你因该攻击造成1点HP伤害，对目标附加恍惚。该攻击的射程等于你的移动力，即使对交战外的目标也可以使用。你不移动。坐骑对移动力的影响不计入射程。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"舞蹈：禁忌之舞","timing":"主要动作","check":"Agility (Dance)","target":"场景（选择）","range":"Move","cost":"10","maxSL":"2","usage":"-","effect":"无名之舞。目标进行精神对抗判定。掷(SL)d6，对抗判定失败的目标根据每个骰子的结果分别获得减益效果。1：威压，2：激怒，3：恐惧，4：失衡，5：束缚，6：你从其他5种可能中选择减益效果。如果多个掷出的骰子有相同的点数（6除外），你将其中一个视为6，直到只有不同的结果或6为止。坐骑对移动力的影响不计入射程。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"舞蹈：最后华尔兹","timing":"主要动作","check":"见效果","target":"见效果","range":"See effect","cost":"See effect","maxSL":"1","usage":"每剧本1次","effect":"为舞会画上句号的舞蹈。你再次执行在过去五轮中执行过的所有“舞蹈”技能，一个接一个（你可以选择新目标）。此技能的消耗等于所有执行的“舞蹈”总消耗的一半。之后，直到本场景结束，你不能使用任何“舞蹈”技能。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"舞蹈：军刀小步舞","timing":"主要动作","check":"命中判定(Dance)","target":"单体","range":"近战","cost":"8","maxSL":"1","usage":"-","effect":"以攻击压倒对方的攻击性舞蹈。对目标进行近战武器攻击。如果他们的行动点数少于你，你对目标进行第二次近战武器攻击。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"舞蹈：特技摇滚","timing":"主要动作","check":"Agility (Dance)","target":"区域（选择）","range":"Move","cost":"8","maxSL":"1","usage":"-","effect":"舞者向各方向跳跃的空中舞蹈，包括越过头顶。目标的所有反应判定获得-1d6，直到本轮结束。如果目标处于飞行状态，效果变为：失去飞行状态，行动点数减少-1d6，且所有反应判定获得-1d6，该效果持续到场景结束（可以通过恢复减益效果的效果取消）。如果至少一个目标受到此技能的任一效果影响，你可以选择进入飞行状态直到你的下一次移动，你不会因此效果移动。坐骑对移动力的影响不计入射程。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"幻影集","timing":"Phase d'Initialisation","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"5","usage":"-","effect":"只有在音乐技能生效时才可使用。你的“舞蹈”技能、“演说”技能和“表演”技能获得伤害+SLx2和减益效果等级+SL，且这些技能的目标对其的反应判定获得-1d6。该效果持续到本轮结束或音乐效果结束。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"邀请（法术）","timing":"主要动作","check":"魔法判定","target":"单体","range":"20m","cost":"12","maxSL":"1","usage":"-","effect":"对“类型：人类、亚人”目标可使用。目标对你的魔法判定进行精神对抗判定。如果你成功，目标将变为消耗、被安抚，并听从你的命令。如果目标不是杂兵或额外角色，他们可以忽略此效果。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"巧舌","timing":"次要动作","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"3","usage":"-","effect":"你选择一个“时机：主要动作”的“演说”技能、“音乐”技能或“吟唱”，立即使用它。直到本主要阶段结束，你不能再次使用所选技能。你不能选择使用条件未满足的技能。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"赞助","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你必须拥有[卓越演艺技能]SL1才能学习此技能。学习此技能时，选择一个你不拥有的、在准备阶段产生KE效果的通用技能。你必须具备学习所选技能的条件，如果至少不具备其中一个条件则不能学习此技能。你在准备阶段从通用技能获得的KE数量乘以5。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"音乐：魔法叙事诗","timing":"主要动作","check":"精神(Chant)","target":"场景（选择）","range":"Scene","cost":"14","maxSL":"1","usage":"-","effect":"注入魔法能量的叙事诗。目标获得魔法判定+1d6，直到你使用另一个“音乐”技能、你受到至少1点HP伤害，或直到本场景结束。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"音乐：终曲","timing":"Phase d'Initialisation","check":"自动成功","target":"Scène (Choix)","range":"Scène","cost":"25","maxSL":"1","usage":"Une fois par Scénario","effect":"只有在你执行的“音乐”技能效果激活时才可使用，并立即结束该效果。所有目标获得所有掷骰和判定+2d6。此效果激活期间你不能使用其他“音乐”技能，持续到你受到至少1点HP伤害或本轮结束。之后，直到本场景结束你不能使用任何“音乐”技能，但对于其他技能，你始终被视为处于“音乐”技能效果下。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"音乐：战斗圣歌","timing":"主要动作","check":"精神(Chant)","target":"场景（选择）","range":"Scene","cost":"14","maxSL":"1","usage":"-","effect":"发自内心提升勇气的圣歌。目标获得武器攻击的命中判定+1d6，直到你使用另一个“音乐”技能、你受到至少1点HP伤害，或直到本场景结束。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"音乐：震动旋律","timing":"主要动作","check":"精神(Chant)","target":"场景（选择）","range":"Scene","cost":"14","maxSL":"1","usage":"-","effect":"震动肌肉与灵魂的旋律。目标获得回避判定+1d6，直到你使用另一个“音乐”技能、你受到至少1点HP伤害，或直到本场景结束。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"音乐：神秘颂","timing":"主要动作","check":"精神(Chant)","target":"场景（选择）","range":"Scene","cost":"14","maxSL":"1","usage":"-","effect":"被遗忘时代的神秘颂歌。目标获得所有精神判定+1d6，直到你使用另一个“音乐”技能、你受到至少1点HP伤害，或直到本场景结束。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"演说：谴责","timing":"主要动作","check":"精神(Deception)","target":"单体","range":"20m","cost":"6","maxSL":"1","usage":"-","effect":"说服目标他们的终结是近在咫尺且不可避免的。目标进行精神对抗判定。如果你获胜，目标在清理阶段受到2d6+CLx3贯穿伤害。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"演说：甜言蜜语","timing":"主要动作","check":"精神(Deception)","target":"单体","range":"20m","cost":"10","maxSL":"3","usage":"-","effect":"赞美目标并激起他们的自负。他们获得再生(SL+1)。该效果在每个清理阶段恢复5 HP，然后效果等级减少1。当效果等级降至0或HP等于最大HP时此效果结束。效果等级可以通过提升减益效果等级的技能来提升。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"演说：疑病症","timing":"主要动作","check":"精神(Deception)","target":"单体","range":"20m","cost":"10","maxSL":"3","usage":"-","effect":"说服目标他们接触了毒物。目标进行精神对抗判定。如果你获胜，对目标附加中毒(SL+1)。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"演说：侮辱","timing":"主要动作","check":"精神(Deception)","target":"单体","range":"20m","cost":"7","maxSL":"1","usage":"-","effect":"向目标投掷粗俗侮辱的言辞。目标进行精神对抗判定。如果你获胜，对目标附加激怒和威压。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"演说：疑云","timing":"主要动作","check":"精神(Deception)","target":"单体","range":"20m","cost":"7","maxSL":"1","usage":"-","effect":"在目标耳边低语关于他们的谣言。目标进行精神对抗判定。如果你获胜，附加恍惚和击退(2)。暴击：消耗0。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"舞步：禁忌","timing":"主要动作","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"1","usage":"-","effect":"你必须拥有[舞蹈：禁忌之舞]SL2才能学习此技能。你可以在准备阶段使用你的[舞蹈：禁忌之舞]。此技能被视为舞者技能“舞步：~~”，且在使用时直到本轮结束被视为处于类似技能效果下。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"迫害","timing":"次要动作","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"1","usage":"-","effect":"仅在攻击受到任意减益效果的对手时有效。将你的精神加到你的命中判定和造成的伤害上。该效果持续到本主要阶段结束。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"奇迹之袋","timing":"次要动作","check":"自动成功","target":"自身","range":"-","cost":"5","maxSL":"1","usage":"-","effect":"选择一个“时机：主要动作”的“表演”技能，立即使用它。直到本主要阶段结束，你不能再次使用所选技能。你不能选择使用条件未满足的技能。你取回一件在本场景中掉落或丢失的物品。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"表演：气球","timing":"主要动作","check":"灵巧(Party)","target":"单体","range":"投掷","cost":"4","maxSL":"1","usage":"-","effect":"制造一个气球投向目标。对目标进行远程攻击。该攻击造成2d6+5物理伤害。如果目标因此伤害失去至少1点HP，对其附加失衡。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"表演：圈环","timing":"主要动作","check":"灵巧(Party)","target":"单体","range":"投掷","cost":"4","maxSL":"1","usage":"-","effect":"制造一个圈环投向目标。对目标进行远程攻击。该攻击造成2d6+5物理伤害。如果目标因此伤害失去至少1点HP，对其附加威压。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"表演：飞刀","timing":"主要动作","check":"灵巧(Party)","target":"单体","range":"投掷","cost":"4","maxSL":"1","usage":"-","effect":"制造一把魔法飞刀投向目标。对目标进行远程攻击。该攻击的灵巧判定获得+1d6。该攻击造成2d6+5物理伤害。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"表演：抛射返还","timing":"反应","check":"灵巧(Party)","target":"单体","range":"See effect","cost":"5","maxSL":"1","usage":"每轮1次","effect":"当你是远程武器攻击的目标时可使用。对该攻击进行灵巧对抗判定。如果你获胜，选择一个目标，该目标成为攻击的新目标（他们可以像正常一样对该攻击进行反应，且可以是攻击者本身）。攻击者和新目标都需要在视野内。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"表演：丝带","timing":"主要动作","check":"灵巧(Party)","target":"单体","range":"投掷","cost":"4","maxSL":"1","usage":"-","effect":"制造一条丝带在目标上方展开。对目标进行远程攻击。该攻击造成2d6+5物理伤害。如果目标因此伤害失去至少1点HP，他们的所有伤害掷骰获得-1d6，直到本轮结束。暴击：增加骰子。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"表演：微笑","timing":"移动动作","check":"自动成功","target":"单体","range":"投掷","cost":"6","maxSL":"3","usage":"每场景SL次","effect":"向目标送上微笑。目标立即使用一个主要动作，而不进入其主要阶段。该主要动作不会使目标变为消耗状态，即使目标已消耗也可以使用。目标可以拒绝此效果，在这种情况下，此次技能使用不计入使用次数限制。","srcTag":"Watson","nameEn":"","cls":"弄臣","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：弄臣","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"弄臣","effect":"你的职业必须是弄臣才能学习此技能。幸运+1。你最多只能学习一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：狂战士","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"Berserker / Use two handed weapon","effect":"你的职业必须是狂战士才能学习此技能。双手武器的武器攻击伤害+2。你最多只能学习一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：舞者","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"舞者","effect":"你的职业必须是舞者才能学习此技能。灵巧+1。你最多只能学习一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：农夫","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"农夫","effect":"你的职业必须是农夫才能学习此技能。你对[类型：动物、植物和魔兽]目标的战利品掷骰+2。你最多只能学习一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：剑斗士","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"Gladiator / Duelling","effect":"你的职业必须是剑斗士才能学习此技能。当你处于决斗状态时激活。魔法防御+2。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：幻术师","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"Illusionist","effect":"你的职业必须是幻术师才能学习此技能。你使用幻术法术的魔法攻击伤害+2。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：吟游诗人","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"吟游诗人","effect":"你的职业必须是吟游诗人才能学习此技能。准备阶段，你获得精神x100 KE。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：武僧","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"Monk / Use Hand-to-hand","effect":"你的职业必须是武僧才能学习此技能。你使用徒手武器的武器攻击伤害+2。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：死灵法师","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"死灵法师","effect":"你的职业必须是死灵法师才能学习此技能。你的死灵法师法术对[类型：不死生物]生效时威力+2（伤害或治疗）。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：忍者","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"忍者","effect":"你的职业必须是忍者才能学习此技能。精神+1。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：贤者","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"贤者","effect":"你的职业必须是贤者才能学习此技能。智力+1。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：萨满","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"萨满","effect":"你的职业必须是萨满才能学习此技能。你对带有负面状态的目标的攻击伤害+2。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"专注：维京人","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"Viking / Swimming","effect":"你的职业必须是维京人才能学习此技能。当你处于游泳状态时，行动点数+2。你不能学习超过一个专注技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"上级精通：大法师","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"CL 10，Arch-Wizard / Choosen class","effect":"你的基础智力需要达到15，基础感知需要达到12。你需要拥有装备限制为「魔法师」的某个职业的[专注：~~]和[精通技能：~~]才能学习此技能。 当你处于大法师职业时，你被视为同时拥有你的[专注：~~]技能所属职业，就像你被视为魔法师职业一样（你可以学习该职业的技能，并使用需要该职业才能使用的技能）。 你的[专注：~~]技能所属职业每等级的HP和MP获得量+4。该职业修正值在智力上+1，在感知上+1。 当你处于你的[专注：~~]所属职业时，你可以学习大法师技能。但通过此效果每等级只能学习1 SL的大法师技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"上级精通：大祭司","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"CL 10，Arch-Priest / Choosen class","effect":"你的基础精神需要达到15，基础幸运需要达到12。你需要拥有装备限制为「祭司」的某个职业的[专注：~~]和[精通技能：~~]才能学习此技能。 当你处于大祭司职业时，你被视为同时拥有你的[专注：~~]技能所属职业，就像你被视为祭司职业一样（你可以学习该职业的技能，并使用需要该职业才能使用的技能）。 你的[专注：~~]技能所属职业每等级的HP和MP获得量+4。该职业修正值在精神上+1，在幸运上+1。 当你处于你的[专注：~~]所属职业时，你可以学习大祭司技能。但通过此效果每等级只能学习1 SL的大祭司技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"上级精通：刺客","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"CL 10，Assassin / Choosen class","effect":"你的基础敏捷需要达到15，基础灵巧需要达到12。你需要拥有装备限制为「盗贼」的某个职业的[专注：~~]和[精通技能：~~]才能学习此技能。 当你处于刺客职业时，你被视为同时拥有你的[专注：~~]技能所属职业，就像你被视为盗贼职业一样（你可以学习该职业的技能，并使用需要该职业才能使用的技能）。 你的[专注：~~]技能所属职业每等级的HP和MP获得量+4。该职业修正值在敏捷上+1，在灵巧上+1。 当你处于你的[专注：~~]所属职业时，你可以学习刺客技能。但通过此效果每等级只能学习1 SL的刺客技能。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"上级精通：冒险者","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"冒险者，CL 10","effect":"你需要拥有[上级职业模仿技能]和[专注：冒险者]才能学习此技能。冒险者职业每等级的HP和MP获得量+4。[专注：冒险者]选择的能力值现在变为+2而非+1。如果你是冒险者职业，在准备阶段获得1次额外的祝福。","srcTag":"Watson","nameEn":"","cls":"专注","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"上级精通：十字军","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"CL 10，Crusader             <p>素晴TRPG包含一项可选规则——<strong>作弊能力</strong>（Cheats），用于还原原作中转生者携带"外挂"的设定。游戏参与者应自行决定是否使用此项可选规则。</p>
            <ul>
                <li>作弊能力在低等级角色手中可能导致游戏平衡更难以把控</li>
                <li>当然，它们也带来了更多乐趣——但这并不意味着所有人都能享受</li>
                <li>因此，系统设计为让参与者自行决定是否使用</li>
                <li>玩家想要使用作弊能力没有问题，但<strong>GM拥有最终决定权</strong></li>
            </ul>
            <p><strong>作弊能力限制：</strong>GM可以对玩家角色可获得的作弊能力施加限制。例如，在涉及对抗魔王军的剧本中，拥有"魔王军成员"作弊能力的角色可能处于严重劣势。在这些情况下，GM可以限制该会话中可获得的作弊能力。当然，GM也可以将该作弊能力引入剧情中。</p>
            <p><strong>作弊能力与NPC：</strong>GM可以让NPC作为剧本的一部分获得作弊能力。如果这样做，所有人在"完成任务"部分将获得额外经验值，等于NPC拥有的作弊能力数量乘以所有玩家角色的平均等级。</p>
            <p><strong>完整作弊能力列表：</strong></p>
            <table>
                <tr><th>名称</th><th>效果（Merit）</th><th>代价（Demerit）</th></tr>
                <tr><td><strong>死亡回归</strong><br>Return by Death</td><td>昏迷或死亡时使用。你不再昏迷或死亡，HP变为1。每剧本限用一次。</td><td>克服死亡并非易事。使用死亡回归时，必须消耗1点祝福。如果无法消耗，则不能使用死亡回归。</td></tr>
                <tr><td><strong>我其实是女神</strong><br>I'm Actually a Goddess</td><td>在同一场景中的角色进行判定后立即使用。该判定变为大成功。如果因大成功而追加骰子，无论掷出多少个6，始终追加2d6。每剧本限用一次。</td><td>这个世界上没有人相信你是女神。你不断告诉他们，但每个人都认为你疯了，或者因为害怕被诅咒而避开你。</td></tr>
                <tr><td><strong>贝尔泽格王族</strong><br>Belzerg Royalty</td><td>被动。对恶魔敌人的所有伤害增加CL×4。</td><td>你的力量依赖于你所习惯的王室生活方式。如果选择"稳定生活"或"简朴生活"作为生活方式，则无法获得此作弊能力的增益效果，且所有判定承受-1d6惩罚。</td></tr>
                <tr><td><strong>痛觉沉醉</strong><br>Intoxicated by Pain</td><td>对你造成的伤害掷骰后立即使用。将该攻击对你造成的伤害变为0。每剧本限用一次。</td><td>你如此沉迷于追求快感，以至于攻击力下降，还忽视了一些本可以闪避的攻击。每次进行命中判定或闪避判定时，承受-1d6惩罚。</td></tr>
                <tr><td><strong>力量追求</strong><br>Pursuit of Power</td><td>被动。对使用骰子决定效果的技能有效。获得此作弊能力时，选择一个你已拥有的、通过攻击造成伤害、恢复HP、恢复MP或增减伤害的法术。在该技能的效果中追加5d6。如果等级在10以上，改为追加(CL/2)d6。</td><td>作为力量的代价，你将每一滴魔力和生命力都倾注到法术中。在应用增益效果的流程结束后，你的HP变为0。</td></tr>
                <tr><td><strong>魔王军成员</strong><br>Member of the Demon King's Army</td><td>被动。物理防御和魔法防御增加CL×4。</td><td>你不能拒绝魔王的命令，也不能攻击属于魔王军的任何角色或敌人。GM可以设定一个条件，当条件满足时允许你攻击此类角色或敌人。</td></tr>
                <tr><td><strong>圣宝持有者：防具</strong><br>Sacred Treasure Holder: Armor</td><td>物品。在预备游戏期间，从你的物品栏中选择一件防具。该防具成为圣宝。其物理防御增加CL×3，魔法防御增加CL。</td><td>当你未装备为此作弊能力选择的防具（你的圣宝）时，所有判定承受-2d6惩罚。</td></tr>
                <tr><td><strong>圣宝持有者：武器</strong><br>Sacred Treasure Holder: Weapon</td><td>物品。在预备游戏期间，从你的物品栏中选择一件武器。该武器成为圣宝。其攻击力增加CL×3。</td><td>当你未装备为此作弊能力选择的武器（你的圣宝）时，所有判定承受-2d6惩罚。</td></tr>
                <tr><td><strong>邪恶气场</strong><br>Villainous Energy</td><td>目标进行任何判定后立即使用。将该判定变为大失败。每剧本限用一次。</td><td>人们像躲避瘟疫一样避开你。如果在角色创建以外的任何时间购买物品，每件物品（包括生活方式）的价格对你来说都是双倍。</td></tr>
                <tr><td><strong>破坏魔法力量</strong><br>Destructive Magic Power</td><td>伤害掷骰前使用。你进行的魔法攻击伤害追加10d6。如果CL在10以上，改为追加(CL+2)d6。每剧本限用一次。</td><td>你需要非常精确地控制MP才能使用破坏魔法力量。你用于进行魔法攻击的所有法术的MP消耗翻倍。</td></tr>
                <tr><td><strong>创造作弊</strong><br>Creation Cheat</td><td>随时使用。创造一件具有你选择功能的物品。无法通过此效果获得武器或防具等装备，也无法通过此增益恢复祝福。GM对物品的最终效果拥有最终决定权。获得的物品在剧本结束时消失。每剧本限用一次。</td><td>你因为创造东西的花费而吝啬金钱。你拒绝放弃任务，拼命想要获得报酬。如果因某种原因无法获得任务报酬或必须放弃任务，你的祝福数立即变为0。</td></tr>
                <tr><td><strong>最强之人的世界</strong><br>World of the Strongest</td><td>在先攻流程中使用。你立即执行你的主要流程。即使已消耗行动，你也可以执行此主要流程，且执行后不会变为消耗状态。每剧本限用一次。</td><td>拥有最强大的力量给你带来了沉重的负担。在增益的主要流程之后，直到场景结束，你进行的每次掷骰（如判定和伤害）承受-1d6惩罚。这不会将掷骰数量减少到1以下。</td></tr>
                <tr><td><strong>命运借贷</strong><br>Loan on Destiny</td><td>被动。可用祝福上限增加1。即使祝福数降至0以下，你也可以使用祝福。</td><td>当你的祝福数为0或以下时，你进行的所有判定（大成功掷骰除外）无论结果如何都会失败。此外，在结束游戏阶段，如果你的祝福数等于或低于你的幸运值的负值，你会死亡。</td></tr>
                <tr><td><strong>被误解的人</strong><br>Misunderstood</td><td>以当前场景中的所有群众角色（或战斗中的群体敌人）为目标。这些目标服从你的指示直到场景结束。然而，在此效果下，他们被视为群众。每剧本限用一次。</td><td>你非常引人注目，人们忍不住会大量关注你。任何以你为攻击目标之一的人进行命中判定时，该命中判定获得+1d6。</td></tr>
            </table>
            <div class="note"><strong>💡 译者注：</strong>在游戏实录中，每位玩家都选择了一项作弊能力，而且它们完美还原了原作的氛围。GM在允许玩家选择作弊能力时，可以考虑要求玩家同时设定一个与能力匹配的角色背景故事——比如为什么阿库娅要赐予这个转生者这样的能力？</div>

你错认成了别人。下一刻，你坐在一把简朴的椅子上。"},{lo:41,hi:42,name:"楼梯",desc:"你为了救别人而摔下了楼梯。视野天旋地转。下一刻，你坐在一把简朴的椅子上。"},{lo:43,hi:44,name:"雷击",desc:"一道闪电在你来不及准备或感受之前就击中了你。下一刻，你坐在一把简朴的椅子上。"},{lo:45,hi:46,name:"暴力",desc:"你被卷入了别人的斗殴中。剧痛袭来。下一刻，你坐在一把简朴的椅子上。"},{lo:51,hi:52,name:"魔法阵",desc:"一个奇怪的图案——像魔法阵——突然出现在一个熟人脚下。你也被卷入其中……下一刻，你坐在一把简朴的椅子上。"},{lo:53,hi:54,name:"视频",desc:"你恰好瞥了一眼视频。然后感觉自己像是被吸进了屏幕……下一刻，你坐在一把简朴的椅子上。"},{lo:55,hi:56,name:"奇怪的门",desc:"你注意到一扇看起来崭新而格格不入的门。随手打开后……下一刻，你坐在一把简朴的椅子上。"},{lo:61,hi:62,name:"闪光",desc:"某天，眼前突然出现一阵强烈的光芒。下一刻，你坐在一把简朴的椅子上。"},{lo:63,hi:64,name:"被殴打",desc:"你被一群人痛打了一顿。疼痛和屈辱让你昏了过去。下一刻，你坐在一把简朴的椅子上。"},{lo:65,hi:66,name:"不明",desc:"突然之间，你发现自己坐在一把简朴的椅子上。面前是一位美丽的女神，正对你微笑。"}]},{key:"native",title:"原住民出身表",entries:[{lo:0,hi:0,name:"自由",desc:"与GM商量后自行决定出身。"},{lo:11,hi:12,name:"英雄",desc:"你的一位或双亲是被某些人尊敬的知名英雄。这在很多方面影响着你。"},{lo:13,hi:14,name:"王族/贵族",desc:"你是王族或贵族的子女。在年幼时接受了优良的教育。"},{lo:15,hi:16,name:"骑士",desc:"你的一位或双亲是现役骑士。你曾作为侍从跟随他们旅行。"},{lo:21,hi:22,name:"冒险者",desc:"和你一样，你的一位或双亲是冒险者。你的第一次冒险就是家庭旅行。"},{lo:23,hi:24,name:"佣兵",desc:"你的一位或双亲是佣兵。他们在许多地方战斗过，总是带着你一起。"},{lo:25,hi:26,name:"秘密特工",desc:"你的家族生活在阴影中。受雇于王族、贵族和富商，从事间谍和破坏活动。"},{lo:31,hi:32,name:"祭司",desc:"你的一位或双亲是祭司。你可以决定他们是属于厄里斯教会、阿克西斯教会，还是信仰其他神祇。"},{lo:33,hi:34,name:"法师",desc:"你的一位或双亲是法师。你从他们那里继承了大量魔法知识。"},{lo:35,hi:36,name:"公会成员",desc:"你的一位或双亲在冒险者公会工作，与其他冒险者打交道。冒险者是你生活中最亲近的大人。"},{lo:41,hi:42,name:"学者",desc:"你的一位或双亲是学者。你童年的家中散落着各种魔法道具。"},{lo:43,hi:44,name:"商人",desc:"你的一位或双亲是商人。你从小学习他们的行当和与顾客谈判的技巧。如今这些经验正在开花结果。"},{lo:45,hi:46,name:"猎人",desc:"你的一位或双亲是猎人。他们教会了你关于生存和露营的一切。"},{lo:51,hi:52,name:"漂泊者",desc:"你的一位或双亲是漂泊者，总是在旅途中。你跟随他们去过许多地方，见过许多事物。"},{lo:53,hi:54,name:"格斗家",desc:"你的一位或双亲是竞技场中的格斗家。竞技场总是充满危险。那种紧张刺激的感觉一直伴随着你。"},{lo:55,hi:56,name:"有组织犯罪",desc:"你的一位或双亲是从事破坏和暗杀的组织的成员。你什么都见过——不管你想不想见。"},{lo:61,hi:62,name:"前科犯",desc:"你的一位或双亲犯过罪，或因莫须有的罪名被捕。你一直不得不隐姓埋名地生活。"},{lo:63,hi:64,name:"恶魔",desc:"你的一位或双亲是恶魔。一条可怕的黑暗血脉流淌在你体内。"},{lo:65,hi:66,name:"平民",desc:"你的一位或双亲是生活在城镇或村庄中的普通人。无论发生什么，他们都继续生活——这是只有普通人才能拥有的力量。"}]},{key:"crimson",title:"红魔族出身表",entries:[{lo:0,hi:0,name:"自由",desc:"与GM商量后自行决定出身。"},{lo:11,hi:12,name:"英雄",desc:"你的一位或双亲是被誉为英雄的知名大法师。唯一的问题是：人们听到他们的名字时会笑。"},{lo:13,hi:14,name:"统治者",desc:"你来自红魔族的统治阶层。你的家族享受无忧的财务水平，过着高品质的生活。"},{lo:15,hi:16,name:"战士",desc:"你的一位或双亲从事战士工作——对红魔族来说很少见的职业。你看到他们时总是感到矛盾。"},{lo:21,hi:22,name:"冒险者",desc:"和你一样，你的一位或双亲是冒险者。你的第一次冒险就是家庭旅行。"},{lo:23,hi:24,name:"雇佣法师",desc:"你的一位或双亲是雇佣法师。他们在许多地方找到了工作和食物。不知为何，你们从未在一个地方待太久。"},{lo:25,hi:26,name:"魔法忍者",desc:"你的家族有一段利用魔法能力进行潜行和渗透的专业暗影历史。"},{lo:31,hi:32,name:"贤者",desc:"你的一位或双亲不仅是出色的法师，还是虔诚的祭司。许多人前来聆听他们的教诲。"},{lo:33,hi:34,name:"施法者",desc:"你的一位或双亲是优秀的施法者。虽然这对许多红魔族成员来说都是事实，但他们更胜一筹。"},{lo:35,hi:36,name:"公会支援人员",desc:"你的一位或双亲在冒险者公会担任支援角色，主要负责鉴定魔法道具和解除诅咒。"},{lo:41,hi:42,name:"魔法鉴定师",desc:"你的一位或双亲鉴定魔法道具。因此你家中散落着许多……相当危险的物品。"},{lo:43,hi:44,name:"魔法商人",desc:"你的一位或双亲是经营稀有魔法道具的商人，这些道具价值不菲。不知为何，你对他们感到自豪。"},{lo:45,hi:46,name:"极度贫困",desc:"你的一位或双亲把所有财产都投入了提升法师力量，使你陷入了极度贫困的境地。"},{lo:51,hi:52,name:"流浪法师",desc:"你跟随一位或双亲进行了大量旅行。你去了很多地方，见了很多事物，但你始终不知道为什么要旅行。"},{lo:53,hi:54,name:"死亡魔法之名",desc:"你的一位或双亲是用魔法力量战斗的人……实际上，他们是用魔法杀人的暗杀者。但你很久以后才知道这一点。"},{lo:55,hi:56,name:"神秘结社",desc:"你的一位或双亲是笼罩在神秘中的秘密结社成员。他们遵从结社的命令执行各种任务。"},{lo:61,hi:62,name:"逃亡者",desc:"你的一位或双亲正在逃避某种强大势力、组织或个人。他们保护着你，总是确保你藏好。"},{lo:63,hi:64,name:"恶魔",desc:"你的一位或双亲是恶魔。一条可怕的黑暗血脉流淌在你体内。"},{lo:65,hi:66,name:"平民",desc:"你的一位或双亲虽然是红魔族，却不拥有丰富的魔力。相反，他们在城镇中过着普通、踏实的生活。"}]},{key:"circum",title:"境遇表",entries:[{lo:0,hi:0,name:"自由",desc:"与GM商量后自行决定境遇。"},{lo:11,hi:12,name:"师匠",desc:"你有一位教你生活和/或你所掌握的技巧和技能的师父。"},{lo:13,hi:14,name:"孤身一人",desc:"你与家人分别了——无论是因为在事件或灾难中失散，还是因为他们已经去世——你一直独自生活。"},{lo:15,hi:16,name:"伤病",desc:"你曾经遭受过重伤或重病。那次经历极大地影响了你对生死的看法。"},{lo:21,hi:22,name:"养父母",desc:"你被养父母抚养长大。你可以自行决定原因、与亲生父母的关系以及对此的感受。"},{lo:23,hi:24,name:"启示",desc:"你听到了美丽女神的声音。你被她选中去完成某件伟大的事。大概。也许。"},{lo:25,hi:26,name:"被夺",desc:"有东西被夺走了。也许是宝物、珍贵的人，或其他什么。但那对你来说极为重要。"},{lo:31,hi:32,name:"没落",desc:"种种境遇导致你失去了社会地位、大量财富或家族荣誉。之后，你的家族变成了昔日自己的影子，陷入衰败。"},{lo:33,hi:34,name:"遗失",desc:"你失去了重要的东西。也许是宝物、家人，或其他什么。但那一定对你来说非常珍贵。"},{lo:35,hi:36,name:"旅人",desc:"你曾旅行到遥远的大陆和未知的土地。你这样旅行了多久？然而旅途似乎永远不会结束。"},{lo:41,hi:42,name:"身份",desc:"只有你知道自己的真实身份。你没有向任何人透露过。会有向某人揭露秘密的那一天吗？"},{lo:43,hi:44,name:"失忆",desc:"你没有过去的记忆。你失去了迄今为止的部分记忆，或关于自己曾经是谁的记忆。"},{lo:45,hi:46,name:"大成功",desc:"你过去做过某件非常成功的事。你为做过它而自豪，或者也许你根本不认为那是一次胜利。"},{lo:51,hi:52,name:"晋升",desc:"你在公会中晋升了。或者也许你通过冒险获得了贵族身份。你也可能是从奴隶变成了自由人。"},{lo:53,hi:54,name:"挚友",desc:"有一个人与你亲近到可以称之为挚友，或者也许，是你的恋人。你可以自行决定细节。"},{lo:55,hi:56,name:"漂泊",desc:"你旅行了世界——无论是出于自愿还是因为某种特殊情况。你现在只是这段旅途的一部分。"},{lo:61,hi:62,name:"背叛",desc:"你被背叛了。是你信任的人？商业伙伴？任务委托人？赞助者？无论是谁，都给你留下了心理创伤。"},{lo:63,hi:64,name:"安静的生活",desc:"你过着普通、和平的平民生活，没有特别的麻烦。"},{lo:65,hi:66,name:"女神的秘密",desc:"你偶然得知了某位女神的秘密。既然你知道了，你将永远处于危险之中。"}]},{key:"goal",title:"目标表",entries:[{lo:0,hi:0,name:"自由",desc:"与GM商量后自行决定目标。"},{lo:11,hi:12,name:"金钱！",desc:"金钱是你的目标。这就是你在这个世界生存所需要的。有什么是钱买不到的吗？如果有的话，你对那种东西也没兴趣。"},{lo:13,hi:14,name:"修行",desc:"你的目标是修行。你想磨练身心以达到更高的境界。"},{lo:15,hi:16,name:"任务",desc:"你为了打倒魔王而行动——那是那位美丽女神对你的期望。你确信自己会完成这个伟大的任务。"},{lo:21,hi:22,name:"好奇心",desc:"你的目标是满足自己的好奇心。你完全清楚这会让你陷入危险。但你停不下来。"},{lo:23,hi:24,name:"命运",desc:"你在旅途中，被一位奇妙女神赐予的命运所引导。在那命运实现之前，你会继续走下去。"},{lo:25,hi:26,name:"复仇",desc:"你想要复仇。你还没有得到它。也许你缺乏力量，或者你不知道到底该向谁复仇，但那团火焰始终在胸中燃烧。"},{lo:31,hi:32,name:"好战",desc:"你热爱战斗。仅凭自己的力量从残酷而异常的死亡之颚中逃脱，让你感到真正活着。"},{lo:33,hi:34,name:"寻找某人",desc:"你的目标是找到某个人。他们在哪里？你可以自行决定与他们的关系和/或寻找他们的原因。"},{lo:35,hi:36,name:"养家",desc:"你作为冒险者工作来养活某个特别的人或家人。你赚的钱都用来给他们提供衣食。"},{lo:41,hi:42,name:"被迫",desc:"你按照他人的意志行动，不管你怎么想。你没有选择。"},{lo:43,hi:44,name:"逃亡",desc:"你正在被某人追捕。你不能在一个地方待太久。你行动的原因是为了逃避追捕。"},{lo:45,hi:46,name:"正义",desc:"你旅行是为了实现你自己的正义。为这个与你理想如此不同的世界带来祝福。"},{lo:51,hi:52,name:"友情",desc:"你的目标是拯救某位朋友。你不求回报。一切都是为了他们——为了你们之间的友情。"},{lo:53,hi:54,name:"夺回",desc:"你的目标是夺回曾经被夺走的东西。这就是你行动的原因。"},{lo:55,hi:56,name:"寻找某物",desc:"你在寻找某样东西。它可能是强大的力量、宝物，或回到故乡的方法——但获得它就是你的目标。"},{lo:61,hi:62,name:"志向",desc:"你一直向往冒险者的世界。也许你渴望像他们一样做冒险工作，或者你想有一天成为著名的冒险者。"},{lo:63,hi:64,name:"打倒魔王",desc:"你的目标是打倒魔王。你将作为冒险者成名，打倒魔王，为这个世界带来祝福。这就是你行动的原因。"},{lo:65,hi:66,name:"没有目标",desc:"你现在没有特别的追求。不过，你仍然平静地生活着。这才是人生中重要的。何必操之过急、设定什么远大目标呢？"}]}],yc={class:"kt-wizard"},Lc={class:"kt-steps"},Ac=["onClick"],Rc={class:"kt-livestat"},xc={class:"kt-ls-item"},wc={class:"kt-ls-item"},Pc={class:"kt-ls-item"},Tc={class:"kt-ls-item"},Cc={class:"kt-ls-item"},Mc={class:"kt-ls-item"},Hc={class:"kt-ls-item"},Dc={class:"kt-ls-item"},Wc={key:0,class:"kt-step-pane"},qc={class:"kt-form-grid"},Gc={key:1,class:"kt-step-pane"},Ic={class:"kt-race-cards"},$c=["onClick"],_c={class:"kt-race-abils"},Oc=["title"],Kc={class:"kt-num"},Nc={class:"kt-race-desc"},Fc={key:0,class:"kt-placeholder"},Uc={key:2,class:"kt-step-pane"},Bc={class:"kt-cls-cards"},Vc=["onClick"],jc={class:"kt-num kt-cls-mod"},Yc={class:"kt-cls-cards"},zc=["onClick"],Xc={class:"kt-num kt-cls-mod"},Jc={class:"kt-race-desc"},Zc={key:0,class:"kt-form-grid",style:{"margin-top":"12px"}},Qc=["value","disabled"],tl={key:1,class:"kt-placeholder"},dl={key:2,class:"kt-sub",style:{"margin-top":"6px"}},el={key:3,class:"kt-step-pane"},nl={class:"kt-sub",style:{"margin-bottom":"10px"}},sl={class:"kt-lp-head"},rl=["onClick"],al=["onUpdate:modelValue"],il=["onUpdate:modelValue"],ol={key:0,class:"kt-roll-result"},cl={key:4,class:"kt-step-pane"},ll={class:"kt-skillpick"},gl={class:"kt-pick-left"},ml={key:0,class:"kt-sub",style:{"margin-bottom":"6px"}},hl={class:"kt-tabs"},fl={class:"kt-sktools"},ul={class:"kt-check kt-check-sm"},pl={class:"kt-count"},kl={class:"kt-skgrid"},El=["onClick"],vl={class:"kt-badge kt-badge-blue"},bl={key:0,class:"kt-badge kt-badge-gold"},Sl={class:"kt-skgrid-stats"},yl={class:"kt-skcard-eff"},Ll={class:"kt-skcard-foot"},Al=["onClick"],Rl=["onClick"],xl={key:0,class:"kt-placeholder"},wl={class:"kt-pick-right"},Pl={class:"kt-flabel"},Tl={class:"kt-pick-chosen"},Cl={class:"kt-pick-name"},Ml={class:"kt-pick-meta"},Hl=["max","onUpdate:modelValue"],Dl=["onClick"],Wl={key:0,class:"kt-placeholder"},ql={class:"kt-limits"},Gl={class:"kt-num"},Il={key:0,class:"kt-limitwarn"},$l={class:"kt-skmodal"},_l={class:"kt-skmodal-head"},Ol={key:0,cl

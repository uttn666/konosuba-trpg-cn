a={example:{name:"示例敌人",nameEn:"Example Enemy",type:"类型 / 属性",level:1,hp:10,mp:10,defense:"0/0",check:"回避 2D+0",actMove:"行动 0 / 移动 0",attack:"攻击名: 2D+0 / 2D+0 / 物理 / 近",abils:"筋力0/0 · 器用0/0 · 敏捷0/0 · 知力0/0 · 感知0/0 · 精神0/0 · 幸运0/0",skills:["技能名 Lv1：效果描述。"],loot:"掉落说明"}},ga=[{title:"开场阶段：……",tag:"无战斗",blocks:[{type:"text",text:"正文段落。type 可用：text / table / check / encounter。"},{type:"table",head:["项目","内容"],rows:[["示例","值"]]},{type:"check",text:"感知判定 DL12——成功则……失败则……"},{type:"encounter",monster:"example",count:"1",note:"monster 键对应本文件 monsters 表；也可用 enemyRef 直接引用怪物库中的敌人名。"}]}],Xo={id:sa,title:ra,official:aa,template:ia,meta:oa,pregen:ca,monsters:la,stages:ga},Jo=Object.freeze(Object.defineProperty({__proto__:null,default:Xo,id:sa,meta:oa,monsters:la,official:aa,pregen:ca,stages:ga,template:ia,title:ra},Symbol.toStringTag,{value:"Module"})),ma="bamboo-shoots",ha="给这些竹笋的美味！",fa=!0,ua=!1,pa={level:"推荐 CL1",players:"3-5 名 PC",duration:"4-5 小时",source:"官方规则书 p299-312 · 两轮核对"},ka="快速开始：使用官方示例角色 PC#1-#5（4 人时不用 PC#5；3 人时用 PC#1/#3/#5）。自行创建推荐战士/法师/祭司/盗贼；3 名玩家时理想情况有一人选择冒险者。创建后确定生活方式，PC 已默认组队。",Ea={bamboo:{name:"狂暴竹笋",nameEn:"Raging Bamboo Shoot",type:"植物 / 地",level:2,hp:32,mp:18,defense:"3/4",check:"回避 2D+3",actMove:"行动 5 / 移动 9",attack:"撞击（徒手/双手）: 3D+4 / 2D+16 / 近战(物理) / 近",abils:"筋力13/4 · 器用12/4 · 敏捷9/3 · 知力4/1 · 感知6/2 · 精神12/4 · 幸运8/2",skills:["爆炸与扩散 Lv1：主要动作。对 5 米内单体进行特殊攻击。命中 3D+6，造成 2D+15 火焰魔法伤害。使用此效果的主要流程结束时死亡，因本效果死亡时不掉落战利品。","起飞 Lv1：主要动作。立即退出场景。","飞行能力 Lv1"],loot:"5-9：竹笋皮（1 KE）；10+：普通竹笋（见模组描述）"}},va=[{title:"开场阶段：冒险者公会（场景1）",tag:"无战斗",blocks:[{type:"text",text:"冒险者公会没有面向低级冒险者的委托——要么面向高级冒险者，要么基本是体力劳动兼职。接待员露娜不愿让队伍空手而归，用她一贯活泼的笑容推荐了一项「很适合你们的工作」：为竹笋挖掘名手翁老人采摘竹笋。"},{type:"table",head:["项目","内容"],rows:[["任务名","竹笋挖掘"],["类型","采集"],["时限","次日清晨之前"],["基础报酬","每人 10 KE"],["追加报酬","高品质竹笋每根 150 KE；普通竹笋每根 20 KE"],["完成条件","深入秘密竹林的两处空地挖掘竹笋"]]},{type:"check",text:"敌人识别判定 DL10（所有 PC 可试）：成功得知——竹笋收获时起身移动后会变成名为「狂暴竹笋」的敌人，且失去风味、计为普通品质。"},{type:"text",text:"露娜台词：「这个任务的最终报酬将根据你们挖到的竹笋数量和品质来计算——采得越多，报酬越高。」「竹笋一旦开始移动就会失去风味，所以我们要在它们移动之前收获。翁老人以能准确判断时机而闻名。」玩家接受任务后场景结束；如果不接受，模组结束，直接进入游戏后阶段。"}]},{title:"中间阶段：前往竹林（场景2-3）",tag:"无战斗",blocks:[{type:"text",text:"凌晨 3 点，PC 在公会前集合，乘四马马车出发。因为竹林的位置是秘密，翁老人要求所有人蒙眼前往。途中他讲解挖掘要领：每人借用特殊篮子和特殊铲子（各重量 1，可放入物品栏；使用铲子时必须有一只空手）。"},{type:"check",text:"注意事项：翁老人在竹林中设置了驱赶怪物的陷阱，但他每年都增加新陷阱，已经不记得位置和种类了。"},{type:"text",text:"翁老人台词：「最重要的是不要碰已经在动的竹笋——你有被攻击的风险，而且那时候的竹笋也不怎么好吃了。」「刚收获的竹笋可以生吃，如果采到很多，不妨尝尝。」对话结束后到达竹林，场景结束。"}]},{title:"地下城探索：区域1-2（场景4）",tag:"陷阱 · 首次收获",blocks:[{type:"text",text:"从本阶段起进入地下城场景：布局为直线通过四个区域，事件解决后不再发生。进入区域 4 时高潮阶段开始；若在日出前退出或未完成任务，模组结束，进入游戏后阶段。"},{type:"text",text:"区域1 · 竹林入口：道路被哥布林破坏。有一个坑洞——原本是落穴陷阱，一只哥布林掉进去死在了里面（可对其敌人识别判定）。旁边还有一个落穴，是可感知型陷阱。"},{type:"check",text:"绕过有哥布林的坑洞旁的另一落穴：感知威胁判定 DL12，成功则发现并能绕过（其余 PC 可忽略该陷阱继续前进）；失败则落穴以其为目标触发。跳过哥布林坑洞：跳跃判定 DL10，成功则不触发落穴继续深入。"},{type:"text",text:"区域2 · 首次收获：可挖掘竹笋的空地，进入个人战斗流程。出现与 PC 数量相等的竹笋。设置流程开始时每个 PC 进行感知判定 DL12，成功则发现一个高品质竹笋（掷 1D6 按竹笋出现表放置）。主要动作用特殊铲子挖掘（需一只空手）并进行幸运判定 DL10：成功获得高品质竹笋（重量 1）；失败则该竹笋变为「狂暴竹笋」敌人，以消耗状态进入战斗，从下一轮开始行动。清理流程中，所有未放置的竹笋全部变为狂暴竹笋。"},{type:"encounter",monster:"bamboo",count:"= PC 数（挖掘失败 + 未放置者）",note:"挖掘失败的高品质竹笋与清理流程出现的竹笋。战斗持续到狂暴竹笋全部消失。"}]},{title:"地下城探索：区域3（陷阱）",tag:"陷阱 DL15",blocks:[{type:"text",text:"路边放着一个诱饵：一颗色泽诱人的苹果放在明显位置（摘取即触发陷阱）。翁老人设置的尖刺板陷阱覆盖其上，可通过探测发现。"},{type:"check",text:"陷阱探测判定 DL15：发现尖刺板陷阱。拆除成功后可直接拿走苹果。"}]},{title:"高潮阶段：区域4 竹笋群落",tag:"Boss 战",blocks:[{type:"text",text:"竹林最深处的空地。先到的哥布林试图攻击 PC，却被狂暴竹笋攻击并击倒了一只。开始战斗：敌人由 1 只哥布林首领和（PC 数 - 1）只哥布林组成。竹笋出现方式与区域 2 相同，区别在于第 2 轮也会出现竹笋，每轮出现的数量等于 PC 数。哥布林优先攻击 PC，不会挖竹笋。"},{type:"encounter",enemyRef:"哥布林首领",count:"1",note:"详见怪物库（哥布林首领）"},{type:"encounter",enemyRef:"哥布林",count:"= PC 数 - 1",note:"详见怪物库（哥布林）"},{type:"encounter",monster:"bamboo",count:"每轮 = PC 数（第 2 轮起）",note:"也可用「起飞」退出场景；若 GM 愿意，竹笋可选择哥布林作为攻击目标。"}]},{title:"结局阶段（场景5-6）",tag:"结算",blocks:[{type:"text",text:"走出竹林后翁老人迎接 PC，再次蒙眼乘车返回阿克塞尔。回程中他询问是否想吃竹笋：吃的 PC 每人消耗一根收获的竹笋——高品质竹笋「美味到令人失语」，普通竹笋「入口的瞬间就被风味惊艳到」。（在此场景之后吃的竹笋没有经验值奖励，因为已失去新鲜度。）"},{type:"table",head:["报酬项目","金额"],rows:[["基础报酬","每人 10 KE"],["高品质竹笋","每根 150 KE"],["普通竹笋","每根 20 KE"],["翁老人请客","早饭一顿"]]},{type:"table",head:["经验值项目","EXP"],rows:[["完成任务加成（取最高）","击败区域4全部敌人 5 / 吃高品质竹笋 3 / 吃普通竹笋 1（不叠加）"],["遭遇敌人等级","狂暴竹笋每只 2（区域2 与 区域4）"],["遭遇陷阱等级","区域1 落穴×2 = 2 ＋ 区域3 尖刺板 = 3，合计 5"],["合计","9 + 狂暴竹笋数量"]]},{type:"check",text:"原书勘误级矛盾备注：XP「合计 9 + 狂暴竹笋数量」与「竹笋每只按 2 计」不自洽（应为 9 + 2×N）；且区域4 哥布林为 PC−1 只，与经验表「1×5」示例矛盾。跑团时建议 GM 按实际击破数结算。"}]}],Zo={id:ma,title:ha,official:fa,template:ua,meta:pa,pregen:ka,monsters:Ea,stages:va},Qo=Object.freeze(Object.defineProperty({__proto__:null,default:Zo,id:ma,meta:pa,monsters:Ea,official:fa,pregen:ka,stages:va,template:ua,title:ha},Symbol.toStringTag,{value:"Module"})),Fe=JSON.parse(`[{"i":1,"ch":"简介","chTitle":"欢迎来到TRPG的世界","title":"什么是TRPG？","id":"intro-trpg","html":"\\n            <p>TRPG是\\"Table Talk Role-Playing Game\\"（桌上对话角色扮演游戏）的缩写。这是一种玩家围坐在桌前，通过对话和骰子来共同创造故事的娱乐形式。</p>\\n            <p>与电子游戏不同，TRPG没有固定的画面或预设的选项。玩家可以自由决定角色的行动，而游戏主持人（GM）则负责描述世界的变化和NPC（非玩家角色）的反应。所有人的想象力共同构成了这场冒险的舞台。</p>\\n            <p>本规则书以《为美好的世界献上祝福！》的世界为舞台。你将扮演来到异世界的冒险者，与伙伴们一起接下公会任务、探索迷宫、对抗魔王军的干部——当然，也可能因为运气不好而经历各种搞笑又糟糕的遭遇。这正是素晴世界的魅力所在。</p>\\n            <div class=\\"note\\"><strong>新手提示：</strong>如果你从未玩过TRPG，不用担心！本规则书会从最基础的概念开始讲解。你只需要准备好骰子、纸笔，以及一颗想要冒险的心。</div>\\n        "},{"i":2,"ch":"简介","chTitle":"欢迎来到TRPG的世界","title":"《为美好的世界献上祝福！》的世界","id":"intro-konosuba","html":"\\n            <p>《为美好的世界献上祝福！》是由晓夏目创作、三嶋黑音绘制插画的轻小说系列，后被改编为动画、漫画等多种媒介。故事讲述了一个名叫佐藤和真的家里蹲少年，在死后被女神阿库娅带到了一个类似RPG游戏的异世界，从此开启了一段充满麻烦、搞笑与偶尔感人时刻的冒险生活。</p>\\n            <div class=\\"content-img\\" style=\\"max-width:340px; position:relative;\\">\\n                <img src=\\"img/image_168_image15.png\\" alt=\\"素晴主要角色\\">\\n                <span style=\\"position:absolute; top:42%; left:52%; font-size:11px; font-weight:bold; color:#333; transform:translateX(-5%); white-space:nowrap;\\">我的爆裂魔法可是最强的！</span>\\n                <span style=\\"position:absolute; top:63%; right:14%; font-size:11px; font-weight:bold; color:#333; white-space:nowrap;\\">请……请务必攻击我！</span>\\n                <span style=\\"position:absolute; bottom:13%; left:48%; font-size:11px; font-weight:bold; color:#333; transform:translateX(-5%); white-space:nowrap;\\">你们两个能不能正常一点啊……</span>\\n            </div>\\n            <p>这个世界存在着魔王和他的军队，冒险者们聚集在\\"阿克塞尔\\"这样的新手城镇，通过在冒险者公会接取任务来赚取生活费和声望。与传统的英雄故事不同，素晴世界的冒险者们各有各的缺点和怪癖，正是这些不完美让故事变得格外有趣。</p>\\n            <p>在这款TRPG中，你将创造属于自己的角色，加入这个荒唐又美好的世界。也许你会成为像和真那样多才多艺的冒险者，像惠惠那样只会爆炸魔法的疯狂大法师，像达克妮丝那样打不中敌人却异常耐打的十字军骑士，或者像阿库娅那样能力强大却智力堪忧的大祭司。</p>\\n            <div style=\\"clear:both;\\"></div>\\n        "},{"i":3,"ch":"简介","chTitle":"欢迎来到TRPG的世界","title":"关于本规则书","id":"intro-about","html":"\\n            <div class=\\"note\\"><strong>📌 阅读前请注意：</strong>本文件为《为美好的世界献上祝福！TRPG》规则书的中文翻译版。原书共326页，本版本包含了核心规则的翻译内容。文中以\\"📝 译者补充（非原版内容）\\"标注的内容为译者自行添加的补充说明，非原书内容；以\\"💡 译者注\\"标注的内容为翻译时的注释说明。</div>\\n            <p>本规则书包含了你在《为美好的世界献上祝福！》世界中进行TRPG游戏所需的核心内容：</p>\\n            <p><strong>游戏实录</strong>——原作者晓夏目等人实际游玩素晴TRPG的完整记录（新增）。</p>\\n            <p><strong>第一章 世界设定</strong>——了解阿克塞尔、魔王军和冒险者公会的背景信息。</p>\\n            <p><strong>第二章 角色创建</strong>——从种族、职业到属性、技能的完整创建流程。</p>\\n            <p><strong>第三章 种族</strong>——转生者、原住民、红魔族三种族的特性。</p>\\n            <p><strong>第四章 职业</strong>——12种初始职业及4种进阶职业详解。</p>\\n            <p><strong>第五章 技能</strong>——种族技能、职业技能与通用技能的详细说明。</p>\\n            <p><strong>第六章 装备</strong>——武器、防具、盾牌、饰品、道具与魔法物品。</p>\\n            <p><strong>第七章 游戏规则</strong>——核心判定机制、祝福系统、经验值与角色成长。</p>\\n            <p><strong>第八章 战斗</strong>——战斗流程、行动、伤害与状态异常。</p>\\n            <p><strong>第九章 魔法</strong>——魔法系统与法术列表。</p>\\n            <p><strong>第十章 游戏主持人指南</strong>——如何主持游戏与设计冒险。</p>\\n            <p><strong>第十一章 模组</strong>——可直接使用的示范冒险剧本。</p>\\n        "},{"i":4,"ch":"简介","chTitle":"欢迎来到TRPG的世界","title":"进行游戏所需的准备","id":"intro-materials","html":"\\n            <p>进行素晴TRPG游戏，你需要准备以下物品：</p>\\n            <p><strong>必备物品：</strong></p>\\n            <ul>\\n                <li>本规则书（至少一本，建议主持人与玩家各准备一本）</li>\\n                <li>六面骰（D6）若干——素晴TRPG主要使用六面骰进行判定</li>\\n                <li>角色卡——可以复印附录中的空白角色卡，或自行制作</li>\\n                <li>铅笔和橡皮</li>\\n                <li>笔记用纸</li>\\n            </ul>\\n            <p><strong>推荐物品：</strong></p>\\n            <ul>\\n                <li>各种多面骰（D4、D8、D10、D12、D20）——部分技能和魔法可能用到</li>\\n                <li>方格纸或地图——用于战斗时标记位置</li>\\n                <li>指示物或棋子——代表角色和敌人的位置</li>\\n                <li>零食和饮料——TRPG会话可能会持续数小时</li>\\n            </ul>\\n            <div class=\\"note\\"><strong>注意：</strong>素晴TRPG的核心判定使用D6（六面骰），这与许多使用D20的TRPG不同。请确保准备至少3-5颗六面骰，每位玩家都应该有自己的骰子。</div>\\n        "},{"i":5,"ch":"术语与规则","chTitle":"术语表与会话流程","title":"术语表 1 —— 基础概念","id":"term-basics","html":"\\n            <p>以下是对素晴TRPG中使用的游戏术语的说明。遇到不熟悉的术语时可以随时查阅。</p>\\n            <table>\\n                <tr><th>术语</th><th>说明</th></tr>\\n                <tr><td><strong>分数处理</strong></td><td>除法等运算产生小数时，除非特别说明，一律向下取整（舍去小数）。</td></tr>\\n                <tr><td><strong>nd6</strong></td><td>掷n颗六面骰并将结果相加。例如\\"2d6\\"表示掷2颗六面骰求和。</td></tr>\\n                <tr><td><strong>d66</strong></td><td>掷两颗六面骰，一颗作为十位、一颗作为个位，产生11~66的结果。用于随机表。掷骰前需先决定哪颗是十位、哪颗是个位。</td></tr>\\n                <tr><td><strong>RoC（掷骰或选择）</strong></td><td>掷骰或选择。可以选择掷骰决定结果，也可以自行选择想要的结果。也可以先掷骰再选择是否采用。当表中出现骰子无法产生的数字（如00）时，必须自愿选择该项。</td></tr>\\n                <tr><td><strong>描述格式</strong></td><td>新的重要术语以粗体标注（通常在解释该术语的章节中）。能力值名称首字母大写（如Strength、Base Strength等）。技能名称和作弊能力名称首字母大写（如Strong Attack）。陷阱名称和物体名称首字母大写。公式中方括号\\"[ ]\\"内的内容需替换为对应数值。</td></tr>\\n                <tr><td><strong>GM（游戏主持人）</strong></td><td>游戏主持人。负责主持游戏、处理游戏中发生的事件、准备数据和裁定规则。</td></tr>\\n                <tr><td><strong>玩家</strong></td><td>除GM以外的游戏参与者。每位玩家创建一个角色作为自己的化身，通过该角色进行游戏。</td></tr>\\n                <tr><td><strong>原作</strong></td><td>指《为美好的世界献上祝福！》的轻小说系列原作。</td></tr>\\n            </table>\\n        "},{"i":6,"ch":"术语与规则","chTitle":"术语表与会话流程","title":"术语表 2 —— 规则术语","id":"term-rules","html":"\\n            <table>\\n                <tr><th>术语</th><th>说明</th></tr>\\n                <tr><td><strong>HP（生命值）</strong></td><td>生命值。原作中称为\\"体力\\"。衡量角色承受伤害的能力，受到伤害时减少。HP可以降至0以下。HP降至0以下时角色陷入昏迷，有死亡危险。</td></tr>\\n                <tr><td><strong>MP（精神值）</strong></td><td>魔力值。原作中称为\\"魔力\\"或\\"法力\\"。使用技能等时消耗。与HP不同，MP最低只能降至0。</td></tr>\\n                <tr><td><strong>NPC</strong></td><td>非玩家角色。由GM操控的不属于玩家的角色。</td></tr>\\n                <tr><td><strong>PC</strong></td><td>玩家角色。由玩家操控的角色。通常一名玩家只操控一个角色。</td></tr>\\n                <tr><td><strong>角色等级（Character Level）</strong></td><td>衡量角色强度和冒险经验广度的数值。等级越高通常越强大。有时简写为CL。</td></tr>\\n                <tr><td><strong>职业（Class）</strong></td><td>原作中也称为\\"职业\\"或\\"工作\\"。描述角色在战斗和冒险中的定位。例如用武器战斗的战士、使用魔法的法师等。</td></tr>\\n                <tr><td><strong>初始职业（Starter Class）</strong></td><td>首次创建角色时可以选择的职业。</td></tr>\\n                <tr><td><strong>进阶职业（Advanced Class）</strong></td><td>比初始职业更专业化的职业。角色等级达到10以上时可转职。</td></tr>\\n                <tr><td><strong>技能（Skill）</strong></td><td>包括战斗技巧、魔法法术、开锁等特殊技能，以及精神敏锐等独特特质。</td></tr>\\n                <tr><td><strong>经验值（EXP）</strong></td><td>用于追踪玩家角色成长的点数。给予的是玩家而非角色。</td></tr>\\n                <tr><td><strong>会话（Session）</strong></td><td>一次完整的素晴TRPG游戏过程。</td></tr>\\n                <tr><td><strong>判定（Dice Roll / Check）</strong></td><td>掷骰子决定行动是否成功或攻击造成多少伤害等。</td></tr>\\n                <tr><td><strong>能力值（Ability Score）</strong></td><td>衡量角色力量、智力等的数值。共有七项：力量（STR）、灵巧（DEX）、敏捷（AGI）、智力（INT）、感知（PER）、精神（MND）、幸运（LUK）。</td></tr>\\n                <tr><td><strong>祝福（Blessings）</strong></td><td>代表玩家角色（即主角）在会话中可能性的能力。使用祝福可以获得各种加成，如重掷骰子或追加骰子。</td></tr>\\n                <tr><td><strong>自由动作（Free Action）</strong></td><td>在角色主要流程中可执行一次、不需要消耗次要动作或主要动作的动作。</td></tr>\\n                <tr><td><strong>次要动作（Minor Action）</strong></td><td>每轮可执行一次、不需要判定的动作。</td></tr>\\n                <tr><td><strong>移动动作（Move Action）</strong></td><td>每轮可执行一次、用于移动角色的动作。</td></tr>\\n                <tr><td><strong>主要动作（Major Action）</strong></td><td>每轮可执行一次、需要判定的动作。</td></tr>\\n                <tr><td><strong>轮次推进（Round Progression）</strong></td><td>战斗中使用的推进方式。分为多个称为\\"轮\\"的单位。</td></tr>\\n            </table>\\n        "},{"i":7,"ch":"术语与规则","chTitle":"术语表与会话流程","title":"术语表 3 —— 世界术语","id":"term-world","html":"\\n            <table>\\n                <tr><th>术语</th><th>说明</th></tr>\\n                <tr><td><strong>异世界（Isekai）</strong></td><td>字面意思是\\"另一个世界\\"或\\"平行宇宙\\"。本游戏的舞台是一个异世界——简而言之，一个类似奇幻电子游戏中描绘的世界。与现代日本不同，这里存在魔法。部分文明和文化让人联想到地球的中世纪。</td></tr>\\n                <tr><td><strong>故事内时间</strong></td><td>本游戏的时间设定大约与原作第一卷相同。更具体地说，是和真和阿库娅来到异世界的时候。</td></tr>\\n                <tr><td><strong>阿克塞尔（Axel）</strong></td><td>新手冒险者聚集的城镇。本游戏和原作的主要舞台。地理上，它是距离魔王城最远的聚居地，周围出现的怪物相对较弱。城镇本身被石墙环绕加固。</td></tr>\\n                <tr><td><strong>冒险者（Adventurer）</strong></td><td>狭义上，冒险者是PC可以选择的职业之一。广义上，任何受雇于冒险者公会、从事讨伐怪物或护送商人等工作的人都被称为冒险者。本游戏中所有玩家角色都是冒险者。</td></tr>\\n                <tr><td><strong>冒险者公会</strong></td><td>组织和管理冒险任务的场所。也收购冒险者在冒险中收集的物品。同时兼营餐厅和酒馆。加入公会需支付1000厄里斯。本游戏中所有玩家角色已支付此费用。</td></tr>\\n                <tr><td><strong>旅馆</strong></td><td>许多在阿克塞尔没有固定住所的冒险者使用的住宿设施。与日本相比价格较高。</td></tr>\\n                <tr><td><strong>马厩</strong></td><td>阿克塞尔中用于安置马匹的设施。人也可以在此住宿，价格比旅馆便宜。没有多余金钱的冒险者住在这里。</td></tr>\\n                <tr><td><strong>贝尔泽格王国</strong></td><td>阿克塞尔所在的国家。顾名思义，由君主统治，贵族在等级制度中位居其次。</td></tr>\\n                <tr><td><strong>女神阿库娅</strong></td><td>负责引导日本年轻亡者的女神。同时也是水之女神。她原本将日本的亡者送往异世界成为英雄，但因为一次意外，她和和真一起亲自去了异世界。</td></tr>\\n                <tr><td><strong>阿克西斯信徒</strong></td><td>信仰女神阿库娅的人。非信徒认为他们是怪人，最好远离。</td></tr>\\n                <tr><td><strong>女神厄里斯</strong></td><td>幸运女神，异世界中最受崇拜的神祇。世界的货币也以她的名字命名。</td></tr>\\n                <tr><td><strong>厄里斯信徒</strong></td><td>信仰女神厄里斯的人。据说是异世界最大的信仰。巧合的是，阿克西斯信徒对厄里斯及其信徒有着强烈的敌意。</td></tr>\\n                <tr><td><strong>红魔族</strong></td><td>拥有绯红色眼睛的族群，居住在红魔之乡。天生拥有极强的魔力和智力，适合施展法术。一般来说，他们的名字非常不寻常，许多人行为夸张、戏剧化。</td></tr>\\n                <tr><td><strong>怪物</strong></td><td>栖息在异世界中的各种魔法生物。从哥布林和狗头人到卷心菜和莴苣，种类繁多。</td></tr>\\n                <tr><td><strong>魔王</strong></td><td>魔族之王。率领军队入侵人类国家。</td></tr>\\n                <tr><td><strong>魔王军</strong></td><td>以魔王为首的军队。包括八位被称为将军的恶魔。</td></tr>\\n                <tr><td><strong>勇者</strong></td><td>已经打倒魔王或有很大机会在未来打倒魔王的人。有时，从地球转生而来的人会被视为勇者候补。</td></tr>\\n            </table>\\n        "},{"i":8,"ch":"术语与规则","chTitle":"术语表与会话流程","title":"会话流程概述","id":"session-overview","html":"\\n            <p>一次素晴TRPG的完整游戏过程称为<strong>会话（Session）</strong>。会话按以下大框架推进：</p>\\n            <div class=\\"note\\">\\n                <strong>游戏流程：</strong><br>\\n                预备游戏（Preplay）→ 正式游戏（Main Play）→ 结束游戏（After Play）<br>\\n                正式游戏又分为四个阶段：<br>\\n                · 开场阶段（Opening Phase）<br>\\n                · 中间阶段（Middle Phase）<br>\\n                · 高潮阶段（Climax Phase）<br>\\n                · 结局阶段（Ending Phase）\\n            </div>\\n\\n            <h4>一、预备游戏（Preplay）</h4>\\n            <p>在正式开始游戏之前，需要完成以下准备工作。</p>\\n            <p><strong>游戏前的准备：</strong></p>\\n            <ul>\\n                <li><strong>心理准备</strong>：所有参与者都需要有一起享受游戏的意愿。心不在焉地玩和带着明确目标地玩，结果会有天壤之别。</li>\\n                <li><strong>身体准备</strong>：注意身体健康，避免在游戏当天感冒或受伤。不要熬夜导致游戏中犯困。</li>\\n                <li><strong>阅读规则书</strong>：不需要记住每一个字，但知道在哪里能找到相关规则的信息会让游戏进行得更顺畅。</li>\\n                <li><strong>准备剧本</strong>：GM需要准备本次会话使用的冒险剧本。如果所有人都是新手，推荐使用规则书中的示范模组\\"竹笋美味\\"。</li>\\n                <li><strong>准备工具</strong>：确保有角色卡、记录卡、骰子和书写工具。</li>\\n            </ul>\\n            <p><strong>游戏当天的准备：</strong></p>\\n            <ol>\\n                <li><strong>分发表格</strong>：GM向每位玩家分发角色卡和记录卡。</li>\\n                <li><strong>宣读预告</strong>：GM向所有玩家宣读本次冒险的预告（Preview）。预告用于设定舞台，让玩家了解会话的内容。可以想象成动画的\\"下集预告\\"。</li>\\n                <li><strong>角色创建与检查</strong>：GM让每位玩家创建角色。如果可能，可以让玩家在游戏日之前完成角色创建以节省时间。创建完成后，GM审阅角色卡确保没有遗漏或错误。</li>\\n                <li><strong>使用作弊能力</strong>（可选）：根据GM的判断，会话中可以包含作弊能力的使用。</li>\\n                <li><strong>填写会话卡</strong>：GM在会话卡上写下剧本名称、会话日期和自己的名字。然后将会话卡传给其他玩家，让他们写下各自角色的信息。</li>\\n                <li><strong>决定生活方式</strong>：GM询问每位玩家本次会话中角色的生活方式。生活方式代表角色在会话期间的生活水平，会影响修正值和会话结束后需要支付的金额。</li>\\n                <li><strong>填写记录卡</strong>：每位玩家在自己的记录卡上写下会话日期、自己的名字、角色名、GM名字和剧本名称。还需抄写角色的最大HP、最大MP和祝福数。</li>\\n                <li><strong>决定座位</strong>：玩家可以自行决定座位，但建议GM坐在桌子长边的正中间。这样GM到每位玩家的距离大致相等，有助于游戏顺畅进行。</li>\\n                <li><strong>自我介绍</strong>：让每位玩家介绍自己的角色。应公开的重要信息包括：角色的姓名、年龄和性别；选择的种族和职业；角色的外貌特征。</li>\\n                <li><strong>组建队伍</strong>：玩家介绍完角色后，需要组建队伍。队伍是一起行动的冒险者团体。最好决定一名队长。队长是队伍的代表，在接受任务和决定去向等事项上有最终决定权。其他成员如果对队长的决定有异议，可以提出。如果超过半数的成员同意，可以否决队长的决定。</li>\\n            </ol>\\n\\n            <h4>二、正式游戏（Main Play）</h4>\\n            <p>正式游戏是使用剧本进行游戏的部分。正式游戏分为四个阶段，每个阶段包含多个<strong>场景（Scene）</strong>。</p>\\n            <div class=\\"note\\"><strong>场景（Scene）：</strong>场景是游戏中的单个情境。你可以把场景想象成电影或电视剧中的一个场景。会话是这些场景的集合，更大的剧本提供了将每个场景联系在一起的信息。GM可以根据游戏的进展创建剧本中未准备的场景。如果玩家需要GM创建场景，也可以提出请求。但GM对创建何种场景以及何时创建拥有最终决定权。</div>\\n            <p><strong>场景的入场与退场：</strong>只有出现在场景中的角色才能参与该场景。角色进入场景称为\\"入场\\"，离开场景称为\\"退场\\"。GM可以自由决定谁将进入场景，也可以让其他角色在场景中途进入（或强制进入），还可以让已入场的角色退出场景。玩家如果想让自己的角色进入场景，可以向GM请求。GM应根据场景中的当前状况和是否有利于场景本身来决定是否允许。退场与入场方式相同，在GM的许可下，PC可以随时退出场景。</p>\\n            <p><strong>场景推进顺序：</strong></p>\\n            <ol>\\n                <li>指定进入场景的角色</li>\\n                <li>开始场景（GM说明场景地点和目标）</li>\\n                <li>PC入场请求</li>\\n                <li>演绎场景</li>\\n                <li>结束场景（GM随时可以宣布场景结束）</li>\\n            </ol>\\n            <p><strong>主场景（Master Scene）：</strong>GM可以设置玩家角色不出场的场景，称为主场景。主场景可以描述没有玩家角色的地点发生的事情，或者讲述故事幕后的情况——用于向玩家提供你希望他们知道的信息，即使他们的角色不会知道。电影、小说和漫画也有远离主角的部分，是为了观众或读者的利益。在桌面RPG中，玩家既是故事中出现的角色，也是观众（或读者）。</p>\\n\\n            <h4>1. 开场阶段（Opening Phase）</h4>\\n            <p>开场阶段是会话中故事的引言。GM解释和/或演绎PC的目标以及与PC相关的事件。通常，一旦PC接受任务，开场阶段即告结束。</p>\\n            <p><strong>任务（Quest）：</strong>任务是由冒险者公会管理的冒险者工作。通过完成任务，玩家角色可以获得报酬。</p>\\n            <p><strong>任务与战役：</strong>最常见的格式是地城格式，PC在开场阶段被赋予任务并在剧本结束前完成。但也可以创建跨越多个剧本的宏大故事。一次完成的剧本或其中单个任务称为<strong>任务（Mission）</strong>，由多个任务组成的剧本称为<strong>战役（Campaign）</strong>。</p>\\n\\n            <h4>2. 中间阶段（Middle Phase）</h4>\\n            <p>中间阶段分为<strong>地城场景</strong>和<strong>调查场景</strong>。中间阶段在进入高潮阶段时结束。</p>\\n            <p><strong>地城场景：</strong>地城场景就是玩家角色探索地城的场景。每个独立的房间或通道在玩家进入时会切换场景，这些独立空间称为<strong>区域（Area）</strong>。通常一个区域视为一个场景。</p>\\n            <p><strong>调查场景：</strong>调查场景包括前往地城之前的场景，或玩家调查地城本身或任务的场景。用于玩家试图寻找地城、核实工作或委托人等情况。</p>\\n\\n            <h4>3. 高潮阶段（Climax Phase）</h4>\\n            <p>高潮阶段是玩家与真正的敌人——Boss角色战斗的阶段。当然，这个阶段不一定要涉及战斗，但这是最令人兴奋的战斗时机。通常，这个阶段是玩家利用一切优势全力以赴的时候。当所有挡路的敌人被击败时，高潮阶段结束。</p>\\n\\n            <h4>4. 结局阶段（Ending Phase）</h4>\\n            <p>结局阶段是故事的尾声，角色演绎尘埃落定后发生的事情。可以包括任务委托人感谢他们的场景，或分配报酬的场景。场景类型取决于剧本本身和会话的结果。</p>\\n            <p>当结局阶段结束且GM宣布剧本结束时，正式游戏结束，进入结束游戏阶段。</p>\\n\\n            <h4>三、结束游戏（After Play）</h4>\\n            <ol>\\n                <li><strong>生活方式付款</strong>：玩家角色支付所选生活方式的费用。玩家不能在结束游戏阶段为其他玩家付款。PC之间可以在结局阶段结束前互相交易金钱。如果玩家无法支付生活方式费用，其获得的经验值会减少。在战役中，GM可以将未支付的金额视为债务，并可能在未来的剧本中将其编入故事。</li>\\n                <li><strong>经验值分配</strong>：GM向所有玩家分配经验值。玩家也通过在会话卡上记录向GM分配经验值。</li>\\n                <li><strong>检查玩家角色</strong>：\\n                    <ul>\\n                        <li><strong>死亡角色</strong>：死亡的玩家角色从游戏中移除。玩家应像对待墓碑一样保管角色卡。即使角色死亡，玩家仍然正常获得经验值。</li>\\n                        <li><strong>存活角色</strong>：所有存活角色现在为下一次冒险做准备。恢复所有在正式游戏中受到的伤害（不延续到下次会话）。祝福数恢复到会话开始前的数值。讨论如何公平分配在剧本中获得的物品和金钱。将获得的物品和金钱从记录卡转移到各自的角色卡上。不需要的物品可以出售换钱。如果角色死亡，所有玩家应讨论如何处理其应得的报酬份额。</li>\\n                        <li><strong>角色成长</strong>：玩家可以使用获得的经验值来提升角色。</li>\\n                    </ul>\\n                </li>\\n                <li><strong>收拾整理</strong>：所有玩家角色完成需要做的事情后，收拾使用的空间。这很重要，这样房主、设施管理员等才会乐意让你在未来的会话中继续使用。收拾完毕后，转移到咖啡馆或餐厅等地，谈论刚才的会话并为下一次做准备，也是非常有趣的！</li>\\n            </ol>\\n        "},{"i":9,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"关于本实录","id":"replay-intro","html":"\\n            <p>游戏实录（Replay）是将一群人实际游玩TRPG的过程以文字形式记录下来的产物。本实录中，<strong>《为美好的世界献上祝福！》的原作者晓夏目亲自参与游戏</strong>，此外还有多位著名轻小说作家加盟——这是一场真正的\\"创作者特别局\\"！</p>\\n            <div class=\\"note\\"><strong>阅读建议：</strong>如果你是TRPG新手，建议先阅读本实录来了解游戏的实际玩法。你可以看到玩家们如何创建角色、如何与GM互动、如何用骰子决定命运——以及素晴TRPG特有的搞笑与混乱。实录中还穿插了规则解说，是理解游戏系统的最佳入门。</div>\\n        "},{"i":10,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"登场人物","id":"replay-cast","html":"\\n            <p><strong>游戏主持人（GM）：</strong></p>\\n            <ul>\\n                <li><strong>大畑明（Akira Ohata）</strong>——本规则书的主要游戏设计师，来自F.E.A.R.公司。资深TRPG设计师，在多款TRPG的回放和规则编写中有出色表现。</li>\\n            </ul>\\n            <p><strong>玩家：</strong></p>\\n            <ul>\\n                <li><strong>晓夏目（Natsume Akatsuki）</strong>——《为美好的世界献上祝福！》原作者。换言之，他是素晴TRPG的\\"生父\\"。扮演角色：<em>克拉里昂·希特·吉尔伯特</em>（原住民·祭司）</li>\\n                <li><strong>Blitz/Kiva</strong>——轻小说《在VRMMO中氪金变强》作者。扮演角色：<em>铃木千穗</em>（转生者·冒险者）</li>\\n                <li><strong>长月达平（Tappei Nagatsuki）</strong>——《Re:ZERO》作者。扮演角色：<em>御洗手乙姬</em>（转生者·战士）</li>\\n                <li><strong>三上延（Teren Mikami）</strong>——《勇者无罪》作者。扮演角色：<em>特米琳</em>（红魔族·法师）</li>\\n            </ul>\\n            <div class=\\"example\\"><strong>有趣的事实：</strong>开场的第一个笑点——当GM大畑紧张地走进会议室时，这些知名作家们反而激动地喊道\\"是大畑老师本人！\\"\\"我没想到能亲眼见到他！！\\"。原来他们全都是大畑参与过的其他TRPG回放的粉丝，甚至有人的\\"推\\"是大畑以前扮演的角色Bennett（\\"我可是从Bennett还没穿上盔甲的时候就是粉丝了！\\"）。GM还没开始主持就被玩家们反客为主地追捧了一番。</div>\\n        "},{"i":11,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"角色创建——四位独特的冒险者","id":"replay-chargen","html":"\\n            <p>在GM的带领下，四位玩家首先创建了各自的角色。以下为每个角色选择了<strong>作弊能力（Cheat）</strong>——这是素晴TRPG的可选规则，用于还原原作中转生者携带\\"外挂\\"的设定。</p>\\n        "},{"i":12,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"吉尔伯特——阿库西斯教的祭司","id":"replay-gilbert","html":"\\n            <p><strong>玩家：晓夏目（原作者）</strong></p>\\n            <table>\\n                <tr><td>角色名</td><td>克拉里昂·希特·吉尔伯特</td></tr>\\n                <tr><td>种族</td><td>原住民</td></tr>\\n                <tr><td>职业</td><td>祭司（阿库西斯教派）</td></tr>\\n                <tr><td>出身</td><td>秘密特工——贵族家庭的第六子，奉命潜入厄里斯教会调查</td></tr>\\n                <tr><td>境遇</td><td>挚友——虽然设定有挚友，但实际上\\"没有朋友\\"</td></tr>\\n                <tr><td>目标</td><td>打倒魔王——在阻止厄里斯教会施粥时获得了神谕</td></tr>\\n                <tr><td>作弊</td><td>邪恶气场——脸太恐怖，可以每剧本一次让对手的判定失误。代价是买东西要付双倍价格，因为店主都不愿靠近他</td></tr>\\n            </table>\\n            <p>吉尔伯特是阿库西斯教——信仰女神阿库娅的教派——的祭司。尽管出身贵族，却投身于对抗最大的宗教\\"厄里斯教会\\"的事业。他有一张可怕的凶脸（三上：\\"厄里斯教会明明没做错什么吧？\\" 晓夏目：\\"我觉得他们是邪恶的。\\"），正是这张脸让他获得了作弊能力\\"邪恶气场\\"。</p>\\n        "},{"i":13,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"千穗——健康身体与圣剑的冒险者","id":"replay-chiho","html":"\\n            <p><strong>玩家：Blitz/Kiva</strong></p>\\n            <table>\\n                <tr><td>角色名</td><td>铃木千穗</td></tr>\\n                <tr><td>种族</td><td>转生者（来自现代日本）</td></tr>\\n                <tr><td>职业</td><td>冒险者</td></tr>\\n                <tr><td>出身</td><td>视频——生前体弱多病，喜欢窝在家里看网络视频。某天边看手机边走路时被卡车撞死</td></tr>\\n                <tr><td>境遇</td><td>体弱——生前常年卧病，转生后因夸奖阿库娅而被赐予健康身体</td></tr>\\n                <tr><td>目标</td><td>任务——被阿库娅嘱咐用圣剑打倒魔王</td></tr>\\n                <tr><td>作弊</td><td>圣宝持有者：武器——获得名为\\"克拉伦特\\"的巨型圣剑。剑太大无法背着，只能用链条挂在腰间拖着走。没有圣剑时会遭受-2D6判定惩罚</td></tr>\\n            </table>\\n            <p>千穗是Blitz/Kiva精心打造的冒险者角色。\\"冒险者职业的酷炫之处在于可以拥有其他职业的技能！\\"——千穗学习了多种跨职业技能，专门用来展示冒险者的多才多艺。</p>\\n            <div class=\\"note\\"><strong>GM提醒：</strong>\\"走路的时候不要看手机啊，孩子们！\\"——长月达平的角色乙姬正是为了救低头看手机走路的人而被牵连撞死的。</div>\\n        "},{"i":14,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"乙姬——绝不赴死的谨慎战士","id":"replay-otohime","html":"\\n            <p><strong>玩家：长月达平（《Re:ZERO》作者）</strong></p>\\n            <table>\\n                <tr><td>角色名</td><td>御洗手乙姬（Otohime Mitarai）——19岁男性，名字是父母随便起的</td></tr>\\n                <tr><td>种族</td><td>转生者</td></tr>\\n                <tr><td>职业</td><td>战士</td></tr>\\n                <tr><td>出身</td><td>卡车——极度谨慎的他，某天看到一个低头看手机的女孩……然后为了救她，自己也被卡车撞死了</td></tr>\\n                <tr><td>境遇</td><td>女神的秘密——被阿库娅赋予了\\"死亡回归\\"能力，但他非常非常不想死</td></tr>\\n                <tr><td>目标</td><td>没有目标——除了活下去！</td></tr>\\n                <tr><td>作弊</td><td>死亡回归（Return by Death）——可以在死亡时复活！代价是失去1点祝福</td></tr>\\n            </table>\\n            <p>乙姬是个子高大但极度谨慎的美男子。作为《Re:ZERO》的作者，长月达平拿着\\"死亡回归\\"这个显然是致敬自己作品的能力——但一心想的是\\"绝对不要死\\"。（晓夏目：\\"写出《Re:ZERO》的人居然拒绝复活的设定……\\"）他的作弊能力在后面的Boss战中起到了关键作用。</p>\\n        "},{"i":15,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"特米琳——沉迷少女漫画的红魔族法师","id":"replay-temiren","html":"\\n            <p><strong>玩家：三上延</strong></p>\\n            <table>\\n                <tr><td>角色名</td><td>特米琳（Temiren）——16岁</td></tr>\\n                <tr><td>种族</td><td>红魔族</td></tr>\\n                <tr><td>职业</td><td>法师</td></tr>\\n                <tr><td>出身</td><td>施法者——在作为法师修行的过程中，目标是成为大法师</td></tr>\\n                <tr><td>境遇</td><td>安静的生活——对红魔族停滞不前的生活感到无聊，偶然遇到了少女漫画并彻底上瘾</td></tr>\\n                <tr><td>目标</td><td>友情——遇到了吉尔伯特这张凶脸，\\"在少女漫画里，长着这种可怕面孔的角色绝对不可能是坏人！\\"</td></tr>\\n                <tr><td>作弊</td><td>破坏魔法力量——每剧本一次，魔法攻击伤害+10D6。代价是MP消耗翻倍</td></tr>\\n            </table>\\n            <p>特米琳是红魔之乡最棒澡堂老板的女儿，梦想着少女漫画般的浪漫邂逅。当她看到吉尔伯特的凶脸时，立即认定他就是自己命中注定的王子——\\"在少女漫画里，有着可怕面孔的角色绝对是好人，这是常识！\\"从此开始追随吉尔伯特，将他称为\\"我的王子（My Prince）\\"。</p>\\n            <div class=\\"example\\"><strong>经典桥段：</strong>吉尔伯特抱怨：\\"特米琳，嗯？这个名字真难记。我要求见见发明红魔族奇怪美学的人！\\" 全场异口同声：\\"就是你啊！！\\"（发明红魔族设定的正是原作者晓夏目本人）</div>\\n        "},{"i":16,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"冒险开始——「初次冒险的幸运！」","id":"replay-adventure","html":"\\n            <p>这次冒险的剧本名为<strong>「初次冒险的幸运！」（Fortune on This First Adventure）</strong>，是为1级冒险者设计的入门任务。</p>\\n\\n            <h4>序幕：公会委托</h4>\\n            <p>故事开始于阿克塞尔的冒险者公会。四位新人冒险者——吉尔伯特、千穗、乙姬和特米琳——在公告板前浏览任务。所有\\"好任务\\"都被其他冒险者抢走了，最后只剩下一张委托：</p>\\n            <table>\\n                <tr><td>任务类型</td><td>讨伐</td></tr>\\n                <tr><td>期限</td><td>3天</td></tr>\\n                <tr><td>报酬</td><td>100 KE + 额外要求奖励</td></tr>\\n                <tr><td>详情</td><td>\\"巨型蟾蜍从山上下来，正在袭击农场。请消灭它们。\\"</td></tr>\\n                <tr><td>达成条件</td><td>在终幕阶段结束前至少击败4只巨型蟾蜍</td></tr>\\n            </table>\\n            <p>乙姬（谨慎地）：\\"巨型蟾蜍啊……不知道它们到底有多大呢。\\"（假装不知道——作为转生者，角色在扮演\\"不了解这个世界\\"）</p>\\n            <p>当两人还在犹豫时，公会接待员露娜过来催促。吉尔伯特突然跳上桌子，向所有冒险者宣布：\\"听我说，各位！女神阿库娅已指定所有蛙类为她的敌人！\\" 千穗：\\"那我们就接这个任务了。\\"</p>\\n            <p>于是，四人组成了队伍——吉尔伯特和特米琳因为\\"打倒魔王\\"的目标加入，千穗和乙姬则是奉阿库娅之命。四个各有怪癖的新手冒险者，就此踏上了第一次远征。</p>\\n\\n            <h4>中幕1：出发前的购物</h4>\\n            <p>在接受任务后，队员们先去市场购买装备。千穗购买了2个小型魔力石（玛纳石）用于恢复MP。此时乙姬终于向千穗坦白——\\"千穗，我不知道我们能不能活着回来，所以趁现在我想告诉你……你被卡车撞的时候，我其实想救你的……\\" 千穗：\\"……啊，我知道。其实我也要谢谢你——多亏那次事故，我现在拥有健康的身体了。\\"</p>\\n            <p>特米琳看到这一幕嫉妒极了——她一把抓住吉尔伯特的胳膊把他推到墙边：\\"来嘛，我的王子！给我点什么！不说些甜蜜的话的话，我的魔法力量可是发挥不出来的哦……\\" 吉尔伯特：\\"我打她！\\"（全场爆笑）</p>\\n            <p>（注：这就是经典的\\"壁咚\\"——特米琳把吉尔伯特推到墙上，而他的反抗只会让她更开心。）</p>\\n\\n            <h4>中幕2：与巨型蟾蜍的死斗！</h4>\\n            <p>队伍跋涉半天来到了山中农场。眼前的景象令人震惊——奶牛和猪的躯体被巨大的舌头缠绕、拖拽，而三只比家畜还庞大的巨型蟾蜍正站在它们身后！</p>\\n            <p>乙姬：（看着比人还大的蟾蜍）\\"这跟我预想的完全不一样啊！！一般来说最先打的不是哥布林或者什么小怪物吗？！\\"</p>\\n            <p>吉尔伯特：\\"世界上除了哥布林还有很多敌人的。\\" 乙姬：\\"这就是我讨厌异世界的原因！！\\"（全场爆笑——写出《Re:ZERO》的人说出这句话，分量格外重）</p>\\n            <p>战斗开始。吉尔伯特冲在最前面，朝巨型蟾蜍挥舞着钉头锤——同时发出可怕的吼声。特米琳紧随其后，大叫\\"我的王子，我来支援你！\\" 千穗拔出巨大的圣剑克拉伦特，而乙姬……站在最后面，谨慎地观察着局面。</p>\\n            <p>在激烈的战斗中，<strong>特米琳发动了她的作弊能力\\"破坏魔法力量\\"</strong>——这是她每剧本一次的超强魔法增强。她施展了\\"冰冻强风\\"（Freeze Gust），目标锁定两只巨型蟾蜍。使用祝福增加骰子后，她掷出了<strong>14D6的魔法伤害</strong>——\\"见证我王子决定庇护之下的那个人的力量。我的名字是特米琳！红魔族最伟大澡堂老板的女儿。她梦想着少女漫画。并且是冰冻魔法的使用者！冰冻强风！！\\"</p>\\n            <p>掷骰结果：<strong>50点伤害</strong>。两只巨型蟾蜍被瞬间冻结，然后被吉尔伯特的钉头锤敲碎。GM（大畑）：\\"十四颗骰子？！这也太夸张了吧！\\" 千穗：\\"这可是你自己设计的规则啊，大畑老师。\\"</p>\\n        "},{"i":17,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"Boss战——蛙王弗洛格的野望","id":"replay-boss","html":"\\n            <p>消灭了巨型蟾蜍后，队员们进入洞穴深处。里面不仅有更多蟾蜍，还有一个坐在宝座上的庞然大物——<strong>蛙王弗洛格（Frogger）</strong>。他曾经是一名不诚实的冒险者，偷了神圣宝物后被诅咒变成了半人半蛙的怪物，现已加入魔王军。他还绑架了农场主最珍爱的奶牛\\"花子\\"（Hanako），正打算拿她来宴请部下。</p>\\n            <p>弗洛格用他的魔法杖召唤出大量蝌蚪，喷出黏液攻击队员。在某一轮中，他对千穗和乙姬同时发动了范围魔法攻击——伤害高达32点。</p>\\n            <p><strong>关键时刻——</strong>乙姬冲到千穗面前，用\\"掩护\\"（Cover）技能替她承受了全部伤害。HP瞬间归零……但就在这时，阿库娅赐予他的作弊能力<strong>\\"死亡回归\\"</strong>触发了！</p>\\n            <p>乙姬：\\"带着残破的身体，我重生了！这就是从女神阿库娅本人那里获得的祝福——死亡回归！吉尔，你的祈祷得到回应了！！\\"</p>\\n            <p>吉尔伯特：\\"我明白了。多亏了你，我感觉自己在这整个游戏里第一次做了祭司该做的事情！\\"（全场爆笑）</p>\\n            <p>千穗：\\"这是阿库西斯教会的力量！\\" 特米琳：\\"我最初只是被王子邀请才加入阿库西斯教的……但我感觉自己终于觉醒了新的信仰！\\"</p>\\n            <p>四人齐声：\\"阿克娅女神万岁！！\\" GM：（担忧地）\\"如果有人先读了这个回放再读原作，他们会以为阿库西斯教很伟大……\\"</p>\\n\\n            <h4>终幕——千穗的全力一击</h4>\\n            <p>在第二轮战斗中，千穗抓住机会对蛙王发动了全力攻击。她用移动动作施展\\"快速拔刀术\\"，辅助动作使用\\"佯攻\\"削弱弗洛格的回避，然后——</p>\\n            <p>千穗：\\"我使用3点祝福。\\"（掷骰）\\"<strong>46点伤害！</strong>\\"</p>\\n            <p>弗洛格试图用双手接住劈下的巨剑——但之前他自己喷出的黏液让他脚底打滑，整个人失去平衡，被巨剑正面命中。</p>\\n            <p>千穗：\\"这不是人类的力量——这是<strong>阿库西斯教会</strong>的力量！\\"</p>\\n            <p>弗洛格：（倒下前）\\"我永远不会承认阿库西斯教会！永远不会……！\\"</p>\\n        "},{"i":18,"ch":"游戏实录","chTitle":"初次冒险的幸运！——官方游戏实录","title":"凯旋与庆功宴","id":"replay-ending","html":"\\n            <p>击败弗洛格后，队员们救出了奶牛花子。战利品非常丰厚：<strong>高级蛙肉×1、红宝石×5、蟾蜍黏液×3</strong>。他们还从洞穴中带回了被俘的商队护卫和车夫。</p>\\n            <p>回到阿克塞尔的冒险者公会，接待员微笑着迎接大家：\\"看来你们的冒险是成功的。报酬是<strong>100 KE</strong>，农场还因为你们救回了花子而追加了<strong>150 KE的奖金</strong>。\\"</p>\\n            <p>乙姬：\\"花子比整个任务还值钱！也许她是那种在评比会上获奖的牛？\\"</p>\\n            <p>吉尔伯特还特意向公会报告了\\"魔王军将军弗洛格\\"的威胁（虽然实际上弗洛格的等级远不到将军级别）。接待员看着记录，歪了歪头：\\"将军？嗯……有人冒充将军我也不奇怪。\\"（所有人大笑——她一眼就看穿了谎言！）</p>\\n            <p>千穗：\\"我觉得不能只怪弗洛格。他变成了蟾蜍后失去了希望。他的人生缺少了某种至关重要的东西。\\" 接待员：\\"那是什么呢？\\" 千穗：\\"<strong>信仰。</strong>\\"（接待员默默移开了视线）</p>\\n            <p>最后，四人走进阿克塞尔的酒馆，点了四杯麦酒，为第一次冒险的圆满成功干杯。吉尔伯特作为\\"掌管宴会的女神\\"阿库娅的信徒，表示要表演一个余兴节目——\\"自然奇观！\\"（阿库娅的招牌技能）。可惜，没有任何人学了\\"宴会技能\\"。</p>\\n            <p>吉尔伯特：\\"也许我该把技能点加到那个上面。\\" 乙姬：\\"加到宴会才艺上？！\\" 吉尔伯特：\\"根据我的信仰，这才是正确的选择。\\"</p>\\n            <p>GM：\\"……以上就是本次冒险的全部内容。感谢大家的游玩！\\" 全员：\\"谢谢！！\\"</p>\\n            <p style=\\"text-align:center;font-size:16px;font-weight:bold;\\">——《初次冒险的幸运！》完——</p>\\n            <div class=\\"note\\"><strong>素晴TRPG的黄金法则：</strong>正如这场回放所展现的——TRPG没有传统意义上的胜负。真正的\\"胜利\\"是所有人都乐在其中，一起创造了一个有趣的故事。哪怕角色会死、冒险会出岔子，只要享受这个过程，就是一场成功的游戏。</div>\\n        "},{"i":19,"ch":"第一章","chTitle":"世界设定——素晴的世界","title":"贝尔泽格王国","id":"world-overview","html":"\\n            <p>游戏的舞台是一个名为\\"贝尔泽格\\"的奇幻王国。这个王国曾经和平繁荣，但自从魔王出现后，各地开始受到魔王军的威胁。魔王在遥远的北方建立了自己的城堡，不断派遣麾下的干部和怪物骚扰人类领地。</p>\\n            <p>贝尔泽格王国实行冒险者制度。任何有实力的人都可以在冒险者公会登记，接受任务来讨伐怪物、探索遗迹或完成各种委托，以此赚取报酬和声望。</p>\\n            <p>这个世界生活着多种多样的居民。除了贝尔泽格王国本土出生的\\"原住民\\"之外，还有从现代日本等异世界转生而来的\\"转生者\\"，以及拥有绯红色眼睛和强大魔法天赋的\\"红魔族\\"——他们共同构成了这个世界冒险者的主体。</p>\\n            <p>正如和真所说，这是一个典型的剑与魔法的奇幻世界——精灵有着长耳朵，矮人身材矮小，还有长着猫耳的兽人。但在这个TRPG中，<strong>玩家的可选种族集中在三种与素晴故事最密切相关的种族上：转生者、原住民和红魔族</strong>。</p>\\n            <p>魔法在这个世界中是真实存在的。任何人只要天生具备魔力并经过学习训练，就可以使用魔法。魔力在生物体内自然产生，消耗后可以通过休息恢复。此外，这个世界上还存在被称为\\"技能\\"的特殊能力，这是每个人与生俱来或通过训练获得的独特天赋。</p>\\n        "},{"i":20,"ch":"第一章","chTitle":"世界设定——素晴的世界","title":"阿克塞尔——起始之城","id":"world-axel","html":"\\n            <p>阿克塞尔是贝尔泽格王国中一座典型的新手冒险者聚集的城市。位于王国的边境地带，周围分布着适合初级冒险者练级的怪物栖息地。城市规模适中，拥有完整的冒险者公会、商业区和居民区。</p>\\n            <p>阿克塞尔的冒险者公会是一座大型石造建筑，一楼是任务发布大厅，二楼是公会职员办公室。大厅中总是聚集着大量冒险者，有些在等待新的任务委托，有些在吹嘘自己的冒险经历。公会的接待员负责评估冒险者的等级并分配适合的任务。</p>\\n            <p>城市中的主要设施包括：</p>\\n            <ul>\\n                <li><strong>冒险者公会：</strong>接受任务、领取报酬、登记冒险者等级的核心场所。</li>\\n                <li><strong>武器店：</strong>出售各种武器和防具，品质从新手级别到高级应有尽有。</li>\\n                <li><strong>魔法道具店：</strong>由红魔族经营的店铺，出售魔法卷轴、药水和各种奇怪的道具。</li>\\n                <li><strong>旅馆与酒馆：</strong>冒险者们休息、用餐和交换情报的场所。</li>\\n                <li><strong>诊疗所：</strong>治疗伤病的设施，通常由祭司或拥有治疗技能的人运营。</li>\\n                <li><strong>市政府：</strong>处理城市行政事务，偶尔也会发布紧急委托。</li>\\n            </ul>\\n            <div class=\\"note\\"><strong>游戏主持人注意：</strong>阿克塞尔是玩家角色们的大本营。你可以根据剧情需要自由添加或修改城市中的设施和NPC。让这座城市充满生活感是营造素晴氛围的关键。</div>\\n        "},{"i":21,"ch":"第一章","chTitle":"世界设定——素晴的世界","title":"魔王军","id":"world-demonking","html":"\\n            <p>魔王军是对魔王麾下所有势力的统称。魔王本人极少出现在世人面前，通常由八位被称为\\"魔王军干部\\"的强大存在指挥各地的侵略活动。每位干部都拥有匹敌一支军队的实力，并统领着大量下级怪物。</p>\\n            <p>魔王军的构成：</p>\\n            <ul>\\n                <li><strong>魔王：</strong>魔王军的最高领袖，实力深不可测。真实身份和目的笼罩在谜团之中。传说中他有能力一击摧毁整座城市。</li>\\n                <li><strong>魔王军干部（八人）：</strong>魔王的直属部下，各自拥有独特的强大能力。已知的干部包括无头骑士贝尔迪亚、机动要塞毁灭者、剧毒史莱姆汉斯等。每位干部都可能成为一个完整冒险故事的最终敌人。</li>\\n                <li><strong>中级指挥官：</strong>在干部之下，指挥各地怪物活动的中层军官。实力远强于普通怪物，是中级冒险者团队的主要挑战对象。</li>\\n                <li><strong>下级怪物：</strong>史莱姆、哥布林、巨型蟾蜍等栖息在贝尔泽格各地的常规怪物。它们通常是新手冒险者的猎物，但数量众多时也能构成威胁。</li>\\n            </ul>\\n            <p>除了正面战斗，魔王军还会通过暗中破坏、散布谣言、污染水源等方式削弱王国。冒险者们的存在正是为了对抗这些威胁。</p>\\n        "},{"i":22,"ch":"第一章","chTitle":"世界设定——素晴的世界","title":"冒险者公会与等级制度","id":"world-guild","html":"\\n            <p>冒险者公会是管理所有冒险者的官方机构。当你创建角色后，第一站就是去公会进行登记。公会会根据冒险者的实力和经验授予相应的等级，等级决定了你可以接取的任务种类和报酬水平。</p>\\n            <p>冒险者等级从低到高依次为：</p>\\n            <table>\\n                <tr><th>等级</th><th>称号</th><th>说明</th></tr>\\n                <tr><td>F</td><td>见习</td><td>刚登记的新手冒险者。只能接取最简单的采集和讨伐小型怪物的任务。</td></tr>\\n                <tr><td>E</td><td>初级</td><td>有一定经验的冒险者。可以接取讨伐中级怪物的任务。</td></tr>\\n                <tr><td>D</td><td>中级</td><td>可靠的冒险者。能够独自或结伴处理大多数常规任务。</td></tr>\\n                <tr><td>C</td><td>上级</td><td>经验丰富的冒险者。可以接取高难度的讨伐和探索任务。</td></tr>\\n                <tr><td>B</td><td>精英</td><td>闻名一方的实力者。偶尔会被委派对抗魔王军指挥官级别的敌人。</td></tr>\\n                <tr><td>A</td><td>英雄</td><td>王国中也屈指可数的顶尖冒险者。能够与魔王军干部正面对抗。</td></tr>\\n                <tr><td>S</td><td>传说</td><td>足以名留青史的传奇冒险者。传说中只有极少数人达到过这个等级。</td></tr>\\n            </table>\\n            <p>游戏中，角色的初始冒险者等级通常为F级。通过完成任务积累经验值（EXP），可以逐步提升等级。每次升级都会带来属性提升和新技能的获得。</p>\\n        "},{"i":23,"ch":"第一章","chTitle":"世界设定——素晴的世界","title":"重要地点","id":"world-locations","html":"\\n            <p>除了阿克塞尔之外，贝尔泽格王国还有许多值得探索的地方：</p>\\n            <p><strong>王都贝尔泽格：</strong>王国的首都，最大的城市。聚集了最强大的冒险者和最高级的设施。王宫所在地，国王和政府在此治理国家。</p>\\n            <p><strong>红魔之乡：</strong>红魔族——一个所有人都拥有极高魔法天赋的种族——居住的隐秘村落。这里是培养大法师的圣地，惠惠的故乡。红魔族的魔法道具以其强大（和偶尔的不稳定性）而闻名。</p>\\n            <p><strong>水之都阿尔坎雷提亚：</strong>一座建在水上的美丽城市，以温泉和宗教设施闻名。阿库西斯教团的总部所在地。</p>\\n            <p><strong>魔王城：</strong>魔王本人大本营，位于贝尔泽格王国北方的荒芜之地。通往魔王城的路上布满了强大的怪物和结界，是冒险者们的最终目标。</p>\\n            <p><strong>地下城：</strong>散布在各地的古代遗迹和迷宫。每个地下城都有不同的主题和守护者，探索它们是获取稀有装备和大量经验的最佳途径。著名的地下城包括月光城堡遗迹、龙之颚迷宫等。</p>\\n        "},{"i":24,"ch":"第二章","chTitle":"角色创建","title":"角色创建流程概览","id":"char-overview","html":"\\n            <p>创建角色是TRPG中最令人兴奋的部分之一。在素晴TRPG中，你将创建一位来到异世界的冒险者。以下是创建角色的完整流程：</p>\\n            <div class=\\"content-img\\">\\n                <img src=\\"img/image_016_image67.png\\" alt=\\"角色创建示例\\">\\n            </div>\\n            <ol>\\n                <li><strong>确定角色概念：</strong>决定你的角色是什么样的——名字、性格、背景故事。</li>\\n                <li><strong>选择种族：</strong>转生者、原住民或红魔族，每个种族有不同的特性和技能。</li>\\n                <li><strong>选择职业：</strong>决定角色在队伍中的定位——战士、法师、祭司、盗贼、冒险者等12种初始职业。</li>\\n                <li><strong>决定属性值：</strong>分配或掷骰决定角色的七项基础属性。</li>\\n                <li><strong>选择技能：</strong>根据职业和种族获取相应的技能。</li>\\n                <li><strong>购买初始装备：</strong>使用初始资金购买武器、防具和道具。</li>\\n                <li><strong>完成细节：</strong>填写角色卡的其余信息。</li>\\n            </ol>\\n            <div class=\\"note\\"><strong>提示：</strong>建议新手玩家与游戏主持人一起完成角色创建，这样可以确保角色符合当前冒险的设定和难度。</div>\\n        "},{"i":25,"ch":"第二章","chTitle":"角色创建","title":"第一步：角色概念","id":"char-concept","html":"\\n            <p>在动笔之前，先在脑海中描绘你的角色形象。以下是帮助你确定角色概念的问题：</p>\\n            <div class=\\"content-img\\">\\n                <img src=\\"img/image_127_image45.png\\" alt=\\"角色互动示例\\">\\n            </div>\\n            <ul>\\n                <li>你的角色叫什么名字？有什么含义吗？</li>\\n                <li>他/她来自哪里？为什么成为冒险者？</li>\\n                <li>他/她的性格如何？开朗、阴沉、热血、慵懒？</li>\\n                <li>有什么特别的习惯、口头禅或者梦想？</li>\\n                <li>有没有害怕的东西或无法克服的弱点？</li>\\n                <li>对队友的态度是怎样的？</li>\\n            </ul>\\n            <p>在素晴世界中，不完美的角色往往比完美的角色更加有趣。和真虽然弱但头脑灵活，阿库娅强大却愚蠢，惠惠只会一种魔法，达克妮丝根本打不中人。正是这些缺点让角色变得生动和可爱。不要害怕给你的角色设计一两个有趣的弱点或怪癖。</p>\\n            <div class=\\"example\\"><strong>角色概念示例：</strong>\\"一个来自乡下的年轻农夫，因为家乡被怪物摧毁而成为冒险者。性格开朗但有点懦弱，梦想是赚到足够的钱重建家乡。对女性有些苦手。擅长逃跑和生存技巧。\\"</div>\\n        "},{"i":26,"ch":"第二章","chTitle":"角色创建","title":"第二步：选择种族","id":"char-race","html":"\\n            <p>在素晴TRPG中，种族决定了角色的基础能力倾向和初始技能。《为美好的世界献上祝福！TRPG》基础规则书允许你从<strong>三个种族</strong>中选择一个（详见第三章）：</p>\\n            <table>\\n                <tr><th>种族</th><th>特点</th><th>适合职业</th></tr>\\n                <tr><td>转生者<br><small>（Reincarnated）</small></td><td>在地球上死亡后由女神转生到异世界的人。拥有\\"额外祝福\\"能力，比原住民多一次命运扭转的机会。</td><td>所有职业，特别是冒险者</td></tr>\\n                <tr><td>原住民<br><small>（Native）</small></td><td>出生并生活在素晴世界的人。能力均衡，适应性强，与所有职业都有良好的相性。</td><td>所有职业（推荐新手选择）</td></tr>\\n                <tr><td>红魔族<br><small>（Crimson Demon）</small></td><td>拥有绯红色眼睛的族群，天生拥有极高的智力和强大魔力。性格上往往有中二病倾向，热衷于为招式起夸张的名字。</td><td>法师系职业（最佳）</td></tr>\\n            </table>\\n            <p>选择种族时，请考虑与你的角色概念是否匹配。例如，如果你想扮演像惠惠那样的大法师，红魔族是最自然的选择；像和真那样从地球转生而来的灵活冒险者，转生者是最佳选择；而如果你希望创建一个土生土长的素晴世界居民，原住民则是最合适的。</p>\\n            <div class=\\"note\\"><strong>提示：</strong>如果你在选择种族时感到困难，原住民是推荐选项——他们与所有职业都很相配，非常适合初次接触TRPG的玩家。</div>\\n        "},{"i":27,"ch":"第二章","chTitle":"角色创建","title":"第三步：选择职业","id":"char-class","html":"\\n            <p>职业决定了角色在冒险中的定位和可用的技能类型。素晴TRPG中有<strong>12种初始职业</strong>可选（详见第四章）。主要的职业类型包括：</p>\\n            <table>\\n                <tr><th>职业类型</th><th>说明</th><th>示例职业</th></tr>\\n                <tr><td>战士系</td><td>使用武器在前线战斗的物理攻击者</td><td>战士、大剑战士</td></tr>\\n                <tr><td>法师系</td><td>使用攻击魔法的后排火力手</td><td>法师、红魔族法师</td></tr>\\n                <tr><td>祭司系</td><td>治疗和支援队友的圣职者</td><td>祭司、慈爱祭司</td></tr>\\n                <tr><td>盗贼系</td><td>依靠速度和技巧的轻型战士</td><td>盗贼、探索者盗贼</td></tr>\\n                <tr><td>冒险者</td><td>全能型，可以从其他职业学习技能</td><td>冒险者（特殊职业）</td></tr>\\n            </table>\\n            <p>职业的选择会影响你能够学习的技能类型。冒险者是最灵活的职业，可以从所有其他职业学习技能，但只有一个本职业技能——\\"额外祝福\\"。</p>\\n            <p>角色达到10级后，还可以转职为<strong>进阶职业</strong>，如十字军（战士进阶）、大祭司（祭司进阶）、大法师（法师进阶）、刺客（盗贼进阶）等。</p>\\n            <div class=\\"note\\"><strong>提示：</strong>和真就是典型的冒险者——学习了偷窃（盗贼技能）、弓箭、基础魔法等多种能力，虽然各方面都不突出，但灵活多变。阿库娅是大祭司、惠惠是大法师（红魔族法师）、达克妮丝是十字军骑士。</div>\\n        "},{"i":28,"ch":"第二章","chTitle":"角色创建","title":"第四步：决定属性值","id":"char-attributes","html":"\\n            <p>属性值代表了角色各方面的基础能力。素晴TRPG使用<strong>七项核心属性</strong>：</p>\\n            <table>\\n                <tr><th>属性</th><th>缩写</th><th>说明</th></tr>\\n                <tr><td>力量</td><td>STR</td><td>物理攻击力、负重能力、破坏物体的能力。用于计算最大HP和移动力。</td></tr>\\n                <tr><td>灵巧</td><td>DEX</td><td>手部精细操作、武器技巧。部分武器用灵巧代替力量进行伤害修正。</td></tr>\\n                <tr><td>敏捷</td><td>AGI</td><td>速度、闪避、行动顺序。用于计算行动点数。</td></tr>\\n                <tr><td>智力</td><td>INT</td><td>魔法攻击力、知识、学习能力、分析物品功能。</td></tr>\\n                <tr><td>感知</td><td>PER</td><td>观察力、直觉、发现陷阱和隐藏事物。用于计算行动点数。</td></tr>\\n                <tr><td>精神</td><td>MND</td><td>魔力值（MP）、意志力、对谎言和精神攻击的抵抗。</td></tr>\\n                <tr><td>幸运</td><td>LUK</td><td>影响各种判定的运气因素、暴击概率、稀有掉落率。</td></tr>\\n            </table>\\n            <p><strong>派生属性计算：</strong></p>\\n            <ul>\\n                <li><strong>最大HP = </strong>基础力量值 + 职业起始HP + 技能修正</li>\\n                <li><strong>最大MP = </strong>基础精神值 + 职业起始MP + 技能修正</li>\\n                <li><strong>行动点数 = </strong>敏捷值 + 感知值 + 装备修正 + 技能修正</li>\\n                <li><strong>移动力 = </strong>力量值 + 5 + 装备修正 + 技能修正</li>\\n            </ul>\\n            <p><strong>属性值的决定方式：</strong></p>\\n            <p>首先根据选择的种族决定基础属性值。然后获得<strong>5点奖励点数</strong>自由分配到任意属性上。属性加值（Ability Bonus）= 属性值÷3（向下取整）。最后，根据职业修正表和技能加成调整最终属性。</p>\\n            <p>最低的属性值可以是0，并且没有上限。数字越高，表示角色在该领域越出色。</p>\\n            <div class=\\"example\\"><strong>属性分配示例：</strong>大法师惠惠型角色——力量较低但精神极高（确保爆裂魔法的MP消耗），智力出类拔萃。红魔族+法师职业修正的组合使她的魔法攻击无人能敌，但物理方面需要队友保护。和真则是各项均衡但幸运值较高的冒险者。</div>\\n        "},{"i":29,"ch":"第二章","chTitle":"角色创建","title":"第五步：选择技能","id":"char-skills","html":"\\n            <p>技能是角色在冒险中可以使用的特殊能力。技能分为三种类型：<strong>种族技能</strong>（每种种族独有）、<strong>职业技能</strong>（每种职业独有）、以及<strong>通用技能</strong>（任何职业都可以学习）。</p>\\n            <p>创建角色时按以下顺序获得技能：</p>\\n            <ol>\\n                <li><strong>种族技能：</strong>从所选种族的技能列表中选择一个带有\\"时机：创建\\"的技能。</li>\\n                <li><strong>职业技能：</strong>从所选职业的技能列表中获取总计5个等级的技能。可以选择5个不同技能各1级，或选择更少的技能将其中部分提升到2级（创建时不能超过2级）。</li>\\n                <li><strong>通用技能：</strong>选择2个通用技能，均从1级开始。</li>\\n            </ol>\\n            <p><strong>冒险者特殊规则：</strong>冒险者只有一个职业技能——\\"额外祝福\\"——但可以从任何其他职业学习技能。冒险者在创建时必须获取\\"额外祝福\\"技能。</p>\\n            <p>详细的技能列表和说明请参考第五章。</p>\\n        "},{"i":30,"ch":"第二章","chTitle":"角色创建","title":"第六步：初始装备","id":"char-equipment","html":"\\n            <p>每个初始角色拥有<strong>500 KE</strong>（厄里斯，素晴世界的货币单位）的初始资金用于购买装备。</p>\\n            <p>此外，根据职业不同，角色可能自动获得某些基础物品。所有角色都会免费获得一张<strong>冒险者卡</strong>。</p>\\n            <p>装备分为以下槽位：右手、左手、头部、身体、辅助护甲和饰品。每个槽位一次只能装备一件物品。装备总重量不能超过基础力量属性值。</p>\\n            <p>剩余的资金可以在武器店、魔法道具店等处自由购物。详细装备列表和价格请参考第六章。</p>\\n        "},{"i":31,"ch":"第二章","chTitle":"角色创建","title":"第七步：完成细节","id":"char-details","html":"\\n            <p>最后，填写角色卡上的其余信息：</p>\\n            <ul>\\n                <li><strong>派生属性：</strong>根据基础属性计算 HP（最大HP = 基础力量值 + 职业起始HP + 技能修正；每次升级额外+职业HP成长值）、MP（最大MP = 基础精神值 + 职业起始MP + 技能修正；每次升级额外+职业MP成长值）、行动点数（敏捷 + 感知 + 装备修正 + 技能修正）、移动（力量 + 5 + 装备修正 + 技能修正）等。技能修正指被动技能对属性的加成，如\\"耐久\\"技能增加最大HP。</li>\\n                <li><strong>祝福点数：</strong>初始有5点祝福。祝福代表角色对抗命运的力量。</li>\\n                <li><strong>角色等级：</strong>初始为1级。</li>\\n                <li><strong>外貌描述：</strong>建议根据种族特征决定头发颜色、眼睛颜色、肤色、身高和体重等。</li>\\n                <li><strong>背景故事：</strong>使用生命轨迹表决定角色的出身和历史（按种族分为转生者、原住民和红魔族三种表格）。</li>\\n                <li><strong>人际关系：</strong>与其他玩家角色的关系（可选，建议在第一次游戏前商议）。</li>\\n            </ul>\\n            <div class=\\"note\\"><strong>重要提示：</strong>创建角色时，建议与游戏主持人和队友充分沟通。确保所有角色的能力互补，避免队伍中所有人都是同一类型。</div>\\n            <div class=\\"content-img\\">\\n                <img src=\\"img/image_071_image68.png\\" alt=\\"角色卡模板\\">\\n                <p class=\\"caption\\">* 角色卡模板：可打印使用</p>\\n            </div>\\n        "},{"i":32,"ch":"第二章","chTitle":"角色创建","title":"生命轨迹表——出身·境遇·目标","id":"background-tables","html":"\\n            <p>角色的<strong>生命轨迹（Life Path）</strong>代表其个人历史，由<strong>出身（Origin）</strong>、<strong>境遇（Circumstance）</strong>和<strong>目标（Goal）</strong>三部分组成。可以使用以下表格掷d66随机决定（RoC = Roll or Choose，掷骰或自选）。</p>\\n\\n            <h4>转生者出身表（d66 / RoC）</h4>\\n            <table>\\n                <tr><th>d66</th><th>出身</th><th>说明</th></tr>\\n                <tr><td>00</td><td>自由</td><td>与GM商量后自行决定出身。</td></tr>\\n                <tr><td>11~12</td><td>卡车</td><td>因为别人的意外或自己的倒霉，你差点被车撞了。但当你回过神来，你已经在从未见过的地方，坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>13~14</td><td>枪击</td><td>你是保护了某人？还是不幸身处错误的时间地点？又或者被人当成了挡箭牌？就在听到枪声的瞬间，你发现自己坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>15~16</td><td>智能手机</td><td>你收到了一条手机消息。就在低头查看的瞬间，你已经在从未见过的地方，坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>21~22</td><td>梦境</td><td>你做了一个关于那个世界的梦。就是那个你一直幻想的世界。当你从梦中醒来，你已经在从未见过的地方，坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>23~24</td><td>电子游戏</td><td>你在玩一个从别人那里借来的RPG游戏。下一刻，你发现自己在一个……似曾相识的地方。那是游戏中的世界。</td></tr>\\n                <tr><td>25~26</td><td>浓雾</td><td>你迷失在突然出现的浓雾中。逃出雾气后，一片陌生的风景展现在你面前。</td></tr>\\n                <tr><td>31~32</td><td>流星</td><td>你总是对着流星许愿。就像那颗——很漂亮……但不是有点太近了吗？下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>33~34</td><td>洞穴</td><td>你探头看向洞穴的边缘，然后有人从背后推了你一把。奇怪的是，你一直在下落。下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>35~36</td><td>天之声</td><td>你脑海中听到了一定是美丽女神的声音。那个声音似乎把你错认成了别人。下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>41~42</td><td>楼梯</td><td>你为了救别人而摔下了楼梯。视野天旋地转。下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>43~44</td><td>雷击</td><td>一道闪电在你来不及准备或感受之前就击中了你。下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>45~46</td><td>暴力</td><td>你被卷入了别人的斗殴中。剧痛袭来。下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>51~52</td><td>魔法阵</td><td>一个奇怪的图案——像魔法阵——突然出现在一个熟人脚下。你也被卷入其中……下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>53~54</td><td>视频</td><td>你恰好瞥了一眼视频。然后感觉自己像是被吸进了屏幕……下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>55~56</td><td>奇怪的门</td><td>你注意到一扇看起来崭新而格格不入的门。随手打开后……下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>61~62</td><td>闪光</td><td>某天，眼前突然出现一阵强烈的光芒。下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>63~64</td><td>被殴打</td><td>你被一群人痛打了一顿。疼痛和屈辱让你昏了过去。下一刻，你坐在一把简朴的椅子上。</td></tr>\\n                <tr><td>65~66</td><td>不明</td><td>突然之间，你发现自己坐在一把简朴的椅子上。面前是一位美丽的女神，正对你微笑。</td></tr>\\n            </table>\\n\\n            <h4>原住民出身表（d66 / RoC）</h4>\\n            <table>\\n                <tr><th>d66</th><th>出身</th><th>说明</th></tr>\\n                <tr><td>00</td><td>自由</td><td>与GM商量后自行决定出身。</td></tr>\\n                <tr><td>11~12</td><td>英雄</td><td>你的一位或双亲是被某些人尊敬的知名英雄。这在很多方面影响着你。</td></tr>\\n                <tr><td>13~14</td><td>王族/贵族</td><td>你是王族或贵族的子女。在年幼时接受了优良的教育。</td></tr>\\n                <tr><td>15~16</td><td>骑士</td><td>你的一位或双亲是现役骑士。你曾作为侍从跟随他们旅行。</td></tr>\\n                <tr><td>21~22</td><td>冒险者</td><td>和你一样，你的一位或双亲是冒险者。你的第一次冒险就是家庭旅行。</td></tr>\\n                <tr><td>23~24</td><td>佣兵</td><td>你的一位或双亲是佣兵。他们在许多地方战斗过，总是带着你一起。</td></tr>\\n                <tr><td>25~26</td><td>秘密特工</td><td>你的家族生活在阴影中。受雇于王族、贵族和富商，从事间谍和破坏活动。</td></tr>\\n                <tr><td>31~32</td><td>祭司</td><td>你的一位或双亲是祭司。你可以决定他们是属于厄里斯教会、阿克西斯教会，还是信仰其他神祇。</td></tr>\\n                <tr><td>33~34</td><td>法师</td><td>你的一位或双亲是法师。你从他们那里继承了大量魔法知识。</td></tr>\\n                <tr><td>35~36</td><td>公会成员</td><td>你的一位或双亲在冒险者公会工作，与其他冒险者打交道。冒险者是你生活中最亲近的大人。</td></tr>\\n                <tr><td>41~42</td><td>学者</td><td>你的一位或双亲是学者。你童年的家中散落着各种魔法道具。</td></tr>\\n                <tr><td>43~44</td><td>商人</td><td>你的一位或双亲是商人。你从小学习他们的行当和与顾客谈判的技巧。如今这些经验正在开花结果。</td></tr>\\n                <tr><td>45~46</td><td>猎人</td><td>你的一位或双亲是猎人。他们教会了你关于生存和露营的一切。</td></tr>\\n                <tr><td>51~52</td><td>漂泊者</td><td>你的一位或双亲是漂泊者，总是在旅途中。你跟随他们去过许多地方，见过许多事物。</td></tr>\\n                <tr><td>53~54</td><td>格斗家</td><td>你的一位或双亲是竞技场中的格斗家。竞技场总是充满危险。那种紧张刺激的感觉一直伴随着你。</td></tr>\\n                <tr><td>55~56</td><td>有组织犯罪</td><td>你的一位或双亲是从事破坏和暗杀的组织的成员。你什么都见过——不管你想不想见。</td></tr>\\n                <tr><td>61~62</td><td>前科犯</td><td>你的一位或双亲犯过罪，或因莫须有的罪名被捕。你一直不得不隐姓埋名地生活。</td></tr>\\n                <tr><td>63~64</td><td>恶魔</td><td>你的一位或双亲是恶魔。一条可怕的黑暗血脉流淌在你体内。</td></tr>\\n                <tr><td>65~66</td><td>平民</td><td>你的一位或双亲是生活在城镇或村庄中的普通人。无论发生什么，他们都继续生活——这是只有普通人才能拥有的力量。</td></tr>\\n            </table>\\n\\n            <h4>红魔族出身表（d66 / RoC）</h4>\\n            <table>\\n                <tr><th>d66</th><th>出身</th><th>说明</th></tr>\\n                <tr><td>00</td><td>自由</td><td>与GM商量后自行决定出身。</td></tr>\\n                <tr><td>11~12</td><td>英雄</td><td>你的一位或双亲是被誉为英雄的知名大法师。唯一的问题是：人们听到他们的名字时会笑。</td></tr>\\n                <tr><td>13~14</td><td>统治者</td><td>你来自红魔族的统治阶层。你的家族享受无忧的财务水平，过着高品质的生活。</td></tr>\\n                <tr><td>15~16</td><td>战士</td><td>你的一位或双亲从事战士工作——对红魔族来说很少见的职业。你看到他们时总是感到矛盾。</td></tr>\\n                <tr><td>21~22</td><td>冒险者</td><td>和你一样，你的一位或双亲是冒险者。你的第一次冒险就是家庭旅行。</td></tr>\\n                <tr><td>23~24</td><td>雇佣法师</td><td>你的一位或双亲是雇佣法师。他们在许多地方找到了工作和食物。不知为何，你们从未在一个地方待太久。</td></tr>\\n                <tr><td>25~26</td><td>魔法忍者</td><td>你的家族有一段利用魔法能力进行潜行和渗透的专业暗影历史。</td></tr>\\n                <tr><td>31~32</td><td>贤者</td><td>你的一位或双亲不仅是出色的法师，还是虔诚的祭司。许多人前来聆听他们的教诲。</td></tr>\\n                <tr><td>33~34</td><td>施法者</td><td>你的一位或双亲是优秀的施法者。虽然这对许多红魔族成员来说都是事实，但他们更胜一筹。</td></tr>\\n                <tr><td>35~36</td><td>公会支援人员</td><td>你的一位或双亲在冒险者公会担任支援角色，主要负责鉴定魔法道具和解除诅咒。</td></tr>\\n                <tr><td>41~42</td><td>魔法鉴定师</td><td>你的一位或双亲鉴定魔法道具。因此你家中散落着许多……相当危险的物品。</td></tr>\\n                <tr><td>43~44</td><td>魔法商人</td><td>你的一位或双亲是经营稀有魔法道具的商人，这些道具价值不菲。不知为何，你对他们感到自豪。</td></tr>\\n                <tr><td>45~46</td><td>极度贫困</td><td>你的一位或双亲把所有财产都投入了提升法师力量，使你陷入了极度贫困的境地。</td></tr>\\n                <tr><td>51~52</td><td>流浪法师</td><td>你跟随一位或双亲进行了大量旅行。你去了很多地方，见了很多事物，但你始终不知道为什么要旅行。</td></tr>\\n                <tr><td>53~54</td><td>死亡魔法之名</td><td>你的一位或双亲是用魔法力量战斗的人……实际上，他们是用魔法杀人的暗杀者。但你很久以后才知道这一点。</td></tr>\\n                <tr><td>55~56</td><td>神秘结社</td><td>你的一位或双亲是笼罩在神秘中的秘密结社成员。他们遵从结社的命令执行各种任务。</td></tr>\\n                <tr><td>61~62</td><td>逃亡者</td><td>你的一位或双亲正在逃避某种强大势力、组织或个人。他们保护着你，总是确保你藏好。</td></tr>\\n                <tr><td>63~64</td><td>恶魔</td><td>你的一位或双亲是恶魔。一条可怕的黑暗血脉流淌在你体内。</td></tr>\\n                <tr><td>65~66</td><td>平民</td><td>你的一位或双亲虽然是红魔族，却不拥有丰富的魔力。相反，他们在城镇中过着普通、踏实的生活。</td></tr>\\n            </table>\\n\\n            <h4>境遇表（d66 / RoC）</h4>\\n            <table>\\n                <tr><th>d66</th><th>境遇</th><th>说明</th></tr>\\n                <tr><td>00</td><td>自由</td><td>与GM商量后自行决定境遇。</td></tr>\\n                <tr><td>11~12</td><td>师匠</td><td>你有一位教你生活和/或你所掌握的技巧和技能的师父。</td></tr>\\n                <tr><td>13~14</td><td>孤身一人</td><td>你与家人分别了——无论是因为在事件或灾难中失散，还是因为他们已经去世——你一直独自生活。</td></tr>\\n                <tr><td>15~16</td><td>伤病</td><td>你曾经遭受过重伤或重病。那次经历极大地影响了你对生死的看法。</td></tr>\\n                <tr><td>21~22</td><td>养父母</td><td>你被养父母抚养长大。你可以自行决定原因、与亲生父母的关系以及对此的感受。</td></tr>\\n                <tr><td>23~24</td><td>启示</td><td>你听到了美丽女神的声音。你被她选中去完成某件伟大的事。大概。也许。</td></tr>\\n                <tr><td>25~26</td><td>被夺</td><td>有东西被夺走了。也许是宝物、珍贵的人，或其他什么。但那对你来说极为重要。</td></tr>\\n                <tr><td>31~32</td><td>没落</td><td>种种境遇导致你失去了社会地位、大量财富或家族荣誉。之后，你的家族变成了昔日自己的影子，陷入衰败。</td></tr>\\n                <tr><td>33~34</td><td>遗失</td><td>你失去了重要的东西。也许是宝物、家人，或其他什么。但那一定对你来说非常珍贵。</td></tr>\\n                <tr><td>35~36</td><td>旅人</td><td>你曾旅行到遥远的大陆和未知的土地。你这样旅行了多久？然而旅途似乎永远不会结束。</td></tr>\\n                <tr><td>41~42</td><td>身份</td><td>只有你知道自己的真实身份。你没有向任何人透露过。会有向某人揭露秘密的那一天吗？</td></tr>\\n                <tr><td>43~44</td><td>失忆</td><td>你没有过去的记忆。你失去了迄今为止的部分记忆，或关于自己曾经是谁的记忆。</td></tr>\\n                <tr><td>45~46</td><td>大成功</td><td>你过去做过某件非常成功的事。你为做过它而自豪，或者也许你根本不认为那是一次胜利。</td></tr>\\n                <tr><td>51~52</td><td>晋升</td><td>你在公会中晋升了。或者也许你通过冒险获得了贵族身份。你也可能是从奴隶变成了自由人。</td></tr>\\n                <tr><td>53~54</td><td>挚友</td><td>有一个人与你亲近到可以称之为挚友，或者也许，是你的恋人。你可以自行决定细节。</td></tr>\\n                <tr><td>55~56</td><td>漂泊</td><td>你旅行了世界——无论是出于自愿还是因为某种特殊情况。你现在只是这段旅途的一部分。</td></tr>\\n                <tr><td>61~62</td><td>背叛</td><td>你被背叛了。是你信任的人？商业伙伴？任务委托人？赞助者？无论是谁，都给你留下了心理创伤。</td></tr>\\n                <tr><td>63~64</td><td>安静的生活</td><td>你过着普通、和平的平民生活，没有特别的麻烦。</td></tr>\\n                <tr><td>65~66</td><td>女神的秘密</td><td>你偶然得知了某位女神的秘密。既然你知道了，你将永远处于危险之中。</td></tr>\\n            </table>\\n\\n            <h4>目标表（d66 / RoC）</h4>\\n            <table>\\n                <tr><th>d66</th><th>目标</th><th>说明</th></tr>\\n                <tr><td>00</td><td>自由</td><td>与GM商量后自行决定目标。</td></tr>\\n                <tr><td>11~12</td><td>金钱！</td><td>金钱是你的目标。这就是你在这个世界生存所需要的。有什么是钱买不到的吗？如果有的话，你对那种东西也没兴趣。</td></tr>\\n                <tr><td>13~14</td><td>修行</td><td>你的目标是修行。你想磨练身心以达到更高的境界。</td></tr>\\n                <tr><td>15~16</td><td>任务</td><td>你为了打倒魔王而行动——那是那位美丽女神对你的期望。你确信自己会完成这个伟大的任务。</td></tr>\\n                <tr><td>21~22</td><td>好奇心</td><td>你的目标是满足自己的好奇心。你完全清楚这会让你陷入危险。但你停不下来。</td></tr>\\n                <tr><td>23~24</td><td>命运</td><td>你在旅途中，被一位奇妙女神赐予的命运所引导。在那命运实现之前，你会继续走下去。</td></tr>\\n                <tr><td>25~26</td><td>复仇</td><td>你想要复仇。你还没有得到它。也许你缺乏力量，或者你不知道到底该向谁复仇，但那团火焰始终在胸中燃烧。</td></tr>\\n                <tr><td>31~32</td><td>好战</td><td>你热爱战斗。仅凭自己的力量从残酷而异常的死亡之颚中逃脱，让你感到真正活着。</td></tr>\\n                <tr><td>33~34</td><td>寻找某人</td><td>你的目标是找到某个人。他们在哪里？你可以自行决定与他们的关系和/或寻找他们的原因。</td></tr>\\n                <tr><td>35~36</td><td>养家</td><td>你作为冒险者工作来养活某个特别的人或家人。你赚的钱都用来给他们提供衣食。</td></tr>\\n                <tr><td>41~42</td><td>被迫</td><td>你按照他人的意志行动，不管你怎么想。你没有选择。</td></tr>\\n                <tr><td>43~44</td><td>逃亡</td><td>你正在被某人追捕。你不能在一个地方待太久。你行动的原因是为了逃避追捕。</td></tr>\\n                <tr><td>45~46</td><td>正义</td><td>你旅行是为了实现你自己的正义。为这个与你理想如此不同的世界带来祝福。</td></tr>\\n                <tr><td>51~52</td><td>友情</td><td>你的目标是拯救某位朋友。你不求回报。一切都是为了他们——为了你们之间的友情。</td></tr>\\n                <tr><td>53~54</td><td>夺回</td><td>你的目标是夺回曾经被夺走的东西。这就是你行动的原因。</td></tr>\\n                <tr><td>55~56</td><td>寻找某物</td><td>你在寻找某样东西。它可能是强大的力量、宝物，或回到故乡的方法——但获得它就是你的目标。</td></tr>\\n                <tr><td>61~62</td><td>志向</td><td>你一直向往冒险者的世界。也许你渴望像他们一样做冒险工作，或者你想有一天成为著名的冒险者。</td></tr>\\n                <tr><td>63~64</td><td>打倒魔王</td><td>你的目标是打倒魔王。你将作为冒险者成名，打倒魔王，为这个世界带来祝福。这就是你行动的原因。</td></tr>\\n                <tr><td>65~66</td><td>没有目标</td><td>你现在没有特别的追求。不过，你仍然平静地生活着。这才是人生中重要的。何必操之过急、设定什么远大目标呢？</td></tr>\\n            </table>\\n            <p class=\\"note\\"><strong>注：</strong>玩家可以自由决定这些目标的具体细节，或与GM商量后确定。</p>\\n        "},{"i":33,"ch":"示例角色","chTitle":"快速开始——示例角色","title":"如何使用示例角色","id":"sample-howto","html":"\\n            <p>如果你是TRPG新手，或者想快速开始游戏，可以使用以下<strong>5个预设示例角色</strong>。这些角色已经完成了所有数据填写，可以直接拿来玩。</p>\\n            <div class=\\"note\\"><strong>使用建议：</strong>如果只有4名玩家，不使用PC #5。如果只有3名玩家，使用PC #1（大剑战士）、PC #3（慈悲祭司）和PC #5（转生冒险者）。</div>\\n        "},{"i":34,"ch":"示例角色","chTitle":"快速开始——示例角色","title":"PC #1：大剑战士（Great Sword Warrior）","id":"sample-warrior","html":"\\n            <p><strong>种族：</strong>转生者　<strong>职业：</strong>战士　<strong>等级：</strong>1</p>\\n            <p>你被女神选中，在这个新世界开始第二人生，成为拯救人民的英雄。当然，你才刚刚开始冒险，手里握着真正的剑和当英雄完全不是一回事。\\"魔王必须死！我的目标是成为顶级英雄！！\\"</p>\\n            <p><strong>生命轨迹：</strong>出身：英雄 | 境遇：身份 | 目标：志向</p>\\n            <p><strong>技能：</strong></p>\\n            <table>\\n                <tr><th>技能名</th><th>SL</th><th>时机</th><th>消耗</th><th>效果</th></tr>\\n                <tr><td>转生恩赐：武器（Reincarnation Boon: Weapon）</td><td>1</td><td>被动</td><td>-</td><td>大剑攻击力+2（后计算）</td></tr>\\n                <tr><td>掩护（Cover）</td><td>1</td><td>伤害掷骰前</td><td>-</td><td>代替目标承受伤害。每次防御1次。</td></tr>\\n                <tr><td>强击（Heavy Attack）</td><td>2</td><td>主要动作</td><td>4MP</td><td>近战武器攻击，伤害+(SL)d6。</td></tr>\\n                <tr><td>武器技能：双手剑（Weapon Skill: Two-Handed Sword）</td><td>1</td><td>被动</td><td>-</td><td>使用双手剑时命中判定+1d6（后计算）。</td></tr>\\n                <tr><td>下劈（Downswing）</td><td>1</td><td>次要动作</td><td>5MP</td><td>武器攻击伤害+力量值（后计算）。</td></tr>\\n                <tr><td>运动（Athletic Skill）</td><td>1</td><td>判定前</td><td>-</td><td>攀爬和跳跃时力量判定+1d6。</td></tr>\\n                <tr><td>搬运（Carrying Skill）</td><td>1</td><td>被动</td><td>-</td><td>携带重量上限+12（后计算）。</td></tr>\\n            </table>\\n            <p><strong>装备：</strong>大剑、帽子、皮夹克、冒险者卡、冒险者套装、治疗药水</p>\\n        "},{"i":35,"ch":"示例角色","chTitle":"快速开始——示例角色","title":"PC #2：绯红法师（Crimson Wizard）","id":"sample-wizard","html":"\\n            <p><strong>种族：</strong>红魔族　<strong>职业：</strong>法师　<strong>等级：</strong>1</p>\\n            <p>你是红魔族的法师。红魔族天生拥有强大的魔力，而你更是其中的佼佼者。你对魔法的热爱近乎狂热，尤其是对爆裂魔法有着执着的追求。\\"吾名乃红魔族第一的魔法师！\\"</p>\\n            <p><strong>生命轨迹：</strong>出身：施法者 | 境遇：安静的生活 | 目标：好奇心</p>\\n            <p><strong>技能：</strong></p>\\n            <table>\\n                <tr><th>技能名</th><th>SL</th><th>时机</th><th>消耗</th><th>效果</th></tr>\\n                <tr><td>魔法天赋（Magical Talent）</td><td>1</td><td>被动</td><td>-</td><td>魔法判定总值+1（后计算）。</td></tr>\\n                <tr><td>咏唱技能（Chanting Skill）</td><td>1</td><td>判定前</td><td>-</td><td>魔法判定+1d6（后计算）。</td></tr>\\n                <tr><td>火球术（Fireball）</td><td>1</td><td>主要动作</td><td>7MP</td><td>魔法攻击（火），范围6，伤害2d6+10。</td></tr>\\n                <tr><td>魔法强化技能（Magical Enhancement Skill）</td><td>2</td><td>被动</td><td>-</td><td>所有魔法攻击伤害+SLd6（后计算）。</td></tr>\\n                <tr><td>魔力汇聚（Mana Convergence）</td><td>1</td><td>伤害掷骰前</td><td>-</td><td>魔法攻击伤害+2d6。每场景1次。</td></tr>\\n                <tr><td>风之呼吸（Wind Breath）</td><td>1</td><td>主要动作</td><td>-</td><td>产生足以吹走纸张的风。基础魔法。</td></tr>\\n                <tr><td>造水术（Create Water）</td><td>1</td><td>主要动作</td><td>-</td><td>产生一杯水。基础魔法。</td></tr>\\n            </table>\\n            <p><strong>装备：</strong>魔法杖、帽子、长袍、冒险者卡、冒险者套装、背包、小魔晶石(XS)×2</p>\\n        "},{"i":36,"ch":"示例角色","chTitle":"快速开始——示例角色","title":"PC #3：慈悲祭司（Compassionate Priest）","id":"sample-priest","html":"\\n            <p><strong>种族：</strong>原住民　<strong>职业：</strong>祭司　<strong>等级：</strong>1</p>\\n            <p>你是一名作为冒险者工作的祭司——每个队伍都需要的治疗者。引导羊群的圣洁女神赐予了你指引和力量。你为世界祈祷，为世间的人们祈祷，也为你的同伴祈祷。\\"我们圣洁的女神啊，带来永恒之爱的您，请聆听我的祈祷！\\"</p>\\n            <p><strong>生命轨迹：</strong>出身：祭司 | 境遇：启示 | 目标：打倒魔王</p>\\n            <p><strong>技能：</strong></p>\\n            <table>\\n                <tr><th>技能名</th><th>SL</th><th>时机</th><th>消耗</th><th>效果</th></tr>\\n                <tr><td>多才多艺（Versatility）</td><td>1</td><td>被动</td><td>-</td><td>创建时选择3个基础属性值各+1（后计算）。此角色选择了AGI/PER/LUK。</td></tr>\\n                <tr><td>圣盾（Saint Shield）</td><td>1</td><td>伤害掷骰后</td><td>3MP</td><td>伤害减少2d6。每次防御1次。</td></tr>\\n                <tr><td>力量术（Power）</td><td>2</td><td>主要动作</td><td>4MP</td><td>目标武器攻击伤害+SL×3。</td></tr>\\n                <tr><td>治疗（Heal）</td><td>2</td><td>主要动作</td><td>4MP</td><td>恢复目标HP (SL×2)d6+MND修正。SL2时恢复4d6+MND修正。</td></tr>\\n                <tr><td>急救（Lifesaving Skill）</td><td>1</td><td>主要动作</td><td>-</td><td>敏捷判定DL10。使一名昏迷的角色恢复意识。</td></tr>\\n                <tr><td>交涉（Negotiation Skill）</td><td>1</td><td>判定前</td><td>-</td><td>交涉和说服的精神判定+1d6。</td></tr>\\n            </table>\\n            <p><strong>装备：</strong>轻锤、帽子、布甲、圣徽、冒险者卡、冒险者套装、背包、小魔晶石(XS)×2</p>\\n        "},{"i":37,"ch":"示例角色","chTitle":"快速开始——示例角色","title":"PC #4：探险盗贼（Explorer Thief）","id":"sample-thief","html":"\\n            <p><strong>种族：</strong>原住民　<strong>职业：</strong>盗贼　<strong>等级：</strong>1</p>\\n            <p>你是一名原住民盗贼。盗贼在战斗中负责进攻，但真正的闪光之处在于地城探索——解除陷阱、侦查敌情、隐秘行动。你的多才多艺让你能胜任各种角色。\\"交给我吧，没有我打不开的锁。\\"</p>\\n            <p><strong>生命轨迹：</strong>出身：冒险者 | 境遇：身份 | 目标：寻找某物</p>\\n            <p><strong>技能：</strong></p>\\n            <table>\\n                <tr><th>技能名</th><th>SL</th><th>时机</th><th>消耗</th><th>效果</th></tr>\\n                <tr><td>多才多艺（Versatility）</td><td>1</td><td>被动</td><td>-</td><td>创建时选择3个基础属性值各+1（后计算）。此角色选择了AGI/PER/LUK。</td></tr>\\n                <tr><td>速攻（Speed Rush）</td><td>1</td><td>主要动作</td><td>5MP</td><td>对2个以上目标进行武器攻击时，伤害+SL×2。</td></tr>\\n                <tr><td>贯穿（Run Through）</td><td>2</td><td>主要动作</td><td>6MP</td><td>武器攻击，伤害+(SL)d6。</td></tr>\\n                <tr><td>武器技能：匕首（Weapon Skill: Dagger）</td><td>1</td><td>被动</td><td>-</td><td>使用匕首时命中判定+1d6（后计算）。</td></tr>\\n                <tr><td>陷阱探测（Trap Detection Skill）</td><td>1</td><td>判定前</td><td>-</td><td>陷阱探测判定+1d6（后计算）。即使探测失败也不会触发陷阱。</td></tr>\\n                <tr><td>调查（Investigation Skill）</td><td>1</td><td>判定前</td><td>-</td><td>基于感知的信息收集判定+1d6。</td></tr>\\n                <tr><td>追踪（Tracking Skill）</td><td>1</td><td>判定前</td><td>-</td><td>基于感知的追踪判定+1d6。</td></tr>\\n            </table>\\n            <p><strong>装备：</strong>匕首、小圆盾、帽子、布甲、盗贼工具、冒险者卡、冒险者套装、背包、小魔晶石(XS)×2、治疗药水</p>\\n        "},{"i":38,"ch":"示例角色","chTitle":"快速开始——示例角色","title":"PC #5：转生冒险者（Reincarnated Adventurer）","id":"sample-adventurer","html":"\\n            <p><strong>种族：</strong>转生者　<strong>职业：</strong>冒险者　<strong>等级：</strong>1</p>\\n            <p>你是一名从现代日本转生来到这个世界的冒险者。发生了一堆事情，不知不觉中你已经开始以冒险者的身份工作了。你靠着在现代世界学到的微薄知识和天生的运气（或者说缺乏运气）勉强度日。\\"好，试试用这个吧。不知道行不行呢！\\"</p>\\n            <p><strong>生命轨迹：</strong>出身：卡车 | 境遇：伤病 | 目标：任务</p>\\n            <p><strong>技能：</strong></p>\\n            <table>\\n                <tr><th>技能名</th><th>SL</th><th>时机</th><th>消耗</th><th>效果</th></tr>\\n                <tr><td>转生恩赐：命运之力（Reincarnation Boon: Power of Fate）</td><td>1</td><td>被动</td><td>-</td><td>创建时祝福+1（后计算）。</td></tr>\\n                <tr><td>额外祝福（Additional Blessings）</td><td>1</td><td>被动</td><td>-</td><td>在预备阶段获得1点额外祝福。冒险者职业自带技能。</td></tr>\\n                <tr><td>强击（Heavy Attack）</td><td>1</td><td>主要动作</td><td>4MP</td><td>近战武器攻击，伤害+(SL)d6。</td></tr>\\n                <tr><td>武器技能：单手剑（Weapon Skill: One-Handed Sword）</td><td>1</td><td>被动</td><td>-</td><td>使用单手剑时命中判定+1d6（后计算）。</td></tr>\\n                <tr><td>陷阱探测（Trap Detection Skill）</td><td>1</td><td>判定前</td><td>-</td><td>陷阱探测判定+1d6（后计算）。</td></tr>\\n                <tr><td>元素符文（Elemental Rune）</td><td>1</td><td>次要动作</td><td>-</td><td>消耗1颗红宝石。本场景内所有武器攻击变为火属性。</td></tr>\\n                <tr><td>急救（Lifesaving Skill）</td><td>1</td><td>主要动作</td><td>-</td><td>敏捷判定DL10。使一名昏迷的角色恢复意识。</td></tr>\\n                <tr><td>生火（Tinder）</td><td>1</td><td>主要动作</td><td>-</td><td>点燃一堆小火。基础魔法。</td></tr>\\n            </table>\\n            <p><strong>装备：</strong>长剑、帽子、布甲、冒险者卡、冒险者套装、治疗药水、红宝石</p>\\n        "},{"i":39,"ch":"第三章","chTitle":"种族详解","title":"种族概述","id":"race-overview","html":"\\n            <p>在素晴TRPG中，种族是角色的基本身份标识之一。《为美好的世界献上祝福！TRPG》基础规则书提供<strong>三种可选种族</strong>。每个种族都有独特的背景、初始技能和擅长职业。</p>\\n            <p>选择种族时不仅要考虑属性加成，更要考虑角色的背景故事。转生者意味着你来自另一个世界，原住民代表你在这个世界土生土长，而红魔族则赋予你独特的魔法天赋和……嗯，中二病的倾向。</p>\\n            <p><strong>种族基础属性值：</strong></p>\\n            <table>\\n                <tr><th>种族</th><th>STR力量</th><th>DEX灵巧</th><th>AGI敏捷</th><th>INT智力</th><th>PER感知</th><th>MND精神</th><th>LUK幸运</th></tr>\\n                <tr><td>转生者</td><td>8</td><td>9</td><td>8</td><td>9</td><td>8</td><td>7</td><td>8</td></tr>\\n                <tr><td>原住民</td><td>9</td><td>8</td><td>8</td><td>8</td><td>8</td><td>8</td><td>8</td></tr>\\n                <tr><td>红魔族</td><td>7</td><td>8</td><td>8</td><td>10</td><td>7</td><td>10</td><td>7</td></tr>\\n            </table>\\n            <p>选择种族后，将上表中的基础属性值填入角色卡。然后获得<strong>5点奖励点数</strong>自由分配——可以将5点全部分配到一项属性，也可以分散到多项。但创建时<strong>单项属性值不得超过13</strong>。最终基础属性值 ÷ 3（向下取整）= 属性加值。</p>\\n            <div class=\\"example\\"><strong>计算示例：</strong>转生者的基础力量为8，投入2点奖励点后变为10。10÷3=3（向下取整），力量加值为+3。</div>\\n        "},{"i":40,"ch":"第三章","chTitle":"种族详解","title":"转生者（Reincarnated）","id":"race-reincarnated","html":"\\n            <p><strong>📝 译者补充（非原版内容）——种族特性：</strong>转生者是在原来世界（通常是现代日本）死亡后，由女神赋予第二次生命而来到素晴世界的人。他们拥有\\"额外祝福\\"——也就是说他们比原住民多一次命运扭转的机会。</p>\\n            <p><strong>种族技能：</strong>转生者可以选择带有\\"时机：创造\\"标签的种族技能。他们的生命轨迹表与原住民和红魔族不同，反映了来自另一个世界的独特经历。</p>\\n            <p><strong>📝 译者补充（非原版内容）——种族描述：</strong>转生者带着前世的记忆和知识来到这个世界。这使他们对这个奇幻世界有着独特的视角——有时这会带来战术上的优势（例如和真利用现代知识对抗怪物），有时也会让他们对这个世界的荒谬之处感到无奈。</p>\\n            <p>转生者可能被任何女神转生——但说实话，大多数情况下你会遇到的是阿库娅。运气好的话，你可能会遇到厄里斯女神。</p>\\n            <p><strong>📝 译者补充（非原版内容）——适合职业：</strong>所有职业均可。转生者的额外祝福使他们在关键时刻更有可能逆转命运。冒险者职业与转生者特别契合（和真就是最好的例子）。</p>\\n            <div class=\\"example\\"><strong>📝 译者补充（非原版内容）——角色灵感：</strong>佐藤和真是典型的转生者冒险者——从现代日本来到异世界，利用灵活的头脑、现代知识以及关键时的运气在各种危机中存活下来。当然，他最初是因为被拖拉机吓得心脏麻痹而死，这也是转生史上最尴尬的死因之一。</div>\\n            <h4>转生者种族技能列表</h4>\\n            <table>\\n                <tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>效果</th></tr>\\n                <tr><td><strong>转生恩赐：武器</strong><br>Reincarnation Boon: Weapon</td><td>物品/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>游戏前从持有武器中选择一件，该武器攻击力+2</td></tr>\\n                <tr><td><strong>转生恩赐：防具</strong><br>Reincarnation Boon: Armor</td><td>物品/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>游戏前从持有防具中选择一件，物理防御+2、魔法防御+1</td></tr>\\n                <tr><td><strong>转生恩赐：命运之力</strong><br>Reincarnation Boon: Power of Fate</td><td>被动/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>角色创建时获得1点额外祝福</td></tr>\\n                <tr><td><strong>转生闪光</strong><br>Flash of Reincarnation</td><td>判定后</td><td>自动成功</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>判定后立即使用，该判定结果+3。每剧本限用一次。利用来自现代地球的知识或常识摆脱困境</td></tr>\\n            </table>\\n        "},{"i":41,"ch":"第三章","chTitle":"种族详解","title":"原住民（Native）","id":"race-native","html":"\\n            <p><strong>📝 译者补充（非原版内容）——种族特性：</strong>原住民是出生并生活在素晴世界中的居民。他们与这个世界有着天然的联系，能力均衡，适应性强。</p>\\n            <p><strong>种族技能：</strong>原住民从自己的种族技能列表中选择技能。他们与所有职业都有良好的相性，是初次接触TRPG的玩家的推荐选择。</p>\\n            <p><strong>📝 译者补充（非原版内容）——种族描述：</strong>原住民涵盖了贝尔泽格王国中的普通人类居民。他们可能来自各种出身——农夫家庭、商人家庭、贵族家庭，甚至是冒险者世家。作为在这个世界中成长的人，原住民对魔法、怪物和冒险者公会等事物有着天然的熟悉感。</p>\\n            <p>原住民的生命轨迹表反映了在这个世界中成长的各种可能性——从作为骑士的侍从，到在冒险者公会中长大，再到普通的乡村生活。</p>\\n            <p><strong>📝 译者补充（非原版内容）——适合职业：</strong>所有职业均可。原住民没有特别突出或削弱的能力方向，因此无论选择什么职业都能良好发挥。对于新手玩家，本书推荐选择原住民。</p>\\n            <div class=\\"note\\"><strong>推荐：</strong>如果你在选择种族时遇到困难，原住民是最安全的选择。他们与所有职业都很相配，而且可以自由设计属于这个世界的丰富背景故事。</div>\\n            <h4>原住民种族技能列表</h4>\\n            <table>\\n                <tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>效果</th></tr>\\n                <tr><td><strong>多才多艺</strong><br>Versatility</td><td>被动/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>选择3个基础属性值，角色创建时每个选择的基础属性值+1</td></tr>\\n                <tr><td><strong>即断即决</strong><br>Snap Decision</td><td>被动/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>行动点+3</td></tr>\\n                <tr><td><strong>坚如磐石</strong><br>Stalwart</td><td>被动/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>物理防御+3</td></tr>\\n                <tr><td><strong>武艺</strong><br>Combat Arts</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>使用装备武器时，所有最终命中判定值+2</td></tr>\\n            </table>\\n        "},{"i":42,"ch":"第三章","chTitle":"种族详解","title":"红魔族（Crimson Demon）","id":"race-crimson","html":"\\n            <p><strong>📝 译者补充（非原版内容）——种族特性：</strong>红魔族是拥有绯红色眼睛的族群，居住在隐秘的红魔之乡。他们天生拥有极高的智力和强大的魔力，是贝尔泽格王国中最具魔法天赋的种族。</p>\\n            <p><strong>种族技能：</strong>红魔族拥有独特的种族技能，通常与魔法增强和MP提升相关。在创建时选择带有\\"时机：创建\\"标签的红魔族种族技能。</p>\\n            <p><strong>📝 译者补充（非原版内容）——种族描述：</strong>红魔族几乎所有成员都拥有极高的智力，但身体能力通常偏弱。然而真正让红魔族与众不同的，是他们独特的<strong>中二病美学</strong>——每个红魔族都热衷于为自己的招式和能力起一些极其夸张的名字，并以戏剧化的方式介绍自己。这是他们文化的一部分，请不要试图纠正他们。</p>\\n            <p>红魔族生活在红魔之乡，一个与世隔绝但充满魔法研究氛围的地方。他们为自己起的名字通常也很不寻常（例如\\"惠惠\\"——一个简洁到极致的名字，在红魔族中反而是异类）。</p>\\n            <p><strong>📝 译者补充（非原版内容）——适合职业：</strong>法师系职业是最自然的选择。红魔族+法师的组合可以创造出极其强大的魔法攻击者。当然，偶尔也会有选择其他道路的异类红魔族——比如某个梦想成为少女漫画家的澡堂老板女儿。</p>\\n            <div class=\\"example\\"><strong>📝 译者补充（非原版内容）——角色灵感：</strong>惠惠是红魔族法师的完美代表——超高智力，只学习\\"爆裂\\"（Explosion）一种魔法并将其威力发挥到极致，每天坚持练习，尽管放完魔法就会耗尽魔力倒地。她热衷于为每次爆裂起名，并以\\"吾乃惠惠！红魔族第一魔法师，操纵最强魔法——爆裂魔法之人！\\"的方式介绍自己。还有那个明明是装饰却坚持戴着的眼罩。</div>\\n            <h4>红魔族种族技能列表</h4>\\n            <table>\\n                <tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>效果</th></tr>\\n                <tr><td><strong>破坏之神的宠儿</strong><br>Godsent Child of Destruction</td><td>被动</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>所有魔法攻击伤害+3</td></tr>\\n                <tr><td><strong>魔法天赋</strong><br>Magical Talent</td><td>被动/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>所有魔法判定的总判定值+1</td></tr>\\n                <tr><td><strong>大魔力</strong><br>Great Magic Power</td><td>被动/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>角色创建时最大MP+5</td></tr>\\n                <tr><td><strong>能力特化</strong><br>Ability Specialization</td><td>被动/创建时</td><td>—</td><td>自身</td><td>—</td><td>—</td><td>1</td><td>选择2个基础属性值，一个+4，另一个-1</td></tr>\\n            </table>\\n        "},{"i":43,"ch":"第四章","chTitle":"职业详解","title":"种族技能一览","id":"race-skills","html":"\\n            <p>以下是各种族可获得的技能完整列表。包含原版规则书和扩展规则（Arianrhod 2E）的种族技能。</p>\\n            \x3C!-- 种族技能 -->\\n<table>\\n<thead><tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr></thead>\\n<tbody>\\n<tr><td><strong>转生者</strong></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>基础能力值：力量 8, 灵巧 9, 敏捷 8, 智力 9, 感知 8, 精神 7, 幸运 8</td></tr>\\n<tr><td><strong>转生闪光</strong></td><td>判定后</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>在判定后立即使用。该判定的结果+3。</td></tr>\\n<tr><td><strong>转生恩赐：防具</strong></td><td>物品 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在准备阶段，从你的物品中选择一件盔甲，它获得+2物理防御和+1魔法防御。</td></tr>\\n<tr><td><strong>转生恩赐：命运之力</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的角色在创建时获得1个额外祝福。</td></tr>\\n<tr><td><strong>转生恩赐：武器</strong></td><td>物品 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在准备阶段，从你的物品中选择一件武器。该武器获得+2攻击力。</td></tr>\\n<tr><td><strong>异世界生意</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>当你购买价值不超过CL×100 KE的物品时可以使用此技能。你获得该物品而不减少你的现金储备。你也可以在结算阶段支付生活费用和基地维护费用时选择使用此技能。</td></tr>\\n<tr><td><strong>异世界生意II</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有异世界生意才能学习此技能。当你购买价值不超过CL×1000 KE的物品时可以使用此技能。你获得该物品而不减少你的现金储备。你也可以在结算阶段支付生活费用和基地维护费用时选择使用此技能。</td></tr>\\n<tr><td><strong>转生恩赐：盾牌</strong></td><td>物品 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在准备阶段，选择你拥有的一件盾牌类物品。所选物品获得+1物理防御和+2魔法防御。</td></tr>\\n<tr><td><strong>转生恩赐II：防具</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有转生恩赐：防具才能学习此技能。你必须穿着为转生恩赐：防具选择的盔甲才能使用。你所有判定+1d6。此效果持续到回合结束。</td></tr>\\n<tr><td><strong>转生恩赐II：命运之力</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有转生恩赐：命运之力才能学习此技能。当你使用一个或多个祝福为掷骰添加额外骰子时可以激活。该掷骰额外+2d6。</td></tr>\\n<tr><td><strong>转生恩赐II：盾牌</strong></td><td>伤害掷骰后</td><td>自动成功</td><td>区域</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有转生恩赐：盾牌才能学习此技能。当你装备了为转生恩赐：盾牌选择的盾牌时可以使用。目标受到的伤害减少3d6。</td></tr>\\n<tr><td><strong>转生恩赐II：武器</strong></td><td>伤害掷骰前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你必须拥有转生恩赐：武器才能学习此技能。你可以在使用为转生恩赐：武器选择的武器进行攻击的伤害掷骰前使用。你的攻击伤害增加2d6。此效果持续到回合结束。</td></tr>\\n<tr><td><strong>原住民</strong></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>基础能力值：力量 9, 灵巧 8, 敏捷 8, 智力 8, 感知 8, 精神 8, 幸运 8</td></tr>\\n<tr><td><strong>战斗技艺</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>使用装备的武器时，所有最终命中判定结果+2。</td></tr>\\n<tr><td><strong>即时决断</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>获得+3行动点数</td></tr>\\n<tr><td><strong>坚韧</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>获得+3物理防御</td></tr>\\n<tr><td><strong>多面性</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择此技能时，选择三个基本能力值。创建角色时，每个选择的基本能力值+1。</td></tr>\\n<tr><td><strong>大胃王</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>学习此技能时选择一个能力值。你使用所选能力值的判定总结果+2。但是，你的生活费用增加50%，最低为CL×10 KE。</td></tr>\\n<tr><td><strong>烹饪传统</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>此技能影响恢复HP或MP的食物类物品。你使用这些物品时效果+2。</td></tr>\\n<tr><td><strong>深信</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>此技能仅在你学习了\\"信仰：~~\\"通用技能时有效。你的攻击伤害和HP恢复效果+3。</td></tr>\\n<tr><td><strong>情报网</strong></td><td>判定前</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在进行情报收集判定或敌人识别判定前使用此技能。该判定获得+2d6。</td></tr>\\n<tr><td><strong>坚忍之魂</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你使用精神的反应判定获得+1d6。</td></tr>\\n<tr><td><strong>天赋</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择此技能时选择一个基本能力值。该基本能力值+3。</td></tr>\\n<tr><td><strong>顽强</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的死亡判定获得+1d6。</td></tr>\\n<tr><td><strong>红魔族</strong></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>基础能力值：力量 7, 灵巧 8, 敏捷 8, 智力 10, 感知 7, 精神 10, 幸运 7</td></tr>\\n<tr><td><strong>能力特化</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择此技能时，选择两个基本能力值。一个+4，另一个-1。</td></tr>\\n<tr><td><strong>破坏之神的宠儿</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你所有的魔法攻击伤害+3。</td></tr>\\n<tr><td><strong>强大魔力</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>角色创建时，你的角色获得+5最大MP。</td></tr>\\n<tr><td><strong>魔法天赋</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你所有魔法判定的总结果+1。</td></tr>\\n<tr><td><strong>元素之选</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[元素亲和II]才能学习此技能。获得此技能时，选择与[元素亲和II]相同的元素，并记为\\"元素之选：火\\"等。当你进行攻击造成所选元素的伤害时，伤害+3。你只能为一个元素学习此技能。[进阶规则书]</td></tr>\\n<tr><td><strong>魔力</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须是[类型：恶魔]才能学习此技能。你使用的类型为法术的技能消耗减少1（最低1）。[进阶规则书]</td></tr>\\n<tr><td><strong>戏剧性回归</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你处于负面状态效果下时，此技能激活。你的攻击伤害+5。</td></tr>\\n<tr><td><strong>天才</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>在你进行非判定的掷骰前立即使用。该掷骰+2d6。</td></tr>\\n<tr><td><strong>天下第一</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你当前没有与任何其他角色（无论敌友）交战时，此技能生效。你的攻击伤害+1d6。</td></tr>\\n<tr><td><strong>自我介绍</strong></td><td>准备阶段</td><td>精神</td><td>区域（选择）</td><td>视野</td><td>3</td><td>1</td><td>每场景1次</td><td>你只能在战斗的第一轮使用此技能。进行一次精神判定，与目标的精神判定对抗。如果你获胜，目标的行动点数减少4。</td></tr>\\n<tr><td><strong>专精法术</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在准备阶段选择一个类型为法术的技能。你使用该技能的判定总结果+2。</td></tr>\\n<tr><td><strong>魔王军</strong></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>基础能力值：力量 9, 灵巧 8, 敏捷 9, 智力 9, 感知 7, 精神 8, 幸运 7</td></tr>\\n<tr><td><strong>魔王军：恶魔</strong></td><td>判定后 / 创建时</td><td>自动成功</td><td>单体</td><td>可见</td><td>-</td><td>1</td><td>每剧本1次</td><td>在目标判定后立即使用。该判定的结果+3。<br>弱点：你被视为\\"类型：恶魔\\"。结算阶段的生活费用翻倍。</td></tr>\\n<tr><td><strong>魔王军：亚人</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当与队伍成员交战时，你的攻击伤害+2d6。<br>弱点：你被视为\\"类型：亚人\\"。此外，你的最大HP-10（最低1）。</td></tr>\\n<tr><td><strong>魔王军：史莱姆</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>获得+5物理防御。弱点：你被视为\\"类型：人造\\"。此外，如果针对你的攻击是暴击，伤害按你的物理防御和魔法防御为0计算。</td></tr>\\n<tr><td><strong>魔王军：不死族</strong></td><td>伤害掷骰前 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>对\\"类型：不死族\\"有效。在你的攻击伤害掷骰前使用。恢复HP。恢复量为CL×3点。<br>弱点：你被视为\\"类型：不死族\\"。此外，你不能接受技能、HP恢复技能和物品的治疗效果，除非它们对\\"类型：不死族\\"有效。</td></tr>\\n<tr><td><strong>魔王军：魔兽</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你所有攻击伤害+5。<br>弱点：你被视为\\"类型：魔兽\\"。此外，你不能装备\\"装备栏：身体\\"物品。</td></tr>\\n<tr><td><strong>魔王军：奇美拉</strong></td><td>被动 / 创建时</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择此技能时，选择两个\\"魔王军\\"技能并获得其效果。<br>弱点：你被视为\\"类型：人造\\"。如果由于另一个\\"魔王军\\"技能有不同的\\"弱点\\"或\\"类型\\"，该\\"类型\\"也适用。</td></tr>\\n<tr><td><strong>邪恶之毒</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你施加的减益效果+1。</td></tr>\\n<tr><td><strong>战斗形态</strong></td><td>准备阶段</td><td>自动成功</td><td>自身</td><td>-</td><td>5</td><td>1</td><td>-</td><td>你的攻击伤害+5。此效果持续到回合结束。</td></tr>\\n<tr><td><strong>元素亲和</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>获得此技能时选择一个元素。魔法防御+5。但是，你现在对所选元素有弱点。</td></tr>\\n<tr><td><strong>再生</strong></td><td>清理阶段</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>对\\"类型：不死族\\"有效。恢复HP。恢复量为CL×3点。</td></tr>\\n<tr><td><strong>魔王之力</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>获得此技能时选择另一个技能。所选技能的SL和最大SL+1。</td></tr>\\n<tr><td><strong>飞行</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以进入飞行状态。进入场景时，选择是否应用效果。通过使用移动动作，你可以取消飞行状态或返回飞行状态。</td></tr>\\n</tbody>\\n</table>\\n\\n        "},{"i":44,"ch":"第四章","chTitle":"职业详解","title":"职业概述","id":"class-overview","html":"\\n            <p>职业代表角色的定位和战斗方式。素晴TRPG中共有<strong>12种初始职业</strong>（Starter Classes）可供选择，角色达到10级后还可以转职为<strong>进阶职业</strong>（Advanced Classes）。</p>\\n            <p>每个职业都有独特的\\"职业修正\\"——对各项属性值的加成——以及专属的职业技能。以下是所有初始职业和进阶职业的修正数据摘要（数据来源：原版规则书第120页）：</p>\\n            <p><strong>初始职业修正表：</strong></p>\\n            <table>\\n                <tr><th>职业</th><th>STR</th><th>DEX</th><th>AGI</th><th>INT</th><th>PER</th><th>MND</th><th>LUK</th><th>起始HP</th><th>起始MP</th><th>HP成长</th><th>MP成长</th><th>装备限制</th></tr>\\n                <tr><td>冒险者</td><td>+1</td><td>+1</td><td>+1</td><td>+1</td><td>+1</td><td>+1</td><td>+1</td><td>23</td><td>23</td><td>+10</td><td>+10</td><td>无限制</td></tr>\\n                <tr><td>战士</td><td>+2</td><td>+2</td><td>+2</td><td>—</td><td>—</td><td>—</td><td>—</td><td>26</td><td>20</td><td>+14</td><td>+8</td><td>战士</td></tr>\\n                <tr><td>祭司</td><td>—</td><td>+2</td><td>—</td><td>+2</td><td>—</td><td>+2</td><td>—</td><td>22</td><td>24</td><td>+10</td><td>+12</td><td>祭司</td></tr>\\n                <tr><td>法师</td><td>—</td><td>—</td><td>—</td><td>+2</td><td>+2</td><td>+2</td><td>—</td><td>20</td><td>26</td><td>+8</td><td>+14</td><td>法师</td></tr>\\n                <tr><td>盗贼</td><td>—</td><td>+2</td><td>+2</td><td>—</td><td>+2</td><td>—</td><td>—</td><td>24</td><td>22</td><td>+12</td><td>+10</td><td>盗贼</td></tr>\\n                <tr><td>弓箭手</td><td>—</td><td>+2</td><td>+1</td><td>—</td><td>+2</td><td>—</td><td>+1</td><td>24</td><td>22</td><td>+12</td><td>+10</td><td>盗贼</td></tr>\\n                <tr><td>元素师</td><td>—</td><td>—</td><td>+1</td><td>+2</td><td>+2</td><td>+1</td><td>—</td><td>22</td><td>24</td><td>+8</td><td>+14</td><td>法师</td></tr>\\n                <tr><td>创造者</td><td>—</td><td>+1</td><td>+2</td><td>+1</td><td>+2</td><td>—</td><td>—</td><td>23</td><td>23</td><td>+11</td><td>+11</td><td>盗贼</td></tr>\\n                <tr><td>剑斗士</td><td>+1</td><td>+2</td><td>+2</td><td>—</td><td>+1</td><td>—</td><td>—</td><td>26</td><td>20</td><td>+14</td><td>+8</td><td>战士</td></tr>\\n                <tr><td>骑士</td><td>+2</td><td>+1</td><td>+1</td><td>—</td><td>—</td><td>+2</td><td>—</td><td>26</td><td>20</td><td>+14</td><td>+8</td><td>战士</td></tr>\\n                <tr><td>枪兵</td><td>+2</td><td>+2</td><td>+1</td><td>—</td><td>+1</td><td>—</td><td>—</td><td>26</td><td>20</td><td>+14</td><td>+8</td><td>战士</td></tr>\\n                <tr><td>符文骑士</td><td>+1</td><td>+2</td><td>+1</td><td>+1</td><td>—</td><td>+1</td><td>—</td><td>24</td><td>22</td><td>+12</td><td>+10</td><td>战士</td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>关于HP成长和MP成长：</strong>每次角色升级时，最大HP增加该职业的\\"HP成长\\"值，最大MP增加该职业的\\"MP成长\\"值。公式：升级后最大HP = 角色创建时的最大HP + (职业HP成长 × 升级次数) + 基础力量值的增加。转职后使用新职业的成长值。</div>\\n            <p><strong>进阶职业修正表：</strong></p>\\n            <table>\\n                <tr><th>进阶职业</th><th>STR</th><th>DEX</th><th>AGI</th><th>INT</th><th>PER</th><th>MND</th><th>LUK</th><th>HP成长</th><th>MP成长</th><th>前置职业</th></tr>\\n                <tr><td>十字军</td><td>+3</td><td>+2</td><td>+2</td><td>—</td><td>—</td><td>+1</td><td>—</td><td>+20</td><td>+10</td><td>战士</td></tr>\\n                <tr><td>大祭司</td><td>—</td><td>+2</td><td>—</td><td>+2</td><td>—</td><td>+3</td><td>+1</td><td>+14</td><td>+16</td><td>祭司</td></tr>\\n                <tr><td>大法师</td><td>—</td><td>—</td><td>—</td><td>+3</td><td>+3</td><td>+2</td><td>—</td><td>+12</td><td>+18</td><td>法师</td></tr>\\n                <tr><td>刺客</td><td>—</td><td>+2</td><td>+3</td><td>—</td><td>+3</td><td>—</td><td>—</td><td>+16</td><td>+14</td><td>盗贼</td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>关于进阶职业：</strong>进阶职业没有\\"起始HP/起始MP\\"，因为转职是在原有HP/MP基础上加上HP成长/MP成长值。转职需达到10级。转职时重写职业修正，重新计算所有属性值。</div>\\n            <p>以下是所有职业的定位列表：</p>\\n            <table>\\n                <tr><th>职业（英/中）</th><th>定位</th><th>进阶职业</th></tr>\\n                <tr><td>冒险者 冒险者</td><td>全能型，可从任何职业学习技能</td><td>—（无进阶）</td></tr>\\n                <tr><td>战士 战士</td><td>前线物理攻击者，擅长武器战斗</td><td>→ 十字军 十字军</td></tr>\\n                <tr><td>祭司 祭司</td><td>治疗与支援，神圣魔法使用者</td><td>→ 大祭司 大祭司</td></tr>\\n                <tr><td>法师 法师</td><td>魔法攻击者，元素魔法专家</td><td>→ 大法师 大法师</td></tr>\\n                <tr><td>盗贼 盗贼</td><td>技巧型战士，潜行与陷阱专家</td><td>→ 刺客 刺客</td></tr>\\n                <tr><td>弓箭手 弓箭手</td><td>远程物理攻击者，弓术专精</td><td>—</td></tr>\\n

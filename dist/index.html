                    </div>\\n                </div>\\n\\n            </div>\\n            <div class=\\"note\\" style=\\"margin-top:10px;\\"><strong>卡片说明：</strong>以上卡片数据与上方表格完全一致，来源于原版规则书第276-285页。共27种敌人，从1级杂鱼到20级BOSS蟾蜍王。</div>\\n        "},{"i":99,"ch":"第十章","chTitle":"游戏主持人指南","title":"任务列表","id":"gm-quests","html":"\\n            <p>以下是原版规则书中提供的示例任务。GM可直接使用或作为参考创建自己的任务。</p>\\n            <h4>任务数据说明</h4>\\n            <ul>\\n                <li><strong>名称：</strong>任务的名称</li>\\n                <li><strong>类型：</strong>任务的大类别，如\\"讨伐\\"或\\"探索\\"</li>\\n                <li><strong>期限：</strong>任务的截止日期，从接受任务时开始计算</li>\\n                <li><strong>报酬：</strong>完成任务后获得的报酬。除非另有说明，报酬由所有PC平分。通常假设有5名PC</li>\\n                <li><strong>条件：</strong>接受任务的条件。除非另有说明，只要队伍中有一人满足条件即可接受</li>\\n                <li><strong>详情：</strong>任务的详细内容</li>\\n                <li><strong>清除条件：</strong>完成任务的条件</li>\\n                <li><strong>任务效果：</strong>接受任务后生效的特殊规则。如果没有则省略</li>\\n            </ul>\\n            <table>\\n                <tr><th>名称</th><th>类型</th><th>期限</th><th>报酬</th><th>条件</th><th>清除条件</th><th>任务效果</th></tr>\\n                <tr><td><strong>讨伐公共墓地的不死族</strong></td><td>讨伐</td><td>3天</td><td>20 KE</td><td>无</td><td>中间阶段深夜前往公共墓地，击败1个僵尸制造者（第281页）和1d6−1（最少1）个僵尸（第278页）</td><td>墓地夜间为黑暗状态</td></tr>\\n                <tr><td><strong>哥布林讨伐</strong></td><td>讨伐</td><td>3天</td><td>100 KE</td><td>无</td><td>中间阶段前往附近树林，在高潮阶段结束前击败1个哥布林首领（第281页）和5个哥布林（第276页）</td><td>中间阶段判定失误时，出现1个新手杀手（第284页）</td></tr>\\n                <tr><td><strong>魔法实验志愿者</strong></td><td>其他</td><td>1天</td><td>50 KE</td><td>强健体魄或高魔法抗性</td><td>承受3d6+50火焰/冰霜魔法伤害而不陷入濒死</td><td>GM可让PC从大法师技能列表中学习一个攻击法术，由任务委托人教授。PC可以自己命名该技能</td></tr>\\n                <tr><td><strong>讨伐巨型蟾蜍</strong></td><td>讨伐</td><td>3天</td><td>100 KE</td><td>无</td><td>在高潮阶段结束前，与巨型蟾蜍（第280页）战斗并击杀至少5只</td><td>战斗开始时玩家可选择是否与蟾蜍战斗。若选择战斗，GM可在每轮开始时让额外1d6−1（最少1）只巨型蟾蜍加入战斗</td></tr>\\n                <tr><td><strong>收集飞入城镇的卷心菜</strong></td><td>紧急</td><td>1天</td><td>每个掉落物品10 KE</td><td>全体成员必须参加</td><td>从小卷心菜（第276页）处获得至少1个卷心菜掉落物</td><td>中间阶段可与1d6×5只小卷心菜战斗。GM还可额外出现1d6只生菜（使用小卷心菜数据但掉落生菜）</td></tr>\\n                <tr><td><strong>保护家畜并消灭巨型蝙蝠</strong></td><td>讨伐</td><td>3天</td><td>200 KE</td><td>无</td><td>找到巨型蝙蝠（第278页）的巢穴，击败所有蝙蝠（PC数+1d6只）</td><td>巢穴为黑暗状态。任务期间每晚需击败[PC数−2]（最少2）只巨型蝙蝠</td></tr>\\n                <tr><td><strong>净化湖水</strong></td><td>其他</td><td>1天</td><td>300 KE</td><td>拥有净化法术的祭司</td><td>进入湖中，以湖水为目标使用净化术10次</td><td>1d6轮后，2d6只凶暴鳄鱼（第278页）加入战斗。湖视为水池（第289页）。清除条件完成后鳄鱼离开</td></tr>\\n                <tr><td><strong>不死骑士追悼</strong></td><td>讨伐</td><td>3天</td><td>400 KE</td><td>祭司</td><td>击败不死骑士（第279页），并收集证明其为熟人的证据</td><td>击败不死骑士时，中间阶段战利品掷骰≥7或高潮阶段≥5，掉落\\"熟人证明\\"（重量1）代替正常掉落</td></tr>\\n                <tr><td><strong>讨伐蝎尾狮和狮鹫</strong></td><td>讨伐</td><td>1周</td><td>500 KE</td><td>无</td><td>中间阶段同时与1只蝎尾狮（第284页）和1只狮鹫（第285页）战斗并击杀</td><td>两只怪物任一攻击前掷1d6：奇数攻击PC，偶数攻击其他目标。若无法攻击所选目标，GM选择可攻击的目标</td></tr>\\n            </table>\\n        "},{"i":100,"ch":"第十章","chTitle":"游戏主持人指南","title":"NPC个人信息","id":"gm-npc","html":"\\n            <p>以下是原作中居住在阿克塞尔的角色，可作为NPC使用。GM也可以创建自己的NPC。</p>\\n            <h4>阿库娅（Aqua）</h4>\\n            <p>性别：女 | 年龄：不明</p>\\n            <p>负责现代日本的女神。她原本是将死去的日本人送到异世界以击败魔王，但被和真强行拉入了异世界。职业是大祭司。她极其美丽，但性格是一个相当大的缺陷。她可能会对受伤的玩家使用治愈魔法。</p>\\n            <p style=\\"font-style:italic;color:#8b6914;\\">\\"我是女神！\\"</p>\\n            <h4>佐藤和真（Kazuma Satou）</h4>\\n            <p>性别：男 | 年龄：16</p>\\n            <p>原作的主角。来自现代日本的转生者。由于属性值低，他无法选择职业，只能以冒险者开始。人们（主要是女性）对他评价不高。但他大体上是个好人，也有敏锐的头脑。他可能会出现在有困难的玩家面前提供有用的建议。</p>\\n            <p style=\\"font-style:italic;color:#8b6914;\\">\\"运气一直是我唯一拥有的东西！\\"</p>\\n            <h4>惠惠（Megumin）</h4>\\n            <p>性别：女 | 年龄：13</p>\\n            <p>来自红魔族的少女。职业是大法师。她从心底热爱爆裂魔法，从未学习过其他法术。她的行为确实令人尴尬，但她也相当博学，如果玩家缺乏知识，她可能会提供帮助。</p>\\n            <p style=\\"font-style:italic;color:#8b6914;\\">\\"我是红魔族首屈一指的魔法师！\\"</p>\\n            <h4>达克妮丝（Darkness）</h4>\\n            <p>性别：女 | 年龄：18</p>\\n            <p>金发碧眼的美女。职业是圣骑士。防御力很高，但剑技糟糕透顶，几乎没有任何一击能命中目标。同时也是个超级受虐狂。不知为何，她对贵族事务非常了解。她做事认真，绝不会忽视需要帮助的人，如果你向她咨询问题，她会非常友好。</p>\\n            <p style=\\"font-style:italic;color:#8b6914;\\">\\"当墙壁是我绝对最擅长的。\\"</p>\\n            <h4>维兹（Wiz）</h4>\\n            <p>性别：女 | 年龄：永远20岁</p>\\n            <p>拥有长卷棕发和棕色眼睛的美女。她目前在阿克塞尔镇经营一家魔法物品店，但她曾经是被称为\\"冰之魔女\\"的技艺精湛的大法师。以她的性格，每当玩家有困难时她都会积极倾听。</p>\\n            <p style=\\"font-style:italic;color:#8b6914;\\">\\"我会没事的！\\"</p>\\n        "},{"i":101,"ch":"第十章","chTitle":"游戏主持人指南","title":"陷阱与物体","id":"gm-traps","html":"\\n            <h4>陷阱的类型</h4>\\n            <p>陷阱是阻碍玩家角色冒险的机关，有时甚至致命。陷阱分为三种类型：</p>\\n            <ul>\\n                <li><strong>触发型陷阱（Triggered）：</strong>当角色执行特定动作（如开门、解锁、踩踏地板）时发动的陷阱。GM可自由决定触发条件。触发型陷阱可以设置在物体、敌人、隔断或其他陷阱上。一旦发动，通常不会再次激活。触发型陷阱分为\\"可探测\\"和\\"可感知\\"两种设置方式。</li>\\n                <li><strong>附魔型陷阱（Enchanted）：</strong>对物体或其他陷阱施加效果的陷阱。它们会持续触发直到被拆除。附魔型陷阱可以设置在物体、敌人和其他陷阱上。</li>\\n                <li><strong>持续型陷阱（Continuous）：</strong>只要角色与其接触就会持续产生效果的陷阱。包括阻止角色行动或造成伤害的效果。持续型陷阱可以设置在隔断上。</li>\\n            </ul>\\n\\n            <h4>探测与拆除陷阱</h4>\\n            <p><strong>探测陷阱：</strong>角色必须与怀疑有陷阱的目标（物体、墙壁、门等）处于同一交战中。声明要探测陷阱后进行感知判定，如果总判定值≥陷阱的探测值，则成功发现陷阱。没有\\"陷阱探测技能\\"的角色如果探测失败，会意外触发陷阱。</p>\\n            <p><strong>感知威胁：</strong>可感知型陷阱通过感知威胁来发现。当角色接触到可感知型陷阱时，GM要求角色进行感知判定。如果总判定值≥陷阱的探测值，则陷阱不再隐藏，角色可以尝试拆除。如果多个角色接触到陷阱，所有人都必须通过感知威胁判定，否则陷阱会激活。接触可感知型陷阱时，角色的移动自动在该位置结束。</p>\\n            <p><strong>拆除陷阱：</strong>角色必须与陷阱处于同一交战中。声明要拆除陷阱后进行灵巧判定，如果总判定值≥陷阱的拆除值，则成功拆除，陷阱永远不会再次激活。如果拆除失败，陷阱会激活。</p>\\n\\n            <h4>陷阱自定义</h4>\\n            <p>标记\\"可自定义\\"的陷阱可以自由调整。自定义会提高陷阱等级：</p>\\n            <table>\\n                <tr><th>变更内容</th><th>等级增加</th></tr>\\n                <tr><td>变更探测值</td><td>每+1探测值，陷阱等级+2</td></tr>\\n                <tr><td>变更拆除值</td><td>每+1拆除值，陷阱等级+2</td></tr>\\n                <tr><td>变更效果DL</td><td>每+1难度等级，陷阱等级+3</td></tr>\\n                <tr><td>变更伤害</td><td>每+1D6伤害，陷阱等级+1</td></tr>\\n                <tr><td>变更命中判定</td><td>每+1命中判定，陷阱等级+2</td></tr>\\n                <tr><td>变更HP</td><td>每+10HP，陷阱等级+1</td></tr>\\n            </table>\\n\\n            <h4>陷阱列表</h4>\\n            <table>\\n                <tr><th>名称</th><th>类型</th><th>构造</th><th>等级</th><th>可自定义</th><th>条件</th><th>探测值</th><th>拆除值</th><th>对象/射程</th><th>效果</th></tr>\\n                <tr><td><strong>水池</strong><br>Pool</td><td>陷阱</td><td>物理</td><td>1</td><td>〇</td><td>持续</td><td>—</td><td>—</td><td>接触/近</td><td>使用时选择一种减益效果。如果你对目标造成至少1点伤害，对目标施加选择的减益效果。减益效果的有效等级视为1。此效果持续到主要阶段结束。</td></tr>\\n                <tr><td><strong>锁A</strong><br>Lock A</td><td>陷阱</td><td>物理</td><td>1</td><td>〇</td><td>附魔</td><td>—</td><td>9</td><td>固定/—</td><td>使用时选择一种减益效果。如果你对目标造成至少1点伤害，对目标施加选择的减益效果。减益效果的有效等级视为1。此效果持续到主要阶段结束。</td></tr>\\n                <tr><td><strong>落穴</strong><br>Pitfall</td><td>陷阱</td><td>物理</td><td>1</td><td>〇</td><td>触发</td><td>12</td><td>10</td><td>单体/近</td><td>使用时选择一种减益效果。如果你对目标造成至少1点伤害，对目标施加选择的减益效果。减益效果的有效等级视为1。此效果持续到主要阶段结束。</td></tr>\\n                <tr><td><strong>尖刺板</strong><br>Spike Board</td><td>陷阱</td><td>物理</td><td>3</td><td>〇</td><td>触发</td><td>15</td><td>12</td><td>单体/近</td><td>使用时选择一种减益效果。如果你对目标造成至少1点伤害，对目标施加选择的减益效果。减益效果的有效等级视为1。此效果持续到主要阶段结束。</td></tr>\\n                <tr><td><strong>锁B</strong><br>Lock B</td><td>陷阱</td><td>物理/魔法</td><td>2</td><td>×</td><td>附魔</td><td>—</td><td>—</td><td>固定/—</td><td>使用时选择一种减益效果。如果你对目标造成至少1点伤害，对目标施加选择的减益效果。减益效果的有效等级视为1。此效果持续到主要阶段结束。</td></tr>\\n                <tr><td><strong>酸液湖</strong><br>Acid Lake</td><td>陷阱</td><td>物理</td><td>2</td><td>×</td><td>附魔</td><td>—</td><td>—</td><td>接触/近</td><td>使用时选择一种减益效果。如果你对目标造成至少1点伤害，对目标施加选择的减益效果。减益效果的有效等级视为1。此效果持续到主要阶段结束。</td></tr>\\n                <tr><td><strong>爆裂陷阱</strong><br>Explosive Trap</td><td>陷阱</td><td>物理</td><td>2</td><td>〇</td><td>触发</td><td>14</td><td>10</td><td>区域/近</td><td>使用时选择一种减益效果。如果你对目标造成至少1点伤害，对目标施加选择的减益效果。减益效果的有效等级视为1。此效果持续到主要阶段结束。</td></tr>\\n            </table>\\n\\n            <h4>物体列表</h4>\\n            <table>\\n                <tr><th>名称</th><th>类型</th><th>构造</th><th>可自定义</th><th>效果</th></tr>\\n                <tr><td><strong>宝箱</strong><br>Treasure Chest</td><td>物体</td><td>物理</td><td>〇</td><td>用于存放物品的箱子。除非设置了锁A或锁B，否则可自由开关。GM可允许攻击破坏：HP20，物防/魔防10。破坏时需幸运判定DL14，失败则内部物品也被破坏。</td></tr>\\n                <tr><td><strong>一般物体</strong><br>General Object</td><td>物体</td><td>物理</td><td>×</td><td>桌子、雕像、圆木等一般物体。GM应赋予代表其身份的名称。无系统限制。GM可允许攻击破坏：HP10，物防/魔防5。</td></tr>\\n                <tr><td><strong>坑洞</strong><br>Hole</td><td>物体</td><td>物理</td><td>×</td><td>大洞。GM可自由决定宽度和深度。角色落入时参见坠落伤害规则。飞行状态可安全通过。</td></tr>\\n                <tr><td><strong>门</strong><br>Door</td><td>物体</td><td>物理</td><td>〇</td><td>设置在墙壁等处的普通门。除非设置了锁A或锁B，否则可自由开关通行，不影响移动。GM可允许攻击破坏：HP50，物防/魔防10。</td></tr>\\n            </table>\\n\\n            <h4>隔断列表</h4>\\n            <table>\\n                <tr><th>名称</th><th>类型</th><th>构造</th><th>可自定义</th><th>效果</th></tr>\\n                <tr><td><strong>墙壁</strong><br>Wall</td><td>隔断</td><td>物理</td><td>〇</td><td>地下城中的普通墙壁。GM可允许攻击破坏：HP50，物防/魔防10。</td></tr>\\n                <tr><td><strong>地板</strong><br>Floor</td><td>隔断</td><td>物理</td><td>〇</td><td>地下城中的地板。GM可允许攻击破坏：HP50，物防/魔防10。</td></tr>\\n                <tr><td><strong>天花板</strong><br>Ceiling</td><td>隔断</td><td>物理</td><td>〇</td><td>地下城中的天花板。GM可允许攻击破坏：HP50，物防/魔防5。</td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>关于物体与隔断：</strong>物体是地下城内放置的物品（门、宝箱、雕像等），隔断是分割地下城的结构（墙壁、地板、天花板）。隔断通常不可破坏或移动，也不会自行移动。标记\\"秘密\\"的陷阱/物体/隔断无法通过常规方式看到，如暗门或隐藏状态。</div>\\n        "},{"i":102,"ch":"第十章","chTitle":"游戏主持人指南","title":"原作角色（NPC）","id":"gm-canon-npc","html":"\\n            <p>以下为原作中活跃在阿克塞尔城的角色，可作为NPC出现在游戏中。这些角色属于\\"群众角色（Extras）\\"类型NPC，没有完整的属性值或职业数据，GM可根据需要自行设定。</p>\\n            <table>\\n                <tr><th>角色</th><th>性别/年龄</th><th>职业</th><th>描述</th><th>台词</th></tr>\\n                <tr><td><strong>阿库娅</strong><br>Aqua</td><td>女/不明</td><td>大祭司<br>(Arch-priest)</td><td>负责引导日本亡者转生的女神，被和真强行拉入异世界。容貌绝美，但性格是致命伤。可能会对受伤的玩家使用治愈魔法。</td><td>\\"我是女神！\\"</td></tr>\\n                <tr><td><strong>佐藤和真</strong><br>Kazuma Satou</td><td>男/16</td><td>冒险者<br>(Adventurer)</td><td>原作主角。来自现代日本的转生者。属性值偏低，只能选择冒险者职业。虽然名声不佳（尤其是女性评价），但本质善良且头脑灵活。可能会为困扰的玩家提供有用的建议。</td><td>\\"运气是我唯一的东西！\\"</td></tr>\\n                <tr><td><strong>惠惠</strong><br>Megumin</td><td>女/13</td><td>大法师<br>(Arch-wizard)</td><td>红魔族少女。打心底热爱爆裂魔法，从未学习其他法术。行为举止十分中二，但知识量意外丰富，可能会在玩家缺乏知识时提供帮助。</td><td>\\"吾乃红魔族第一魔法师！\\"</td></tr>\\n                <tr><td><strong>达克妮斯</strong><br>Darkness</td><td>女/18</td><td>十字军<br>(Crusader)</td><td>金发蓝眼的美女。防御力极高，但剑术惨不忍睹，几乎无法命中。重度受虐狂。对贵族事务意外了解。为人认真，绝不会对求助者坐视不管。</td><td>\\"当一面墙是我最擅长的。\\"</td></tr>\\n                <tr><td><strong>维兹</strong><br>Wiz</td><td>女/永远20岁</td><td>大法师<br>(Arch-wizard)</td><td>棕色长卷发美女。目前在阿克塞尔经营魔法物品商店，曾是被称为\\"冰之魔女\\"的强大法师。性格温柔，会主动倾听玩家的困难。</td><td>\\"我会没事的！\\"</td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>关于原作角色：</strong>以上角色在原版规则书中仅以简短人格描述呈现，没有提供完整属性值、HP/MP、技能列表或装备数据。如需在游戏中使用这些角色的完整数据，GM应按照高等级PC创建规则（见原书第234页）自行构建。另外，阿克塞尔冒险者公会的接待员露娜（Luna）也可作为常用NPC出现。</div>\\n        "},{"i":103,"ch":"原版模组","chTitle":"原版模组——「给这些竹笋的美味！」","title":"模组概要","id":"bamboo-overview","html":"\\n            <div class=\\"note\\"><strong>⚠️ 玩家注意：</strong>本章节包含模组剧透内容。如果你是玩家，请在GM允许前不要阅读！</div>\\n            <p><strong>玩家人数：</strong>3~5人<br>\\n            <strong>角色等级：</strong>1级<br>\\n            <strong>游戏时间：</strong>4~5小时</p>\\n            <h4>故事梗概</h4>\\n            <p>阿克塞尔——被称为新手冒险者之镇，\\"起始之镇\\"。玩家角色们都是新手冒险者，将从接待员露娜那里接受一项特殊任务。</p>\\n            <p>他们的目标是：挖掘竹笋。然而，这些可不是普通的植物——它们会自己移动（更准确地说，像火箭一样喷射飞出）。当竹笋开始移动并成长为完整的竹子时，它们的风味会急速流失。最美味的竹笋（也是经验值最多的）是那些还在地下、即将发射的竹笋。</p>\\n            <p>在以挖掘竹笋四十年的技艺闻名的翁（Okina）老人的指导下，新手冒险者们出发前往竹林采笋。密生的竹林已成为天然地下城，内部还有翁老人设置的陷阱（连他自己都不记得设在哪里了）。当玩家们在竹林中小心前进时，发现哥布林也来到了这里，寻找同样的东西。玩家们穿过竹林，到达翁老人指定的竹笋群落。在那里，他们遇到了正在挖掘偷取竹笋的哥布林。战斗随之展开——玩家们一边与哥布林战斗，一边收获竹笋。战斗结束后，结算奖励，模组结束。</p>\\n        "},{"i":104,"ch":"原版模组","chTitle":"原版模组——「给这些竹笋的美味！」","title":"预读与角色创建","id":"bamboo-creation","html":"\\n            <h4>预读</h4>\\n            <p>会话开始时，GM应向玩家朗读以下预读：</p>\\n            <div class=\\"example\\">阿克塞尔——被称为新手冒险者之镇。然而，在这个和平的定居点，竟然找不到适合新手冒险者的工作。冒险者公会收到了多起相关投诉后，决定在常规委托中提供一项特别服务——一项他们认为适合新手冒险者的任务：挖掘竹笋。<br><br>不过在这个世界，成熟美味的蔬菜会自己移动，竹笋也不例外。在竹笋行业四十年的老手翁的指导下，新手冒险者们出发去采竹笋了。</div>\\n\\n            <h4>角色创建</h4>\\n            <p><strong>快速开始：</strong>可使用以下示例角色。4人时不用PC#5，3人时使用PC#1、PC#3和PC#5。</p>\\n            <ul>\\n                <li>PC#1：大剑战士（见示例角色章节）</li>\\n                <li>PC#2：绯红法师（见示例角色章节）</li>\\n                <li>PC#3：慈悲祭司（见示例角色章节）</li>\\n                <li>PC#4：探险盗贼（见示例角色章节）</li>\\n                <li>PC#5：转生冒险者（见示例角色章节）</li>\\n            </ul>\\n            <p><strong>自行创建：</strong>推荐选择战士、法师、祭司或盗贼职业。如果只有3名玩家，理想情况下应有一人选择冒险者职业以弥补缺少的职业。</p>\\n            <p><strong>生活方式：</strong>创建角色后，玩家应确定各自角色的生活方式。</p>\\n            <p><strong>组队：</strong>所有玩家角色已经组成了队伍。可在角色创建前说明这一点。</p>\\n        "},{"i":105,"ch":"原版模组","chTitle":"原版模组——「给这些竹笋的美味！」","title":"开场阶段：冒险者公会","id":"bamboo-scene1","html":"\\n            <h4>场景1：冒险者公会</h4>\\n            <p>在冒险者公会，玩家角色们收到了面向新手冒险者的竹笋挖掘任务。</p>\\n            <p><strong>任务信息：</strong></p>\\n            <table>\\n                <tr><th>项目</th><th>内容</th></tr>\\n                <tr><td>任务名</td><td>竹笋挖掘</td></tr>\\n                <tr><td>类型</td><td>采集</td></tr>\\n                <tr><td>时限</td><td>次日清晨之前</td></tr>\\n                <tr><td>报酬</td><td>每人10 KE</td></tr>\\n                <tr><td>条件</td><td>无</td></tr>\\n                <tr><td>描述</td><td>\\"竹笋挖掘四十年名手翁老人希望你们在竹林中采摘竹笋。\\"</td></tr>\\n                <tr><td>完成条件</td><td>深入秘密竹林两个空地挖掘竹笋</td></tr>\\n                <tr><td>任务效果</td><td>报酬根据收获竹笋数量增加。高品质竹笋每根150 KE，普通竹笋每根20 KE</td></tr>\\n            </table>\\n            <p>所有玩家角色可对竹笋进行敌人识别判定，DL为10。成功则获得以下信息：</p>\\n            <ul>\\n                <li>竹笋在收获时起身移动后会变成名为\\"狂暴竹笋\\"的敌人。变成狂暴竹笋后会失去风味，计为普通品质</li>\\n                <li>关于狂暴竹笋的其他可通过敌人识别获得的信息</li>\\n            </ul>\\n\\n            <p><strong>场景描写：</strong>冒险者公会没有挂着面向低级冒险者的委托。要么是面向高级冒险者的，要么基本上是体力劳动的兼职。没有一个请求是面向新手冒险者的。露娜不愿让你们的队伍空手而归，用她一贯活泼的笑容对你们说：\\"我一直在留着一个我觉得很适合你们的工作。有兴趣吗？\\"</p>\\n\\n            <p><strong>露娜台词：</strong></p>\\n            <ul>\\n                <li>\\"我想让你们接的任务是挖掘竹笋。\\"（展示任务详情）</li>\\n                <li>\\"这个任务的最终报酬将根据你们挖到的竹笋数量和品质来计算。也就是说，采得越多，报酬越高。\\"</li>\\n                <li>\\"和卷心菜、胡萝卜不同，竹笋一旦开始移动就会失去风味，所以我们在它们移动之前收获。翁老人以能准确判断时机而闻名。\\"</li>\\n                <li>\\"翁老人秘密森林里的竹笋品质很高，最好的每根至少能卖150 KE。\\"</li>\\n            </ul>\\n            <p>玩家接受任务后场景结束。如果不接受，模组结束，进入游戏后阶段。</p>\\n        "},{"i":106,"ch":"原版模组","chTitle":"原版模组——「给这些竹笋的美味！」","title":"中间阶段：前往竹林","id":"bamboo-scene2","html":"\\n            <h4>场景2：竹笋挖掘者翁老人</h4>\\n            <p>冒险者们凌晨3点在公会前集合。露娜介绍他们认识翁老人。因为竹林的位置是秘密，他要求所有人蒙眼乘坐马车前往。</p>\\n            <p><strong>场景描写：</strong>凌晨3点，你们在冒险者公会前集合。那里停着一辆四匹马拉的马车。露娜向你们介绍坐在驾驶座上握着缰绳的老人。\\"这就是委托人——翁老人，著名的竹笋挖掘名手。\\"看起来六十多岁的老人一边温暖地微笑着，一边揉着腰。</p>\\n            <p><strong>翁老人台词：</strong></p>\\n            <ul>\\n                <li>\\"一大早叫你们出来真是抱歉。不过竹笋必须在清晨采摘。\\"</li>\\n                <li>\\"我用这辆马车送你们去。请上车。\\"</li>\\n                <li>\\"你们还需要蒙上眼睛。\\"</li>\\n                <li>（玩家上车后）\\"那就出发吧！\\"</li>\\n            </ul>\\n            <p>玩家上车出发后场景结束。</p>\\n\\n            <h4>场景3：挖掘竹笋说明</h4>\\n            <p>在途中，翁老人讲解如何挖掘竹笋。即使玩家角色摘下眼罩，外面漆黑一片什么都看不见。</p>\\n            <ul>\\n                <li>翁老人借给每人一个特殊篮子和一把特殊铲子</li>\\n                <li>玩家收获尚未开始移动的竹笋。也可以采集正在抽动的竹笋。放入特殊篮子后会停止移动</li>\\n                <li>注意事项：翁老人在竹林中设置了陷阱。但他每年都增加新陷阱，所以不记得在哪里或设置了什么样的陷阱</li>\\n            </ul>\\n            <p><strong>翁老人台词：</strong></p>\\n            <ul>\\n                <li>\\"你们只需要用我借给你们的篮子和铲子，很简单。\\"</li>\\n                <li>\\"篮子和铲子都是让竹笋入睡的道具。挖出来后它们就不会动了。\\"</li>\\n                <li>\\"之前我想搞一个农业体验观光，但太早了没有客人来，就放弃了。\\"</li>\\n                <li>（关于挖掘诀窍）\\"最重要的是不要碰已经在动的竹笋。你有被攻击的风险。而且那时候的竹笋也不怎么好吃了。\\"</li>\\n                <li>\\"刚收获的竹笋可以生吃，如果采到很多，不妨尝尝。\\"</li>\\n            </ul>\\n            <p>与翁老人的对话结束后，所有人到达竹林，场景结束。</p>\\n\\n            <h4>场景4：探索竹林</h4>\\n            <p>在这个场景中，所有人到达翁老人秘密竹林的前方。翁老人借给玩家角色特殊篮子和特殊铲子。每件物品重量为1，可放入物品栏。但使用铲子时，玩家必须有一只空手（右手或左手槽位必须为空）。</p>\\n            <p><strong>场景描写：</strong>你们面前是一片茂密的竹林。翁老人将在这里等待你们回来。铲子和篮子的数量刚好够每个队员各拿一个。</p>\\n            <p><strong>翁老人台词：</strong></p>\\n            <ul>\\n                <li>\\"好了，拿着这些铲子和篮子吧。挖到的竹笋要立刻放进篮子里。\\"</li>\\n                <li>\\"沿着林中的土路走。哦，路上小心陷阱——我设那些是为了驱赶怪物的。沿着路走，很快就会到一个空地。\\"</li>\\n                <li>\\"我弄那个空地是为了让竹笋更容易生长。\\"</li>\\n                <li>\\"如果你看到地上有小隆起，或听到脚下有间歇性的嘶嘶声，那就是要找的地方——赶紧挖。如果拖太久，竹笋就会开始移动。\\"</li>\\n            </ul>\\n            <p>玩家角色进入竹林后场景结束。接下来的场景将是地下城场景。</p>\\n        "},{"i":107,"ch":"原版模组","chTitle":"原版模组——「给这些竹笋的美味！」","title":"地下城探索","id":"bamboo-dungeon","html":"\\n            <p>从此处开始，场景为地下城场景。每次玩家移动到新区域，场景就会变化。一旦某区域的事件发生并解决，该事件不会再次发生。这个地下城布局简单，玩家沿直线依次通过四个区域。</p>\\n            <p>进入区域4时，高潮阶段开始。如果玩家角色在到达区域4（和高潮阶段）之前退出地下城，或未能在日出前完成任务，模组结束，进入游戏后阶段。</p>\\n\\n            <h4>区域1：竹林入口</h4>\\n            <p>小路通向森林深处。通常这是一条维护良好的道路，但哥布林已经破坏了它。</p>\\n            <p>有一个坑洞，原本是落穴陷阱，一只哥布林掉了进去并死在里面。如果玩家角色查看坑洞，能看到哥布林侧躺在底部。坑里插着竹子，对于一个简单驱赶动物的陷阱来说似乎有点杀意。看到哥布林的角色可对其进行敌人识别判定。</p>\\n            <p>在那个落穴旁边还有另一个落穴，是可感知型陷阱。如果玩家角色试图绕过那个坑洞，需进行感知威胁判定DL12。成功则注意到那里的落穴并能绕过而不触发。其他玩家角色随后可忽略该陷阱继续前进。如果感知威胁判定失败，落穴以该角色为目标触发。</p>\\n            <p>如果玩家角色试图跳过有哥布林的坑洞，需通过跳跃判定DL10。成功则能继续深入森林而不触发落穴。</p>\\n            <p>玩家角色继续前进后，进入区域2。前方的哥布林跳过了坑洞。足迹太多，无法判断具体数量。</p>\\n\\n            <h4>区域2：首次收获</h4>\\n            <p>这是一个玩家可以挖掘竹笋的空地。在这个区域，玩家使用个人战斗流程进行挖掘。出现与玩家角色数量相等的竹笋。</p>\\n            <p>设置流程开始时，每个玩家角色进行感知判定DL12。成功则发现一个高品质竹笋。发现的角色掷1D6，根据竹笋出现表将竹笋放置在战斗地图上。</p>\\n            <p>与高品质竹笋交战的玩家角色可在主要流程中使用主要动作挖掘竹笋。但必须携带特殊铲子且有一只空手。挖掘竹笋时进行幸运判定DL10。成功则获得一个高品质竹笋（重量1）。失败则无法收获，该高品质竹笋变为敌人\\"狂暴竹笋\\"，以消耗状态进入战斗，从下一轮开始行动。</p>\\n            <p>清理流程中，将所有未放置在地图上的竹笋变为狂暴竹笋敌人并放置在地图上。GM掷1D6决定放置位置。这些狂暴竹笋从下一轮开始行动。</p>\\n            <p>从第二轮开始，战斗持续到狂暴竹笋全部消失。</p>\\n            <p>狂暴竹笋可在玩家角色的主要流程中使用\\"爆炸与扩散\\"攻击，甚至在狂暴竹笋的主要流程之前。如果有多个角色可选，GM随机决定攻击目标。如果没有攻击目标，狂暴竹笋使用\\"起飞\\"退出场景。</p>\\n            <p>使用过\\"爆炸与扩散\\"的狂暴竹笋以及退出场景的狂暴竹笋不会掉落战利品。未使用\\"爆炸与扩散\\"的狂暴竹笋正常掉落战利品。</p>\\n            <p>战斗后玩家继续深入时，进入区域3。前方的哥布林没有注意到区域2的竹笋，继续前进了。</p>\\n\\n            <h4>区域3：竹林陷阱</h4>\\n            <p>在通往竹林深处的小路上，放着一个苹果（使用水果的数据）。苹果上设置了可探测型尖刺板陷阱，拿起苹果会触发陷阱。与水果交战的角色必须进行陷阱探测判定DL15。成功则注意到陷阱。如果能拆除陷阱，只需声明即可拿走苹果。</p>\\n            <p>继续深入则进入区域4（高潮阶段）。哥布林对苹果起了疑心，所以忽略它继续前往区域4。</p>\\n        "},{"i":108,"ch":"原版模组","chTitle":"原版模组——「给这些竹笋的美味！」","title":"高潮阶段：竹笋群落","id":"bamboo-climax","html":"\\n            <h4>区域4：竹笋群落</h4>\\n            <p>玩家到达另一个竹笋群落。先到的哥布林试图攻击玩家角色，但狂暴竹笋攻击并击败了其中一只。</p>\\n            <p>开始战斗。敌人由1只哥布林首领和（玩家角色数-1）只哥布林组成。</p>\\n            <p>竹笋出现方式与区域2相同。区别在于第2轮也会出现竹笋。每轮出现的竹笋数量等于玩家角色数。</p>\\n            <p>哥布林首领和哥布林优先攻击玩家角色，不会特意去挖竹笋（它们也没有特殊工具所以挖不了）。</p>\\n            <p>与区域2一样，竹笋可以对正在执行主要流程的角色使用\\"爆炸与扩散\\"，或使用\\"起飞\\"退出场景。如果GM愿意，可以选择哥布林作为攻击目标。</p>\\n            <p><strong>场景描写：</strong>你们到达竹林最深处，又看到一个空地。在前面踩着路走的哥布林发现了队伍，发出威胁的低吼。你们也听到附近间歇性的嘶嘶声——然后是一声爆炸！一只哥布林惨叫着倒下了。竹笋的皮四处飞散。显然，这些植物也跃跃欲试。</p>\\n\\n            <h4>狂暴竹笋数据</h4>\\n            <table>\\n                <tr><th>项目</th><th>数据</th></tr>\\n                <tr><td>名称</td><td>狂暴竹笋 Raging Bamboo Shoot</td></tr>\\n                <tr><td>类型/属性</td><td>植物/地</td></tr>\\n                <tr><td>等级</td><td>2</td></tr>\\n                <tr><td>属性值</td><td>筋力 13/4, 器用 12/4, 敏捷 9/3, 知力 4/1, 感知 6/2, 精神 12/4, 幸运 8/2</td></tr>\\n                <tr><td>攻击</td><td>撞击(徒手/双手): 3D+4/2D+16/近战(物理)/近</td></tr>\\n                <tr><td>回避</td><td>2D+3</td></tr>\\n                <tr><td>防御</td><td>3/4</td></tr>\\n                <tr><td>HP/MP</td><td>32/18</td></tr>\\n                <tr><td>行动/移动</td><td>5/9</td></tr>\\n            </table>\\n            <p><strong>狂暴竹笋技能：</strong></p>\\n            <ul>\\n                <li><strong>爆炸与扩散 Lv1：</strong>主要动作。对5米内单体进行特殊攻击。命中3D+6，造成2D+15火焰魔法伤害。使用此效果的主要流程结束时死亡。因本效果死亡时不掉落战利品。</li>\\n                <li><strong>起飞 Lv1：</strong>主要动作。立即退出场景。</li>\\n                <li><strong>飞行能力 Lv1</strong></li>\\n            </ul>\\n            <p><strong>描述：</strong>狂暴竹笋是利用根部某种加压物质像导弹一样发射出去的怪物，会不分青红皂白地攻击附近任何移动的东西。碰撞时会爆炸。</p>\\n            <p><strong>战利品：</strong>5-9：竹笋皮(1 KE)；10+：普通竹笋(见模组描述)</p>\\n        "},{"i":109,"ch":"原版模组","chTitle":"原版模组——「给这些竹笋的美味！」","title":"结局阶段","id":"bamboo-ending","html":"\\n            <h4>场景5：竹笋的价值</h4>\\n            <p>翁老人在玩家角色走出竹林后迎接他们。再次蒙眼乘车返回阿克塞尔。</p>\\n            <p>回程途中，翁老人问玩家角色是否想吃竹笋。如果是，每个想吃的玩家消耗一根收获的竹笋。</p>\\n            <p>吃竹笋的角色能品尝到零涩味的新鲜竹笋。风味因品质而异：</p>\\n            <ul>\\n                <li><strong>高品质竹笋：</strong>味道美味到令人失语</li>\\n                <li><strong>普通竹笋：</strong>放入口中的瞬间就被风味惊艳到</li>\\n            </ul>\\n            <p>之后玩家角色在游戏后阶段获得经验值。在此场景之后吃竹笋不会获得经验值奖励，因为竹笋已失去新鲜度。</p>\\n            <p><strong>翁老人台词：</strong></p>\\n            <ul>\\n                <li>\\"哥布林？真是个灾难……我得再设置更多陷阱了。\\"</li>\\n                <li>\\"想尝一口吗？刚从地里挖出来的可以生吃。不过你们吃的要从报酬里扣除哦。怎么样？\\"</li>\\n            </ul>\\n\\n            <h4>场景6：返回冒险者公会</h4>\\n            <p>在冒险者公会结算竹笋。收获竹笋的额外报酬：</p>\\n            <ul>\\n                <li>高品质竹笋：每根150 KE</li>\\n                <li>普通竹笋：每根20 KE</li>\\n            </ul>\\n            <p><strong>场景描写：</strong>清晨在冒险者公会，你们将新鲜的竹笋放在露娜面前的柜台上。旁边，专业的蔬菜鉴定师和经纪人检查你们带来的作物，将它们分成两个箱子——好的和极好的。</p>\\n            <p><strong>露娜台词：</strong>\\"干得好。我们马上评估。\\"</p>\\n            <p><strong>翁老人台词：</strong>\\"嗯，是的。非常感谢。大家要不要吃个早饭？跑了一趟肯定饿了，我请客。\\"</p>\\n            <p>计算报酬后，模组结束。</p>\\n        "},{"i":110,"ch":"原版模组","chTitle":"原版模组——「给这些竹笋的美味！」","title":"游戏后：经验值结算","id":"bamboo-afterplay","html":"\\n            <p>以下经验值以5名玩家角色为基准。如果4人以下，需重新计算。如果玩家角色在完成任务前返回阿克塞尔，根据当时完成的内容计算经验值。</p>\\n            <p>如果玩家角色在结局阶段吃了竹笋，将获得以下经验值加成。加成不叠加，即使吃了多根竹笋，取最高结果。</p>\\n\\n            <h4>完成任务</h4>\\n            <table>\\n                <tr><th>条件</th><th>经验值</th></tr>\\n                <tr><td>击败区域4所有敌人</td><td>5点</td></tr>\\n                <tr><td>吃了高品质竹笋</td><td>3点</td></tr>\\n                <tr><td>吃了普通竹笋</td><td>1点</td></tr>\\n            </table>\\n\\n            <h4>遭遇敌人等级</h4>\\n            <table>\\n                <tr><th>区域</th><th>敌人</th><th>经验值</th></tr>\\n                <tr><td>区域2</td><td>狂暴竹笋</td><td>每只出现2点</td></tr>\\n                <tr><td>区域4</td><td>哥布林首领</td><td>4点</td></tr>\\n                <tr><td>区域4</td><td>哥布林×5</td><td>1×5=5点</td></tr>\\n                <tr><td>区域4</td><td>狂暴竹笋</td><td>每只出现2点</td></tr>\\n                <tr><td colspan=\\"2\\">小计</td><td>9 + 狂暴竹笋数</td></tr>\\n            </table>\\n\\n            <h4>遭遇陷阱等级</h4>\\n            <table>\\n                <tr><th>区域</th><th>陷阱</th><th>经验值</th></tr>\\n                <tr><td>区域1</td><td>落穴×2</td><td>2点</td></tr>\\n                <tr><td>区域3</td><td>尖刺板</td><td>3点</td></tr>\\n                <tr><td colspan=\\"2\\">合计</td><td>5点</td></tr>\\n            </table>\\n        "},{"i":111,"ch":"附录","chTitle":"参考资料与速查表","title":"通用技能一览","id":"appendix-general-skills","html":"\\n            <p>以下是所有职业都可以学习的通用技能完整列表。包含原版规则书和扩展规则（Arianrhod 2E）的通用技能。</p>\\n            <div class=\\"note\\"><strong>来源标注：</strong>无标注=原版规则书 | [AR2E]=Arianrhod 2E扩展规则 | [Watson]=社区自制</div>\\n            <table>\\n<thead><tr><th>技能名</th><th>时机</th><th>判定</th><th>对象</th><th>射程</th><th>消耗</th><th>最大SL</th><th>使用条件</th><th>效果</th></tr></thead>\\n<tbody>\\n<tr><td><strong>鉴定技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在尝试分析物品功能或弄清使用方法时的智力判定中获得+1d6</td></tr>\\n<tr><td><strong>运动技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在进行攀爬或跳跃的力量判定中获得+1d6</td></tr>\\n<tr><td><strong>搬运技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的负重上限变为（基础力量）×2</td></tr>\\n<tr><td><strong>欺骗技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在尝试欺骗他人时的精神判定中获得+1d6。这可以是任何虚张声势或用谎言欺骗他人的行为。</td></tr>\\n<tr><td><strong>破坏技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在尝试破坏物体时的伤害中获得+2d6。你仍然无法破坏不可破坏的物体。</td></tr>\\n<tr><td><strong>识谎技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在尝试看穿虚张声势、谎言和其他欺骗时的精神判定中获得+1d6。成功的判定不会告诉你对方为什么欺骗你或他们在欺骗你什么。</td></tr>\\n<tr><td><strong>敌人识别技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在敌人识别判定中获得+1d6</td></tr>\\n<tr><td><strong>信仰：阿库娅</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>物理防御和魔法防御各+1。你不能再获得任何其他信仰技能。</td></tr>\\n<tr><td><strong>信仰：厄里斯</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的技能或物品恢复HP或MP的效果+2。你不能再获得任何其他信仰技能。</td></tr>\\n<tr><td><strong>钓鱼技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>在场景结束时使用。恢复2d6+(CL×2)点MP。GM可以因为附近没有湖泊或河流等原因拒绝使用此技能。如果GM拒绝使用，不计入使用次数。</td></tr>\\n<tr><td><strong>轻足技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在被阻挡的交战中执行撤退时，行动点数+1d6</td></tr>\\n<tr><td><strong>赐肉技能</strong></td><td>物品</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在准备阶段，获得三块肉（第193页）。</td></tr>\\n<tr><td><strong>历史技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在智力判定中获得+1d6，用于判断你是否了解各种聚落的基本信息、历史、居民和过去发生的事件。</td></tr>\\n<tr><td><strong>狩猎技能</strong></td><td>见效果</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>在场景结束时使用。恢复2d6+(CL×2)点HP。GM可以因为场景之间没有足够时间或附近没有动物等原因拒绝使用此技能。如果GM拒绝使用，不计入使用次数。</td></tr>\\n<tr><td><strong>调查技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在基于感知的情报收集判定中获得+1d6</td></tr>\\n<tr><td><strong>救命技能</strong></td><td>主要动作</td><td>灵巧</td><td>单体</td><td>近战</td><td>-</td><td>1</td><td>-</td><td>仅在目标陷入昏迷时有效。进行难度10的灵巧判定。如果成功，目标不再昏迷且HP变为1。目标随后变为疲劳状态。</td></tr>\\n<tr><td><strong>交涉技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在交涉和说服的精神判定中获得+1d6</td></tr>\\n<tr><td><strong>宴会技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在表演宴会技艺的灵巧判定中获得+1d6</td></tr>\\n<tr><td><strong>追踪技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在尝试使用脚印或其他痕迹追踪某人或某物的感知判定中获得+1d6</td></tr>\\n<tr><td><strong>杂技技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你装备的每个盾牌和盔甲的行动修正至少为+0时，此技能生效。闪避判定的总结果+1。如果你没有装备盾牌或盔甲，此技能也生效。</td></tr>\\n<tr><td><strong>追加装备技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>装备物品的负重上限+5</td></tr>\\n<tr><td><strong>上级职业模仿技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>冒险者</td><td>你所有的基本能力值必须至少为10才能学习此技能。拥有此技能，即使你还未达到10级，也可以学习上级职业技能。但是，你每次升级最多只能学习一个上级职业技能。</td></tr>\\n<tr><td><strong>审美技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在判断艺术品价值和真伪的智力判定中获得+1d6。DM决定市场和价格的细节。</td></tr>\\n<tr><td><strong>盔甲训练技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>学习此技能时，选择战士、祭司、法师或盗贼之一。你可以装备所选职业装备限制的盾牌和盔甲，无论你当前是什么职业。但是，当你装备了通常无法使用的物品时，你的探陷阱、拆陷阱、感知威胁和魔法判定获得-1d6。每个选择的职业视为独立技能。</td></tr>\\n<tr><td><strong>畅销书</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在交涉中说出自己名字时的精神判定中获得+1d6</td></tr>\\n<tr><td><strong>商业嗅觉技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在准备阶段，你获得CL×50 KE</td></tr>\\n<tr><td><strong>陶艺技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在制作碗和其他餐具的灵巧判定中获得+1d6。根据你想要制作的物品，DM将设定难度并确定所需资源。</td></tr>\\n<tr><td><strong>告白技能</strong></td><td>自由动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每剧本1次</td><td>你恢复2d6点MP。<br>倾诉情感或秘密以获得宣泄的技能。</td></tr>\\n<tr><td><strong>烹饪技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在烹饪食物的灵巧判定中获得+1d6</td></tr>\\n<tr><td><strong>防御专精技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你装备的所有盔甲类物品的装备限制为\\"-\\"时，此技能生效。你的物理防御和魔法防御增加你装备的盔甲数量。</td></tr>\\n<tr><td><strong>清贫技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你的生活方式选择稳定生活时，此技能生效。你所有判定的总结果+1。</td></tr>\\n<tr><td><strong>高效防御技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你装备的每个盾牌和盔甲的行动修正和移动修正+1（最大为0）。效果分别对每个物品适用。</td></tr>\\n<tr><td><strong>专家技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>学习此技能时，选择一个职业。你所知道的该职业技能的总SL必须至少为10。该职业技能的判定总结果+1。你可以多次学习此技能，每个职业视为独立技能，如专家技能：战士。</td></tr>\\n<tr><td><strong>暴食技能</strong></td><td>主要动作</td><td>自动成功</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>每场景1次</td><td>用一个主要动作，你可以使用两个需要主要动作才能使用的食物类物品。此效果持续到你的主要阶段结束。</td></tr>\\n<tr><td><strong>专注：冒险者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>冒险者</td><td>你的职业必须是冒险者才能学习此技能。选择一个能力值，使其+1。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：弓箭手</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>弓箭手，使用弓</td><td>你的职业必须是弓箭手才能学习此技能。远程攻击伤害+2。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：创造者</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>创造者</td><td>你的职业必须是创造者才能学习此技能。攻击伤害+2。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：元素大师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>元素大师</td><td>你的职业必须是元素大师才能学习此技能。学习此技能时选择一个元素。你造成所选元素魔法伤害的攻击伤害+3。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：骑士</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>骑士</td><td>你的职业必须是骑士才能学习此技能。当你对某人使用了誓言技能时生效。物理防御+2。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：枪兵</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>枪兵，装备枪</td><td>你的职业必须是枪兵才能学习此技能。行动点数+2。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：祭司</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>祭司</td><td>你的职业必须是祭司才能学习此技能。精神+1。此外，你恢复HP的祭司技能效果+1。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：符文骑士</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>符文骑士</td><td>你的职业必须是符文骑士才能学习此技能。你造成魔法伤害的攻击伤害+2。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：剑士</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>剑士，装备匕首、单手剑或双手剑</td><td>你的职业必须是剑士才能学习此技能。使用武器的命中判定总结果+1。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：盗贼</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>盗贼</td><td>你的职业必须是盗贼才能学习此技能。敏捷+1。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：战士</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>战士</td><td>你的职业必须是战士才能学习此技能。力量+1。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>专注：法师</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>法师</td><td>你的职业必须是法师才能学习此技能。感知+1。你不能学习超过一个专注技能。</td></tr>\\n<tr><td><strong>集中训练技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>选择两个基本能力值。一个+3，另一个-1。</td></tr>\\n<tr><td><strong>击杀标记</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你的队伍完成任务获得的奖励增加10%（最大+50%）。GM可以选择将此效果也应用于任务效果。</td></tr>\\n<tr><td><strong>奢华技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你在准备阶段选择套房或皇家生活方式时，此技能生效。你所有攻击的伤害+1d6。</td></tr>\\n<tr><td><strong>天敌技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>学习此技能时，选择一种敌人类型。当你攻击的目标是该敌人类型时，攻击伤害+1d6。</td></tr>\\n<tr><td><strong>自然之美</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你必须拥有[宴会技能]才能学习此技能。在准备阶段，你获得精神×100 KE</td></tr>\\n<tr><td><strong>恶名</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在恐吓他人时说出自己名字的精神判定中获得+1d6</td></tr>\\n<tr><td><strong>绘画技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在绘画的灵巧判定中获得+1d6</td></tr>\\n<tr><td><strong>无情技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>当你的攻击造成目标弱点元素的魔法伤害时，此技能适用。伤害+1d6。</td></tr>\\n<tr><td><strong>卷轴制作技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>你可以以10%的折扣（向上取整）购买卷轴类物品。但是，GM可以决定此技能不适用。</td></tr>\\n<tr><td><strong>歌唱技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在优美歌唱的精神判定中获得+1d6</td></tr>\\n<tr><td><strong>节俭技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在结算阶段支付的生活费用减少10%（最低50%）。</td></tr>\\n<tr><td><strong>拟声技能</strong></td><td>被动</td><td>-</td><td>自身</td><td>-</td><td>-</td><td>1</td><td>-</td><td>在模仿动物叫声或人类声音的感知判定中获得+1d6</td></tr>\\n<tr><td><strong>造土术（地属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近战</td><td>2</td><td>1</td><td>-</td><td>如果魔法判定成功，你产生一把土。<br>暴击：消耗为0</td></tr>\\n<tr><td><strong>造水术（水属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近战</td><td>2</td><td>1</td><td>-</td><td>如果魔法判定成功，你产生一杯水。<br>暴击：消耗为0</td></tr>\\n<tr><td><strong>羽落术（风属性法术）</strong></td><td>见效果</td><td>魔法判定</td><td>自身</td><td>-</td><td>6</td><td>1</td><td>每场景1次</td><td>在坠落伤害掷骰前使用。将你受到的坠落伤害变为0。你也可以在掉入陷阱（第289页）或洞穴（第291页）时使用，或在骑乘时受到失衡影响时使用。暴击：消耗为0</td></tr>\\n<tr><td><strong>冰冻术（冰属性法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>单体</td><td>5m</td><td>4</td><td>1</td><td>-</td><td>如果魔法判定成功，你冻结范围内的水或冻结角色身体的表面。这种冻结不影响判定等。暴击：消耗为0</td></tr>\\n<tr><td><strong>净化术（水属性法术）</strong></td><td>准备阶段</td><td>魔法判定</td><td>见效果</td><td>近战</td><td>6</td><td>1</td><td>-</td><td>如果魔法判定成功，你净化你接触的水。你可以净化脏水、有毒的水等。GM可以根据水的状态或数量设定判定难度。暴击：消耗为0</td></tr>\\n<tr><td><strong>生火术（火属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近战</td><td>2</td><td>1</td><td>-</td><td>如果魔法判定成功，你产生一个小火焰，大约火柴大小。<br>暴击：消耗为0</td></tr>\\n<tr><td><strong>微风术（风属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>见效果</td><td>5m</td><td>2</td><td>1</td><td>-</td><td>如果魔法判定成功，你在范围内指定位置产生足以吹走一张纸的风。<br>暴击：消耗为0</td></tr>\\n<tr><td><strong>冷却术（水属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>10m</td><td>6</td><td>1</td><td>-</td><td>目标的体温降低。这种体温降低不会造成伤害或施加减益效果。<br>暴击：消耗为0</td></tr>\\n<tr><td><strong>造饮术（水属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>自身</td><td>-</td><td>4</td><td>1</td><td>-</td><td>产生1杯任意饮料。产生的饮料可以是任何颜色和口味。GM可以根据产生的饮料设定判定难度或要求原料。暴击：消耗为0</td></tr>\\n<tr><td><strong>电击手（雷属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>自身</td><td>-</td><td>2</td><td>1</td><td>-</td><td>在你身体的一部分产生微弱电流。GM可以根据你选择用电流做什么来设定判定难度。暴击：消耗为0</td></tr>\\n<tr><td><strong>烈焰术（火属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>自身</td><td>-</td><td>3</td><td>1</td><td>-</td><td>在你身后创造一道火柱或火焰爆发。火焰可以是任何颜色。此火焰不造成任何伤害。<br>暴击：消耗为0</td></tr>\\n<tr><td><strong>踏足术（地属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>见效果</td><td>近战</td><td>6</td><td>1</td><td>-</td><td>创造一个由土壤组成的脚手架。GM可以根据你尝试创建的脚手架高度来设定判定难度。标准为[10+脚手架高度（米）×2]。GM也可以选择限制可创建的脚手架高度。此效果持续到场景结束。暴击：消耗为0</td></tr>\\n<tr><td><strong>升温术（火属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>10m</td><td>6</td><td>1</td><td>-</td><td>目标的体温升高。这种体温升高不会造成伤害或施加减益效果。此效果持续到场景结束。暴击：消耗为0</td></tr>\\n<tr><td><strong>造音术（风属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>场景（选择）</td><td>20m</td><td>3</td><td>1</td><td>-</td><td>从目标空间产生你选择的声音。如果你想模仿某物的声音，你需要拟声技能。</td></tr>\\n<tr><td><strong>修补术（地属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近战</td><td>3</td><td>1</td><td>-</td><td>对至少剩余1HP的物体有效。目标的HP恢复2d6。<br>暴击：消耗为0</td></tr>\\n<tr><td><strong>彩虹幻影（光属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>见效果</td><td>10m</td><td>2</td><td>1</td><td>-</td><td>在范围内向一个空间产生所需颜色的光线。<br>暴击：消耗为0</td></tr>\\n<tr><td><strong>暗影帷幕（暗属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>10m</td><td>6</td><td>1</td><td>-</td><td>抵消目标正在使用的中和[黑暗]的物品效果。目标可以在效果移除后再次使用这些物品。此效果持续到场景结束。暴击：消耗为0</td></tr>\\n<tr><td><strong>塑影术（暗属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>区域（选择）</td><td>近战</td><td>3</td><td>1</td><td>-</td><td>随意改变目标影子的形状。你可以让它摆姿势、做手势，或完全变成不同的形状。暴击：消耗为0</td></tr>\\n<tr><td><strong>百变艺人（法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体*</td><td>10m</td><td>10</td><td>1</td><td>-</td><td>你必须拥有宴会技能SL1和拟声技能SL1才能学习此技能。目标以SL1学会宴会技能和拟声技能，但每场景只能使用一次。此效果持续到剧本结束。GM可以设定效果可能丧失的条件。</td></tr>\\n<tr><td><strong>消声术（风属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>10m</td><td>6</td><td>1</td><td>-</td><td>目标的声音变得不可听见。此效果持续到场景结束，或直到目标移动或使用主要动作移除效果。GM可以设定移除效果的判定难度。暴击：消耗为0</td></tr>\\n<tr><td><strong>水中呼吸术（水属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>近战</td><td>5</td><td>1</td><td>-</td><td>在游泳状态下，目标的移动不再减少，并允许执行全力移动。此效果持续到场景结束。</td></tr>\\n<tr><td><strong>风语术（风属性法术）</strong></td><td>主要动作</td><td>魔法判定</td><td>单体</td><td>视野</td><td>2</td><td>1</td><td>-</td><td>如果你赢得此效果的判定，你的声音将传达给目标。GM可以根据你尝试传达的信息设定判定难度。暴击：消耗为0</td></tr>\\n</tbody>\\n</table>\\n        "},{"i":112,"ch":"附录","chTitle":"参考资料与速查表","title":"属性与判定速查","id":"appendix-checks","html":"\\n            <p>以下为原版规则书第207页列出的各属性值对应的判定示例。GM根据行动内容决定使用哪个属性值进行判定。</p>\\n            <table>\\n                <tr><th>属性</th><th>含义</th><th>判定示例</th></tr>\\n                <tr><td><strong>力量（STR）</strong></td><td>体力、韧性、运动能力</td><td>举起/持续举起重物、忍受身体疼痛、跳跃、攀爬、游泳</td></tr>\\n                <tr><td><strong>灵巧（DEX）</strong></td><td>操作武器或工具的能力</td><td>修理/精细作业、抓取快速移动的物体、伪装、<strong>武器命中判定</strong></td></tr>\\n                <tr><td><strong>敏捷（AGI）</strong></td><td>速度、平衡感</td><td>走过摇晃的吊桥、躲避坠落物、追捕/逃跑、避开障碍、<strong>回避判定</strong></td></tr>\\n                <tr><td><strong>智力（INT）</strong></td><td>知识广度、记忆力</td><td>地理/历史/事件知识、特殊技能/学术领域、<strong>魔法判定</strong>、识别敌人</td></tr>\\n                <tr><td><strong>感知（PER）</strong></td><td>感官敏锐度、第六感</td><td>从痕迹追踪、掌握周围情况、信息收集、<strong>陷阱探测</strong>、<strong>感知威胁</strong>、潜行状态时</td></tr>\\n                <tr><td><strong>精神（MND）</strong></td><td>精神力、心理承受力</td><td>让人相信谎言/看穿谎言、说服他人接受请求、忍受恐惧/拷问</td></tr>\\n                <tr><td><strong>幸运（LUK）</strong></td><td>运气、命运之力</td><td>偶然遇到熟人、偶然发现/意识到某事、幸运地免受伤害、<strong>死亡判定</strong></td></tr>\\n            </table>\\n            <div class=\\"note\\"><strong>关键判定速查：</strong>武器命中判定=灵巧 | 回避判定=敏捷 | 魔法判定=智力 | 陷阱探测/感知威胁=感知 | 死亡判定=幸运</div>\\n        "},{"i":113,"ch":"附录","chTitle":"参考资料与速查表","title":"难度等级（DL）速查","id":"appendix-tn","html":"\\n            <p>以下为原版规则书第205页的难度等级表。DL基于普通市民的属性值设定，GM需根据高等级角色的情况调整DL。</p>\\n            <table>\\n                <tr><th>难度等级（DL）</th><th>行动类型</th></tr>\\n                <tr><td>8～9</td><td>非常简单的行动</td></tr>\\n                <tr><td>10～11</td><td>简单的行动</td></tr>\\n                <tr><td>12～13</td><td>成败各半的行动</td></tr>\\n                <tr><td>14～15</td><td>困难的行动</td></tr>\\n                <tr><td>16～17</td><td>非常困难的行动</td></tr>\\n                <tr><td>18+</td><td>极其困难的行动</td></tr>\\n            </table>\\n            <p><strong>判定公式：</strong>总判定值 = 属性值 + 骰子结果（2D6）</p>\\n            <p>总判定值 ≧ DL → 成功 | 总判定值 < DL → 失败</p>\\n            <p><strong>暴击：</strong>掷出的骰子中有2个以上为6 → 自动成功（即使总判定值不足DL）</p>\\n            <p><strong>失误：</strong>所有骰子均为1 → 自动失败</p>\\n        "},{"i":114,"ch":"附录","chTitle":"参考资料与速查表","title":"战斗行动速查","id":"appendix-combat","html":"\\n            <table>\\n                <tr><th>行动</th><th>类型</th><th>说明</th></tr>\\n                <tr><td>战斗移动</td><td>移动行动</td><td>移动等于移动力（米）的距离。在同一交战中有敌人时不能使用</td></tr>\\n                <tr><td>全力移动</td><td>移动行动</td><td>移动等于移动力+5（米）的距离。不能再执行次要动作。同一交战中有敌人时不能使用</td></tr>\\n                <tr><td>脱离</td><td>移动行动</td><td>从交战中脱离，最多移动5米。不能再执行次要动作</td></tr>\\n                <tr><td>使用技能</td><td>各类型</td><td>使用时机为对应行动类型的技能</td></tr>\\n                <tr><td>装备武器/盾牌/防具</td><td>移动/次要行动</td><td>装备一件武器、盾牌或防具</td></tr>\\n                <tr><td>使用物品</td><td>各类型</td><td>使用需要对应行动类型触发的物品</td></tr>\\n                <tr><td>攻击</td><td>主要行动</td><td>使用武器或技能对敌人造成伤害（对抗判定）</td></tr>\\n                <tr><td>交换武器或盾牌</td><td>主要行动</td><td>将手持物品换成另一件武器或盾牌</td></tr>\\n                <tr><td>交换饰品</td><td>主要行动</td><td>将当前装备的饰品换成另一件</td></tr>\\n                <tr><td>执行需要判定的行动</td><td>主要行动</td><td>检测陷阱、解除陷阱、识别敌人、鉴定物品等</td></tr>\\n                <tr><td>从威压恢复</td><td>次要行动</td><td>解除威压减益状态</td></tr>\\n                <tr><td>从滑倒恢复</td><td>移动行动</td><td>解除滑倒减益状态</td></tr>\\n                <tr><td>等待</td><td>—</td><td>等到所有角色消耗后再执行主要流程</td></tr>\\n                <tr><td>放弃行动</td><td>—</td><td>放弃部分或全部行动。放弃主要行动则立即变为消耗状态</td></tr>\\n            </table>\\n        "},{"i":115,"ch":"附录","chTitle":"参考资料与速查表","title":"扩展装备与物品","id":"appendix-equipment","html":"\\n            <p>以下是来自<strong>Arianrhod 2E扩展规则</strong>的额外装备、物品和魔法物品。这些内容不是原版素晴TRPG规则书的内容，而是来自与素晴TRPG兼容的扩展规则。效果描述保留英文原文以便准确理解。</p>\\n            <h4>扩展装备列表（Arianrhod 2E）</h4>\\n\\n<h5>Weapon List - Addition from Arianrhod 2E / Only weapons with unique effects or level 10 have been added. I don&#x27;t have the list for Arianrhod that go after the level 10. - 武器</h5>\\n<table>\\n<tr><th>名称</th><th>类型</th><th>等级</th><th>重量</th><th>命中修正</th><th>攻击力</th><th>行动修正</th><th>射程</th><th>装备位</th><th>价值</th><th>效果</th></tr>\\n<tr><td>Bastard Sword</td><td>1HSword (2H)</td><td>1</td><td>8</td><td>-2</td><td>8</td><td>-1</td><td>Close</td><td>One Hand (2H)</td><td>260</td><td>You may equi this in two hands. If you do, it becomes [Type: 2HSword]. A versatile sword that can be used in one or both hands.</td></tr>\\n<tr><td>Fine Bastard Sword</td><td>1HSword (2H)</td><td>4</td><td>9</td><td>-2</td><td>11</td><td>-1</td><td>Close</td><td>One Hand (2H)</td><td>620</td><td>You may equi this in two hands. If you do, it becomes [Type: 2HSword]. A high-quality bastard sword.</td></tr>\\n<tr><td>Heavy Bastard Sword</td><td>1HSword (2H)</td><td>6</td><td>9</td><td>-1</td><td>12</td><td>-1</td><td>Close</td><td>One Hand (2H)</td><td>800</td><td>You may equi this in two hands. If you do, it becomes [Type: 2HSword]. A weighted bastard sword.</td></tr>\\n<tr><td>Mythril Bastard Sword</td><td>1HSword (2H)</td><td>10</td><td>11</td><td>-2</td><td>15</td><td>-1</td><td>Close</td><td>One Hand (2H)</td><td>5800</td><td>You may equi this in two hands. If you do, it becomes [Type: 2HSword]. A bastard sword made from mythril.</td></tr>\\n<tr><td>Beast Jaws</td><td>拳套</td><td>10</td><td>8</td><td>0</td><td>14</td><td>0</td><td>Close</td><td>双持</td><td>3900</td><td>Gauntlets adorned with the jaws of a beast. When you but them together they resemble a maw.</td></tr>\\n<tr><td>Mythril Flamberge</td><td>双手剑</td><td>10</td><td>14</td><td>-1</td><td>20</td><td>-3</td><td>Close</td><td>双手</td><td>6100</td><td>A flamberge made from mythril.</td></tr>\\n<tr><td>Tomahawk</td><td>斧</td><td>4</td><td>11</td><td>-2</td><td>11</td><td>-1</td><td>Close</td><td>单手</td><td>480</td><td>Throwable. An axe balanced for throwing.</td></tr>\\n<tr><td>Tabar</td><td>斧</td><td>10</td><td>12</td><td>-2</td><td>15</td><td>-1</td><td>Close</td><td>单手</td><td>7800</td><td>A battleae with a head that looks like a half-moon.</td></tr>\\n<tr><td>Crescent Axe</td><td>斧</td><td>10</td><td>14</td><td>-2</td><td>20</td><td>-2</td><td>Close</td><td>双手</td><td>6200</td><td>A greataxe sporting a giant crescent-shaped blade.</td></tr>\\n<tr><td>Kukri</td><td>匕首</td><td>8</td><td>4</td><td>0</td><td>7</td><td>0</td><td>Close</td><td>单手</td><td>2200</td><td>Throwable. A dagger with a curved blade</td></tr>\\n<tr><td>Chain Dagger</td><td>鞭/匕首</td><td>5</td><td>5</td><td>-3</td><td>7</td><td>0</td><td>Close</td><td>单手</td><td>900</td><td>That weapon is considered has a [Type: Whip] and [Type: Dagger] at the same time. A chain whip with a dagger on the end. It can also be used as a normal dagger in close quarters.</td></tr>\\n<tr><td>Whip Blade</td><td>鞭/单手剑</td><td>7</td><td>6</td><td>-3</td><td>9</td><td>0</td><td>Close</td><td>单手</td><td>1200</td><td>That weapon is considered has a [Type: Whip] and [Type: 1HSword] at the same time. A sword with a special blade that can be used as a whip, opening more paths for attack.</td></tr>\\n<tr><td>Chain Cutter</td><td>鞭/匕首</td><td>9</td><td>7</td><td>-3</td><td>11</td><td>0</td><td>Close</td><td>单手</td><td>2700</td><td>That weapon is considered has a [Type: Whip] and [Type: Dagger] at the same time. A chainwhip lined with bladed edges.</td></tr>\\n<tr><td>Hammer Whip</td><td>鞭/钝器</td><td>11</td><td>8</td><td>-3</td><td>14</td><td>0</td><td>Close</td><td>单手</td><td>4000</td><td>That weapon is considered has a [Type: Whip] and [Type: Blunt] at the same time. A chain whip with a large metal sphere on the end.</td></tr>\\n<tr><td>Armbow</td><td>弓</td><td>1</td><td>6</td><td>-1</td><td>3</td><td>-3</td><td>20m</td><td>单手</td><td>500</td><td>Usable once per Scene. A wrist-mounted bow</td></tr>\\n<tr><td>Ballista</td><td>弓</td><td>10</td><td>16</td><td>-1</td><td>16</td><td>-5</td><td>50m</td><td>双手</td><td>6000</td><td>A giant crossbow, originally a siege weapon, that has been refitted for individual use. Extremely powerful, but also unbelievably heavy.</td></tr>\\n<tr><td>Pike</td><td>枪</td><td>5</td><td>13</td><td>0</td><td>13</td><td>-2</td><td>Close</td><td>双手</td><td>900</td><td>Passive: If this weapon is used to make a Weapon Attack against a Mounted enemy, it get +5 to the Atk Power. A spear designed to counter cavalry.</td></tr>\\n<tr><td>Footman&#x27;s Pike</td><td>枪</td><td>8</td><td>14</td><td>0</td><td>16</td><td>-2</td><td>Close</td><td>双手</td><td>2800</td><td>Passive: If this weapon is used to make a Weapon Attack against a Mounted enemy, it get +5 to the Atk Power. A pike intended for infantry use.</td></tr>\\n</table>\\n<h5>Weapon List - Addition from Arianrhod 2E - FOR SKILLS / Surprisingly, Katanas go up to level 40, giving a possible baseline to progress for other weapon. - 武器</h5>\\n<table>\\n<tr><th>名称</th><th>类型</th><th>等级</th><th>重量</th><th>命中修正</th><th>攻击力</th><th>行动修正</th><th>射程</th><th>装备位</th><th>价值</th><th>效果</th></tr>\\n<tr><td>Hand Grenade</td><td>炼金</td><td>1</td><td>1</td><td>0</td><td>6</td><td>0< d><td>防具</td><td>4</td><td>8</td><td>6</td><td>0</td><td>0</td><td>0</td><td>身体</td><td>3800</td><td>Passive: The wearer gets +1 Action Points. / A set of magical armor made from lightweight materials, which has been additionally enchanted with magic to be even lighter. Although it is made of metal, it is as light as regular clothing. Truly a piece of armor that is &quot;light as a feather&quot;.</td><td>Thief</td></tr>\\n<tr><td>Power Wrist</td><td>防具</td><td>2</td><td>3</td><td>4</td><td>0</td><td>-1</td><td>0</td><td>其他防具</td><td>1300</td><td>Passive: Wearer gets +1 Strength. / Curse : Wearer gets -1 to Hit Checks. / A magical wristband that strengthens its wearer.</td><td>Warrior</td></tr>\\n<tr><td>Swift-footed Boots</td><td>防具</td><td>3</td><td>2</td><td>3</td><td>0</td><td>1</td><td>0</td><td>其他防具</td><td>2800</td><td>Passive: The wearer gets +1 Action Points. / Magical boots that increase the wearer&#x27;s running speed. These boots let you run like the wind. Particularly popular among Thieves.</td><td>Warrior, Thief</td></tr>\\n</table>\\n<h5>Accessories List - 饰品</h5>\\n<table>\\n<tr><th>名称</th><th>类型</th><th>等级</th><th>重量</th><th>价值</th><th>效果</th></tr>\\n<tr><td>Big Eye</td><td>饰品</td><td>1</td><td>1</td><td>1000</td><td>Passive: The wearer gets +3 to Identify Enemy Checks and Identify Item Checks. / A pair of magical glasses. Putting these on lets you see things in greater clarity, allowing you to pick up on subtler details.</td></tr>\\n<tr><td>Amulet of Concentration</td><td>饰品</td><td>3</td><td>2</td><td>2500</td><td>Passive: Wearer gets +1 to Hit Checks made with a Weapon. Wearer gets +1 to Damage from Weapon Attacks. Warrior Only. / Curse : Wearer gets -1 Mind. / A magic amulet that increases your concentration in battle.</td></tr>\\n<tr><td>Eagle&#x27;s Eye</td><td>饰品</td><td>4</td><td>1</td><td>2600</td><td>Passive: The wearer gets +3 Damage for Ranged Attacks. / A pair of magical glasses that allow the wearer to see things in the distance with utmost clarity and detail. This Item can take various forms, including monocles and eyepatches.</td></tr>\\n</table>\\n\\n<h4>作弊能力列表（Arianrhod 2E）</h4>\\n\\n<h5>作弊能力（Cheat）</h5>\\n<table>\\n<tr><th>名称</th><th>描述</th><th>优势</th><th>劣势</th></tr>\\n<tr><td>I&#x27;m Actually a Goddess</td><td>Description : You&#x27;re actually a goddess of this world. If push comes to shove, you can unleash your hidden divine power. Player characters of any gender can use this cheat.</td><td>Merit : Use right after a character in the same Scene performs a check. The check is now counted as a critical. If dice would be added because it is a critical, always add 2d6 regardless of the number of sixes rolled. You can use this once per scenario.</td><td>Demerit : Nobody in this world believes you&#x27;re a goddess. You keep telling them, but everyone either thinnks you must be insane or avoids you out of fear of being damned.</td></tr>\\n<tr><td>Retour par la Mort</td><td>Description : When you died, for reasons related to the world of a deity, you received the ability to come back to life after dying.</td><td>Merit : Use when you are knocked out or die. You are no longer knocked out or dead. Your HP becomes 1. You can use this once per scenario.</td><td>Demerit : It is not easy to overcome death itself. You need luck on your side. When using Return by Death, you must spend 1 Blessing. If you cannot, then you cannot use Return by Death.</td></tr>\\n<tr><td>Pursuit of Power</td><td>Description : You&#x27;re infatuated with bolstering your magic&#x27;s power, and you devote yourself wholly to this pursuit.</td><td>Merit : Passive. Effective on skills that use dice to determine effects. When you acquire this cheat, choose one spell you already have that deals damage via attack, recovers HP, recovers MP or increases/decreases damage. Add 5d6 to the chosen skill&#x27;s effects. If you are at least tenth level, add (CL/2)d6 instead.</td><td>Demerit : In exchange for power, you pour every last drop of magical energy and life force into your spell. At the end of a process in which you applied the merit&#x27;s effect, your HP becomes 0.</td></tr>\\n<tr><td>Intoxicated by Pain</td><td>Description : When you receive physical or mental damage, you feel pleasure instead of pain. You gladly put yourself in harm&#x27;s way or loose more power than you&#x27;re capable of for the sake of reveling in that feeling.</td><td>Merit : Use right after a damage roll made against you. Change the damage you would receive from that attack to 0. You can use this once per scenario.</td><td>Demerit : You are so single-minded in your pursuit of pleasure that your offense suffers, and you neglect to dodge some attacks that come your way. Whenever you make a hit check or dodge check, take a -1d6 penalty.</td></tr>\\n<tr><td>Belzerg Royalty</td><td>Description : The blood of the Belzerg royal family, which birthed the legendary hero who slew the Demon Kin, runs through your veins. As such, you&#x27;ve inherited the immense powers of that legendary hero.</td><td>Merit : Passive. Add CLx4 to all damage dealth to demon enemies.</td><td>Demerit : Your power is propped up by the royal lifestyle you&#x27;re used to. If you choose stable living or simple living as your Lifestyle, you cannot receive the effects of this cheat&#x27;s merit, and you take a -1d6 penalty on all checks.</td></tr>\\n<tr><td>Sacred Treasure Holder: Weapon</td><td>Description : You are the owner of an item said to have been made by the gods in ancient times-- a Sacred Treasure weapon. You know the legeds surrounding your treasure, and what its name is. You can decide for yourself how you came to possess it.</td><td>Merit : Item. During Preplay, choose one weapon from your inventory. That weapon becomes a Sacred Treasure. Add CLx3 to its attack power.</td><td>Demerit : When you are not equipped with the weapon you chose for this cheat (your Sacred Treasure), you take -2d6 on all checks.</td></tr>\\n<tr><td>Sacred Treasure Holder: Armor</td><td>Description : You are the owner of an item said to have been made by the gods in ancient times-- a Sacred Treasure armor. You know the legeds surrounding your treasure, and what its name is. You can decide for yourself how you came to possess it.</td><td>Merit : Item. During Preplay, choose one armor from your inventory. That armor becomes a Sacred Treasure. Add CLx3 to its Physical Defense and CL ot its Magic Defense.</td><td>Demerit : When you are not equipped with the armor you chose for this cheat (your Sacred Treasure), you take -2d6 on all checks.</td></tr>\\n<tr><td>Member of the Demon King&#x27;s Army</td><td>Description : You are part of the Demon King&#x27;s forces. You&#x27;ve received the Demon King&#x27;s orders, or permission, to carry out a certain task-- pharps to secretly maintain the barrier around the king&#x27;s castle. Discuss with the GM what this task should be.</td><td>Merit : Passive. Add CLx4 to your Physical Defense and Magic Defense.</td><td>Demerit : You cannot refuse a request from the Demon King, nor can you attack any character or enemy who belongs to the Demon King&#x27;s forces. The GM may set a condition that, when met, enables you to attack such characters or enemies if desired.</td></tr>\\n<tr><td>Creation Cheat</td><td>Description : You have the ability to create anything you wish. You may decide a reason for this yourself, such as putting knowledge obtained from a goddess to full use.</td><td>Merit : You case use this at any time. Create one item with a function of your choosing. Equipment, such as weapons or armor, cannot be obtained with this effect, and you cannot recover Blessings via this merit. The GM has the final decision on the item&#x27;s final effects. The obtained item vanishes when the scenario ends. You can use this once per scenario.</td><td>Demerit : You are tighfisted with money because of what it costs to create things. You refuse to give up on quests and desperately want their rewards. If, for some reason, you cannot gain a quest reward or must give up on it, your number of Blessings immediately becomes 0.</td></tr>\\n<tr><td>Destructive Magic Power</td><td>Description : You have obtained magic powers specialized in destruction. The magic attacks you use boast incredible attack power. The player may freely determine the reason they are able to use Destructive Magic Power.</td><td>Merit : Use right before a damage roll. Add 10d6 to the damage of a magic attack you perform. If your CL is at least 10, add (CL+2)d6 instead. You can use this once per scenario.</td><td>Demerit : You need very precise control over MP in order to use Destructive Magic Power. All spells you use to make magic attacks cost twice the MP.</td></tr>\\n<tr><td>Villainous Energy</td><td>Description : You&#x27;re a dead ringer for a villain. A single, wicked lok from you brings misfortune to others like an evil eye. You can freely decide which parts of you are villainous, such as having a villain&#x27;s face or having an ominous aura about you.</td><td>Merit : Use right after a target makes any sort of check. Change the check they performed to a fumble. You can use this once per scenario.</td><td>Demerit : People avoid you like the plague. If you buy item&#x27;s at any time other than character creation, the cost of every item (including Lifestyles) is double for you.</td></tr>\\n<tr><td>Misunderstood</td><td>Description : Others think extremely highly of you due to a misunderstanding. As a result, people tend to overly respect your opinions. The player may freely choose what sort of misunderstanding it was.</td><td>Merit : Targets all extra characters (or mobs, if in battle) currently in the Scene. Those targets obey your instructions until the end of the Scene, However, whil under this effect, they are treated as extras. You can use this once per scenario.</td><td>Demerit : You are awfully conspicuous, and people can&#x27;t help but pay you a lot of attention. Anyone who makes a hit check for an attack where you are one of the targets gets +1d6 for that hit check.</td></tr>\\n<tr><td>Loan on Destiny</td><td>Description : You have received the blessings of fate. Face hardship, and you will coincidentally be saved. The loot you receive on adventures is surprisingly valuable. This is all because you have taken out an advance loan on good luck, diverting you from your original fate.</td><td>Merit : Passive. Add 1 to your maximum number of usable Blessings. You can also use Blessings even if it would bring your number of usable Blessings to less than 0.</td><td>Demerit : When you are at 0 or less Blessings, all checks you perform, excluding critical rolls, will fail no matter what. Additionally, in After Play, if you Blessings are equal to or less than a negative value of your Luck, you die.</td></tr>\\n<tr><td>World of the Strongest</td><td>Description : You are the strongest. You have the power to surpass everything anyone could throw at you. There is nobody who can stand in your way.</td><td>Merit : Nobody can stand in the way of your supreme might. Use this during the Initiative Process. You immediately perform your Main Process. You can perform this Main Process even when spent, and you don&#x27;t become spent after it. You can use this once per scenario.</td><td>Demerit : Having the mightiest of powers puts a heavy burden on you. After the Main Process from your merit, take -1d6 on every dice roll (such as for checks and damage) you perform until the end of the Scene. This cannot reduce the number of dice you roll to less than 1.</td></tr>\\n<tr><td>Pursuit Of Skill</td><td>Description : You’ve dedicated your life to improving your performance in a certain skill, you’ve committed everything to mastering that skill.</td><td>Merit : Choose a Skill that is not a Spell and requires a dice roll for its effect. Gain +5d6 to its effect. If CL is 10 or more, gain (CL/2)d6 instead.</td><td>Demerit : You are literally putting everything on the line, even your life. After using the skill that benefits from this effect, your HP drops to 0.</td></tr>\\n<tr><td>Minor Faith</td><td>Description : You worship a god with few followers and monopolise the powers he bestows upon you.</td><td>Merit : Write this skill as Minor Faith: (chosen god). Add +2d6 to the Attack Damage, HP recovery, and Damage Reduction effects of (arch)priest skills. If your CL is 10 or more, add + (CL/3)d6 instead.</td><td>Demerit : If you acquire a Faith Skill, this cheat will be lost. Also if a character with the same Minor Faith appears in the same scene, the benefits of this cheat cannot be applied.</td></tr>\\n<tr><td>Super Anxious</td><td>Description : You fear failure and want everything to be done with care and perfection, which comes with extensive preparation, lengthy training, and careful research.</td><td>Merit : The training and planning you have prepared will come into play. When you reroll a roll due to a Skill or Blessing, add +2d6 to the roll.</td><td>Demerit : Before you act, you carefully asses the situation. You must wait on the first round of combat. If you don’t wait, you receive -1d6 on all dice rolls and no benefits until the end of the scene.</td></tr>\\n<tr><td>Underestimated</td><td>Description : Others tend to underestimate your abilities, but once you take action they will see your true abilities.</td><td>Merit : Used when you win a Reaction Check. Add +1d6 to your checks and (CL/5+1)d6 to your Attack Damage. This effect lasts until the end of the scenario.</td><td>Demerit : While under the effect of this cheat’s benefits, enemies deal an additional (your) CL x 2 damage to you. Enemies may prioritize you or characters they are using to torment you.</td></tr>\\n<tr><td>Skill Of Mirror</td><td>Description : You can perfectly copy the skills you see.</td><td>Merit : Can be used at any time. Select one skill used in the scene. You will acquire that skill at the same SL and can use it without class restrictions. In the case of enemy skills, one blessing is consumed. This effect lasts until the end of the scenario.</td><td>Demerit : If you have acquired [CL/10 + 1] or more skills through the effect of merit, at the start of the ending phase, you must make a Death Check with difficulty 12. Add -[the number of skills acquried]d6 to this check.</td></tr>\\n<tr><td>I’d Say I’m Normal</td><td>Description : You’re normal. You’ve lived your life turning your back on things like cheats and being a chosen hero.</td><td>Merit : Increase your Max HP and Max MP by CL x 3.</td><td>Demerit : At the beginning of the Scenario, you are the Cheat. Make a Mind Check with difficulty 8 + CL. If you fail, suffer a fumble. (Note: I have no idea what that fumble would cause, let&#x27;s the GM decide, take a blessing or keep it for later or something).</td></tr>\\n<tr><td>Lovely Personality</td><td>Description : You are the type of person who easily receives the affection of those around you and makes them feel close to you. Whether you like it or not, love and hate are swirling around you.</td><td>Merit : Once per Scene. You can ask for one favor within the limits of your abilities. This does not allow you to take any action that would cause HP damage.</td><td>Demerit : Your constitution incurs resentment and jealousy. All damage you take is increased by CL x 2.</td></tr>\\n<tr><td>Guardian Beast</td><td>Description : You have a guardian beast by your side to protect and accompany you. It is very gentle, but can be very scary when angered.</td><td>Merit : Once per Scenario, during the Initiative Process, your Guardian Beast can perform a Special Attack. Hit Check 3d6+Mind, Piercing Damage 2d6+10 or CL x 2 for CL 10 or higher.</td><td>Demerit : When you are with your Guardian Beast add +1 to the weight of your belongings. If you are not together add -2d6 to all rolls.</td></tr>\\n<tr><td>Eternal Traveler</td><td>Description : Your body does not age, so you have lived a very long life despite your appearance. Those who are standing before you now will one day leave you behind.</td><td>Merit : Your body is very resistant to change and you can overcome any bad status. You are immune to negative status effects.</td><td>Demerit : You are already becoming an entity that is outside the laws of this world. Gain -1 to your Blessings and Usage Limit. (minimum 1).</td></tr>\\n<tr><td>Stratège Militaire</td><td>Description : You are skilled in military strategy, and it is easy for you to take advantage of situations and turn the tide of battle against overwhelming odds.</td><td>Merit : Once per Scenario, Add +10 to the Damage made by any character appearing in the Scene. If CL is 5 or higher add CL x 2 instead. This effect lasts until the end of the scene.</td><td>Demerit : Whether it’s preparing your military strategy or your personal life, you are spending a lot of money. Add CL x 100 KE to your Lifestyle cost.</td></tr>\\n<tr><td>Surpassement des Limites</td><td>Description : Whether through talent or hard work, you can hone a skill and just keep on improving it.</td><td>Merit : Whenever you acquire a Skill, choose one Skill, it can be one you have not acquired. Its Max SL is increased by 3, CL / 2 if your CL is 10 or higher. It cannot be a Skill whose number of uses or effect does not change with SL.</td><td>Demerit : The Max SL for other skills not chosen are 1.</td></tr>\\n</table>\\n        "},{"i":116,"ch":"附录","chTitle":"参考资料与速查表","title":"关于本应用","id":"appendix-about","html":"\\n            <p>本应用是对《为美好的世界献上祝福！TRPG》（KonoSuba: God's Blessing on This Wonderful World! TRPG）规则书的<strong>中文翻译版</strong>。</p>\\n            <div class=\\"content-img\\">\\n                <img src=\\"img/image_176_image277.png\\" alt=\\"角色属性参考表\\">\\n            </div>\\n            <p><strong>原作信息：</strong></p>\\n            <ul>\\n                <li>原作：《为美好的世界献上祝福！》（暁なつめ 著 / 三嶋くろね 插画）</li>\\n                <li>TRPG规则书由 F.E.A.R. 株式会社 和 KADOKAWA 共同开发（2019年日本初版）</li>\\n                <li>英文版由 Yen Press 于2022年出版（翻译：Alice Prowse）</li>\\n                <li>原书共326页，包含Replay实录、完整角色数据、敌人列表等大量内容</li>\\n            </ul>\\n            <p><strong>本版本说明：</strong></p>\\n            <ul>\\n                <li>本文件基于英文原版规则书翻译，已根据原版PDF逐章核对修正</li>\\n                <li>所有规则内容均以原版PDF为准，已修正大量编造和错误内容</li>\\n                <li>建议搭配英文原版或日文原版规则书使用。所有内容仅供个人学习和游戏参考，请支持正版规则书</li>\\n            </ul>\\n        "}]`),vd=JSON.parse('[{"name":"转生闪光","timing":"判定后","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"每剧本1次","effect":"在判定后立即使用。该判定的结果+3。","nameEn":"","cls":"转生者","kind":"racial","src":"official","ref":""},{"name":"转生恩赐：防具","timing":"物品 / 创建时","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"在准备阶段，从你的物品中选择一件盔甲，它获得+2物理防御和+1魔法防御。","nameEn":"","cls":"转生者","kind":"racial","src":"official","ref":""},{"name":"转生恩赐：命运之力","timing":"被动 / 创建时","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你的角色在创建时获得1个额外祝福。","nameEn":"","cls":"转生者","kind":"racial","src":"official","ref":""},{"name":"转生恩赐：武器","timing":"物品 / 创建时","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"在准备阶段，从你的物品中选择一件武器。该武器获得+2攻击力。","nameEn":"","cls":"转生者","kind":"racial","src":"official","ref":""},{"name":"异世界生意","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"每剧本1次","effect":"当你购买价值不超过CL×100 KE的物品时可以使用此技能。你获得该物品而不减少你的现金储备。你也可以在结算阶段支付生活费用和基地维护费用时选择使用此技能。","nameEn":"","cls":"转生者","kind":"racial","src":"ar2e","ref":"","srcTag":"进阶规则书"},{"name":"异世界生意II","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"每剧本1次","effect":"你必须拥有异世界生意才能学习此技能。当你购买价值不超过CL×1000 KE的物品时可以使用此技能。你获得该物品而不减少你的现金储备。你也可以在结算阶段支付生活费用和基地维护费用时选择使用此技能。","nameEn":"II","cls":"转生者","kind":"racial","src":"ar2e","ref":"","srcTag":"进阶规则书"},{"name":"转生恩赐：盾牌","timing":"物品 / 创建时","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"在准备阶段，选择你拥有的一件盾牌类物品。所选物品获得+1物理防御和+2魔法防御。","nameEn":"","cls":"转生者","kind":"racial","src":"ar2e","ref":"","srcTag":"进阶规则书"},{"name":"转生恩赐II：防具","timing":"准备阶段","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"每剧本1次","effect":"你必须拥有转生恩赐：防具才能学习此技能。你必须穿着为转生恩赐：防具选择的盔甲才能使用。你所有判定+1d6。此效果持续到回合结束。","nameEn":"","cls":"转生者","kind":"racial","src":"ar2e","ref":"","srcTag":"进阶规则书"},{"name":"转生恩赐II：命运之力","timing":"见效果","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"每剧本1次","effect":"你必须拥有转生恩赐：命运之力才能学习此技能。当你使用一个或多个祝福为掷骰添加额外骰子时可以激活。该掷骰额外+2d6。","nameEn":"","cls":"转生者","kind":"racial","src":"ar2e","ref":"","srcTag":"进阶规则书"},{"name":"转生恩赐II：盾牌","timing":"伤害掷骰后","check":"自动成功","target":"区域","range":"-","cost":"-","maxSL":"1","usage":"每剧本1次","effect":"你必须拥有转生恩赐：盾牌才能学习此技能。当你装备了为转生恩赐：盾牌选择的盾牌时可以使用。目标受到的伤害减少3d6。","nameEn":"","cls":"转生者","kind":"racial","src":"ar2e","ref":"","srcTag":"进阶规则书"},{"name":"转生恩赐II：武器","timing":"伤害掷骰前","check":"自动成功","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"每剧本1次","effect":"你必须拥有转生恩赐：武器才能学习此技能。你可以在使用为转生恩赐：武器选择的武器进行攻击的伤害掷骰前使用。你的攻击伤害增加2d6。此效果持续到回合结束。","nameEn":"","cls":"转生者","kind":"racial","src":"ar2e","ref":"","srcTag":"进阶规则书"},{"name":"战斗技艺","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"使用装备的武器时，所有最终命中判定结果+2。","nameEn":"","cls":"原住民","kind":"racial","src":"official","ref":""},{"name":"即时决断","timing":"被动 / 创建时","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"获得+3行动点数","nameEn":"","cls":"原住民","kind":"racial","src":"official","ref":""},{"name":"坚韧","timing":"被动 / 创建时","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"获得+3物理防御","nameEn":"","cls":"原住民","kind":"racial","src":"official","ref":""},{"name":"多面性","timing":"被动 / 创建时","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"选择此技能时，选择三个基本能力值。创建角色时，每个选择的基本能力值+1。","nameEn":"","cls":"原住民","kind":"racial","src":"official 时受到\\"手榴弹：~~\\"技能的效果影响手榴弹的交互方式，将该效果应用于陷阱。同一交战区只能放置一个陷阱。此效果持续到激活或场景结束。","srcTag":"Watson","nameEn":"","cls":"创造者","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"陷阱：药水","timing":"主要动作","check":"智力","target":"自身","range":"-","cost":"5","maxSL":"1","usage":"-","effect":"你使用一个药水物品来在你所在的交战区设置陷阱。当非飞行角色进入你陷阱的交战区时，你可以选择激活陷阱（这将打断其移动，即使交战区中没有其他人）。目标进行DL为(10+你的智力)的幸运判定。如果失败，你对目标应用所使用物品的效果。目标可以选择主动接受该效果。同一交战区只能放置一个陷阱。此效果持续到激活或场景结束。","srcTag":"Watson","nameEn":"","cls":"创造者","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"陷阱：设置","timing":"主要动作","check":"感知","target":"自身","range":"-","cost":"5","maxSL":"1","usage":"-","effect":"你必须拥有[陷阱攻击]至少SL1才能学习此技能。使用此技能，你可以用[陷阱攻击]在你所在的交战区设置陷阱。当非飞行角色进入你陷阱的交战区时，你可以选择激活陷阱（这将打断其移动，即使交战区中没有其他人）。此时，你对目标使用[陷阱攻击]，即使你不在范围内。如果你在使用此技能时受到[陷阱雷]的效果，将其应用于攻击。同一交战区只能放置一个陷阱。此效果持续到激活或场景结束。对于要求[陷阱攻击]的技能，你可以使用此技能代替[陷阱攻击]。","srcTag":"Watson","nameEn":"","cls":"创造者","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"先制","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"5","usage":"-","effect":"你的行动点数+(SLx2)。","srcTag":"AR2E扩展","nameEn":"","cls":"剑士","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"神经破坏","timing":"主要动作","check":"命中判定","target":"单体","range":"武器","cost":"4","maxSL":"5","usage":"-","effect":"对目标进行武器攻击。如果此攻击造成了至少1点HP伤害，目标的回避判定-(SLx2)。此效果持续到目标使用一个次要动作结束此效果或场景结束。暴击：增加骰子","srcTag":"AR2E扩展","nameEn":"","cls":"剑士","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"音爆","timing":"Kamaitachi","check":"自动成功","target":"自身","range":"-","cost":"2","maxSL":"3","usage":"-","effect":"可与[镰鼬]同时使用。此攻击伤害+(SL)d6。","srcTag":"AR2E扩展","nameEn":"","cls":"剑士","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"秘方","timing":"被动","check":"-","target":"自身","range":"-","cost":"-","maxSL":"1","usage":"-","effect":"你可以在使用其他武器时使用非被动的剑士技能，这些技能须有[条件：使用匕首、单手剑、双手剑或刀]或[条件：装备匕首、单手剑、双手剑或刀]。但是，以此方式使用的技能消耗+2。无消耗的技能不增加消耗。","srcTag":"AR2E扩展","nameEn":"","cls":"剑士","kind":"homebrew","src":"ar2e","ref":"AR2E"},{"name":"武士之魂","timing":"物品","check":"-",
